# Qlty project configuration (#568).
#
# Read by both the Qlty CLI and Qlty Cloud, so `qlty check --all` locally and
# the cloud issue list are driven by this one file. Started from
# `qlty init --yes` (CLI 0.644.0) and then edited; the reasons for every edit
# are next to the edit.
#
# Reference: https://docs.qlty.sh/cli/qlty-toml
#
# SILENCES LIVE ELSEWHERE, ON PURPOSE. Security findings are triaged with each
# scanner's own native ignore file, not with [[triage]] or [[exclude]] blocks
# here, so the same decision holds when the scanner runs outside Qlty. The record of every triaged
# finding is docs/security/scanner-triage.md (#567). Do not add a security
# silence to this file; add it where that page says. Those native files are
# .gitleaks.toml (rules) and .gitleaksignore (gitleaks), .bandit (bandit),
# .checkov.yaml and inline `checkov:skip` (checkov), inline `trivy:ignore`
# (trivy). Prefer a rule that describes a KIND of match, or an inline comment
# that moves with its line, over a `path:line` fingerprint: a fingerprint
# breaks on the next edit above it and the finding returns (2026-11-24).
# exclude_patterns below is different: it says a folder is not source code
# (build output, generated data, test fixtures), and each entry says why.
config_version = "0"

# Qlty already honours .gitignore, so node_modules/, dist/, site/ (the MkDocs
# build), .agentic/ (workflow run logs) and scripts/.reports/ never reach a
# plugin. They are repeated here where it matters that Qlty Cloud, which
# analyses a clean clone, and a local run with build output present agree.
exclude_patterns = [
  # Defaults from `qlty init`, less "**/config/**", "**/db/**", "**/seed/**"
  # and "**/templates/**": in this repository those names hold hand-written
  # source (frontend/src/config/, frontend/src/components/templates/) that
  # should be analysed. "**/generated/**" is narrowed to the one folder below
  # (#1845).
  "*_min.*",
  "**/assets/**",
  "**/cache/**",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/bower_components/**",
  "**/build/**",
  "**/deps/**",
  "**/extern/**",
  "**/external/**",
  # The one generated/ folder (owner decision 2026-11-25, #1845): the Azure
  # certification rows frontend/scripts/update-applied-skills.mjs writes.
  # Named exactly, not "**/generated/**" (qlty init's default), so
  # hand-written code put in any other folder called generated/ is still
  # checked. On 2026-11-25 `git ls-files | grep /generated/` listed only
  # frontend/src/data/azure/generated/certifications.js.
  "frontend/src/data/azure/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/protos/**",
  "**/target/**",
  "**/testdata/**",
  "**/vendor/**",

  # Build, install and coverage output.
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**",
  "site/**",
  "**/.terraform/**",
  "**/__pycache__/**",

  # Local agent run state and logs (gitignored; listed for local runs).
  ".agentic/**",
  ".claude/worktrees/**",

  # Generated data. frontend/data/content-manifest.json is written by
  # scripts/build-content-manifest.mjs through publish-content-manifest.yml,
  # frontend/public/data/ by `npm run build:data`, and the framework JSON under
  # frontend/public/ is reference data. None of it is hand-written code, and
  # linting it only reports the generator's formatting.
  "frontend/data/**",
  "frontend/public/data/**",
  "frontend/public/**/*.json",
  # Vendored font files (hundreds of them).
  "frontend/public/fonts/**",
  # Generated by frontend/scripts/update-study-guides.mjs from Microsoft Learn (#500):
  # one module per exam, and related exams share outline text by design, so
  # similar-code findings there describe the source data, not duplicated code.
  "frontend/src/data/azure/study-guides/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/e2e/**",
  "**/__tests__/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

# Monitor, not comment (owner, 2026-09-14). Code smells stay on the Qlty
# dashboard and feed the Health Hub's Code and Security tab (#569), but they
# do not post pull request comments: the main ruleset requires every review
# conversation to be resolved, so an inline "many returns" note on idiomatic
# early-return React hooks blocked merges without being a defect. Security
# and lint findings from the plugins below are unaffected.
#
# ENFORCED ON PULL REQUESTS BY CI, not by Qlty (owner decision 2026-11-24/25,
# #1845). The `security-scan` job in .github/workflows/ci.yml fails a pull
# request that adds a medium or high smell, through scripts/check-new-smells.mjs,
# and applies the data-table [[triage]] block at the end of this file. This
# mode stays "monitor" so Qlty Cloud still posts no inline comments; the CI
# check's annotations take their place.
[smells]
mode = "monitor"

[[source]]
name = "default"
default = true

# ---------------------------------------------------------------------------
# Linters
# ---------------------------------------------------------------------------

[[plugin]]
name = "actionlint"
# The version CI's `actionlint, zizmor, hadolint` job pins (ci.yml
# ACTIONLINT_VERSION); move both together. Qlty's default, 1.7.9, predates
# the `artifact-metadata` permission (actionlint 1.7.10), which
# publish-lab-image.yml uses, and reported it as unknown (2026-11-24).
version = "1.7.12"

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

# ESLint runs with each package's own flat config, installed from that
# package's package.json. `qlty init` wrote package_filters of
# ["eslint", "jest", "prettier"], which dropped `globals` (imported by both
# eslint.config files) and failed every run with
# `Cannot find package 'globals'`. `globals` is added to both; frontend also
# needs `react`, because its config reads react/package.json to pin the React
# version for eslint-plugin-react. CI's own `npm run lint` jobs remain the
# gate; this is the same rule set reported in Qlty.
[[plugin]]
name = "eslint"
version = "10.10.0"
package_file = "package.json"
package_filters = ["eslint", "globals", "react", "prettier"]
prefix = "frontend"

[[plugin]]
name = "eslint"
version = "10.10.0"
package_file = "package.json"
package_filters = ["eslint", "globals"]
prefix = "scripts"

[[plugin]]
name = "prettier"
version = "3.9.6"
package_file = "frontend/package.json"
package_filters = ["prettier"]

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "tflint"

# ---------------------------------------------------------------------------
# Security scanners. The set the Qlty Cloud project runs (#568).
# ---------------------------------------------------------------------------

[[plugin]]
name = "bandit"

[[plugin]]
name = "checkov"

[[plugin]]
name = "gitleaks"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "trivy"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
# The version CI's `actionlint, zizmor, hadolint` job pins (ci.yml
# ZIZMOR_VERSION); move both together, as for actionlint above.
version = "1.31.1"

# LINT TRIAGE (#588). Not security silences (those stay in each scanner's own
# ignore file, per the header). Open work lives in GitHub issues (owner
# decision 2026-09-05), so a TODO/NOTE/OPTIMIZE word in this repository is a
# reference to TODO.md, a closed T- item, or prose, never an untracked task. On `main` on
# 2026-09-14 ripgrep reported 180 and radarlint-iac 19. A search that day for
# TODO/NOTE/OPTIMIZE marker comments found no open task: the TODO hits are
# `TODO.md` references or string literals a validator matches, and each NOTE
# is an explanation. FIXME, HACK and BUG stay reported.
#
# The radarlint-iac S1135 rule that sat here is retired (#821). Its 19 hits
# were `TODO.md` in infra/ comments; #821 repointed them, and a recount on
# 2026-10-02 found no TODO token left under infra/. A new one is now reported,
# which is what should happen. docs/security/scanner-triage.md has the record.

[[triage]]
match.plugins = ["ripgrep"]
match.rules = ["TODO", "NOTE", "OPTIMIZE"]
set.ignored = true

# lab-image/Dockerfile's `fetch` stage keeps one RUN per downloaded artefact
# on purpose (2026-11-24): the stage ships nothing (later stages COPY only
# /out), so its layer count reaches no image, and kept apart a change to one
# pin in versions.env downloads only that artefact again. The comment above
# those RUNs says so. radarlint-iac has no inline skip, so the rule is
# ignored for that one file here; S7031 still reports in every other
# Dockerfile. docs/security/scanner-triage.md#radarlint-iac.
[[triage]]
match.plugins = ["radarlint-iac"]
match.rules = ["radarlint-iac:docker:S7031"]
match.file_patterns = ["lab-image/Dockerfile"]
set.ignored = true

# Test inputs, not infrastructure (2026-11-24). lab-image/smoke.sh hands each
# file under lab-image/smoke/ to a validator inside the lab image
# (hcw-kubeconform, hcw-helm-template, hcw-terraform-validate, ansible
# --check) to prove the validator works; kubeconform-payload/invalid is
# broken on purpose. Nothing there is applied or deployed, so checkov's and
# trivy's production rules (69 high and medium findings that day) describe a
# cluster that does not exist. Only those two plugins skip the folder:
# gitleaks, trufflehog and osv-scanner still read it.
# docs/security/scanner-triage.md#lab-image-smoke-fixtures.
[[exclude]]
plugins = ["checkov", "trivy"]
file_patterns = ["lab-image/smoke/**"]

# DATA AND STYLE TABLES: similar-code only (owner decision 2026-11-25, #1845).
# These files are lists of records (catalogue rows, write-ups, learning paths,
# card lists) or tables of Tailwind colour classes. Their rows look alike
# because every row has the same fields, so Qlty's duplicate finder reports
# them as "similar code"; there is no code to share. This block ignores ONLY
# `qlty:similar-code`, ONLY in the files named below, one by one. Every other
# smell (complex functions, many returns, copied identical code) still reports
# in these files, and a new data file is not covered until it is added here by
# name, with its reason in docs/security/scanner-triage.md#code-smells-in-data-and-style-tables.
#
# Who reads this block. Qlty itself does not apply [[triage]] to its own
# smells yet, in the CLI or in Qlty Cloud (qltysh/qlty#2902, confirmed by a
# Qlty maintainer on 2026-10-04), so the Qlty Cloud dashboard still lists
# these. The pull request smell check in ci.yml (scripts/check-new-smells.mjs)
# reads this block and applies it the way Qlty documents [[triage]], so the
# check and this list cannot disagree.
[[triage]]
match.plugins = ["qlty"]
match.rules = ["qlty:similar-code"]
match.file_patterns = [
  "frontend/src/components/admin/cloudflare/cloudflareLocks.js",
  "frontend/src/data/addons/catalogue.js",
  "frontend/src/data/ansible/education.js",
  "frontend/src/data/architectures.js",
  "frontend/src/data/aws/certifications.js",
  "frontend/src/data/labs/catalogue.js",
  "frontend/src/data/serviceDocsData.js",
  "frontend/src/data/vmware/education.js",
  "frontend/src/lib/landingZone/hcl/aws/index.js",
  "frontend/src/lib/landingZone/hcl/aws/readme.js",
  "frontend/src/lib/landingZone/hcl/gcp/index.js",
  "frontend/src/lib/landingZone/hcl/gcp/readme.js",
  "frontend/src/pages/ansible/LandingPage.jsx",
  "frontend/src/pages/aws/EducationPage.jsx",
  "frontend/src/pages/aws/education/CertDetailPage.jsx",
  "frontend/src/pages/aws/education/MicrocredentialDetailPage.jsx",
  "frontend/src/pages/azure/EducationPage.jsx",
  "frontend/src/pages/azure/education/CertDetailPage.jsx",
  "frontend/src/pages/azure/education/azureTimeline.jsx",
  "frontend/src/pages/finops/EducationPage.jsx",
  "frontend/src/pages/finops/FocusPage.jsx",
  "frontend/src/pages/finops/architecture-blueprints.js",
  "frontend/src/pages/gcp/EducationPage.jsx",
  "frontend/src/pages/gcp/LandingPage.jsx",
  "frontend/src/pages/gcp/architecture-blueprints.js",
  "frontend/src/pages/github/EducationPage.jsx",
  "frontend/src/pages/github/LandingPage.jsx",
  "frontend/src/pages/shared/PodcastPage.jsx",
  "frontend/src/pages/terraform/LandingPage.jsx",
  "frontend/src/pages/terraform/ModulesPage.jsx",
  "functions/src/lib/ambassador/programs.js",
  "functions/src/lib/cloudflare/protected.js",
]
set.ignored = true
