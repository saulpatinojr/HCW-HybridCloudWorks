# Reads the LIVE state of every alert rule infra/ declares and fails, naming
# the rule, when one is missing, disabled, not wired to its action group, or
# resolving differently from its declaration. Weekly, and on dispatch.
#
# WHY THIS EXISTS. The Deployment Runbook's §4 asks for post-apply
# verification, and for the alert fabric there was no way to do it: applies
# happen in HCP Terraform Cloud on a human's confirmation, and a green TFC run
# proves ARM ACCEPTED the change, not that the rule now behaves differently.
# The two come apart exactly where it matters — `autoMitigate` is the attribute
# that decides whether a firing rule mails once or every five minutes, and it
# is invisible from the repository, from CI, and from the TFC run list.
#
# WHY IT IS NO LONGER A LIST OF THREE (PLAT-4, #964). From 2026-08-26 this job
# read three hard-coded rule names in one resource group, dispatch-only, while
# the configuration grew to thirteen across two subscriptions: the
# reachability, export and Telegram rules beside the three it knew, and the
# capacity and lab rules in the Management subscription, were never read back.
# It last ran on 2026-08-30. The rule list is now DERIVED from infra/ on every
# run by scripts/verify-alert-state.mjs (through
# scripts/lib/alert-declarations.mjs), so a rule added to the configuration is
# checked from the commit that adds it, and the job runs on a schedule rather
# than when somebody remembers it.
#
# Operators are sometimes on a phone. The report goes to the job summary so it
# is readable from the GitHub mobile app, AND to stdout so it is in the logs —
# the first run of this workflow (2026-08-26) wrote only to the summary, which
# the REST logs API does not expose, so a failure could not be diagnosed
# without opening a browser.
#
# "May not read" and "does not exist" stay two different findings
# (NOT AUTHORIZED and MISSING). The first run collapsed them into one label,
# and they are opposite diagnoses: one means the alert fabric is gone, the
# other that this workflow's own grant is.
#
# READ-ONLY IN WHAT IT DOES: every call the script makes is an ARM GET: one
# token from `az account get-access-token`, then the subscription list, the
# three alert rule lists per resource group, and each action group. The
# identity is github_alert_reader (#1053, infra/oidc.tf), which holds the
# custom "HCW Alert Rule Reader" role in rg-web-site-prod-cus and
# rg-mgmt-plat-prod-cus and nothing else: the four alert-rule and
# action-group reads, no data action, so it cannot query a log. Until #1053
# the job ran as github_reader, which also held a Function App config write
# and could not read the Management subscription at all.
#
# BOTH SUBSCRIPTIONS ARE READABLE NOW. The capacity rule, the lab rules, the
# Management role-change rules and the action group live in
# rg-mgmt-plat-prod-cus; they reported UNREADABLE every week until #1053, and
# the script's UNREADABLE table is empty since. The mechanism stays: a
# subscription recorded there reports UNREADABLE in every run's table and as
# a warning annotation, with its state called unknown, and the run passes or
# fails on everything it CAN read; when the read there starts succeeding, the
# run FAILS, naming the stale entry, until it is deleted. The step's
# `coverage` output (and the job's) reads `partial` while any entry applies,
# `complete` otherwise.
#
# NO `environment:` KEY, deliberately. Declaring one changes the OIDC subject
# GitHub presents from repo:<owner>/<repo>:ref:<ref> to
# repo:<owner>/<repo>:environment:<name>, and this job is trusted through the
# BRANCH credential. Adding an environment here breaks authentication with
# AADSTS700213 — the failure mode documented at length in infra/oidc.tf. A
# scheduled run presents refs/heads/main, the ref that credential names.
# Since the 2026-10-07 transfer to the personal account the subject is
# `repo:saulpatinojr@34853639/HCW-HybridCloudWorks@1268997852:ref:refs/heads/main`.

name: Verify Alert Rule State

on:
  # Weekly. Alert rules change only when an apply lands, and the applies are
  # human-confirmed, so a daily read would mostly repeat itself; a week is the
  # longest a rule can sit missing or disarmed unnoticed. Monday morning UTC,
  # offset from the top of the hour and from the other Monday jobs.
  schedule:
    - cron: '53 7 * * 1'
  # No inputs (checkov CKV_GHA_7): which rules and groups to read comes from
  # infra/ at the dispatched commit, and an input could only point the check
  # at the wrong ones.
  workflow_dispatch:

# The workflow-level default. `id-token: write` is granted on the job that uses
# it rather than here (zizmor excessive-permissions, #588): this workflow has
# one job today, so the two are identical in effect — what a job-level grant
# prevents is a second job added later silently inheriting the OIDC token.
permissions:
  contents: read # the checkout, nothing more

concurrency:
  # Never cancel a run in flight: a cancelled verification reports nothing,
  # which on a dashboard looks the same as "the alert rules are fine".
  group: verify-alert-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify alert rule state
    # Same self-arming gate as monitor-functions-registered.yml: before the
    # apply that creates github_alert_reader and the variable set from its
    # client id, there is no identity to log in as, and a red run would read
    # as a permissions bug while actually meaning "not deployed yet".
    if: ${{ vars.ALERT_READER_CLIENT_ID != '' }}
    permissions:
      contents: read # the checkout, nothing more
      id-token: write # exchanged by azure/login for an Azure access token
    runs-on: ubuntu-26.04
    # For anything that reads this run's outcome rather than its summary: a
    # green run that could not read a recorded subscription says `partial`.
    outputs:
      coverage: ${{ steps.verify.outputs.coverage }}
    steps:
      # The rule list is read out of infra/ at this commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Node built-ins only: the script and the helpers it imports have no
      # package dependencies, so there is no install step to supply-chain.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'

      # ALERT_READER_CLIENT_ID (#1053), not CLIENT_ID or READER_CLIENT_ID.
      # This workflow reads alert rules and action groups and nothing else, so
      # it runs as the identity that can do exactly that, rather than the
      # deploy identity or the reader that also holds a Function App write.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ALERT_READER_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      # Exit 0: every rule it could read is live, enabled and wired (rules in
      # a subscription UNREADABLE records are listed and raised as a warning
      # annotation, never counted as healthy). Exit 1: a finding, named in the
      # report. Exit 2: the check could not run, which fails the step the same
      # way and is never reported as health.
      - name: Compare the declared rules with the live ones
        id: verify
        run: node scripts/verify-alert-state.mjs --summary "$GITHUB_STEP_SUMMARY"
