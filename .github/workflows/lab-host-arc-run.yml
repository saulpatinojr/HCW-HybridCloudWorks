name: Lab host - run a fixed command through Azure Arc

# Runs ONE of three fixed scripts on the lab host (vps-hostinger-01, the Arc
# machine arcs-lab-hybrid-prod-cus-01) through Azure Arc Run Command, which is
# in preview (#1590; ADR 0032, amendment of 2026-11-09). The owner asked for
# it on 2026-11-09 so that the host can be reached without the one SSH key on
# the one workstation:
#
#   status        read-only: memory, disk, uptime, containers, failed units,
#                 the last completed bootstrap run (lab-host/arc-run/status.sh)
#   memory-check  the five-run sandbox memory check (lab-host/arc-run/memory-check.sh)
#   bootstrap     a full bootstrap.sh run to the current main commit, about six
#                 minutes (lab-host/arc-run/bootstrap.sh)
#
# WHY IT IS SHAPED THIS WAY. Run Command runs a script as root on the host
# (learn.microsoft.com/azure/azure-arc/servers/run-command), so whoever can
# create one is root there. So:
#   - there is no free-text input: `action` is a choice, the script is a file
#     in this repository picked by a fixed `case`, and no `${{ }}` expression
#     is written into any shell line (script injection);
#   - the job is bound to its own environment, `lab-host-arc`, whose
#     required reviewers approve each run and whose deployment-branch policy
#     admits main only. That environment is the control: the identity it
#     signs in as (github_arc_run, infra/oidc.tf) trusts the OIDC subject
#     repo:<org>/<repo>:environment:lab-host-arc, and Entra matches a
#     federated credential on issuer, subject and audience alone (a client
#     id is public). So any job that names `lab-host-arc` could sign in as
#     it, and scripts/oidc-subjects.test.mjs fails if any workflow but this
#     one names that environment. It is not `production`, because every
#     deploy job names `production` and runs `npm ci`, whose package scripts
#     must never reach root on the lab host;
#   - that identity holds one custom role on the lab group, HCW Arc Run
#     Command Operator (infra/roles/arc-run-command-operator.json): run,
#     read and delete run commands, read the machine;
#   - the run command resource is deleted after every run, in an always()
#     step, so no script is left stored on the machine;
#   - Arc's activity log records every create and delete with the caller.
#
# THE OUTPUT IS PUBLIC. This repository is public, so this run's log and
# summary are readable by anyone. The scripts print states, counts and names;
# bootstrap.sh keeps its full log on the host (/var/log/hcw-arc-run/) and
# prints only the PLAY RECAP and failed task names. Run Command itself keeps
# only the last 4 KB of output and of error (instanceView.output and .error).
#
# It cannot run until the owner's one-time steps are done
# (docs/runbooks/labs-host.md, "Run a fixed command on the host through Azure
# Arc"): the `lab-host-arc` environment created with its reviewers and branch
# rule, the role created and lab_arc_run_command_enabled set,
# ARC_RUN_CLIENT_ID set, and one bootstrap over SSH so the agent's extension
# allowlist admits the Run Command handler.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run on the lab host (status is read-only; bootstrap takes about six minutes)'
        type: choice
        required: true
        default: status
        options:
          - status
          - memory-check
          - bootstrap

permissions:
  contents: read # the checkout, nothing more

# One run on the host at a time. Two bootstraps at once would fight over
# /opt/hcw-src and apt; a queued run waits rather than cancelling one that is
# part-way through a play.
concurrency:
  group: lab-host-arc-run
  cancel-in-progress: false

jobs:
  run:
    name: Run a fixed command on the lab host
    permissions:
      contents: read # the checkout, nothing more
      id-token: write # exchanged by azure/login for an Azure access token
    runs-on: ubuntu-26.04
    # bootstrap: about six minutes on the host, 40 at most (RUN_TIMEOUT
    # below), plus sign-in, install, the read-back and the clean-up.
    timeout-minutes: 70
    # The gate. `lab-host-arc` is this workflow's own environment: required
    # reviewers approve each run, and its deployment-branch policy admits
    # main only (Required-Inputs §4.4). The owner creates it before the
    # first run; GitHub would otherwise create a missing one, with no
    # protection, the first time a job names it.
    environment: lab-host-arc
    env:
      ACTION: ${{ inputs.action }}
      # The Arc machine, as the arc role names it
      # (lab-host/ansible/group_vars/all.yml; scripts/lab-host-arc-run-workflow.test.mjs
      # holds the two together).
      ARC_RESOURCE_GROUP: rg-lab-hybrid-prod-cus
      ARC_MACHINE: arcs-lab-hybrid-prod-cus-01
      ARC_LOCATION: centralus
      # The Azure CLI's connectedmachine extension, which carries
      # `az connectedmachine run-command` (preview). 1.1.0 is the newest
      # non-beta release; the digest is the index's sha256Digest for
      # connectedmachine-1.1.0-py3-none-any.whl, read 2026-11-09 and equal to
      # the sha256sum of the file downloaded that day.
      CONNECTEDMACHINE_VERSION: 1.1.0
      CONNECTEDMACHINE_SHA256: 9b71015a6b047770deed883dd4092857641c6a574f2107ee558b0535ff2946d8
    steps:
      - name: Refuse a run from a ref that is not main
        # A backstop only. A dispatch runs the workflow file as it is on the
        # ref it was dispatched from, so a branch could carry a copy without
        # this step. The control is the `lab-host-arc` environment's
        # deployment-branch policy (main only), which GitHub enforces before
        # the job starts and which no file on a branch can change.
        if: github.ref != 'refs/heads/main'
        timeout-minutes: 1
        run: |
          ref="${GITHUB_REF//%/%25}"
          ref="${ref//$'\r'/%0D}"
          ref="${ref//$'\n'/%0A}"
          echo "::error::Refusing to run from ${ref}. Commands on the lab host run from main only."
          exit 1

      - name: Refuse while ARC_RUN_CLIENT_ID is unset
        timeout-minutes: 1
        env:
          ARC_RUN_CLIENT_ID: ${{ vars.ARC_RUN_CLIENT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
        run: |
          if [ -z "${ARC_RUN_CLIENT_ID}" ]; then
            echo "::error::The repository variable ARC_RUN_CLIENT_ID is not set. It is the client id of github_arc_run, the arc_run_client_id output of the hcw-azure workspace (docs/runbooks/labs-host.md, 'Run a fixed command on the host through Azure Arc')."
            exit 1
          fi
          if [ -z "${SUBSCRIPTION_ID}" ]; then
            echo "::error::The repository secret SUBSCRIPTION_ID is not set. It is the Application subscription every deploy uses, kept as a secret so the log shows *** (docs/standards/required-inputs.md, section 4.3)."
            exit 1
          fi

      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The only place `action` turns into something that runs, and it can
      # only turn into one of three files. A value outside the list (a
      # dispatch through the API, say) stops here.
      - name: Choose the script
        timeout-minutes: 1
        run: |
          set -euo pipefail
          case "${ACTION}" in
            status) script=lab-host/arc-run/status.sh; timeout=300 ;;
            memory-check) script=lab-host/arc-run/memory-check.sh; timeout=1200 ;;
            bootstrap) script=lab-host/arc-run/bootstrap.sh; timeout=2400 ;;
            *) echo "::error::Unknown action. Choose status, memory-check or bootstrap."; exit 1 ;;
          esac
          test -s "${script}"
          # Linux run command names are at most 36 characters
          # (learn.microsoft.com/azure/azure-arc/servers/run-command):
          # hcw-memory-check-<11-digit run id>-<attempt> is 30.
          name="hcw-${ACTION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "${#name}" -gt 36 ]; then
            echo "::error::Run command name ${name} is longer than 36 characters."
            exit 1
          fi
          {
            echo "SCRIPT_FILE=${script}"
            echo "RUN_TIMEOUT=${timeout}"
            echo "RUN_NAME=${name}"
          } >> "$GITHUB_ENV"

      - name: Install the Azure CLI connectedmachine extension (pinned, digest checked)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          az version --output none
          wheel="connectedmachine-${CONNECTEDMACHINE_VERSION}-py3-none-any.whl"
          curl -sSfL --retry 3 --retry-all-errors -o "${RUNNER_TEMP}/${wheel}" "https://azcliprod.blob.core.windows.net/cli-extensions/${wheel}"
          echo "${CONNECTEDMACHINE_SHA256}  ${RUNNER_TEMP}/${wheel}" | sha256sum -c -
          # A copy the runner image may already carry is replaced by the pinned one.
          az extension remove --name connectedmachine --only-show-errors 2>/dev/null || true
          az extension add --source "${RUNNER_TEMP}/${wheel}" --yes --only-show-errors
          az extension show --name connectedmachine --query version --output tsv
          echo "== Next: signing in to Azure as github_arc_run =="

      # Federated OIDC, no stored credential. ARC_RUN_CLIENT_ID names
      # github_arc_run, which holds only the Run Command role on the lab
      # group; TENANT_ID is the one every deploy uses.
      #
      # No `subscription-id`, and `allow-no-subscriptions`, as in
      # verify-alert-state.yml: the identity's only role is at resource-group
      # scope, and whether that makes the subscription selectable at sign-in
      # is not documented, so pinning one could fail the login with "No
      # subscriptions found" before anything runs. Each az call names the
      # subscription itself (the SUBSCRIPTION_ID secret, set on each step that
      # calls az). No subscription-scope
      # grant is added to make the pin work.
      - name: Azure Login
        id: login
        timeout-minutes: 2
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ARC_RUN_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          allow-no-subscriptions: true

      # The run step shows progress while the script runs (owner request of
      # 2026-11-09: a bootstrap printed nothing for six minutes). So the run
      # command is created with --no-wait and then read back every
      # POLL_SECONDS until the host says the script has finished.
      #
      # --no-wait, checked in the pinned connectedmachine 1.1.0 wheel: its
      # `create` is a long-running operation with AZ_SUPPORT_NO_WAIT = True,
      # so --no-wait returns once Azure has accepted the request and does not
      # poll it ("Do not wait for the long-running operation to finish",
      # learn.microsoft.com/cli/azure/connectedmachine/run-command). A request
      # Azure refuses (a missing role, say) still fails the create at once.
      # --async-execution stays false: it is a property of the run command
      # ("provisioning will complete as soon as script starts"), not of the
      # CLI, so with false the run command's provisioningState keeps tracking
      # the script, and on its own it would still leave the CLI blocked until
      # the script started.
      #
      # Every poll prints one line: the time since the run command was sent,
      # provisioningState and executionState. When instanceView.output has
      # grown, the new lines follow, between ::stop-commands:: markers with a
      # fresh token each time, so a `::` line the host prints is text, never
      # a workflow command. Run Command keeps only the last 4 KB, so a long
      # run's early lines may scroll out between two polls; the log says so.
      # Whether the Arc agent reports output while the script is still
      # running, rather than only at the end, is not documented; the state
      # line appears every poll either way.
      #
      # The poll stops at a terminal executionState (Succeeded, Failed,
      # TimedOut, Canceled), at a provisioningState of Failed or Canceled (the
      # run command failed before the script could report), or RUN_TIMEOUT +
      # 240 s after this step started. Then the run command is read once more
      # for the summary and the exit code, as before.
      - name: Run the script on the host and report what it printed
        id: run
        # RUN_TIMEOUT (40 minutes at most) + 240 s is the poll deadline,
        # counted from the start of this step. One poll that overruns it (a
        # sleep and a read, a minute and a half at most) and the read-back (a
        # minute at most) fit inside the 50.
        timeout-minutes: 50
        env:
          # A secret, so GitHub masks it as *** in this public log (#1610).
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          POLL_SECONDS: 20
        run: |
          set -euo pipefail
          step_start="$(date +%s)"
          deadline="$((step_start + RUN_TIMEOUT + 240))"
          started="${step_start}"
          view="${RUNNER_TEMP}/run-command.json"
          seen="${RUNNER_TEMP}/seen.txt"
          : > "${seen}"
          iv='(.instanceView // .properties.instanceView)'
          phase() { echo "== $* =="; }
          # Prints a file of host output as text: workflow commands are
          # stopped around it, with a fresh token no host line can know.
          print_host() {
            if [ -n "$(tr -d '[:space:]' < "$1")" ]; then
              local token
              token="$(openssl rand -hex 16)"
              echo "::stop-commands::${token}"
              cat "$1"
              if [ "$(tail -c 1 "$1" | od -An -tx1 | tr -d ' \n')" != "0a" ]; then echo; fi
              echo "::${token}::"
            fi
          }
          # The one read of the run command, used by every poll and by the
          # read-back. Returns az's exit code; the JSON goes to ${view}.
          read_view() {
            timeout 60 az connectedmachine run-command show \
              --subscription "${SUBSCRIPTION_ID}" \
              --resource-group "${ARC_RESOURCE_GROUP}" \
              --machine-name "${ARC_MACHINE}" \
              --name "${RUN_NAME}" \
              --only-show-errors --output json > "${view}"
          }
          # The lines of $2 not printed yet. The longest run of lines at the
          # end of $1 (what was printed) that also starts $2 is skipped, since
          # the 4 KB window may have moved on between two polls.
          new_lines() {
            awk -v seen_file="$1" '
              FILENAME == seen_file { p[++np] = $0; next }
              { c[++nc] = $0 }
              END {
                best = 0
                for (k = (np < nc ? np : nc); k > 0; k--) {
                  ok = 1
                  for (i = 1; i <= k; i++) if (p[np - k + i] != c[i]) { ok = 0; break }
                  if (ok) { best = k; break }
                }
                if (best == 0 && np > 0 && nc > 0) print "(earlier output scrolled out of the 4 KB the host keeps)"
                for (i = best + 1; i <= nc; i++) print c[i]
              }' "$1" "$2"
          }
          # $1 without a last line that has no newline yet: that line may
          # still grow, so it waits for the next poll and is not printed twice.
          complete_lines() {
            if [ ! -s "$1" ] || [ "$(tail -c 1 "$1" | od -An -tx1 | tr -d ' \n')" = "0a" ]; then
              cp "$1" "$2"
            else
              sed '$d' "$1" > "$2"
            fi
          }
          elapsed() {
            local s="$(( $(date +%s) - started ))"
            printf '%dm%02ds' "$((s / 60))" "$((s % 60))"
          }

          phase "Uploading ${SCRIPT_FILE} to ${ARC_MACHINE} as run command ${RUN_NAME} (timeout ${RUN_TIMEOUT} s)"
          create=0
          timeout 180 az connectedmachine run-command create \
            --subscription "${SUBSCRIPTION_ID}" \
            --resource-group "${ARC_RESOURCE_GROUP}" \
            --machine-name "${ARC_MACHINE}" \
            --location "${ARC_LOCATION}" \
            --name "${RUN_NAME}" \
            --script "$(cat "${SCRIPT_FILE}")" \
            --timeout-in-seconds "${RUN_TIMEOUT}" \
            --async-execution false \
            --no-wait \
            --only-show-errors --output none || create=$?
          started="$(date +%s)"

          finished=0
          timed_out=0
          if [ "${create}" -ne 0 ]; then
            echo "create exited ${create}, so there is nothing to wait for."
          else
            phase "Waiting for the host to start the script (a line every ${POLL_SECONDS} s)"
            running=0
            while :; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                timed_out=1
                break
              fi
              sleep "${POLL_SECONDS}"
              show=0
              read_view || show=$?
              if [ "${show}" -ne 0 ]; then
                echo "[+$(elapsed)] could not read the run command (show exited ${show}); trying again."
                continue
              fi
              prov="$(jq -r '.provisioningState // .properties.provisioningState // "unknown"' "${view}" 2> /dev/null || echo unknown)"
              now_state="$(jq -r "${iv}.executionState // \"unknown\"" "${view}" 2> /dev/null || echo unknown)"
              if [ "${running}" -eq 0 ] && [ "${now_state}" = "Running" ]; then
                phase "Running on the host"
                running=1
              fi
              echo "[+$(elapsed)] provisioningState=${prov} executionState=${now_state}"
              jq -j "${iv}.output // \"\"" "${view}" > "${RUNNER_TEMP}/now.txt" 2> /dev/null || : > "${RUNNER_TEMP}/now.txt"
              complete_lines "${RUNNER_TEMP}/now.txt" "${RUNNER_TEMP}/now-complete.txt"
              new_lines "${seen}" "${RUNNER_TEMP}/now-complete.txt" > "${RUNNER_TEMP}/new.txt"
              print_host "${RUNNER_TEMP}/new.txt"
              cp "${RUNNER_TEMP}/now-complete.txt" "${seen}"
              case "${now_state}" in
                Succeeded | Failed | TimedOut | Canceled) finished=1; break ;;
              esac
              case "${prov}" in
                Failed | Canceled) finished=1; break ;;
              esac
            done
          fi

          # The read-back. Hybrid Compute's GET of a run command returns its
          # instance view (state, exit code, output, error) without any
          # $expand: the REST reference "Machine Run Commands - Get" lists no
          # such parameter and its sample response carries
          # properties.instanceView. That is unlike Azure VM run commands,
          # whose GET needs $expand=instanceView. The pinned connectedmachine
          # 1.1.0 `show` accordingly takes no --expand (its arguments are the
          # machine, the name and the group), and an unknown option would make
          # az refuse the call. It flattens `properties`, so the view is at
          # .instanceView; .properties.instanceView is read too, in case a
          # later extension stops flattening. No view at all fails the job
          # below rather than reading as an unknown state.
          phase "Reading the result"
          show=0
          read_view || show=$?
          if [ "${show}" -ne 0 ]; then
            # Nothing to read: the create was refused before the machine had
            # a run command (a missing role, or the agent's allowlist not yet
            # admitting the Run Command handler; the runbook says which).
            echo "::error::Could not read run command ${RUN_NAME} back (create exited ${create}, show exited ${show}). The az error above says why."
            exit 1
          fi
          if ! jq -e "${iv} | type == \"object\"" "${view}" > /dev/null; then
            echo "::error::Run command ${RUN_NAME} came back without an instance view, so its state and exit code cannot be read (create exited ${create}). Read it by hand with az connectedmachine run-command show."
            exit 1
          fi
          state="$(jq -r "${iv}.executionState // \"unknown\"" "${view}")"
          exit_code="$(jq -r "${iv}.exitCode // \"none\"" "${view}")"
          jq -r "${iv}.executionMessage // \"\"" "${view}" > "${RUNNER_TEMP}/msg.txt"
          jq -r "${iv}.output // \"\"" "${view}" > "${RUNNER_TEMP}/out.txt"
          jq -r "${iv}.error // \"\"" "${view}" > "${RUNNER_TEMP}/err.txt"

          echo "[+$(elapsed)] executionState=${state} exitCode=${exit_code}"
          print_host "${RUNNER_TEMP}/msg.txt"
          # Only what the polls have not printed yet, including a last line
          # with no newline; all of it when nothing was printed live.
          new_lines "${seen}" "${RUNNER_TEMP}/out.txt" > "${RUNNER_TEMP}/new.txt"
          if [ -n "$(tr -d '[:space:]' < "${RUNNER_TEMP}/new.txt")" ]; then
            if [ -s "${seen}" ]; then echo "---- the rest of the output ----"; else echo "---- output (last 4 KB) ----"; fi
            print_host "${RUNNER_TEMP}/new.txt"
          fi
          if [ -n "$(tr -d '[:space:]' < "${RUNNER_TEMP}/err.txt")" ]; then
            echo "---- error (last 4 KB) ----"
            print_host "${RUNNER_TEMP}/err.txt"
          fi

          {
            echo "## Lab host: ${ACTION}"
            echo
            echo "Run command \`${RUN_NAME}\` on \`${ARC_MACHINE}\`: execution state **${state}**, exit code **${exit_code}**."
            echo
            echo "Run Command keeps only the last 4 KB of output and of error, so a long run shows its end."
            echo
            echo "### Output"
            echo
            echo '~~~~text'
            # A line starting with up to three spaces and ~~~ would close the
            # fence; four spaces in front make it plain text inside it.
            sed 's/^ \{0,3\}~~~/    &/' "${RUNNER_TEMP}/out.txt"
            echo '~~~~'
            if [ -n "$(tr -d '[:space:]' < "${RUNNER_TEMP}/err.txt")" ]; then
              echo
              echo "### Error"
              echo
              echo '~~~~text'
              sed 's/^ \{0,3\}~~~/    &/' "${RUNNER_TEMP}/err.txt"
              echo '~~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${timed_out}" -eq 1 ]; then
            echo "::error::Run command ${RUN_NAME} had not finished ${RUN_TIMEOUT} s + 240 s after this step started (execution state ${state}). The next step deletes it, which stops the script if it is still running."
            exit 1
          fi
          if [ "${state}" != "Succeeded" ] || [ "${exit_code}" != "0" ]; then
            echo "::error::The script did not succeed on the host: execution state ${state}, exit code ${exit_code}."
            exit 1
          fi
          if [ "${create}" -ne 0 ]; then
            echo "::error::az connectedmachine run-command create exited ${create} although the host reports success; read its error above."
            exit 1
          fi

      # Always, once signed in: a run command left on the machine keeps the
      # script stored there, and a still-running one is stopped by the delete
      # (Microsoft: "If the script execution is still in progress, execution
      # is terminated"). That includes a cancelled workflow run, so cancel a
      # bootstrap only if stopping it part-way is what you want.
      #
      # Three tries, 10 and then 20 seconds apart, for a passing ARM or relay
      # error. If all three fail the step fails, and the warning names the
      # run command and the one PowerShell line that deletes it by hand.
      - name: Delete the run command from the machine
        if: always() && steps.login.outcome == 'success' && env.RUN_NAME != ''
        timeout-minutes: 10
        env:
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
        run: |
          set -uo pipefail
          echo "== Deleting run command ${RUN_NAME} from ${ARC_MACHINE} =="
          for try in 1 2 3; do
            deleted=0
            az connectedmachine run-command delete \
              --subscription "${SUBSCRIPTION_ID}" \
              --resource-group "${ARC_RESOURCE_GROUP}" \
              --machine-name "${ARC_MACHINE}" \
              --name "${RUN_NAME}" \
              --yes --only-show-errors || deleted=$?
            if [ "${deleted}" -eq 0 ]; then
              echo "Deleted run command ${RUN_NAME}."
              exit 0
            fi
            echo "Delete try ${try} of 3 exited ${deleted}."
            if [ "${try}" -lt 3 ]; then sleep "$((try * 10))"; fi
          done
          echo "::warning::Run command ${RUN_NAME} could NOT be deleted from ${ARC_MACHINE} after three tries, so its script is still stored on the machine. Delete it by hand, PowerShell: az connectedmachine run-command delete --subscription sub-app-site-prod-cus --resource-group ${ARC_RESOURCE_GROUP} --machine-name ${ARC_MACHINE} --name ${RUN_NAME} --yes"
          exit 1
