# Add-on images against Docker Scout — do the add-on images the lab host runs
# meet Scout's policies, and do they carry a vulnerability that has a fix?
#
# WHAT IT CHECKS. The lab host runs each tool add-on by digest
# (lab-host/ansible/group_vars/all.yml, addons[].image and image_digest), so the
# digest is the thing to check. scripts/lab/read-addon-pins.mjs reads those two
# lines into a matrix; for each image Scout prints its policy table and base
# image recommendation (quickview) and then fails the job when the image has a
# CRITICAL or HIGH vulnerability with a fix available (cves).
#
# WHEN. On a pull request that changes the pins (or this check), which is the
# moment an image is about to reach production; and every Wednesday, because the
# advisory database moves after an image is pinned. lab-supply-chain.yml already
# scans the same digests every Tuesday with Trivy and opens the issue; this is
# Scout's view of them, with its policies, which Trivy does not have.
#
# WHY IT NEEDS A DOCKER TOKEN. Scout answers only a signed-in Docker user. Both
# ways of running it without one stopped on 2026-10-25: docker/scout-action
# ("could not authenticate: user githubactions not entitled to use Docker
# Scout", run 40166549204) and the Scout command line on a clean runner ("Log in
# with your Docker ID", run 40166753167). The publish workflows' OIDC
# connections cannot stand in: they carry only image pull, image push, reading
# public repositories and Build Cloud. So the owner stores ONE credential, here
# and nowhere else (decision of 2026-10-25, issue #1367): the repository
# variable DOCKER_SCOUT_USER (a Docker ID, not secret) and the secret
# DOCKER_SCOUT_PAT, a personal access token with the lowest permission, **Repo
# Public Read-only**, which is enough for public images. docs/runbooks/docker-scout.md
# has the steps to create and store it, and to rotate it.
#
# THE TOKEN IS HANDLED NARROWLY. Every job holds `contents: read` and nothing
# else. A pull request from a fork gets no secrets from GitHub, and the scout job
# is skipped for one rather than left to fail. The token is read in two places
# only: the step that checks it is set, and the action's `dockerhub-password`
# input. The pull request comment is off (`write-comment: false`), so no write
# scope is needed; the result is the job summary and the job's pass or fail.
#
# NO TOKEN YET IS NOT A PASS. On a pull request, a missing credential is a
# warning and the scout job reports skipped steps. On the weekly run and a manual
# run it is an error: a check that goes green because it never ran is worse than
# none, and by then the owner has been asked to set the token.
#
# WHAT IT DOES NOT DO. It does not block a merge: the check is not one of the
# ruleset's required checks, which is the owner's decision. The copyleft policy,
# which fails on every Debian-based image because of the base's own package
# licences, is shown in the table and does not fail the job (`quickview` exits 0
# whatever the policies say, read 2026-10-25): only the vulnerability check does.
name: Add-on images against Docker Scout

on:
  pull_request:
    paths:
      - lab-host/ansible/group_vars/all.yml
      - scripts/lab/read-addon-pins.mjs
      - .github/workflows/addon-image-scout.yml
  schedule:
    # Wednesdays 07:20 UTC: a day after lab-supply-chain.yml (Tuesdays 06:45),
    # off the top of the hour.
    - cron: '20 7 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: addon-image-scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Read the add-on pins
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No npm ci: the script imports node: built-ins only.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # Stops, instead of passing, on a pin it cannot read: a check that skipped
      # a malformed digest would be green for the wrong reason.
      - name: Read the add-on images the lab host runs
        id: read
        run: |
          set -euo pipefail
          matrix="$(node scripts/lab/read-addon-pins.mjs)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | node -e 'for (const e of JSON.parse(require("fs").readFileSync(0, "utf8")).include) console.log(e.id + " -> " + e.image)'

  scout:
    name: Scout ${{ matrix.id }}
    needs: pins
    # A pull request from a fork gets no secrets and must never be handed one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pins.outputs.matrix) }}
    steps:
      - name: A Docker credential for Scout is set
        id: credential
        env:
          SCOUT_USER: ${{ vars.DOCKER_SCOUT_USER }}
          SCOUT_PAT: ${{ secrets.DOCKER_SCOUT_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${SCOUT_USER}" ] && [ -n "${SCOUT_PAT}" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "set=false" >> "$GITHUB_OUTPUT"
          msg="Docker Scout has no credential here: the repository variable DOCKER_SCOUT_USER and the secret DOCKER_SCOUT_PAT are not both set (docs/runbooks/docker-scout.md says how)."
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "::warning::${msg} Skipped on this pull request."
            echo "Scout was **skipped**: no Docker credential is set. ${msg}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::${msg}"
          exit 1

      # docker/scout-action v1.27.0 (released 2026-10-21), pinned to its commit
      # like every other action here. `command` takes a comma-separated list and
      # stops at the first command that exits non-zero, so the policy table
      # (quickview) is written to the summary before the vulnerability check
      # (cves) can fail the job.
      - name: Policies, then fixable critical and high vulnerabilities
        if: steps.credential.outputs.set == 'true'
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: quickview,cves
          image: registry://${{ matrix.image }}
          dockerhub-user: ${{ vars.DOCKER_SCOUT_USER }}
          dockerhub-password: ${{ secrets.DOCKER_SCOUT_PAT }}
          only-fixed: true
          only-severities: critical,high
          exit-code: true
          summary: true
          write-comment: false
