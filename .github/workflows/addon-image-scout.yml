# Add-on images against Docker Scout — do the three add-on images the lab host
# runs carry a vulnerability that has a fix, and do they meet Scout's policies?
#
# WHAT IT CHECKS. The lab host runs each tool add-on by digest
# (lab-host/ansible/group_vars/all.yml, addons[].image and image_digest), so the
# digest is the thing to check. scripts/lab/read-addon-pins.mjs reads those two
# lines into a matrix; for each image Scout prints its policy table and base
# image recommendation (quickview) and then fails the job when the image has a
# CRITICAL or HIGH vulnerability with a fix available (cves).
#
# WHEN. On a pull request that changes the pins (or this check), which is the
# moment an image is about to reach production; and weekly, because the
# advisory database moves after an image is pinned and a digest nobody touches
# is never rebuilt. The publish workflows in the add-on repositories already
# scan with Trivy before they push; this looks again at what is actually pinned.
# lab-supply-chain.yml does the same weekly for the two lab images, with Trivy.
#
# THE CLI, NOT docker/scout-action, AND NO CREDENTIALS. The first version of
# this workflow used docker/scout-action v1.27.0 and failed on every image with
# "could not authenticate: user githubactions not entitled to use Docker Scout"
# (run 40166549204, 2026-10-25): the action signs in to the Scout service as a
# Docker user, and the only way to give it one is a Docker access token stored
# in this repository, a second home for a credential, which the publish
# workflows avoid by using short-lived OIDC logins. The Scout command line, run
# by hand with an empty Docker config on the same day, read the public images'
# SBOM and provenance attestations and answered without any login. So this
# installs that binary the way iac-validate.yml installs Trivy: a pinned release
# whose checksum is held HERE, not fetched from the release that serves it.
# Every job holds `contents: read` and nothing else. The Scout service's own
# per-repository analysis, which shows in the Scout dashboard, is a separate
# setting the owner turns on in Docker (docs/runbooks/docker-scout.md).
#
# WHAT IT DOES NOT DO. It does not block a merge: the check is not one of the
# ruleset's required checks, which is the owner's decision to make. A weekly
# failure shows as a red run in Actions. The copyleft policy, which fails on
# every Debian-based image because of the base's own package licences, is shown
# in the table and does not fail the job (`quickview` exits 0 whatever the
# policies say, read 2026-10-25): only the vulnerability check does.
name: Add-on images against Docker Scout

on:
  pull_request:
    paths:
      - lab-host/ansible/group_vars/all.yml
      - scripts/lab/read-addon-pins.mjs
      - .github/workflows/addon-image-scout.yml
  schedule:
    # Wednesdays 07:20 UTC: a day after lab-supply-chain.yml (Tuesdays 06:45),
    # off the top of the hour.
    - cron: '20 7 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: addon-image-scout-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned release binary with its checksum held HERE, as TRIVY_* are in
  # lab-supply-chain.yml (T-755). The checksum is the one GitHub lists for the
  # asset and the release's own docker-scout_1.27.0_checksums.txt lists the
  # same value (both read 2026-10-25). Update both values in one commit.
  SCOUT_VERSION: 1.27.0
  SCOUT_SHA256: 815207e27559fd3d7dddfe778e86f0aeb823eeb24b3cd79d00bc5cd8dfd0724d

jobs:
  pins:
    name: Read the add-on pins
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No npm ci: the script imports node: built-ins only.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # Stops, instead of passing, on a pin it cannot read: a check that skipped
      # a malformed digest would be green for the wrong reason.
      - name: Read the add-on images the lab host runs
        id: read
        run: |
          set -euo pipefail
          matrix="$(node scripts/lab/read-addon-pins.mjs)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | node -e 'for (const e of JSON.parse(require("fs").readFileSync(0, "utf8")).include) console.log(e.id + " -> " + e.image)'

  scout:
    name: Scout ${{ matrix.id }}
    needs: pins
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pins.outputs.matrix) }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Install Docker Scout CLI (pinned release binary)
        run: |
          set -euo pipefail
          tarball="docker-scout_${SCOUT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" "https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}/${tarball}"
          # The name sha256sum -c looks for is the tarball's own, so write it that way.
          echo "${SCOUT_SHA256}  ${tarball}" > /tmp/scout_expected.txt
          (cd /tmp && sha256sum -c scout_expected.txt)
          tar -xzf "/tmp/${tarball}" -C /tmp docker-scout
          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 /tmp/docker-scout "${HOME}/.docker/cli-plugins/docker-scout"
          docker scout version

      # Policies first, as information: quickview exits 0 whatever they say.
      - name: Policies and base image
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/quickview.txt"
          docker scout quickview "registry://${IMAGE}" 2>&1 | tee "$out"
          { echo "### \`${IMAGE}\` — policies"; echo; echo '```'; cat "$out"; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

      # The gate: exits 2 when the image has a CRITICAL or HIGH vulnerability
      # with a fix available (read 2026-10-25: 0 on the three published images,
      # 2 on node:18-bullseye-slim). A finding with no fix yet does not count.
      - name: Fixable critical and high vulnerabilities
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/cves.txt"
          docker scout cves --only-fixed --only-severity critical,high --exit-code "registry://${IMAGE}" 2>&1 | tee "$out"
          code="${PIPESTATUS[0]}"
          { echo "### \`${IMAGE}\` — fixable critical and high vulnerabilities (exit ${code})"; echo; echo '```'; cat "$out"; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
