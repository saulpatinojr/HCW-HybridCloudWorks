# Build, smoke-test and publish the hcw-lab image (issue #658, Phase 1 in #674).
#
# Two images from one Dockerfile: docker.io/hybridcloudworks/hcw-lab-runner
# (the `runner` target) and docker.io/hybridcloudworks/hcw-lab (the `full`
# target). See lab-image/README.md for what each carries.
#
# Docker Hub only since 2026-10-08. Until then the images went to GHCR first
# and were copied to Docker Hub by digest. The repository's move from the
# HybridCloudWorks organisation to a personal account left its token unable
# to write the organisation's package namespace (`permission_denied: The
# requested installation does not exist`, run 37730460748), and the owner
# chose one registry over two. The digests the consumers pinned then were
# already on Docker Hub byte for byte, so the move needed no rebuild.
#
# Two jobs, so the untrusted path never holds a write-capable token:
#
#   build    every trigger. Builds both targets, loads them into the runner's
#            Docker, runs lab-image/smoke.sh in each under --network none with
#            the source mounted read-only, then lab-image/sandbox-check.mjs,
#            which runs the runner-image capabilities through the agent's own
#            docker-runner.js under the full job sandbox (#675). That is why
#            the two agent files it imports are in the path filter: a change
#            to the sandbox flags is a change to what this image must pass.
#            It runs every job at the agent's default limits, read from
#            vps-agent/index.js, so that file is in the pull_request filter
#            too: a lower job memory is a change to what the image must fit
#            (a limit alone changes nothing in the image, so not on push).
#            It also validates the Landing Zone Builder's full default build,
#            generated from frontend/src/lib/landingZone at run time, so that
#            directory is in the pull_request filter for the same reason: a
#            builder that starts emitting a module the image does not vendor
#            fails here (ADR 0032 decision 5). It is not in the push filter,
#            because a builder change alone changes nothing in the image and
#            should not republish it.
#            `contents: read` and nothing else,
#            because a same-repository pull request can edit this file and run
#            any shell step here; with only a read token that edit can prove
#            nothing and publish nothing. This is the check a pull request
#            waits on.
#   publish  only after `build` succeeds, and only on a push to main or a
#            dispatch from main. Builds both targets again (a job cannot take
#            another job's Docker state; the Actions layer cache only makes
#            this fast), runs the same smoke tests on what it built, and then
#            pushes exactly those images with `docker push`, tagged with the
#            commit sha and `latest`, with a provenance attestation on each.
#            The pushed bytes are the smoke-tested bytes by identity. This job
#            alone holds `id-token: write` and `attestations: write`. It
#            signs in to Docker Hub through a Docker OIDC connection: a
#            short-lived Docker token exchanged for this job's GitHub OIDC
#            token, with no stored credential (#779). It runs only while the
#            repository variable DOCKERHUB_ENABLED is `true`, which is how
#            publishing is switched off. Set out at the login step, and in
#            docs/runbooks/docker-hub-publishing.md. The digests go to the
#            job summary so the follow-up that pins them
#            (vps-agent/lib/capabilities.js, #675) copies them from a
#            first-party source.
#
#   propose-pins, pin-pull-request
#            after every publish (#949). The images are consumed by digest,
#            never by tag, so a publish changes nothing a learner runs until
#            the two consumers pin it: IMAGES.hcwLabRunner in
#            vps-agent/lib/capabilities.js and the workspace image in
#            lab-host/coder/templates/hcw-lab/main.tf. `propose-pins`
#            (`contents: read`) edits both with the digests `publish` read
#            back from Docker Hub, after reading each again from the registry by
#            tag (scripts/lab-pins-upstream.mjs --bump image-digests); a
#            disagreement fails it. `pin-pull-request` opens, or updates, the
#            one `chore/lab-pins-image-digests` pull request with the GitHub
#            App token the other scheduled pull requests use
#            (scripts/open-lab-pin-pr.mjs), from the `automation` environment.
#
#   workflow_dispatch from a branch runs `build` only. A `latest` pushed from a
#   branch would silently replace what learners pull.
#
# THE WEEKLY REBUILD (#949, LAB-3). On the schedule, `build` builds both
# targets from main as a push would, but without the layer cache (a cached
# apt layer is last week's packages), and then compares the Debian
# packages in the new `full` image with those in the `full` image the Coder
# template pins. When they differ, `publish` pushes and attests the rebuild
# (tagged <sha>-rebuilt-<date>, so the commit's own tag keeps naming the
# commit's own build) and the pin pull request follows; when they do not,
# nothing is published and the run says so.
#
#   What a rebuild changes on its own: the packages the `full` target installs
#   with apt from Debian (curl, git, jq, libatomic1, procps and their
#   dependencies), which Debian patches in place, so a rebuild picks up their
#   security fixes. That is all.
#
#   What it cannot change on its own: the base image, its CPython and every
#   package in it, because every FROM is pinned by digest in the commit, and
#   an image built from a FROM the commit does not hold would carry a
#   provenance attestation naming a commit that did not produce it; and every
#   tool in lab-image/versions.env, each pinned with its checksum. Those move
#   by pull request: lab-supply-chain.yml proposes the newest base digest
#   weekly (`chore/lab-pins-image-base`) and the newest release of each tool
#   and Terraform provider (`chore/lab-pins-image-tools`), and merging either
#   is a push here, which rebuilds on it. The runner target installs nothing with apt, so a
#   rebuild of it alone changes nothing a scan would see.
#
# Path-filtered on purpose, unlike ci.yml: this workflow is not a required
# context on the main ruleset (a path-filtered required context is never
# auto-satisfied and blocks unrelated pull requests forever — the T-523
# doctrine in iac-validate.yml). If it is ever made required, remove `paths`
# first and move the filtering inside the job as ci.yml does.
#
# The push authenticates with a token Docker issues per run through the OIDC
# connection; no PAT, no access token, no secret.
#
# The base image's digest lives in two places by necessity — a FROM line
# cannot read a file — so the first step fails the build when any FROM in
# lab-image/Dockerfile or lab-image/sandbox-template/Dockerfile is neither an
# earlier stage nor the image@digest lab-image/versions.env records for that
# file, which also fails a FROM that is not pinned at all.
name: Publish lab image

on:
  workflow_dispatch:
  schedule:
    # Tuesdays 05:20 UTC: before lab-supply-chain.yml (06:45), off the hour
    # and away from the other scheduled jobs. The weekly rebuild; see the
    # header for what it can and cannot change.
    - cron: '20 5 * * 2'
  pull_request:
    paths:
      - 'lab-image/**'
      - 'vps-agent/index.js'
      - 'vps-agent/lib/docker-runner.js'
      - 'vps-agent/lib/capabilities.js'
      - 'frontend/src/lib/landingZone/**'
      - '.github/workflows/publish-lab-image.yml'
  # Not vps-agent/lib/capabilities.js on push (it is on pull_request): the
  # digest pull request edits it, and republishing on that merge would publish
  # new digests, open another pin pull request, and so on forever. A change
  # there changes nothing in the image, the same reason vps-agent/index.js
  # and the builder are pull_request only.
  push:
    branches: [main]
    paths:
      - 'lab-image/**'
      - 'vps-agent/lib/docker-runner.js'
      - '.github/workflows/publish-lab-image.yml'

permissions:
  contents: read

concurrency:
  # Cancel a superseded pull request build, never a publish from main: the
  # main run is the record of what was pushed under a sha.
  group: publish-lab-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `docker.io` as the registry part: the form actions/attest documents for
  # Docker Hub with push-to-registry. Its credential lookup treats docker.io,
  # index.docker.io and registry-1.docker.io as one registry, so it finds the
  # `https://index.docker.io/v1/` entry docker login writes. The consumers
  # pin the same form (scripts/lib/lab-pin-bumps.mjs RUNNER_IMAGE, FULL_IMAGE).
  RUNNER_IMAGE: docker.io/hybridcloudworks/hcw-lab-runner
  FULL_IMAGE: docker.io/hybridcloudworks/hcw-lab
  DOCKERHUB_ORG: hybridcloudworks

jobs:
  build:
    name: Build and smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 60 # slowest 17 min, Oct 2026 (#1441)
    permissions:
      contents: read
    # Read by `publish` on the schedule only (the weekly rebuild).
    outputs:
      rebuild: ${{ steps.rebuild.outputs.rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Every FROM in each Dockerfile is either an earlier stage of the same
      # file or exactly the image@digest versions.env records for that file
      # (the tag included, so the documentation beside the digest cannot
      # drift either). Anything else fails: a different digest, a bare tag,
      # an unpinned image, or a `--platform` flag in front of any of them.
      - name: Every FROM is an earlier stage or the base image digest in versions.env
        working-directory: lab-image
        run: |
          set -euo pipefail
          env_value() { sed -n "s/^$1=//p" versions.env; }
          check() {
            local file="$1" want="$2" stages=" " external=0 bad=0 n=0 line from as name
            test -n "$want"
            case "$want" in *@sha256:*) ;; *) echo "::error file=lab-image/versions.env::${want} is not image@sha256:digest"; return 1 ;; esac
            while IFS= read -r line; do
              n=$((n + 1))
              read -r _ from as name _ <<<"$line"
              if [[ "$stages" == *" ${from} "* ]]; then
                echo "ok    ${file}: FROM ${from} (earlier stage)"
              elif [ "$from" = "$want" ]; then
                external=$((external + 1))
                echo "ok    ${file}: FROM ${from}"
              else
                bad=1
                echo "::error file=lab-image/${file}::FROM ${from} is neither an earlier stage nor ${want} from versions.env"
              fi
              if [ "${as,,}" = as ] && [ -n "$name" ]; then stages="${stages}${name} "; fi
            done < <(grep -iE '^[[:space:]]*FROM[[:space:]]' "$file")
            echo "${file}: ${n} FROM line(s), ${external} pinned to ${want}"
            test "$bad" -eq 0
            test "$external" -gt 0
          }
          check Dockerfile "$(env_value BASE_IMAGE)@$(env_value BASE_DIGEST)"
          check sandbox-template/Dockerfile "$(env_value SANDBOX_BASE_IMAGE)@$(env_value SANDBOX_BASE_DIGEST)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `load: true` puts the image into the runner's Docker so smoke.sh can
      # run it. `provenance: false` here and in the publish job: the
      # attestation is actions/attest-build-provenance's, pushed to Docker Hub
      # beside the image, so the pushed image stays a plain single manifest whose
      # digest is the one `docker pull` reports — the value #675 pins.
      # `cache-to` fills the Actions cache the publish job rebuilds from.
      # `no-cache` on the weekly schedule, here and in the publish job: the
      # `full` target's apt layer has the same instruction every week, so a
      # cached build would reuse last week's packages and the rebuild would
      # never change anything.
      - name: Build runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab-image
          target: runner
          load: true
          push: false
          provenance: false
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: hcw-lab-runner:ci
          cache-from: type=gha,scope=hcw-lab
          cache-to: type=gha,scope=hcw-lab,mode=max

      - name: Build full
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab-image
          target: full
          load: true
          push: false
          provenance: false
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: hcw-lab:ci
          cache-from: type=gha,scope=hcw-lab
          cache-to: type=gha,scope=hcw-lab,mode=max

      - name: Smoke runner
        run: docker run --rm --network none -v "${GITHUB_WORKSPACE}/lab-image:/workspace:ro" hcw-lab-runner:ci bash /workspace/smoke.sh runner

      - name: Smoke full
        run: docker run --rm --network none -v "${GITHUB_WORKSPACE}/lab-image:/workspace:ro" hcw-lab:ci bash /workspace/smoke.sh full

      # The smoke test runs inside a container with a network switch and
      # nothing else. This runs each runner-image capability through the
      # agent's own docker-runner.js (read-only root, cap-drop ALL, the 64 MB
      # tmpfs, uid 65534, the memory limit, a tar payload) against the image
      # just built, because two of #675's faults were invisible to the smoke
      # test and fatal there. Node only; docker-runner.js has no dependency.
      - name: Sandbox check
        run: node lab-image/sandbox-check.mjs hcw-lab-runner:ci

      # The weekly rebuild publishes only when it changes something a learner
      # runs: the Debian packages of the `full` image the Coder template pins,
      # against those of the one just built. Package and version, sorted; a
      # difference is the reason to publish, and the diff goes to the summary.
      # Any other trigger publishes as it always has, so this runs on the
      # schedule only.
      - name: Did the weekly rebuild change the full image's packages?
        id: rebuild
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          pinned=$(grep -oE 'image_digest\s*=\s*"sha256:[0-9a-f]{64}"' lab-host/coder/templates/hcw-lab/main.tf | grep -oE 'sha256:[0-9a-f]{64}')
          test -n "$pinned"
          docker pull --quiet "${FULL_IMAGE}@${pinned}" > /dev/null
          packages() { docker run --rm --network none --user 0 --entrypoint dpkg-query "$1" -W -f '${binary:Package} ${Version}\n' | LC_ALL=C sort; }
          packages "${FULL_IMAGE}@${pinned}" > "${RUNNER_TEMP}/packages-pinned.txt"
          packages hcw-lab:ci > "${RUNNER_TEMP}/packages-rebuilt.txt"
          {
            echo "## Weekly rebuild"
            echo
            echo "Debian packages of \`${FULL_IMAGE}@${pinned}\` (pinned in the Coder template) against this rebuild:"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if diff -u "${RUNNER_TEMP}/packages-pinned.txt" "${RUNNER_TEMP}/packages-rebuilt.txt" > "${RUNNER_TEMP}/packages.diff"; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "The same $(wc -l < "${RUNNER_TEMP}/packages-rebuilt.txt") packages at the same versions, so nothing is published this week." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            { echo '```diff'; cat "${RUNNER_TEMP}/packages.diff"; echo '```'; echo; echo "Published below, and pinned by the digest pull request that follows."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Image sizes
        run: |
          set -euo pipefail
          {
            echo "## hcw-lab image sizes"
            echo
            echo '```'
            docker image ls --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' hcw-lab-runner:ci
            docker image ls --format '{{.Repository}}\t{{.Tag}}\t{{.Size}}' hcw-lab:ci
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Docker Hub's OIDC connection trusts one subject, this repository's `main`
  # in GitHub's immutable-identifier form:
  #   repo:saulpatinojr@34853639/HCW-HybridCloudWorks@1268997852:ref:refs/heads/main
  # which is what this job runs on: a push to main, a dispatch from main, or
  # the schedule, which runs on the default branch. It declares no
  # environment on purpose: an environment subject carries no ref, so it
  # would match a dispatch from any branch unless a deployment-branch rule
  # outside this file held (Required-Inputs §4.4).
  #
  # The owner half changed on 2026-10-07, when the repository moved from the
  # HybridCloudWorks organisation (312844660) to the personal account; the
  # connection's rule in Docker Home had to be edited to match by hand.
  # scripts/check-oidc-owner.mjs keeps EXPECTED_RULE below equal to
  # infra/oidc.tf and to the repository CI runs in.
  #
  # `id-token: write` is for the Docker token exchange and for Sigstore;
  # `attestations: write` stores the provenance.
  publish:
    name: Publish to Docker Hub
    needs: build
    if: >-
      vars.DOCKERHUB_ENABLED == 'true' && (
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && needs.build.outputs.rebuild == 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 60 # slowest 3.8 min; rebuilds as slowly as build on a cache miss (#1441)
    permissions:
      contents: read
      id-token: write # the Docker token exchange, and Sigstore's signing certificate
      attestations: write
      # The attest step's storage record on the linked artifacts page
      # (docs.github.com, "Uploading storage and deployment data to the linked
      # artifacts page"). Without it every run warned "Please check that the
      # artifact-metadata:write permission has been included" and "Failed to
      # create storage record" (run 36508154993, 2026-09-29).
      artifact-metadata: write
    # What propose-pins pins. Digests are not secrets.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      runner-digest: ${{ steps.push-runner.outputs.digest }}
      full-digest: ${{ steps.push-full.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The commit sha, as always; a weekly rebuild of an unchanged commit
      # gets the date beside it, so `<sha>` keeps naming the bytes the commit's
      # own publish pushed rather than moving to a rebuild of them.
      - name: Choose the tag
        id: tag
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then tag="${SHA}-rebuilt-$(date -u +%Y%m%d)"; else tag="${SHA}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Before the builds, so a missing connection ID fails in seconds rather
      # than after them. docker/login-action checks the ID too, but its
      # message cannot say that the fix is a repository variable.
      - name: DOCKERHUB_CONNECTION holds a connection ID
        env:
          CONNECTION_ID: ${{ vars.DOCKERHUB_CONNECTION }}
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [[ ! "$CONNECTION_ID" =~ $uuid ]]; then
            echo "::error::DOCKERHUB_ENABLED is true, but the repository variable DOCKERHUB_CONNECTION is not an OIDC connection ID (a UUID, copied from the connection in Docker Home). See docs/runbooks/docker-hub-publishing.md."
            exit 1
          fi

      # This job builds its own images (a job cannot receive the build job's
      # Docker state, and the Actions layer cache is a speed-up, not a
      # guarantee), so it smoke-tests what it built and then pushes exactly
      # those bytes with `docker push`: the image that passed the smoke test
      # is the image that lands on Docker Hub, by identity rather than by
      # reconstruction.
      - name: Build runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab-image
          target: runner
          load: true
          push: false
          provenance: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=hcw-lab
          tags: hcw-lab-runner:ci

      - name: Build full
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lab-image
          target: full
          load: true
          push: false
          provenance: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=hcw-lab
          tags: hcw-lab:ci

      - name: Smoke runner
        run: docker run --rm --network none -v "${GITHUB_WORKSPACE}/lab-image:/workspace:ro" hcw-lab-runner:ci bash /workspace/smoke.sh runner

      - name: Smoke full
        run: docker run --rm --network none -v "${GITHUB_WORKSPACE}/lab-image:/workspace:ro" hcw-lab:ci bash /workspace/smoke.sh full

      # The smoke test runs inside a container with a network switch and
      # nothing else. This runs each runner-image capability through the
      # agent's own docker-runner.js (read-only root, cap-drop ALL, the 64 MB
      # tmpfs, uid 65534, the memory limit, a tar payload) against the image
      # just built, because two of #675's faults were invisible to the smoke
      # test and fatal there. Node only; docker-runner.js has no dependency.
      - name: Sandbox check
        run: node lab-image/sandbox-check.mjs hcw-lab-runner:ci

      # docker/login-action v4.5.0 and later: with no password, a registry of
      # docker.io and DOCKERHUB_OIDC_CONNECTIONID set, it requests a GitHub ID
      # token for the audience https://identity.docker.com, exchanges it at
      # https://identity.docker.com/oauth/token (RFC 8693) and logs in with
      # the Docker access token it gets back, which is masked in the log.
      # Here, after the builds, smoke tests and sandbox check, so the token's
      # life is spent on the pushes and attestations alone.
      #
      # 900 seconds, not the default 300: the pushes now upload every new
      # layer from this runner rather than copy a manifest between registries,
      # and the weekly rebuild changes the apt layer of the larger `full`
      # image. The two pushes and two attestations took about 70 seconds to
      # GHCR (run 36392932443); the margin is for a slow upload, and a step
      # that fails `unauthorized` minutes after this one still points at the
      # lifetime. DOCKERHUB_OIDC_EXPIREIN accepts 300 to 3600 (the action's
      # src/dockerhub.ts at v4.6.0). DOCKERHUB_OIDC_CONNECTIONID is the name
      # the action reads; DOCKERHUB_CONNECTION is ours.
      - name: Log in to Docker Hub through the OIDC connection
        id: dockerhub-login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: '900'
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_ORG }}

      # Docker answers a refused exchange with only `400 access_denied`, which
      # does not say which condition failed (the first run, 36508154993 on
      # 2026-09-29, did exactly that). This asks GitHub for an ID token with
      # Docker's audience, as the login step did, and prints its non-secret
      # claims beside the rule the connection should hold, so the owner can
      # compare them character by character. The token itself is never
      # printed: only fields decoded from its payload are.
      - name: Explain a refused Docker token exchange
        if: failure() && steps.dockerhub-login.outcome == 'failure'
        env:
          EXPECTED_RULE: repo:saulpatinojr@34853639/HCW-HybridCloudWorks@1268997852:ref:refs/heads/main
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://identity.docker.com")"
          # The JWT's middle segment, base64url without padding: map to
          # base64, pad to a multiple of four, decode.
          payload="$(jq -r '.value' <<<"$response" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims="$(base64 -d <<<"$payload")"
          sub="$(jq -r '.sub' <<<"$claims")"
          {
            echo "### Docker refused the token exchange"
            echo
            echo "| Claim | Value |"
            echo "| --- | --- |"
            jq -r '["sub","aud","repository","repository_id","repository_owner_id","ref","event_name","job_workflow_ref"][] as $k | "| `\($k)` | `\(.[$k] // "")` |"' <<<"$claims"
            echo
            if [ "$sub" = "$EXPECTED_RULE" ]; then
              echo "The subject matches the rule in docs/runbooks/docker-hub-publishing.md exactly, so the connection's ruleset is not the mismatch if it holds that rule. Check in Docker Home that the ruleset lists the resources hybridcloudworks/hcw-lab and hybridcloudworks/hcw-lab-runner with read and write scopes, and that the organisation's plan includes OIDC connections (Team or Business)."
            else
              echo "The subject differs from the rule the runbook asks for (\`${EXPECTED_RULE}\`). The connection's rule must match this run's \`sub\` above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Docker refused the OIDC exchange. This run's subject is '${sub}'. The run summary compares it with the rule the connection should hold."

      # `docker push` of the loaded image writes a plain single manifest whose
      # digest is the one `docker pull` reports — the value #675 pins. The
      # digest is read back from the pushed reference, not computed locally.
      - name: Push runner
        id: push-runner
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag hcw-lab-runner:ci "${RUNNER_IMAGE}:${TAG}"
          docker tag hcw-lab-runner:ci "${RUNNER_IMAGE}:latest"
          docker push "${RUNNER_IMAGE}:${TAG}"
          docker push "${RUNNER_IMAGE}:latest"
          digest="$(docker buildx imagetools inspect "${RUNNER_IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Push full
        id: push-full
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag hcw-lab:ci "${FULL_IMAGE}:${TAG}"
          docker tag hcw-lab:ci "${FULL_IMAGE}:latest"
          docker push "${FULL_IMAGE}:${TAG}"
          docker push "${FULL_IMAGE}:latest"
          digest="$(docker buildx imagetools inspect "${FULL_IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest runner provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.RUNNER_IMAGE }}
          subject-digest: ${{ steps.push-runner.outputs.digest }}
          push-to-registry: true

      - name: Attest full provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.FULL_IMAGE }}
          subject-digest: ${{ steps.push-full.outputs.digest }}
          push-to-registry: true

      - name: Published digests
        env:
          RUNNER_DIGEST: ${{ steps.push-runner.outputs.digest }}
          FULL_DIGEST: ${{ steps.push-full.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## Published"
            echo
            echo "Pin these as \`<tag>@<digest>\`; the tag is documentation, the digest decides."
            echo
            echo '```'
            echo "${RUNNER_IMAGE}:${TAG}@${RUNNER_DIGEST}"
            echo "${FULL_IMAGE}:${TAG}@${FULL_DIGEST}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The consumers' digest pins, after every publish (#949): see the header.
  # Two jobs for the reason lab-supply-chain.yml gives: the one that reads
  # the registry holds `contents: read`, and the one that holds the App token
  # reads nothing from the network but GitHub's API.
  propose-pins:
    name: Plan the consumers' digest pins
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout only — this job must never be able to push
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No npm ci: the scripts import node: built-ins only.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # Each digest is read again from Docker Hub by tag and must equal what
      # `publish` read back after its push; a note here is a disagreement, and
      # fails the job rather than pinning either value.
      - name: Pin the published digests
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          RUNNER_DIGEST: ${{ needs.publish.outputs.runner-digest }}
          FULL_DIGEST: ${{ needs.publish.outputs.full-digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lab-pins"
          node scripts/lab-pins-upstream.mjs --bump image-digests \
            --runner "${RUNNER_IMAGE}:${TAG}@${RUNNER_DIGEST}" \
            --full "${FULL_IMAGE}:${TAG}@${FULL_DIGEST}" \
            --evidence "${RUNNER_TEMP}/lab-pins/evidence-image-digests.md" \
            --notes "${RUNNER_TEMP}/lab-pins/notes-image-digests.md" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s "${RUNNER_TEMP}/lab-pins/notes-image-digests.md" ]; then
            echo "::error::A published digest could not be confirmed on Docker Hub; nothing is pinned. See the summary."
            exit 1
          fi

      - name: The patch, over the two consumer files only
        id: patch
        run: |
          set -euo pipefail
          mapfile -t paths < <(node scripts/open-lab-pin-pr.mjs --paths image-digests)
          git diff --binary -- "${paths[@]}" > "${RUNNER_TEMP}/lab-pins/image-digests.patch"
          if [ -s "${RUNNER_TEMP}/lab-pins/image-digests.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Both consumers already pin these digests." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the patch and evidence
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-image-digests
          path: ${{ runner.temp }}/lab-pins/
          retention-days: 7
          if-no-files-found: error

  pin-pull-request:
    name: Open or update the digest pull request
    needs: propose-pins
    if: needs.propose-pins.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # `automation`, as in the other PR-opening jobs: the weekly rebuild runs
    # on a schedule, and an approval gate would leave it waiting.
    environment: automation
    permissions:
      contents: read # checkout only — this job cannot push anywhere on its own
    steps:
      # `persist-credentials: false`, or the push authenticates as
      # github-actions[bot] and is refused (publish-content-manifest.yml,
      # run 34092896715).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-image-digests
          path: ${{ runner.temp }}/lab-pins

      - name: Apply the patch
        run: git apply "${RUNNER_TEMP}/lab-pins/image-digests.patch"

      # Self-arming: before the App exists this reports that it opened
      # nothing rather than failing every publish.
      - name: Is the App configured?
        id: app
        env:
          MANIFEST_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          MANIFEST_APP_ID: ${{ vars.MANIFEST_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MANIFEST_APP_PRIVATE_KEY}" ] && [ -n "${MANIFEST_APP_ID}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::New digests were published but the App is not configured, so no pull request was opened. Set the MANIFEST_APP_ID variable and the MANIFEST_APP_PRIVATE_KEY secret (T-726)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # No `npm ci`: the minter imports only node:crypto and node:url.
      - name: Mint an App installation token
        id: token
        if: steps.app.outputs.armed == 'true'
        env:
          GITHUB_APP_ID: ${{ vars.MANIFEST_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token=$(node scripts/github-app-token.mjs)
          # Masked BEFORE it is written anywhere, including to GITHUB_OUTPUT.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # Stages the two consumer files by name and refuses when anything else
      # changed; one branch, one open pull request.
      - name: Push the branch and open or update the pull request
        if: steps.app.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/open-lab-pin-pr.mjs --set image-digests --evidence "${RUNNER_TEMP}/lab-pins/evidence-image-digests.md" --notes "${RUNNER_TEMP}/lab-pins/notes-image-digests.md"

      # The token lives an hour; the work above takes seconds. `always()`, so
      # a failed push still cleans up.
      - name: Revoke the installation token
        if: always() && steps.token.outputs.token != ''
        env:
          GITHUB_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/github-app-token.mjs --revoke
