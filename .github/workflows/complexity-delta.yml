# Report the cyclomatic complexity a pull request ADDS. Say nothing about the
# complexity that was already here.
#
# WHY THIS IS A DELTA GATE AND NOT `lizard . -C 8 -W`
#
# Measured at the head of `main` on 2026-09-16:
#
#     CCN > 8 : 479 functions      CCN > 20 : 43 functions
#     CCN > 10: 322 functions      CCN > 25 : 25 functions
#     CCN > 12: 219 functions      CCN > 30 : 18 functions
#     CCN > 15: 117 functions      CCN > 40 :  9 functions
#
# A whole-tree run at CCN 8 is red 479 times over on its first pull request and
# on every one after it, INCLUDING pull requests that remove complexity. A check
# that cannot go green is a check nobody reads, and this repository already has
# one of those: monitor-unresolved-secrets.yml sits `disabled_manually` with
# nothing in the history saying why.
#
# So this asks the question that has a green answer available every time — "did
# this pull request make it worse" — and leaves the 479 to be worked down
# separately. scripts/complexity/check_complexity_delta.py carries the rest of
# the reasoning, including how functions are matched across a diff.
#
# ALSO: `lizard . -C 8 -W` does not do what it reads like. Lizard's `-W` is
# `--whitelist` and takes a FILENAME, so that command exits 2 from argparse —
# "argument -W/--whitelist: expected one argument" — before measuring anything.
# Lowercase `-w` prints warnings, and lizard already exits 1 when it finds any,
# so there is no fail-on-warning flag to add.
#
# WHY THE pull_request TRIGGER IS NOT PATH-FILTERED
#
# Same reason as iac-validate.yml and ADR 0026: a path-filtered workflow that is
# also a required context leaves every pull request that does not match the
# filter sitting at "Expected — waiting for status to be reported" forever. The
# job runs on every pull request and decides for itself whether anything
# analysable changed — a checkout and one `git diff` when nothing did.
#
# REPORT FIRST, ENFORCE WHEN READY
#
# The default posture is report-only: findings appear as annotations on the
# changed lines and as a job summary, and the check stays green. Arm it by
# setting the `COMPLEXITY_ENFORCE` repository variable to `true`
# (Settings → Secrets and variables → Actions → Variables), at
# https://github.com/saulpatinojr/HCW-HybridCloudWorks/settings/variables/actions
# Raise the threshold the same way with `COMPLEXITY_THRESHOLD`.

name: Complexity Delta

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: complexity-delta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delta:
    name: complexity delta
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # slowest 0.8 min, Oct 2026 (#1441)

    steps:
      # fetch-depth: 0 so the merge base is reachable. A shallow clone makes
      # `git merge-base` fail, and the script exits 2 for that rather than
      # reporting a pass it never measured.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Everything below reads local objects — `git merge-base` and
          # `git show` — so the job needs no token after the clone.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      # Pinned, not floating. A tokenizer change between lizard releases moves
      # every number this check compares, which would read as a pull request
      # that added complexity on the day the release landed.
      - name: Install lizard
        run: pip install --disable-pip-version-check lizard==1.24.0

      # The gate's own comparison logic, before it is used to judge anything.
      # It needs neither git nor lizard and costs under a second, which is
      # cheaper than finding out from a false positive on someone's pull
      # request that the move-matching regressed.
      - name: Self-test
        run: python3 -m unittest discover -s scripts/complexity -p 'test_*.py'

      - name: Complexity delta against the merge base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          THRESHOLD: ${{ vars.COMPLEXITY_THRESHOLD || '8' }}
          ENFORCE: ${{ vars.COMPLEXITY_ENFORCE }}
        run: |
          if [ "${ENFORCE}" = "true" ]; then MODE=""; else MODE="--report-only"; fi
          python3 scripts/complexity/check_complexity_delta.py \
            --base "origin/${BASE_REF}" \
            --threshold "${THRESHOLD}" \
            ${MODE}
