# Are the Key Vault references still resolving? (T-720)
#
# WHY THIS IS NOT THE SCHEDULED-QUERY ALERT THE TRACKER ASKED FOR.
#
# TODO.md once carried "a scheduled-query alert on unresolvedSecrets ... needs an
# apply" for weeks. There was nothing to apply, and there could not have been.
# The count exists only as a field in the /api/health RESPONSE BODY; nothing
# writes it to Log Analytics. A KQL rule would query a table that never receives
# it and return zero rows forever — an alert that reads as healthy precisely
# because it can never fire. That is the worst possible shape for a detector,
# and this estate has already been bitten twice by instruments confidently
# reporting about the wrong subject.
#
# Curling /api/health from a runner does not work either: through Cloudflare a
# GitHub-hosted runner gets a Bot Fight Mode 403, and direct to origin it gets
# the origin lock's 403 because the site denies every address outside
# Cloudflare's ranges. validate-deployed.yml was the workflow that documented
# this at length, and it could never pass from a runner for exactly this
# reason; it was deleted on 2026-09-08 after three weeks red. The same checks
# run from an operator machine — docs/runbooks/edge-dns-verification.md.
#
# So this reads the CONDITION through ARM, which is the argument
# monitor-functions-registered.yml already makes and wins on the same axes: it
# survives the Log Analytics daily cap that silences every rule in
# observability.tf, it does not traverse Cloudflare, it needs no metric that
# does not exist, and it names WHICH setting is broken rather than a count.
#
# HOW IT PAGES. A failed scheduled run emails the repository owner through
# GitHub's own notifications. No action group, no Azure alert rule, no cost.
#
# EVERY SIX HOURS, not hourly. A reference stops resolving when a secret is
# rotated, expires, or an RBAC assignment changes — none of which happen on a
# minute scale. Four runs a day is ~120 job-minutes a month against the free
# allowance, alongside monitor-functions-registered (hourly). Offset from the
# top of the hour for the same reason that one is.
#
# NO `environment:` KEY — declaring one changes the OIDC subject from
# repo:<org>/<repo>:ref:<ref> to :environment:<name>, which the reader's branch
# credential cannot match. github_reader holds two federated credentials and
# both are ref-form (AADSTS700213, documented in infra/oidc.tf).

name: Monitor Unresolved Secrets

on:
  schedule:
    # Offset from the top of the hour, as the other monitors are.
    - cron: '29 */6 * * *'
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: read-only monitor on a Reader identity; names go through env into a quoted URL. docs/security/scanner-triage.md#checkov
    inputs:
      function_app:
        description: 'Function App whose Key Vault references are checked'
        required: false
        default: 'func-site-prod-cus-01'
      resource_group:
        description: 'Resource group holding the Function App'
        required: false
        default: 'rg-web-site-prod-cus'

# The workflow-level default. `id-token: write` is granted on the job that uses
# it rather than here (zizmor excessive-permissions, #588): this workflow has
# one job today, so the two are identical in effect — what a job-level grant
# prevents is a second job added later silently inheriting the OIDC token.
permissions:
  contents: read # the checkout, nothing more

concurrency:
  # Never cancel a run in flight. This is a six-hourly monitor, so a cancelled
  # run is a skipped check rather than a check done later.
  group: monitor-unresolved-secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check Key Vault references resolve
    # Self-arming, as monitor-functions-registered.yml is: before the first
    # apply there is no identity to log in as, and a red run every six hours
    # would read as a permissions bug while actually meaning "not deployed yet".
    if: ${{ vars.READER_CLIENT_ID != '' }}
    permissions:
      contents: read # the checkout, nothing more
      id-token: write # exchanged by azure/login for an Azure access token
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # slowest 0.8 min, Oct 2026 (#1441)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # READER_CLIENT_ID, not CLIENT_ID. This reads and changes nothing, so it
      # runs as the read-only identity rather than the one that can deploy code.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.READER_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Are the Key Vault references resolving?
        env:
          APP: ${{ inputs.function_app || 'func-site-prod-cus-01' }}
          RG: ${{ inputs.resource_group || 'rg-web-site-prod-cus' }}
          SUB: ${{ vars.SUBSCRIPTION_ID }}
        run: |
          set -uo pipefail

          URL="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${RG}"
          URL="${URL}/providers/Microsoft.Web/sites/${APP}/config/configreferences/appsettings"
          URL="${URL}?api-version=2023-12-01"

          err=$(mktemp)
          if ! payload=$(az rest --method get --url "${URL}" --only-show-errors 2>"${err}"); then
            reason=$(tr -d '\r' < "${err}" | tr '\n' ' ' | cut -c1-300)
            # An authorization failure is NOT an outage. Saying so is the whole
            # difference between a useful page and a distrusted one — the same
            # distinction monitor-functions-registered.yml draws.
            case "${reason}" in
              *AuthorizationFailed*|*does\ not\ have\ authorization*|*Forbidden*)
                echo "::warning::NOT AUTHORIZED to read Key Vault reference status. This is a"
                echo "::warning::permissions gap, not a broken secret. github_reader needs an"
                echo "::warning::action covering Microsoft.Web/sites/config on ${APP}."
                echo "Reason: ${reason}"
                exit 1 ;;
              *)
                echo "::error::Could not read Key Vault reference status, so NOTHING is known"
                echo "::error::about the references. This is not a clean bill of health."
                echo "Reason: ${reason}"
                exit 1 ;;
            esac
          fi

          printf '%s' "${payload}" | node scripts/check-unresolved-secrets.mjs
          code=$?

          # 0 healthy, 1 at least one reference is not resolving, 2 the payload
          # could not be understood. Two is reported differently on purpose: it
          # means the check could not tell, which must never render as green.
          if [ "${code}" = "2" ]; then
            echo "::error::The ARM payload was not in a shape this check understands, so it"
            echo "::error::reports nothing about the references rather than reporting health."
            exit 1
          fi
          exit "${code}"
