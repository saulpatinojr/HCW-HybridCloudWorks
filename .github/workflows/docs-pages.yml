# Documentation site — build on every change, deploy to GitHub Pages on main.
#
# Source is docs/ plus the three root documents the hook in scripts/docs/hooks.py
# pulls in (README.md, CHANGELOG.md, TODO.md). `mkdocs build --strict` fails the
# job on a broken link, a missing nav target or an unknown anchor, so a PR
# cannot merge a page that would 404 on the site.
#
# Deployment uses the github-pages environment and OIDC: no PAT, no deploy
# key. The Pages site was created with build_type=workflow on 2026-09-05
# (issue #360); the custom domain docs.hybridcloudworks.com is set on the site
# after the Cloudflare CNAME in infra/frontend.tf is applied.
name: Docs site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'TODO.md'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'TODO.md'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read # the checkout, nothing more

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt

      - name: Install MkDocs
        run: python -m pip install -r scripts/docs/requirements.txt

      # Publication gate, before the build: no links back to the retired Wiki,
      # no non-placeholder GUIDs (tenant, subscription, client, resource ids),
      # no contributor-local paths. The site is public on a real domain; the
      # gate is what keeps a pasted identifier from shipping with a page.
      - name: Redaction and link gate
        run: python scripts/docs/check_redaction.py

      # A page may not say a live thing is still planned (PLAT-9, #969): the
      # phrases the 2026-10-06 review found an operator acting on, each
      # failing the build once the dated record it contradicts exists.
      - name: Stale state gate
        run: python scripts/docs/check_stale_state.py

      - name: Build
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write # publishes the built site to GitHub Pages
      id-token: write # the OIDC token deploy-pages exchanges for its Pages token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
