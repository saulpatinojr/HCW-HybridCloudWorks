name: Second Brain plugin
on:
  pull_request:
    paths: ['obsidian-plugin/**', '.github/workflows/second-brain-plugin.yml']
  push:
    branches: [main]
    paths: ['obsidian-plugin/**', '.github/workflows/second-brain-plugin.yml']
permissions:
  contents: read
concurrency:
  group: second-brain-plugin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plugin:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      # Windows DPAPI is tested on the Windows development host and during
      # release acceptance. The cross-platform engine tests run here.
