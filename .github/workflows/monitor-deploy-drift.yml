# Is production behind `main`, and for how long?
#
# WHY THIS EXISTS. deploy-functions.yml and deploy-azure-frontend.yml are both
# workflow_dispatch only, by a recorded decision — enabling a workflow and
# enabling auto-deploy-on-merge are separate choices, and only the first was
# made. So merging deploys nothing, and until 2026-09-01 nothing said so.
#
# That one gap produced both of 2026-08-31's incidents, hours apart, both found
# by accident rather than by a check:
#
#   - The manifest route merged 2026-08-30 02:45 UTC against a Function App last
#     deployed at 01:21. publish-content-manifest.yml then failed with a 404 for
#     two nights, and its own error message blamed the app — which was healthy,
#     reporting 121 registered functions the whole time.
#   - The frontend was 35 commits behind, including a hydration change and a
#     security fix, discovered only because someone deployed for another reason.
#
# AGE, NOT COMMIT COUNT — the design decision this workflow turns on. The first
# incident was ONE commit behind and the second was THIRTY-FIVE. No count
# threshold separates them: catch the one and you fire on every ordinary merge;
# tolerate ordinary merges and you miss the outage. What they share is that both
# sat undeployed for days. Age tolerates the normal merge-then-deploy gap, which
# is the entire point of dispatch-only releases, and still catches a change that
# was merged and forgotten. scripts/check-deploy-drift.mjs carries the reasoning
# beside the code.
#
# HOW IT PAGES. A failed scheduled run emails the repository owner through
# GitHub's own notifications — the same mechanism monitor-functions-registered.yml
# uses, and for the same reason: no action group, no Azure alert rule, no cost,
# and no dependency on the subscription being watched.
#
# ON THE SCHEDULE BEING UNRELIABLE, said plainly rather than assumed away.
# GitHub delivers about 22% of this repository's scheduled runs, a median 36
# minutes late, with a 12.7-hour worst case (measured 2026-08-31 over
# monitor-functions-registered.yml's whole life). For an outage detector that is
# a real problem. Here it is not: this watches a condition measured in DAYS
# against a threshold measured in HOURS, so a check landing every 4.6 hours on
# average has ample margin against a 24-hour threshold. If the threshold ever
# drops near the delivery gap, that reasoning stops holding and this comment is
# the thing that should stop it.
#
# NO AZURE, NO OIDC, NO `environment:`. Everything here is answerable from the
# GitHub API: the last successful run of each deploy workflow, and the commits on
# main touching that service's paths since. Nothing to authenticate to, nothing
# to leak, and no self-arming gate needed.
#
# ===========================================================================
# A SECOND JOB, ADDED 2026-09-08: CAN EVERY WORKFLOW STILL SUCCEED?
# ===========================================================================
# `validate-deployed.yml` was dispatched twice on 2026-08-18, failed both
# times, and sat in the directory for three weeks. Its own header explained
# why it could not pass from a GitHub-hosted runner; nothing was reading it.
# #426 retired it on 2026-09-08. `scripts/check-workflow-health.mjs` is the
# part that stops the next one sitting there: it reads run history and names
# any workflow with no success in the sampled window, at least one failure
# among those runs, and no attempt of any kind inside the staleness window.
# Run against this repository on 2026-09-08 it named that one and nothing
# else.
#
# WHY IT LIVES HERE AND NOT IN A FILE OF ITS OWN. The owner's instruction on
# 2026-09-08 was that there are too many workflows. This one already holds the
# permissions the check needs (`actions: read`), already runs Node with no
# `npm ci`, already runs on a schedule, and is already the repository's
# delivery-health monitor. A twentieth file to ask one more question of the
# same API would have been the wrong trade.
#
# IT IS A SEPARATE JOB, NOT A SECOND STEP, and that is not cosmetic. "The
# frontend is four days behind" and "a workflow has been failing since August"
# are different findings needing different people; a single job conclusion
# would merge them into one red X that says neither. Same reasoning as the
# three-way exit-code split in tfc-plan-check.yml.

name: Monitor delivery health

on:
  schedule:
    # Offset from the top of the hour, and from the other monitors' minutes, so
    # three jobs do not queue against each other on a scheduler that is already
    # dropping most of them.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: read-only monitor; threshold goes through env and the script refuses a non-positive number. docs/security/scanner-triage.md#checkov
    inputs:
      threshold_hours:
        description: 'Fail when a service has been behind for at least this many hours.'
        required: false
        default: '24'

# Reads the commit log and the run history. Writes nothing, anywhere.
permissions:
  contents: read # reads the commit log; writes nothing
  actions: read # reads this repository's own run history

concurrency:
  group: deploy-drift
  cancel-in-progress: true

jobs:
  check:
    name: Is production behind main?
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # No `npm ci`. The script imports node:url and uses global fetch, and a
      # monitor that installs third-party packages to check a commit log has
      # more supply chain than subject matter.
      - name: Measure the drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRIFT_THRESHOLD_HOURS: ${{ inputs.threshold_hours || '24' }}
        run: |
          set -uo pipefail
          # Captured, then written to BOTH the summary and stdout. The summary is
          # readable from the GitHub mobile app; stdout is what the REST logs API
          # exposes. verify-alert-state.yml's first run wrote only the summary
          # and could not be diagnosed without a browser.
          report=$(node scripts/check-deploy-drift.mjs)
          status=$?
          echo "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  workflows:
    name: Can every workflow still succeed?
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # No `npm ci`, for the same reason the job above gives: the script uses
      # global fetch and nothing else.
      - name: Read the run history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          # `2>&1` IS LOAD-BEARING. Every exit-2 path in the script writes with
          # console.error and nothing to stdout: the usage banner, the
          # paginated-listing refusal, the run-filter refusal. Without the
          # redirect this captured 0 bytes on exit 2 — measured — so the job
          # went red with a BLANK step summary, in the one case an operator most
          # needs to read why. Caught in review on this PR;
          # scripts/check-workflow-health.invocation.test.mjs is the tripwire.
          report=$(node scripts/check-workflow-health.mjs 2>&1)
          # Immediately, and from the assignment rather than from a pipeline.
          # `node ... | tee` would report tee's status, which is always 0 — a
          # monitor that can never fail.
          status=$?
          # Both destinations: the summary is readable from the mobile app, and
          # stdout is what the REST logs API exposes. verify-alert-state.yml's
          # first run wrote only the summary and could not be diagnosed without
          # opening a browser.
          echo "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          # Exit 2 means the history could not be read, which is NOT a verdict
          # on any workflow. It still fails the job — an instrument that cannot
          # see should say so loudly — but the report says which of the two
          # happened.
          exit $status
