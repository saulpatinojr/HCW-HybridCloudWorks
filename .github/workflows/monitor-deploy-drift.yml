# Is production behind `main`, and for how long?
#
# WHY THIS EXISTS. deploy-functions.yml and deploy-azure-frontend.yml were both
# workflow_dispatch only, by a recorded decision — enabling a workflow and
# enabling auto-deploy-on-merge are separate choices, and only the first was
# made. So merging deployed nothing, and until 2026-09-01 nothing said so.
#
# Since 2026-11-09 (owner decision on #1613) a merge that changes frontend/
# starts a frontend deploy by itself, and nobody approves it (the owner removed
# the `production` environment's required reviewers the same day). The
# functions deploy is still started by hand, and since #1617 it waits for a
# reviewer in the `production-backend` environment. This monitor reads the last
# successful run whatever started it, so a frontend run that failed still
# shows as drift. It does not see a change outside frontend/ that the site
# needs (a repository variable, the deploy workflow itself): that starts no
# deploy, and the monitor counts only commits under frontend/, so such a
# change needs a frontend deploy started by hand.
#
# That one gap produced both of 2026-08-31's incidents, hours apart, both found
# by accident rather than by a check:
#
#   - The manifest route merged 2026-08-30 02:45 UTC against a Function App last
#     deployed at 01:21. publish-content-manifest.yml then failed with a 404 for
#     two nights, and its own error message blamed the app — which was healthy,
#     reporting 121 registered functions the whole time.
#   - The frontend was 35 commits behind, including a hydration change and a
#     security fix, discovered only because someone deployed for another reason.
#
# AGE, NOT COMMIT COUNT — the design decision this workflow turns on. The first
# incident was ONE commit behind and the second was THIRTY-FIVE. No count
# threshold separates them: catch the one and you fire on every ordinary merge;
# tolerate ordinary merges and you miss the outage. What they share is that both
# sat undeployed for days. Age tolerates the normal gap between a merge and its
# deploy (minutes for the automatic frontend deploy, longer for a deploy started
# by hand), and still catches a change that was merged and forgotten. scripts/check-deploy-drift.mjs carries the reasoning
# beside the code.
#
# HOW IT PAGES. A failed scheduled run emails the repository owner through
# GitHub's own notifications — the same mechanism monitor-functions-registered.yml
# uses, and for the same reason: no action group, no Azure alert rule, no cost,
# and no dependency on the subscription being watched.
#
# ON THE SCHEDULE BEING UNRELIABLE, said plainly rather than assumed away.
# GitHub delivers about 22% of this repository's scheduled runs, a median 36
# minutes late, with a 12.7-hour worst case (measured 2026-08-31 over
# monitor-functions-registered.yml's whole life). For an outage detector that is
# a real problem. Here it is not: this watches a condition that stays true until
# someone acts, so a late check is a late alert, never a missed one. The
# threshold was 24 hours until 2026-10-23 and is now 8 (owner decision: a
# forgotten frontend deploy sat a day before anyone looked). A check landing
# every 4.6 hours on average leaves under two checks of margin against 8 hours,
# and the 12.7-hour worst case can still delay one alert past it. If the
# threshold ever drops to the delivery gap or below, that reasoning stops
# holding and this comment is the thing that should stop it.
#
# THE TELEGRAM MESSAGE. When this job goes red the owner is also told on
# Telegram, with a title no other message uses ("DELIVERY MONITOR RED"). That
# is not sent from here: the bot token stays in Key Vault, and checkAgentHealth
# in the Function App reads this workflow's runs from GitHub's public API once
# an hour (functions/src/lib/timers/delivery-monitor-watch.js). It cannot speak
# while Azure is down; GitHub's own failure email still can.
#
# NO AZURE, NO OIDC. The two deploy rows are answerable from the GitHub API
# alone: the last successful run of each deploy workflow, and the commits on
# main touching that service's paths since. The Terraform row is not (PLAT-3,
# #963, reopened 2026-10-15): "what is applied" lives in HCP Terraform, so the
# `check` job carries `TFC_TOKEN` and sits in the `automation` environment for
# the same reason tfc-plan-check.yml does — a secret is reachable only from a
# job GitHub has admitted into an environment (zizmor secrets-outside-env,
# #567), and `automation` rather than a deploy environment because a
# scheduled run cannot wait on an approval gate (`production-backend` has one
# since #1617; `production` had one until 2026-11-09, #1613, and is the
# frontend deploy's alone). The token is read-only here: one workspace
# lookup and one one-run listing. Without it the row reads ⚠️ and the job goes
# red, never ✅ — the first version keyed that row on the last green
# tfc-plan-check.yml run, which succeeds with the token unset, on an
# unconfirmed plan, and on a plan nobody applied, so the row read green on
# evidence that was not an apply.
#
# ===========================================================================
# A SECOND JOB, ADDED 2026-09-08: CAN EVERY WORKFLOW STILL SUCCEED?
# ===========================================================================
# `validate-deployed.yml` was dispatched twice on 2026-08-18, failed both
# times, and sat in the directory for three weeks. Its own header explained
# why it could not pass from a GitHub-hosted runner; nothing was reading it.
# #426 retired it on 2026-09-08. `scripts/check-workflow-health.mjs` is the
# part that stops the next one sitting there: it reads run history and names
# any workflow with no success in the sampled window, at least one failure
# among those runs, and no attempt of any kind inside the staleness window.
# Run against this repository on 2026-09-08 it named that one and nothing
# else.
#
# Since #1661 it also names a scheduled workflow whose last two scheduled runs
# both failed (`failing`), however recently, unless a newer run on `main`
# succeeded since. update-avm-versions.yml had succeeded and then failed its
# weekly runs on 2026-11-03 and 2026-11-10 (#1658), and nobody heard: the
# check called it healthy, and a red job here only reached whoever happened
# to open the run. So the job now keeps ONE issue, labelled `Platform` and
# titled "Workflow health: a workflow is broken or keeps failing its
# scheduled runs" (label and exact title are how the step finds it again, so
# the title does not change). It opens it on the first finding, comments when
# the list of findings changes, and closes it with a comment at the first
# clean check. The same create-or-comment shape as check-drill-age.yml. A
# check that could not read the history (exit 2), or that ended on an error
# it did not expect, opens and closes nothing; the job just goes red, as
# before.
#
# WHY IT LIVES HERE AND NOT IN A FILE OF ITS OWN. The owner's instruction on
# 2026-09-08 was that there are too many workflows. This one already holds the
# permissions the check needs (`actions: read`), already runs Node with no
# `npm ci`, already runs on a schedule, and is already the repository's
# delivery-health monitor. A twentieth file to ask one more question of the
# same API would have been the wrong trade.
#
# IT IS A SEPARATE JOB, NOT A SECOND STEP, and that is not cosmetic. "The
# frontend is four days behind" and "a workflow has been failing since August"
# are different findings needing different people; a single job conclusion
# would merge them into one red X that says neither. Same reasoning as the
# three-way exit-code split in tfc-plan-check.yml.

name: Monitor delivery health

on:
  schedule:
    # Offset from the top of the hour, and from the other monitors' minutes, so
    # three jobs do not queue against each other on a scheduler that is already
    # dropping most of them.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: read-only monitor; threshold goes through env and the script refuses a non-positive number. docs/security/scanner-triage.md#checkov
    inputs:
      threshold_hours:
        description: 'Fail when a service has been behind for at least this many hours. Leave blank for the script default (8).'
        required: false

# No workflow-level permissions: each job declares its own, so the one write
# (`issues: write`, for the workflow-health issue) stays in the one job that
# needs it (#1661).
permissions: {}

concurrency:
  group: deploy-drift
  cancel-in-progress: true

jobs:
  check:
    name: Is production behind main?
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # slowest 0.4 min, Oct 2026 (#1441)
    # For TFC_TOKEN, and nothing else — see the header. The `workflows` job
    # below reads only this repository's run history and stays outside it.
    environment: automation
    permissions:
      contents: read # reads the commit log; writes nothing
      actions: read # reads this repository's own run history
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # No `npm ci`. The script imports node:url and uses global fetch, and a
      # monitor that installs third-party packages to check a commit log has
      # more supply chain than subject matter. The Terraform row's reader comes
      # through tfc-workspace-busy.mjs and check-tfc-plan.mjs, which reach only
      # node:fs, node:url and node:util (tfc-plan-check.yml says the same of
      # that chain).
      #
      # TFC_TOKEN is not tested in a step of its own, as tfc-plan-check.yml
      # does: the script reads it and renders the Terraform row ⚠️ with the
      # reason when it is absent, so the summary says which row could not be
      # read rather than the whole job skipping.
      - name: Measure the drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          DRIFT_THRESHOLD_HOURS: ${{ inputs.threshold_hours }}
        run: |
          set -uo pipefail
          # Captured, then written to BOTH the summary and stdout. The summary is
          # readable from the GitHub mobile app; stdout is what the REST logs API
          # exposes. verify-alert-state.yml's first run wrote only the summary
          # and could not be diagnosed without a browser.
          #
          # `|| status=$?` IS LOAD-BEARING. GitHub runs this step as
          # `bash -e {0}` (no `shell:` is set), and `set -uo pipefail` does not
          # turn `-e` off. With `-e`, a bare `report=$(...)` whose command exits
          # non-zero ends the step on that line, so on exit 1 (drift found) or
          # 2 (could not read) the echo below never ran and the log and summary
          # were blank in exactly the runs that went red. A command on the left
          # of `||` is exempt from `-e`. Pinned by
          # scripts/monitor-deploy-drift-steps.test.mjs, which runs this step
          # with `bash -e`.
          status=0
          report=$(node scripts/check-deploy-drift.mjs) || status=$?
          echo "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  workflows:
    name: Can every workflow still succeed?
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # slowest 0.6 min, Oct 2026 (#1441)
    permissions:
      contents: read # checkout, and the list of workflow files on main
      actions: read # reads this repository's own run history
      issues: write # open, comment on or close the one workflow-health issue (#1661)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # No `npm ci`, for the same reason the job above gives: the script uses
      # global fetch and nothing else.
      - name: Read the run history
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          # `2>&1` IS LOAD-BEARING. Every exit-2 path in the script writes with
          # console.error and nothing to stdout: the usage banner, the
          # paginated-listing refusal, the run-filter refusal. Without the
          # redirect this captured 0 bytes on exit 2 — measured — so the job
          # went red with a BLANK step summary, in the one case an operator most
          # needs to read why. Caught in review on this PR;
          # scripts/check-workflow-health.invocation.test.mjs is the tripwire.
          #
          # The status comes from the assignment itself, through `||`, and not
          # from a pipeline: `node ... | tee` would report tee's status, which
          # is always 0, a monitor that can never fail. And not from a
          # `status=$?` on the next line either: GitHub runs this step as
          # `bash -e {0}`, and with `-e` a failing `report=$(...)` ends the step
          # before that line or the echo below runs, so every red run printed a
          # blank report. A command on the left of `||` is exempt from `-e`.
          status=0
          report=$(node scripts/check-workflow-health.mjs 2>&1) || status=$?
          # Both destinations: the summary is readable from the mobile app, and
          # stdout is what the REST logs API exposes. verify-alert-state.yml's
          # first run wrote only the summary and could not be diagnosed without
          # opening a browser.
          echo "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          # Kept for the issue step, and the exit code handed on as an output,
          # so this step itself passes and the two steps below decide (#1661):
          # 1 opens or updates the issue, 0 closes it, and anything else
          # fails the job at the last step. Exit 2 means the history could not
          # be read, which is NOT a verdict on any workflow, so it touches no
          # issue; it still fails the job, because an instrument that cannot
          # see should say so loudly.
          printf '%s\n' "$report" > "${RUNNER_TEMP}/health.md"
          echo "exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      # One issue, kept current, the way check-drill-age.yml keeps its
      # drill-overdue one: created when none is open, commented on when one is,
      # and here also closed at the first clean check. It carries the existing
      # `Platform` label (type: platform, operations and cloud infra), and it is
      # found again by that label plus its exact title, read from the issue
      # list itself rather than from search, whose index can lag behind a
      # just-created issue. So the title does not change, and an issue with a
      # similar title is never commented on or closed. (If someone removes the
      # label, the next finding opens a second issue; that is the safe way to
      # be wrong.) Every value reaches the shell through `env:`, never `${{ }}`
      # inside the script (zizmor's template-injection rule).
      #
      # The check runs every four hours and a workflow can stay failing for a
      # week, so commenting on every run would post dozens of identical
      # comments. The report ends with a hidden line naming the findings
      # (`findingsKey` in the script, one `path:verdict` each); a comment is
      # posted only when the newest report the workflow itself posted
      # (`github-actions[bot]`) does not carry this exact one. Nobody else's
      # text counts as the issue's last report (#1688).
      - name: Open, update or close the workflow-health issue
        if: steps.health.outputs.exit == '0' || steps.health.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTH_EXIT: ${{ steps.health.outputs.exit }}
        run: |
          set -euo pipefail
          title="Workflow health: a workflow is broken or keeps failing its scheduled runs"
          label="Platform"
          # The hidden findings line the report ends with. sed prints nothing
          # when there is no such line and fails only when it cannot read the
          # file, which stops the step instead of reading as "no line".
          key=$(sed -n '/^<!-- workflow-health findings:/{p;q;}' "${RUNNER_TEMP}/health.md")
          # Exit 1 with no findings line is not a report this step can trust:
          # the script ends every real finding with one, so this is a crash it
          # did not catch. Treat it like exit 2 and leave the issue alone; the
          # last step still fails the job.
          if [ "${HEALTH_EXIT}" = "1" ] && [ -z "$key" ]; then
            echo "::warning::The check exited 1 without a findings line, so its report is not trusted; no issue was opened or updated."
            exit 0
          fi
          existing=$(gh issue list --repo "$REPO" --state open --label "$label" --limit 200 --json number,title | jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ "${HEALTH_EXIT}" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" --reason completed --comment "Clean again: run ${RUN_URL} found no broken or failing workflow."
              echo "Closed #${existing}."
            else
              echo "No workflow-health issue is open, and none is needed."
            fi
            exit 0
          fi
          {
            echo "Delivery-health check, run ${RUN_URL}, $(date -u +%Y-%m-%d)."
            echo
            cat "${RUNNER_TEMP}/health.md"
            echo
            echo "**What to do:** for each workflow named above, open its newest red run (a failing workflow's line links it; for a broken one, open the workflow's run list), fix what that run reports, or delete the workflow if nobody needs it. This issue gets a comment when the list of findings changes and closes itself at the first check (every four hours) that finds none."
          } > "${RUNNER_TEMP}/health-issue.md"
          if [ -z "$existing" ]; then
            gh issue create --repo "$REPO" --title "$title" --label "$label" --body-file "${RUNNER_TEMP}/health-issue.md"
            exit 0
          fi
          # The findings lines of the reports the workflow itself posted on
          # the issue (#1688), newest last: its body if the workflow opened it,
          # then its own comments, every page, read through REST, where the
          # workflow is `github-actions[bot]`. The repository is public and
          # anyone can comment, so a findings line copied into someone else's
          # comment must not make these findings look reported already. Only
          # whole lines that start with the marker count. If they cannot be
          # read, the report is posted: a repeat costs less than a miss.
          if ! reported=$( { gh api "repos/${REPO}/issues/${existing}" --jq 'select(.user.login == "github-actions[bot]") | (.body // "") | split("\n")[] | select(startswith("<!-- workflow-health findings:"))' && gh api "repos/${REPO}/issues/${existing}/comments?per_page=100" --paginate --jq '.[] | select(.user.login == "github-actions[bot]") | (.body // "") | split("\n")[] | select(startswith("<!-- workflow-health findings:"))'; } | tail -n 1 ); then
            echo "::warning::The earlier reports on #${existing} could not be read, so this one is posted."
            reported=""
          fi
          # A plain text comparison (the quoted key is matched literally), not
          # `if grep`, which this repository forbids in workflows because a
          # grep error reads as "no match" (scripts/iac-workflow-steps.test.mjs).
          if [[ "$reported" == *"$key"* ]]; then
            echo "#${existing} already reports these findings; no new comment."
          else
            gh issue comment "$existing" --repo "$REPO" --body-file "${RUNNER_TEMP}/health-issue.md"
            echo "Commented on #${existing}."
          fi

      # Last, so the issue is handled first and the job still goes red while a
      # workflow is broken or failing (1) or the history could not be read
      # (2). `!cancelled()` so it still runs, and says why, when the issue
      # step itself failed; `outcome == 'success'` so it does not blame a
      # workflow when the check never ran (a failed checkout already turns the
      # job red on its own).
      - name: Fail the job while a workflow is broken or failing, or unread
        if: ${{ !cancelled() && steps.health.outcome == 'success' && steps.health.outputs.exit != '0' }}
        env:
          HEALTH_EXIT: ${{ steps.health.outputs.exit }}
        run: |
          if [ "${HEALTH_EXIT}" = "2" ]; then
            echo "::error::The run history could not be read, so no workflow was judged; see the summary."
          else
            echo "::error::A workflow is broken or keeps failing its scheduled runs; see the summary and the workflow-health issue."
          fi
          exit "${HEALTH_EXIT:-1}"
