name: Publish Content Manifest

# Produces frontend/data/content-manifest.json — the published articles that
# scripts/prerender.mjs turns into static HTML.
#
# WHY A SEPARATE WORKFLOW. The frontend build cannot fetch this itself. It runs
# on a GitHub runner, the public API is behind Cloudflare, and Cloudflare answers
# a datacenter IP with a managed challenge (#175). The alternative was a
# permanent bot-protection exception on the API host, which that issue rejected.
#
# So the data comes from the other side: this workflow holds Azure federated
# credentials, fetches the published corpus from the Function App, and commits a
# plain JSON file. deploy-azure-frontend.yml keeps `contents: read` and a Static
# Web Apps token — no Azure identity at all — and reads a file from the
# checkout. That separation is the point, not an implementation detail: the
# build that runs on every push should not hold database credentials.
#
# IT USED TO READ COSMOS DIRECTLY with data-plane RBAC, and that is what held
# the 0.0.0.0 sentinel open on the Cosmos firewall — the switch admitting every
# Azure tenant at the network layer (T-718). The query moved into the Function
# App, which reaches Cosmos over the integration subnet the firewall admits, and
# this job now fetches the result over HTTP through a per-run origin window. It
# holds no Cosmos role of any kind. See
# docs/decisions/0025-cosmos-firewall-datacenter-sentinel.md.
#
# Committed rather than passed as an artifact so a build is reproducible from a
# checkout alone, and so a diff shows what changed about the published set.

on:
  workflow_dispatch:
  schedule:
    # 06:15 UTC daily, after the nightly content timers have run. Articles are
    # published by humans and by the forge, and neither tells this workflow.
    - cron: '15 6 * * *'

# No workflow-level permissions: each job declares its own, and the whole point
# of the split below is that no job holds both (T-726).
permissions: {}

concurrency:
  group: content-manifest
  cancel-in-progress: false

# ============================================================================
# WHY THIS IS TWO JOBS (T-726)
# ============================================================================
# It used to be one, holding `contents: write` AND `id-token: write` — the full
# deploy identity plus the ability to push to main — while running `npm ci` on
# third-party packages. That was the single highest supply-chain concentration
# in the pipeline: any postinstall script in scripts/'s dependency tree ran with
# a token that could push arbitrary commits to a protected branch and an Azure
# federated credential in the same environment.
#
# Now `build` holds the Azure identity and never any write to this repository,
# and `commit` holds neither: since 2026-08-31 its own permission is
# `contents: read`, and the writing is done by a GitHub App installation token
# it mints for the length of two API calls. Neither job is enough on its own,
# and the artifact between them is a plain JSON file. `build` also installs with
# `--ignore-scripts`, so lifecycle scripts do not execute at all — verified that
# the install and the manifest build both succeed without them.
#
# The concentration this split broke up is therefore smaller again than it was:
# the credential `commit` holds cannot merge past a check, so a postinstall
# script that reached it could open a pull request and nothing more.
#
# WHY `commit` OPENS A PULL REQUEST (T-726) — AND WHAT THAT ACTUALLY FIXED.
#
# CORRECTED 2026-08-31. This block, and four other files, said the App path
# retired a ruleset bypass: that for the push to land on a main protected by
# twelve required contexts the ruleset had to list the Actions token as a bypass
# actor, and that a bypass belongs to the TOKEN, so every workflow holding
# `contents: write` inherited the ability to push past every check.
#
# THERE IS NO SUCH BYPASS AND THE ARGUMENT WAS BUILT ON A GUESS. Reading
# /repos/saulpatinojr/HCW-HybridCloudWorks/rulesets/20680114 returns
# `enforcement: active`, no `bypass_actors` at all, and the rules `deletion`,
# `non_fast_forward`, `pull_request` and `required_status_checks`. The
# `pull_request` rule refuses a direct push to main from anyone, this token
# included.
#
# So the push in `commit` was not privileged. It was BROKEN, and had been since
# the ruleset was last updated on 2026-08-25. The bot's only successful manifest
# push is 4b8c36d, dated 2026-08-23. Every scheduled run between 08-24 and 08-29
# went green because the published set had not moved, so the push path was never
# reached — a workflow can be dead for five days and report success every night
# if the only thing that would exercise it is a change that did not happen.
#
# The App path is therefore a REPAIR, not a de-escalation. It is still the right
# shape: `commit` mints a GitHub App installation token, pushes a BRANCH, and
# opens a pull request that the required checks run on. They run precisely
# because the pull request is not opened with GITHUB_TOKEN — GitHub does not
# trigger workflows for events its own token creates, which is why the obvious
# version of this idea silently never merges.
#
# What it costs, stated because it is real and no longer offset by a bypass
# being retired: one stored non-expiring App private key, granting
# push-a-branch and open-a-pull-request on this repository. It cannot merge past
# a check and it cannot push to main, so it is bounded by the same ruleset as
# everything else — but it is a new stored credential, and calling it "strictly
# less than what it replaces" was only true of a thing that did not exist.
#
# ONE OWNER ACTION REMAINS, and until it is done this degrades rather than
# breaks: enable auto-merge (Settings -> General -> Pull Requests). It was OFF
# when this was written, so the pull request opens and waits for a human instead
# of merging itself. scripts/open-manifest-pr.mjs reports that as a notice
# naming the setting rather than failing the night.
#
# Generating the manifest during the frontend build instead was considered and
# rejected on the strongest ground available: it would put Cosmos access back
# into the deploy job, which is precisely what T-718 and the job split below
# exist to prevent.

jobs:
  build:
    name: Fetch the published corpus and build the manifest
    # MANIFEST_WINDOW_CLIENT_ID (#1098), not CLIENT_ID or READER_CLIENT_ID.
    # This job's only Azure call is the origin window below, a write to the
    # Function App's config, so it signs in as github_manifest_window, which
    # can open and close that window and read the web group's resources, and
    # cannot list app settings. It
    # ran as github_reader from T-728 until #1098, which left the reader
    # holding this write beside its app-settings read (infra/oidc.tf).
    #
    # The self-arming gate matches monitor-functions-registered and
    # verify-alert-state: until the apply lands and the variable is seeded, this
    # skips rather than failing at azure/login on an empty client-id. `commit`
    # needs this job, so it skips with it and the manifest simply stays at its
    # last committed version.
    if: ${{ vars.MANIFEST_WINDOW_CLIENT_ID != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25 # slowest 1.5 min; each step up to the window close has its own limit, 19 min in all (#1441)
    permissions:
      contents: read # checkout only — this job must never be able to push
      id-token: write # federated credential exchange for azure/login
    steps:
      - name: Checkout
        timeout-minutes: 2 # slowest 4 s
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        timeout-minutes: 2 # slowest 7 s
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Azure login
        timeout-minutes: 2 # slowest 17 s
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.MANIFEST_WINDOW_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      # `--ignore-scripts`: nothing in this tree needs a lifecycle script, and
      # this job holds an Azure credential. Defence in depth behind the job
      # split — the split is what makes a compromised package unable to push.
      - name: Install script dependencies
        timeout-minutes: 2 # slowest 6 s
        working-directory: scripts
        run: npm ci --ignore-scripts

      # T-718: this job no longer touches Cosmos. The query moved into the
      # Function App, which runs inside the subnet the Cosmos firewall already
      # admits, and this fetches the result over HTTP — which is what let
      # cosmos_allow_azure_datacenter_ips go false.
      #
      # THE ORIGIN, NOT CLOUDFLARE. A runner asking the public host is served a
      # Bot Fight Mode interstitial and a 403 (#175). So the runner is admitted
      # to the origin the same way deploy-functions.yml admits itself for
      # /api/health: add its IP, fetch, remove it in an always() step.
      #
      # NO DEFAULT-ACTION FLIP, unlike the storage window in deploy-functions.yml.
      # The storage firewall ignores IP rules for requests from the account's own
      # region, which forces Allow for the duration; App Service honours IP rules
      # normally, so an allow rule for this runner is sufficient and the standing
      # posture is never widened. That difference is why this route is an HTTP
      # one rather than a blob.
      #
      # Authorized by github_manifest_window's HCW Function Config Refresh role
      # on the site, Microsoft.Web/sites/config/Write with config/list/action
      # excluded, and Reader on the web group for the reads around it. That
      # identity holds the list action nowhere, so it can open and close this
      # window and cannot read app settings back (#1098).
      - name: Open origin window for this runner
        id: appfw
        timeout-minutes: 3 # slowest 37 s, 20 of them a sleep
        env:
          APP: ${{ vars.FUNCTION_APP_NAME }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sS --max-time 10 https://api.ipify.org)
          if [[ ! "${RUNNER_IP}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::ipify.org returned invalid IPv4: '${RUNNER_IP}' (PLAT-10, #970)"
            exit 1
          fi
          RULE="ci-manifest-${GITHUB_RUN_ID}"
          az functionapp config access-restriction add \
            --resource-group "$RG" --name "$APP" \
            --rule-name "$RULE" --action Allow \
            --ip-address "${RUNNER_IP}/32" --priority 300 \
            --output none
          echo "rule_name=${RULE}" >> "$GITHUB_OUTPUT"
          sleep 20

      - name: Build the manifest
        timeout-minutes: 5 # slowest 22 s
        working-directory: scripts
        env:
          FUNCTION_ORIGIN: https://${{ vars.APP_HOSTNAME }}
        run: node build-content-manifest.mjs

      # The assertion is the point of this step, not the removal. A window that
      # silently failed to close leaves the origin admitting a dead runner's
      # address, and the job stays green while it does.
      - name: Close origin window
        if: ${{ always() && steps.appfw.outputs.rule_name != '' }}
        timeout-minutes: 3 # slowest 11 s
        env:
          APP: ${{ vars.FUNCTION_APP_NAME }}
          RG: ${{ vars.RESOURCE_GROUP }}
          RULE: ${{ steps.appfw.outputs.rule_name }}
        run: |
          set -euo pipefail
          az functionapp config access-restriction remove \
            --resource-group "$RG" --name "$APP" \
            --rule-name "$RULE" --output none

          left=$(az functionapp config access-restriction show -n "$APP" -g "$RG" \
            --query "length(ipSecurityRestrictions[?starts_with(name, 'ci-manifest-')])" -o tsv)
          if [ "$left" != "0" ]; then
            echo "::error::${left} ci-manifest-* rule(s) still on the origin after the window closed"
            exit 1
          fi
          echo "origin window closed — no temporary rules left"

      - name: Upload the manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-manifest
          path: frontend/data/content-manifest.json
          retention-days: 1
          if-no-files-found: error

  commit:
    name: Open a pull request if the manifest changed
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # slowest 0.3 min, Oct 2026 (#1441)
    # Scoped to the `automation` environment so this job's secret is reachable
    # only from a run GitHub has admitted into it (zizmor secrets-outside-env,
    # #567). The estate already does this — `production` on the two deploys,
    # `copilot` on the Copilot setup, `github-pages` on the docs — and these
    # three workflows were simply the ones that never adopted it.
    #
    # `automation` and NOT `production`: these open pull requests rather than
    # deploying, they run on a schedule, and inheriting a production approval
    # gate would leave a scheduled run waiting for a human who is not there.
    #
    # Declaring it changes nothing on its own: a repository secret is still
    # readable from a job in any environment. It is what makes an ENVIRONMENT
    # secret possible, which is the control Microsoft's MCSB v2 DS-3 asks for
    # and what `azure/login`'s own guidance means by "use environment secrets
    # instead of repository secrets".
    #
    # ORDER MATTERS, and the wrong order is silent. This job self-arms: an
    # absent secret makes it report "not set — skipping" and pass GREEN. Move
    # the secret to the environment before this file declares it and the
    # automation stops dead with every check still passing.
    #
    # No `azure/login` in this job, so no OIDC subject changes here. That trap
    # is real and infra/oidc.tf records it (AADSTS700213) — it applies to jobs
    # that exchange a token, which this one does not.
    environment: automation
    # `contents: read` for the checkout, and NOTHING ELSE. The writing is done
    # by a GitHub App installation token. This job used to hold `contents:
    # write` and push straight to main — which the ruleset's `pull_request`
    # rule refuses, with no bypass actor to exempt it (see the header; the
    # earlier claim that one existed was wrong). The App opens a pull request
    # instead, and the checks run on it — precisely because a pull request
    # opened with GITHUB_TOKEN does not trigger workflows, and one opened with
    # an App token does.
    permissions:
      contents: read # checkout only — this job can no longer push anywhere
    steps:
      # `persist-credentials: false`, and the push below does not work without
      # it. checkout writes the job's GITHUB_TOKEN into `.git/config` as an
      # `http.extraheader`, and that header is sent on every request to this
      # remote — it OUTRANKS a token embedded in the remote URL. So the App
      # installation token minted three steps down was never the credential
      # git used: the push authenticated as github-actions[bot], which holds
      # `contents: read` here by design, and the remote answered
      # "Permission ... denied to github-actions[bot]", 403 (run 34092896715,
      # 2026-09-07, the first run in which the manifest had actually changed
      # since this job was rewritten to open a pull request). Dropping the
      # persisted credential leaves the URL token as the only one, which is
      # the App's, which is what the pull request must be opened by.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: content-manifest
          path: frontend/data

      # The script already suppresses timestamp-only rewrites, so a diff here
      # means the article set or its content actually moved. Decided before the
      # token is minted, so an unchanged night never asks for a credential.
      - name: Did the published set change?
        id: changed
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/data/content-manifest.json; then
            echo "No change to the published set."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          routes=$(node -e "console.log(require('./frontend/data/content-manifest.json').routes.length)")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "routes=${routes}" >> "$GITHUB_OUTPUT"

      # Self-arming, like the reader workflows: before the App exists this
      # reports honestly that it did not run rather than failing every night
      # and training everyone to ignore a red X. `secrets` is not available to
      # a job-level `if`, so the test happens in a step.
      - name: Is the App configured?
        id: app
        if: steps.changed.outputs.changed == 'true'
        env:
          MANIFEST_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          MANIFEST_APP_ID: ${{ vars.MANIFEST_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MANIFEST_APP_PRIVATE_KEY}" ] && [ -n "${MANIFEST_APP_ID}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The manifest changed but the App is not configured, so no pull request was opened. Set the MANIFEST_APP_ID variable and the MANIFEST_APP_PRIVATE_KEY secret (T-726)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # No `npm ci`: the minter imports only node:crypto and node:url and uses
      # global fetch. This job holds the most powerful credential in the
      # pipeline for the length of two API calls, so it installs nothing.
      - name: Mint an App installation token
        id: token
        if: steps.app.outputs.armed == 'true'
        env:
          GITHUB_APP_ID: ${{ vars.MANIFEST_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token=$(node scripts/github-app-token.mjs)
          # Masked BEFORE it is written anywhere, including to GITHUB_OUTPUT.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # `git add <path>` and never `-A` or `.`: the branch this pushes is the
      # one thing the App's write permission can reach, so what goes on it is
      # the boundary. scripts/manifest-workflow.test.mjs asserts the absence of
      # the wildcard forms.
      - name: Push the branch
        if: steps.app.outputs.armed == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          ROUTES: ${{ steps.changed.outputs.routes }}
        run: |
          set -euo pipefail
          # RUN_ATTEMPT, not RUN_ID alone: a re-run of the same run keeps the
          # id, so the branch would already exist on the remote and the push
          # would fail — or worse, succeed against a stale branch with a pull
          # request already open, which answers 422 on create. Found in review.
          branch="chore/content-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=${branch}" >> "$GITHUB_ENV"
          git config user.name  'hcw-manifest[bot]'
          git config user.email 'hcw-manifest[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          git add frontend/data/content-manifest.json
          git commit -m "chore: refresh content manifest (${ROUTES} article routes)"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${branch}"

      - name: Open the pull request
        if: steps.app.outputs.armed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MANIFEST_BRANCH: ${{ env.branch }}
          MANIFEST_ROUTES: ${{ steps.changed.outputs.routes }}
        run: node scripts/open-manifest-pr.mjs

      # The token lives an hour; the work above takes seconds. Ending it here
      # keeps a credential that can open pull requests on this repository from
      # outliving the job that needed it (#641) — which is what
      # `actions/create-github-app-token` does in its post step, and the one
      # thing the in-repo minter did not do.
      #
      # `always()`, so a failed push or a failed `gh pr create` still cleans up
      # — that is the case where a live token matters most. The step cannot
      # fail the job: the script returns 0 whatever GitHub answers, because a
      # run that did its work should not turn red over cleanup.
      - name: Revoke the installation token
        if: always() && steps.token.outputs.token != ''
        env:
          GITHUB_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/github-app-token.mjs --revoke
