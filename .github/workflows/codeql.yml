# Code scanning, advanced setup.
#
# .github/codeql/codeql-config.yml has existed and been referenced by nothing:
# the repository turned off CodeQL Default setup in favour of an advanced
# workflow that was never added, so code scanning has been off entirely while
# .github/CONTRIBUTING.md lists it as a required gate. This is that workflow.
#
# The language matrix is deliberately narrow. The config file explains that the
# retired Default setup grew erroring language:go and language:java-kotlin
# configurations from vendored harness snippets; those stay out, because CodeQL
# fails a language that resolves to no source.
#
# python is in the matrix as of hooks/claude_event.py and tooling/workflow.py
# landing on main. Both run on every Claude Code session, which makes them the
# first first-party Python here worth analysing. The config's paths-ignore keeps
# the vendored harness demonstration code out of the results.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds existing code rather than
    # waiting for the next pull request to touch the affected file.
    - cron: '31 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-26.04
    permissions:
      # Uploading results to the code-scanning API is the only write this
      # workflow performs. It uses no secrets, no cloud credentials, no OIDC.
      security-events: write # uploading the SARIF is this workflow's only write
      contents: read # the checkout, nothing more
      actions: read # reads this workflow's own run metadata
    strategy:
      # One language failing should not mask the state of the other.
      fail-fast: false
      # Each language carries the file pattern that makes analysing it worth
      # a run. Filtering happens INSIDE the job (the T-523 doctrine, stated in
      # full in iac-validate.yml): these contexts are required on the `main`
      # ruleset, and a trigger-level `paths:` filter would leave every
      # non-matching pull request waiting on "Expected" forever. The weekly
      # schedule and the push to main still analyse everything, so a newly
      # published query never waits on a pull request to touch the language.
      matrix:
        include:
          - language: javascript-typescript
            filter: '\.(js|jsx|ts|tsx|mjs|cjs)$'
          - language: actions
            filter: '^\.github/(workflows|actions)/'
          - language: python
            filter: '\.py$'
    steps:
      # fetch-depth: 0 so the change detection below can diff against the base
      # commit — a shallow clone fails the diff rather than returning "no
      # changes".
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect language changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: ${{ matrix.filter }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — analysing everything"
            exit 0
          fi
          # Capture the diff first: `set -e` is inert inside an `if`
          # condition, so a failed diff (an unfetchable base sha) would read
          # as "no changes" and silently skip the analysis. A diff that
          # cannot be computed fails toward analysing.
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — analysing rather than guessing"
            exit 0
          }
          # grep -E answers 0 when a changed file matches the filter, 1 when
          # none does, and 2 or more when it could not read the filter at all
          # (an unclosed parenthesis, say). `if grep …` takes every answer
          # other than 0 as "no", so a filter grep cannot read would skip the
          # analysis as "no relevant change" while this required check stayed
          # green (#1429, the same weakness as #1428 in ci.yml). The answer is
          # kept instead, and anything other than 0 or 1 fails this step and
          # names the filter. The filter goes in brackets so that a stray
          # backslash at its end cannot join onto the `|` that adds this
          # workflow and the CodeQL config, and so hide the mistake. These
          # lines are the same as in ci.yml and iac-validate.yml; the test in
          # scripts/codeql-iac-workflow-steps.test.mjs runs this step.
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/codeql\.yml$|^\.github/codeql/' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "${LANGUAGE} files changed — analysing"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no ${LANGUAGE} change — skipping analysis, still reporting this context"
          else
            echo "::error file=.github/workflows/codeql.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      - name: Initialize CodeQL
        if: steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      # No build step: both languages are analysed by interpretation, which is
      # why the config's paths-ignore applies to them.
      - name: Perform CodeQL analysis
        if: steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          category: /language:${{ matrix.language }}
