# Code scanning, advanced setup.
#
# .github/codeql/codeql-config.yml has existed and been referenced by nothing:
# the repository turned off CodeQL Default setup in favour of an advanced
# workflow that was never added, so code scanning has been off entirely while
# .github/CONTRIBUTING.md lists it as a required gate. This is that workflow.
#
# The language matrix is deliberately narrow. The config file explains that the
# retired Default setup grew erroring language:go and language:java-kotlin
# configurations from vendored harness snippets; those stay out, because CodeQL
# fails a language that resolves to no source.
#
# python is in the matrix as of hooks/claude_event.py and tooling/workflow.py
# landing on main. Both run on every Claude Code session, which makes them the
# first first-party Python here worth analysing. The config's paths-ignore keeps
# the vendored harness demonstration code out of the results.
#
# WHEN IT RUNS (owner decision 2026-11-24, #1545). On every pull request to
# `main`, on every push to `main` and every Monday.
#
#   - A pull request is analysed one language at a time, and only for the
#     languages it touched: the "Detect language changes" step below looks at
#     the files the pull request changes and the two CodeQL steps skip when
#     none of them belongs to the job's language. A documentation-only pull
#     request pays for three checkouts (seconds), not three analyses (about
#     four minutes).
#   - A push to `main` and the Monday run analyse every language in full,
#     always. The weekly run is what finds a newly published query's matches
#     in code nobody touched.
#
# IT IS NOT A REQUIRED CHECK. The `main` ruleset requires `gate` from ci.yml
# and four other contexts, none from here
# (docs/runbooks/required-checks.md). So a finding, or a failed analysis,
# does not grey out the merge button; the session that owns the pull request
# reads the three `Analyze …` jobs and code scanning's review comments before
# it merges, and fixes what they report. That is deliberate: the three
# contexts were required until 2026-11-04, which forced every pull request to
# wait for them, and from 2026-11-04 to 2026-11-24 the workflow did not run
# on pull requests at all, so a finding was only seen on `main` after the
# merge. This arrangement gets the finding back before the merge without
# making every merge wait on it.
#
# PULL REQUESTS FROM A FORK OR FROM DEPENDABOT get a read-only token whatever
# `permissions:` says. That does not break the upload: code scanning accepts
# results from a run a `pull_request` event started, as
# https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/resource-not-accessible
# says, so those pull requests need no special case here. (Seen for
# Dependabot on this repository before 2026-11-04; not seen for a fork,
# because nobody has opened one.)

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds existing code rather than
    # waiting for the next pull request to touch the affected file.
    - cron: '31 4 * * 1'

permissions:
  contents: read

# One run at a time per place the code comes from. `github.ref` is
# `refs/pull/<number>/merge` for a pull request and `refs/heads/main` for a
# push to `main` or the Monday run, so a new push to a pull request cancels
# only that pull request's older run, and no pull request can cancel a run on
# `main` or on another pull request. On `main` a newer push still cancels the
# run of the push before it; the newer run analyses everything, so nothing is
# lost, but a cancelled run uploads nothing (.claude/CLAUDE.md, "Code
# scanning's alerts").
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20 # slowest row 4.8 min (javascript-typescript), Oct 2026 (#1441)
    permissions:
      # Uploading results to the code-scanning API is the only write this
      # workflow performs. It uses no secrets, no cloud credentials, no OIDC.
      security-events: write # uploading the SARIF is this workflow's only write
      contents: read # the checkout, nothing more
      actions: read # reads this workflow's own run metadata
    strategy:
      # One language failing should not mask the state of the others.
      fail-fast: false
      # Each language carries the pattern for the file paths that make
      # analysing it worth a run on a pull request. They follow what CodeQL
      # reads for that language:
      #   - javascript-typescript: JavaScript and TypeScript files, and the
      #     HTML and Vue files whose scripts it also reads. It reads JSON and
      #     YAML too, for a handful of queries about configuration; those are
      #     left out on purpose, or nearly every pull request would count as
      #     a JavaScript change. The runs on `main` cover them.
      #   - actions: workflow files and the files of a local action.
      #   - python: Python files.
      # The filtering happens INSIDE the job, not in a trigger-level `paths:`
      # filter, so the job always reports and a skipped language shows a
      # green job whose log says why, not a missing one.
      matrix:
        include:
          - language: javascript-typescript
            filter: '\.(js|jsx|ts|tsx|mjs|cjs|mts|cts|html|htm|vue)$'
          - language: actions
            filter: '^\.github/(workflows|actions)/|(^|/)action\.ya?ml$'
          - language: python
            filter: '\.py$'
    steps:
      # fetch-depth: 0 so the change detection below can diff against the base
      # commit: a shallow clone fails the diff rather than returning "no
      # changes".
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # WHAT THE SKIP LOOKS LIKE ON THE PULL REQUEST. The job itself never
      # skips: this step always runs and writes relevant=false when the pull
      # request changed no file of its language, and it is the two CodeQL
      # steps below (init and analyze) that then skip. The job ends green in
      # a few seconds and NOTHING is uploaded for that language. Uploading
      # nothing matters: an empty result would tell code scanning that the
      # language has no findings and close its open alerts for the pull
      # request.
      #
      # GitHub posts its own "CodeQL" status (the roll-up code scanning
      # posts, not one of the ruleset's required checks) as soon as the first
      # language uploads results, listing every /language:* category that ran
      # on main but has not uploaded for this pull request yet: a Warning
      # reading "Code scanning cannot determine the alerts introduced by this
      # pull request, because N configurations present on refs/heads/main
      # were not found", with the status neutral. Two things keep a category
      # on that list. A language whose analysis is still running: once every
      # language that will run has uploaded, the same status is updated in
      # place to "No new alerts", so that case clears itself (seen on #1485,
      # where all three ran). A language whose analysis steps skipped:
      # nothing will ever upload, so the warning stays, and that is this
      # skip, not a broken scan. A pull request that changes no file of a
      # language cannot add an alert in that language, and main is still
      # analysed in full on every merge and every Monday (seen on #1484, two
      # of three skipped). When every language skips, no "CodeQL" status is
      # posted at all (seen on #1458, a JSON-only change). The history is in
      # ADR 0026.
      #
      # A change to this workflow or to the CodeQL settings folder counts as
      # a change in every language, so a pull request that edits either one
      # is analysed in full and so tests its own edit.
      - name: Detect language changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: ${{ matrix.filter }}
          # The folders .github/codeql/codeql-config.yml tells CodeQL not to
          # read (`paths-ignore`). A file in one of them is not analysed, so
          # it is no reason to run. scripts/codeql-workflow.test.mjs holds
          # this line to that file.
          IGNORED: '^\.(claude|agents)/'
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — analysing everything"
            exit 0
          fi
          # Capture the diff first: `set -e` is inert inside an `if`
          # condition, so a failed diff (an unfetchable base sha) would read
          # as "no changes" and silently skip the analysis. A diff that
          # cannot be computed fails toward analysing.
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — analysing rather than guessing"
            exit 0
          }
          # Drop the files CodeQL is told not to read. sed stops the step
          # (set -e) if it cannot read the pattern, so a broken pattern
          # cannot pass for "nothing left".
          changed="$(sed -E "\\#${IGNORED}#d" <<<"$changed")"
          # grep -E answers 0 when a changed file matches the filter, 1 when
          # none does, and 2 or more when it could not read the filter at all
          # (an unclosed parenthesis, say). `if grep …` takes every answer
          # other than 0 as "no", so a filter grep cannot read would skip the
          # analysis as "no relevant change" while the job stayed green
          # (#1429, the same weakness as #1428 in ci.yml). The answer is kept
          # instead, and anything other than 0 or 1 fails this step and names
          # the filter. The filter goes in brackets so that a stray backslash
          # at its end cannot join onto the `|` that adds this workflow and
          # the CodeQL config, and so hide the mistake. These lines are the
          # same as in ci.yml and iac-validate.yml; the test in
          # scripts/iac-workflow-steps.test.mjs runs this step.
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/codeql\.yml$|^\.github/codeql/' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "${LANGUAGE} files changed — analysing"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no ${LANGUAGE} change — skipping the analysis and uploading nothing; main is still analysed in full"
          else
            echo "::error file=.github/workflows/codeql.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      - name: Initialize CodeQL
        if: steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      # No build step: these languages are analysed by interpretation, which
      # is why the config's paths-ignore applies to them.
      - name: Perform CodeQL analysis
        if: steps.changes.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          category: /language:${{ matrix.language }}
