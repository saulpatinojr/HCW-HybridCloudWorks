# Code scanning, advanced setup.
#
# .github/codeql/codeql-config.yml has existed and been referenced by nothing:
# the repository turned off CodeQL Default setup in favour of an advanced
# workflow that was never added, so code scanning has been off entirely while
# .github/CONTRIBUTING.md lists it as a required gate. This is that workflow.
#
# The language matrix is deliberately narrow. The config file explains that the
# retired Default setup grew erroring language:go and language:java-kotlin
# configurations from vendored harness snippets; those stay out, because CodeQL
# fails a language that resolves to no source.
#
# python is in the matrix as of hooks/claude_event.py and tooling/workflow.py
# landing on main. Both run on every Claude Code session, which makes them the
# first first-party Python here worth analysing. The config's paths-ignore keeps
# the vendored harness demonstration code out of the results.
#
# WHEN IT RUNS (#1545, 2026-11-04). On every push to `main` and every Monday,
# not on pull requests. Until the `main` ruleset was updated on 2026-11-04 the
# three `Analyze …` contexts were required checks, so the workflow had to run
# on every pull request (the T-523 doctrine in iac-validate.yml: a required
# check whose workflow never ran is never satisfied) and carried a detect step
# per language to skip the analysis when the pull request changed no file of
# that language. The ruleset now requires `gate` from ci.yml and nothing from
# here, so the pull-request run, its detect step and its shape test went. The
# trade-off, recorded in docs/runbooks/required-checks.md: an alert a pull
# request introduces is found on `main` after the merge (the push run, about
# four minutes), not before it, and code scanning no longer posts its alerts
# as review comments on the pull request. The weekly run is what finds a newly
# published query's matches in code nobody touched.

name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds existing code rather than
    # waiting for the next push to touch the affected file.
    - cron: '31 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20 # slowest row 4.8 min (javascript-typescript), Oct 2026 (#1441)
    permissions:
      # Uploading results to the code-scanning API is the only write this
      # workflow performs. It uses no secrets, no cloud credentials, no OIDC.
      security-events: write # uploading the SARIF is this workflow's only write
      contents: read # the checkout, nothing more
      actions: read # reads this workflow's own run metadata
    strategy:
      # One language failing should not mask the state of the others.
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fbfa9f37476c0024508d051f3c34fcca3366b0e2 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      # No build step: both languages are analysed by interpretation, which is
      # why the config's paths-ignore applies to them.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@fbfa9f37476c0024508d051f3c34fcca3366b0e2 # v4
        with:
          category: /language:${{ matrix.language }}
