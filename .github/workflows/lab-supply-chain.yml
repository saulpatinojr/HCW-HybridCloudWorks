# Lab supply chain — are the lab host's pins behind upstream, do the lab
# images carry known vulnerabilities, and what moves them? (estate review
# 2026-10-06, LAB-3; #899, #949)
#
# Everything the lab host runs is pinned and held, and the lab images are
# pinned by digest where they are consumed, which is right for a host that
# runs untrusted code. The cost was that nothing noticed when a pin fell
# behind: a runc or containerd advisory after the pin date stayed unpatched
# until a human happened to look, and the published images were never
# scanned again after the build that attested them. Dependabot cannot read
# Ansible group_vars or a digest in a JS module.
#
# Weekly, this workflow:
#   1. `propose` runs scripts/lab-pins-upstream.mjs --bump for two pin sets
#      and makes the edits in its own checkout:
#        host        lab-host/ansible/group_vars/all.yml, every pin behind
#                    its publisher;
#        image-base  lab-image/versions.env and its FROM lines, to the
#                    newest digest of the base image's release line, which is
#                    how the lab images are rebuilt on a newer base (the
#                    rebuild itself is the publish that merging it triggers;
#                    publish-lab-image.yml says what a rebuild can and cannot
#                    change on its own), and ansible-core's ANSIBLE_CORE_*
#                    lines to its newest release in its line, with every
#                    wheel's hash read from PyPI (lab-host/bootstrap.sh
#                    installs the host's ansible-core from the same lines).
#      Each edit carries the checksum or digest read from the publisher
#      beside the version (scripts/lib/lab-pin-bumps.mjs says which, from
#      where). A pin whose checksum could not be verified is not edited: it is
#      a note, and the notes go into the issue below. When the Docker Engine
#      pin moved, scripts/lab/record-docker-cli-fixture.mjs re-records the
#      agent's Docker CLI request fixture with the pinned docker-ce-cli,
#      verified through the host's own trust chain (the signing key by
#      docker_apt_key_checksum, the InRelease by the key, the index by the
#      InRelease, the .deb by the index) and run from a temporary directory.
#      Because that is a downloaded binary running in the checkout, each
#      set's paths are recorded before it runs and the job fails if anything
#      outside them changed afterwards. The job holds a read-only token and
#      the network input, and hands the edits on as a patch.
#   2. `pull-request` applies each set's patch and keeps one pull request per
#      set open (scripts/open-lab-pin-pr.mjs): a fixed branch per set, the
#      pull request opened ready for review or, while one is open, its commit
#      and body replaced by the new reading. It never pushes to main and never
#      overwrites a commit someone else added to the branch. It holds
#      `contents: read`; the push and the pull request use the GitHub App
#      installation token the other scheduled pull requests use
#      (MANIFEST_APP_ID / MANIFEST_APP_PRIVATE_KEY), because a pull request
#      opened with GITHUB_TOKEN never gets its required checks. That is also
#      why this file holds no `contents: write` or `pull-requests: write`
#      grant (scripts/workflow-write-permissions.test.mjs).
#   3. `check` compares every pin with upstream, scans the two published lab
#      image digests the host actually runs — read from
#      vps-agent/lib/capabilities.js and the Coder template, not from a tag —
#      with Trivy for HIGH and CRITICAL vulnerabilities with a fix available,
#      and opens one issue (or comments on the open one) when a pin is
#      behind, an image needs a fix, or a pin could not be bumped. A clean
#      week is a green run and nothing else.
#
# The response times for a runtime advisory (runc, containerd, Docker
# Engine), and who does what, are in docs/runbooks/labs-host.md, "Runtime
# advisories". lab-host/README.md, "Bumping a pin", is the hand procedure
# this automates.
name: Lab supply chain

on:
  schedule:
    # Tuesdays 06:45 UTC, off the top of the hour and away from the other
    # scheduled jobs.
    - cron: '45 6 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: lab-supply-chain
  cancel-in-progress: false

env:
  # Pinned release binary with its checksum held HERE, not fetched from the
  # release that serves the tarball (T-755; same as iac-validate.yml). Update
  # both values in one commit.
  TRIVY_VERSION: 0.69.3
  TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75

jobs:
  propose:
    name: Propose pin bumps with publisher checksums
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout only — this job must never be able to push
    outputs:
      sets: ${{ steps.patches.outputs.sets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No npm ci: the scripts import node: built-ins only.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # Each set's paths, read from the pristine checkout and kept in the
      # artifact, before anything this job downloads has run: the patch step
      # and the guard below use these lists, never a second read of the
      # script, so a downloaded binary that rewrote open-lab-pin-pr.mjs could
      # not widen a set (CodeRabbit on #1129).
      - name: Record each set's paths before anything downloaded runs
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lab-pins"
          for set in host image-base; do
            node scripts/open-lab-pin-pr.mjs --paths "$set" > "${RUNNER_TEMP}/lab-pins/paths-${set}.txt"
          done
          sort -u "${RUNNER_TEMP}"/lab-pins/paths-*.txt > "${RUNNER_TEMP}/lab-pins/paths-all.txt"

      # Each set writes its edits into this checkout, its evidence (the pull
      # request body) and its notes (the pins it could not verify). Exit 2 is
      # a plan that could not be made at all; that fails the run.
      - name: Plan and make the bumps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for set in host image-base; do
            node scripts/lab-pins-upstream.mjs --bump "$set" \
              --evidence "${RUNNER_TEMP}/lab-pins/evidence-${set}.md" \
              --notes "${RUNNER_TEMP}/lab-pins/notes-${set}.md" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # A Docker Engine move changes the CLI the lab agent's socket proxy is
      # held to (LAB-5): scripts/lab-host-docker-proxy.test.mjs fails the
      # host pull request until scripts/fixtures/docker-cli-agent-requests.json
      # is recorded with the pinned CLI. This re-records it with the pinned
      # docker-ce-cli, installed into a temporary directory from Docker's
      # signed apt index (the .deb's SHA256 is the one the index lists), and
      # exits 0 with nothing written when the fixture already matches the pin.
      - name: Re-record the Docker CLI fixture when the engine pin moved
        run: |
          set -euo pipefail
          node scripts/lab/record-docker-cli-fixture.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # The downloaded CLI ran in this checkout. Whatever it did, only the
      # sets' paths may differ now: a change anywhere else (a script this job
      # or the next one runs, this workflow, a new file) fails the run before
      # a patch is made, judged against the lists recorded above.
      - name: Nothing outside the sets' paths changed
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all \
            | sed -E 's/^.. //; s/.* -> //; s/^"(.*)"$/\1/' | sort -u > "${RUNNER_TEMP}/lab-pins/changed.txt"
          outside="$(comm -13 "${RUNNER_TEMP}/lab-pins/paths-all.txt" "${RUNNER_TEMP}/lab-pins/changed.txt")"
          if [ -n "${outside}" ]; then
            echo "::error::The checkout changed outside every pin set; no patch is made. Changed: $(echo "${outside}" | tr '\n' ' ')"
            exit 1
          fi
          echo "Changed, all inside the sets' paths: $(tr '\n' ' ' < "${RUNNER_TEMP}/lab-pins/changed.txt")"

      # One patch per set, over that set's paths only (the lists recorded
      # before anything downloaded ran); the sets whose patch is not empty are
      # the matrix of the next job.
      - name: One patch per set
        id: patches
        run: |
          set -euo pipefail
          sets=()
          for set in host image-base; do
            mapfile -t paths < "${RUNNER_TEMP}/lab-pins/paths-${set}.txt"
            git diff --binary -- "${paths[@]}" > "${RUNNER_TEMP}/lab-pins/${set}.patch"
            if [ -s "${RUNNER_TEMP}/lab-pins/${set}.patch" ]; then sets+=("\"${set}\""); fi
          done
          json="[$(IFS=,; echo "${sets[*]}")]"
          echo "Sets with a bump: ${json}"
          echo "sets=${json}" >> "$GITHUB_OUTPUT"

      - name: Upload the patches, evidence and notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-pins
          path: ${{ runner.temp }}/lab-pins/
          retention-days: 7
          if-no-files-found: error

  pull-request:
    name: Open or update the ${{ matrix.set }} pull request
    needs: propose
    if: needs.propose.outputs.sets != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # `automation`, as in the other scheduled PR-opening jobs: it runs on a
    # schedule, and an approval gate would leave the run waiting for a human
    # who is not there.
    environment: automation
    permissions:
      contents: read # checkout only — this job cannot push anywhere on its own
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(needs.propose.outputs.sets) }}
    steps:
      # `persist-credentials: false`, or the push authenticates as
      # github-actions[bot] and is refused (publish-content-manifest.yml,
      # run 34092896715).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Download the patches
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-pins
          path: ${{ runner.temp }}/lab-pins

      # This job holds the App token and runs repository scripts after the
      # patch is applied, so the patch is judged before it is applied, by a
      # rule written here rather than in anything the patch could replace: it
      # may touch only the paths recorded for its set before anything
      # downloaded ran in `propose`, and never this workflow, another
      # workflow, or a script outside scripts/fixtures/ (CodeRabbit on #1129).
      - name: The patch touches only this set's recorded paths, and no code this job runs
        env:
          SET: ${{ matrix.set }}
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/lab-pins/${SET}.patch"
          git apply --numstat "${patch}" | cut -f3- | sort -u > "${RUNNER_TEMP}/lab-pins/patched.txt"
          sort -u "${RUNNER_TEMP}/lab-pins/paths-${SET}.txt" > "${RUNNER_TEMP}/lab-pins/allowed.txt"
          outside="$(comm -13 "${RUNNER_TEMP}/lab-pins/allowed.txt" "${RUNNER_TEMP}/lab-pins/patched.txt")"
          if [ -n "${outside}" ]; then
            echo "::error::The ${SET} patch touches paths outside the set recorded for it: $(echo "${outside}" | tr '\n' ' ')"
            exit 1
          fi
          if grep -E '^(\.github/|scripts/)' "${RUNNER_TEMP}/lab-pins/patched.txt" | grep -vE '^scripts/fixtures/'; then
            echo "::error::The ${SET} patch touches a workflow or a script this job could run; refused."
            exit 1
          fi
          echo "Patched: $(tr '\n' ' ' < "${RUNNER_TEMP}/lab-pins/patched.txt")"

      - name: Apply this set's patch
        env:
          SET: ${{ matrix.set }}
        run: git apply "${RUNNER_TEMP}/lab-pins/${SET}.patch"

      # Self-arming: before the App exists this reports that it opened
      # nothing rather than failing every week.
      - name: Is the App configured?
        id: app
        env:
          MANIFEST_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          MANIFEST_APP_ID: ${{ vars.MANIFEST_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MANIFEST_APP_PRIVATE_KEY}" ] && [ -n "${MANIFEST_APP_ID}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A pin moved but the App is not configured, so no pull request was opened. Set the MANIFEST_APP_ID variable and the MANIFEST_APP_PRIVATE_KEY secret (T-726)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # No `npm ci`: the minter imports only node:crypto and node:url.
      - name: Mint an App installation token
        id: token
        if: steps.app.outputs.armed == 'true'
        env:
          GITHUB_APP_ID: ${{ vars.MANIFEST_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token=$(node scripts/github-app-token.mjs)
          # Masked BEFORE it is written anywhere, including to GITHUB_OUTPUT.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # Stages the set's paths by name and refuses when anything else in the
      # checkout changed; one branch per set, one open pull request per branch.
      - name: Push the branch and open or update the pull request
        if: steps.app.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SET: ${{ matrix.set }}
        run: node scripts/open-lab-pin-pr.mjs --set "$SET" --evidence "${RUNNER_TEMP}/lab-pins/evidence-${SET}.md" --notes "${RUNNER_TEMP}/lab-pins/notes-${SET}.md"

      # The token lives an hour; the work above takes seconds. `always()`, so
      # a failed push still cleans up.
      - name: Revoke the installation token
        if: always() && steps.token.outputs.token != ''
        env:
          GITHUB_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/github-app-token.mjs --revoke

  check:
    name: Pins against upstream, images against the vulnerability database
    needs: propose
    # The scan and the issue do not wait on the bumps succeeding.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No npm ci: the checker imports node: built-ins only.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Pins against upstream
        id: pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          node scripts/lab-pins-upstream.mjs --summary "${RUNNER_TEMP}/pins.md"
          code=$?
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/pins.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # The pins `propose` could not verify, for the issue. Absent when
      # `propose` failed; the issue then says so.
      - name: Download the bump notes
        if: needs.propose.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lab-pins
          path: ${{ runner.temp }}/lab-pins

      - name: Collect the bump notes
        id: notes
        env:
          PROPOSE_RESULT: ${{ needs.propose.result }}
          SETS: ${{ needs.propose.outputs.sets }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/bump-notes.md"
          : > "$out"
          if [ "${PROPOSE_RESULT}" != "success" ]; then
            echo "The \`propose\` job did not succeed (${PROPOSE_RESULT}), so no pin was bumped this week; its log says why." >> "$out"
          else
            for set in host image-base; do
              if [ -s "${RUNNER_TEMP}/lab-pins/notes-${set}.md" ]; then
                echo "**${set}:** $(cat "${RUNNER_TEMP}/lab-pins/notes-${set}.md")" >> "$out"
                echo >> "$out"
              fi
            done
          fi
          if [ -s "$out" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
          echo "sets=${SETS:-[]}" >> "$GITHUB_OUTPUT"

      - name: Install Trivy (pinned release binary)
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" "${base}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" > /tmp/trivy_expected.txt
          (cd /tmp && sha256sum -c trivy_expected.txt)
          tar -xzf "/tmp/${tarball}" -C /tmp trivy
          install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # The digests the host runs, read from where they are consumed. A tag
      # would scan whatever was pushed last; the digest scans what runs.
      #
      # Two renderings of one scan: the full table goes to the run summary,
      # and the issue gets a compact per-package table, because a full table
      # for the two images ran past GitHub's 65,536-character issue body on
      # 2026-10-14 (run 38493246343, `Body is too long`) and the week's
      # findings were filed nowhere.
      - name: Scan the published lab images the host runs
        id: scan
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          runner=$(grep -oE "docker\.io/hybridcloudworks/hcw-lab-runner:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}" vps-agent/lib/capabilities.js | head -1)
          full_digest=$(grep -oE 'image_digest\s*=\s*"sha256:[0-9a-f]{64}"' lab-host/coder/templates/hcw-lab/main.tf | grep -oE 'sha256:[0-9a-f]{64}')
          full="docker.io/hybridcloudworks/hcw-lab@${full_digest}"
          test -n "$runner" && test -n "$full_digest"
          table="${RUNNER_TEMP}/scan.md"
          compact="${RUNNER_TEMP}/scan-summary.md"
          echo "## Lab images against the vulnerability database" | tee "$table" > "$compact"
          echo | tee -a "$table" >> "$compact"
          failed=0
          n=0
          for image in "$runner" "$full"; do
            n=$((n+1))
            report="${RUNNER_TEMP}/scan-${n}.json"
            echo "### \`${image}\`" | tee -a "$table" >> "$compact"
            echo | tee -a "$table" >> "$compact"
            if trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json -o "$report" "$image" 2> "${RUNNER_TEMP}/scan-${n}.err"; then
              echo "no HIGH or CRITICAL vulnerability with a fix available" | tee -a "$table" >> "$compact"
            elif [ ! -s "$report" ]; then
              failed=1
              { echo "the scan did not complete:"; echo '```'; cat "${RUNNER_TEMP}/scan-${n}.err"; echo '```'; } | tee -a "$table" >> "$compact"
            else
              failed=1
              echo '```' >> "$table"
              trivy convert --quiet --format table "$report" >> "$table" 2>&1
              echo '```' >> "$table"
              totals=$(jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity) | map("\(length) \(.[0].Severity)") | join(", ")' "$report")
              # One row per installation: the same package name under two
              # result targets (a Debian package and a Python one, say) or at
              # two installed versions is two rows, so a fix is never shown
              # against the wrong installation (CodeRabbit on #1132).
              rows=$(jq -r '[.Results[]? | .Target as $t | .Type as $y | .Vulnerabilities[]? | {target: $t, type: ($y // "-"), pkg: .PkgName, inst: .InstalledVersion, fix: (.FixedVersion // "-"), sev: .Severity, id: .VulnerabilityID}]
                | group_by([.target, .pkg, .inst]) | map({target: .[0].target, type: .[0].type, pkg: .[0].pkg, inst: .[0].inst, fix: (map(.fix) | unique | join(", ")), sev: (map(.sev) | unique | sort | join("/")), ids: (map(.id) | unique)})
                | sort_by(.sev, .target, .pkg) | .[] | "| \(.type): \(.target) | `\(.pkg)` | \(.inst) | \(.fix) | \(.sev) | \(.ids | length): \(.ids[0:3] | join(", "))\(if (.ids | length) > 3 then ", …" else "" end) |"' "$report")
              count=$(printf '%s\n' "$rows" | grep -c '^|' || true)
              {
                echo "**${totals}** with a fix available, in ${count} installation(s). The full table is the run summary: ${RUN_URL}."
                echo
                echo "| Found in | Package | Installed | Fixed in | Severity | Vulnerabilities |"
                echo "| --- | --- | --- | --- | --- | --- |"
                printf '%s\n' "$rows" | head -40
                if [ "$count" -gt 40 ]; then echo; echo "… and $((count - 40)) more installation(s), in the run summary."; fi
              } >> "$compact"
            fi
            echo | tee -a "$table" >> "$compact"
          done
          cat "$table" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          exit 0

      # One issue, kept current: created when none is open, commented on when
      # one is. Nothing when both checks are clean and every bump was made.
      - name: Open or update the issue when something is due
        if: steps.pins.outputs.exit != '0' || steps.scan.outputs.failed == '1' || steps.notes.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PINS_EXIT: ${{ steps.pins.outputs.exit }}
          SCAN_FAILED: ${{ steps.scan.outputs.failed }}
          BUMP_SETS: ${{ steps.notes.outputs.sets }}
        run: |
          set -euo pipefail
          title="Lab supply chain: pins behind upstream or image vulnerabilities"
          {
            echo "Weekly check, run ${RUN_URL}, $(date -u +%Y-%m-%d)."
            echo
            case "${PINS_EXIT}" in
              0) echo "**Pins:** every lab host pin is current." ;;
              1) echo "**Pins:** at least one lab host pin is behind upstream (table below). The \`propose\` job moved every one whose checksum or digest the publisher served, in one pull request per pin set (sets with a bump this week: \`${BUMP_SETS}\`; the branches are \`chore/lab-pins-host\` and \`chore/lab-pins-image-base\`). containerd carries runc: docs/runbooks/labs-host.md, \"Runtime advisories\", has the response times." ;;
              *) echo "**Pins:** at least one source could not be read, so the pin check did not evaluate (table below)." ;;
            esac
            echo
            cat "${RUNNER_TEMP}/pins.md"
            echo
            if [ -s "${RUNNER_TEMP}/bump-notes.md" ]; then
              echo "**Not bumped automatically:** a bump without a verifiable checksum is not a bump. Each of these needs a person (lab-host/README.md, \"Bumping a pin\")."
              echo
              cat "${RUNNER_TEMP}/bump-notes.md"
              echo
            fi
            if [ "${SCAN_FAILED}" = "1" ]; then
              echo "**Images:** a published lab image carries a HIGH or CRITICAL vulnerability with a fix available. A newer base digest arrives as the \`chore/lab-pins-image-base\` pull request, and publish-lab-image.yml's weekly rebuild refreshes the full image's Debian packages; a fix in a tool is a bump in lab-image/versions.env. Each publish from main opens the \`chore/lab-pins-image-digests\` pull request that pins the new digests where they run."
            else
              echo "**Images:** no HIGH or CRITICAL vulnerability with a fix available."
            fi
            echo
            cat "${RUNNER_TEMP}/scan-summary.md"
          } > "${RUNNER_TEMP}/issue.md"
          # GitHub refuses an issue body over 65,536 characters; the full
          # report is the run summary, so the body may be cut and say so.
          if [ "$(wc -c < "${RUNNER_TEMP}/issue.md")" -gt 60000 ]; then
            head -c 60000 "${RUNNER_TEMP}/issue.md" > "${RUNNER_TEMP}/issue.cut"
            printf '\n\n… cut at 60,000 characters; the full report is the run summary: %s\n' "$RUN_URL" >> "${RUNNER_TEMP}/issue.cut"
            mv "${RUNNER_TEMP}/issue.cut" "${RUNNER_TEMP}/issue.md"
          fi
          existing=$(gh issue list --repo "$REPO" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "${RUNNER_TEMP}/issue.md"
            echo "Commented on #${existing}."
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "${RUNNER_TEMP}/issue.md"
          fi

      - name: Fail the run when the pin check could not evaluate
        if: steps.pins.outputs.exit == '2'
        run: |
          echo "::error::At least one upstream source could not be read; the pin check did not evaluate. See the summary."
          exit 1
