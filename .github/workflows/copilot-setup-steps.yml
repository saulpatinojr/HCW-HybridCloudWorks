# Copilot's environment — the two credentials the MCP servers need, minted per
# run, nothing stored that can act on its own.
#
# GitHub runs the `copilot-setup-steps` job before Copilot cloud agent starts
# work and, by default, before Copilot code review reviews a pull request
# (docs: "Customize the agent environment" and "Use code review →
# Customizing Copilot code review's environment"). Two of the servers in
# .github/copilot-mcp.json need something this job leaves behind:
#
#   azure               an Azure CLI sign-in (AZURE_TOKEN_CREDENTIALS pins the
#                       server to it)
#   github-mcp-server   a one-hour GitHub App installation token in
#                       $HOME/.copilot-review/github-mcp.env, which the server's
#                       docker run reads with --env-file
#
# Everything else the reviewer needs (Node for npx, Docker for the Terraform
# and GitHub servers) is on the runner image.
#
# NO STORED CREDENTIAL THAT CAN ACT ON ITS OWN.
#
# Azure: azure/login exchanges the job's GitHub OIDC token for an Azure token,
# exactly as deploy-functions.yml and the monitors do. The identity is
# `github_copilot_review` in infra/oidc.tf: Reader on the four workload resource
# groups and nothing else — no data-plane role, no Key Vault access, no write
# anywhere. Its federated credential trusts the subject `…:environment:copilot`,
# which is what `environment: copilot` below makes GitHub compose. Change
# either side alone and azure/login fails with AADSTS700213;
# scripts/oidc-subjects.test.mjs cross-checks the two on every CI run.
#
# GitHub: a dedicated GitHub App, installed on this repository only, whose
# permissions are all READ. The private key is the one stored secret, and the
# App's permissions are its ceiling: a key that leaked could mint nothing but
# read-only, one-repository, one-hour tokens — the same access the token itself
# grants. No personal access token of any kind, classic or fine-grained: those
# are user-bound and long-lived, and this estate holds none (see
# docs/standards/variables-and-secrets.md). The token is narrowed again at
# mint time to the eight read permissions the pinned toolsets need
# (GITHUB_APP_PERMISSIONS below) — the same minter the manifest publisher
# uses, scripts/github-app-token.mjs, which explains why it is not the
# marketplace action.
#
# COPILOT READS THIS FILE FROM THE DEFAULT BRANCH. The review sessions of PR
# #378 ran the step list `main` held at the time, not the one on the PR head,
# even though the PR changed this file — so an edit here shows up in a Copilot
# session only after it merges, and the PR that carries it is reviewed with
# the previous version. Judge a change to this file by the first review AFTER
# its merge, not by the reviews of the PR itself.
#
# workflow_dispatch only, on purpose: the docs' Azure example triggers the same
# way, and a pull_request trigger would sign in on every edit of this file for
# no reader. Run it by hand to prove the Azure login; Copilot runs it for real.
# The App step is self-arming: with the variable and secret unset it reports
# that it did not run rather than failing the job, and a manual dispatch may
# well report that — Agents secrets are exposed to Copilot's own runs, and
# whether an ordinary dispatch sees them is GitHub's call, not this file's.
#
# If the `Setting up environment` section of a Copilot review session shows
# this job did NOT run, that is a GitHub-side gap (community discussion
# #203859, unresolved as of 2026-09) and the failure is safe: both servers
# start with no credential and every tool call fails closed. The runbook
# docs/runbooks/copilot-code-review-mcp.md says what to look for.
name: Copilot setup steps

on:
  workflow_dispatch:

permissions:
  contents: read # the checkout, nothing more

concurrency:
  # Dispatch-only environment build; a newer run supersedes an older one.
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job MUST be named copilot-setup-steps or Copilot does not pick it up.
  copilot-setup-steps:
    name: Sign in to Azure and mint the GitHub read token
    runs-on: ubuntu-26.04
    # Declaring the environment is what puts `:environment:copilot` in the OIDC
    # subject (see infra/oidc.tf github_copilot_review_environment).
    environment: copilot
    permissions:
      # id-token: write is what lets the runner request a GitHub OIDC token.
      # Without it azure/login has nothing to exchange.
      id-token: write # the OIDC token azure/login exchanges, under `environment: copilot`
      contents: read # the checkout, nothing more
    steps:
      # Federated OIDC — no stored credential. The three values are
      # IDENTIFIERS: they name the managed identity, tenant and subscription
      # and grant nothing without a token from this repository in the copilot
      # environment.
      #
      # Each is read from TWO places, because this file runs in two runners
      # that see different stores. A manual `gh workflow run` is an ordinary
      # Actions job and resolves repository VARIABLES (COPILOT_REVIEW_CLIENT_ID,
      # seeded from the copilot_review_client_id Terraform output by
      # scripts/set-github-variables.ps1; TENANT_ID and SUBSCRIPTION_ID, which
      # every other login here uses). Copilot's own runner, which executes
      # these steps before a code review or a cloud-agent session, does NOT
      # resolve `vars` at all — the first review session on 2026-09-06 (PR
      # #378) ran azure/login with every `vars.*` input empty — and exposes
      # only the Agents store, which is what GitHub's own Azure example reads
      # with `secrets.`. So the same three identifiers are also held as Agents
      # SECRETS named COPILOT_REVIEW_CLIENT_ID, COPILOT_REVIEW_TENANT_ID and
      # COPILOT_REVIEW_SUBSCRIPTION_ID, and each `||` prefers that store when
      # it is present. Holding identifiers in a secret store is a deliberate
      # exception to docs/standards/variables-and-secrets.md, made because the
      # Agents store is the only one Copilot's runner reads; the values are
      # still not credentials.
      #
      # The VS Code GitHub Actions extension marks every `secrets.COPILOT_REVIEW_*`
      # below "Context access might be invalid". It checks names against the
      # Actions and environment stores only and cannot see the Agents store, so
      # the warning is about the editor, not this file (checked 2026-09-28: the
      # Agents store holds the four identifiers; the App private key is listed
      # in docs/standards/required-inputs.md). Copying the secrets into a store
      # the extension can see would only double every rotation.
      #
      # Self-arming, like the App step below and the reader workflows: while
      # any of the three is unresolved in the runner that is executing this
      # file, the login is skipped with a notice instead of failing the setup
      # — Copilot then reports the review without Azure context rather than
      # posting "setup step failed" on every pull request while the Agents
      # copies (runbook step 2b) are missing. `secrets` is not available to a
      # step-level `if`, so the test is a step of its own.
      - name: Are the Azure identifiers resolvable here?
        id: azure
        env:
          CLIENT_ID: ${{ secrets.COPILOT_REVIEW_CLIENT_ID || vars.COPILOT_REVIEW_CLIENT_ID }}
          TENANT_ID: ${{ secrets.COPILOT_REVIEW_TENANT_ID || vars.TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.COPILOT_REVIEW_SUBSCRIPTION_ID || vars.SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLIENT_ID}" ] && [ -n "${TENANT_ID}" ] && [ -n "${SUBSCRIPTION_ID}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::An Azure identifier is not resolvable in this runner (Agents secrets COPILOT_REVIEW_CLIENT_ID, COPILOT_REVIEW_TENANT_ID, COPILOT_REVIEW_SUBSCRIPTION_ID; variables COPILOT_REVIEW_CLIENT_ID, TENANT_ID, SUBSCRIPTION_ID), so Azure Login was skipped and the azure MCP server has no credential this session. Copilot's runner reads only the Agents copies (runbook step 2b)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Azure Login
        if: steps.azure.outputs.armed == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.COPILOT_REVIEW_CLIENT_ID || vars.COPILOT_REVIEW_CLIENT_ID }}
          tenant-id: ${{ secrets.COPILOT_REVIEW_TENANT_ID || vars.TENANT_ID }}
          subscription-id: ${{ secrets.COPILOT_REVIEW_SUBSCRIPTION_ID || vars.SUBSCRIPTION_ID }}

      # The minter is in the repository, so the repository has to be here.
      # Copilot performs its own checkout afterwards; this one is for the one
      # script below and nothing else.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Node.js 26, the newest line, to match scripts/package.json's engines
      # declaration; scripts/version-floors.json holds both there (#715).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # Copilot enumerates each MCP server's tools a few seconds after starting
      # it and drops any server that has none yet. The first review session
      # (PR #378) kept the Terraform server, whose image was quick to pull, and
      # dropped the Azure server, whose `npx @azure/mcp` has to download the
      # package and a platform binary before it can answer — so the download
      # happens here, ahead of time, and the same pinned command in
      # .github/copilot-mcp.json then starts from the npm cache. The two
      # container images are pulled for the same reason. Nothing here changes
      # what runs; it only moves the wait out of the window that decides
      # which servers a review can use.
      #
      # Best-effort on purpose: a download that fails here is the server that
      # will be missing from this session, which is the same fail-closed
      # outcome as before this step existed. It must not fail the job, because
      # in Copilot's runner a failed step skips every later step, and the
      # token mint below has nothing to do with npm or Docker Hub being slow.
      # Each miss is a warning in the step summary so the session log says
      # which server to expect absent.
      - name: Warm the pinned MCP servers
        run: |
          set -uo pipefail
          warm() {
            local what="$1"; shift
            if "$@" > /dev/null 2>&1; then
              echo "warmed: ${what}"
            else
              echo "::warning::Could not warm ${what}; that MCP server may be absent from this session's tool list (runbook: What the review runner keeps). The setup continues." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          }
          warm "@azure/mcp@3.0.0-beta.41" npx -y @azure/mcp@3.0.0-beta.41 --version
          warm "terraform-mcp-server image" docker pull hashicorp/terraform-mcp-server:1.3.0@sha256:423a6b8e2ee06affcf090892f40c86469caba45fd2448ffa8ca5d717a174f7d5
          warm "github-mcp-server image" docker pull ghcr.io/github/github-mcp-server:v1.12.0@sha256:46cdbbd810faf6f7aed1745ea04057443f5cb9fcadc15c7308add18cf9a83e33

      # Self-arming, like publish-content-manifest.yml: before the App exists
      # this reports honestly that it did not run rather than failing every
      # session. `secrets` is not available to a step-level `if`, so the test
      # happens inside the step. The App ID is read from both stores for the
      # same reason as the login inputs above: Copilot's runner sees only the
      # Agents store.
      - name: Is the GitHub App configured?
        id: app
        env:
          COPILOT_REVIEW_APP_ID: ${{ secrets.COPILOT_REVIEW_APP_ID || vars.COPILOT_REVIEW_APP_ID }}
          COPILOT_REVIEW_APP_PRIVATE_KEY: ${{ secrets.COPILOT_REVIEW_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${COPILOT_REVIEW_APP_ID}" ] && [ -n "${COPILOT_REVIEW_APP_PRIVATE_KEY}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COPILOT_REVIEW_APP_ID or COPILOT_REVIEW_APP_PRIVATE_KEY is not resolvable in this runner, so no GitHub token was minted and the github-mcp-server entry will fail closed this session. Runbook step 4 registers the App and stores its key; step 2b mirrors COPILOT_REVIEW_APP_ID into the Agents store, the only store Copilot's runner reads, so a variable alone is unset here." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # No `npm ci`: the minter imports only node:crypto and node:url and uses
      # global fetch. The token is narrowed at mint time to the eight READ
      # permissions the pinned toolsets need — metadata and contents (repos),
      # issues, pull_requests, actions, security_events (code scanning),
      # vulnerability_alerts (Dependabot), discussions — on this repository
      # only, for one hour. It is masked before it is written anywhere.
      # NOT revoked at the end of this job, unlike the two PR-opening
      # workflows (#641). The token is handed to Copilot's MCP server below and
      # read AFTER this job finishes, so ending it here would leave code review
      # holding a dead credential. It expires on its own in an hour.
      - name: Mint a read-only App installation token
        id: token
        if: steps.app.outputs.armed == 'true'
        env:
          GITHUB_APP_ID: ${{ secrets.COPILOT_REVIEW_APP_ID || vars.COPILOT_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.COPILOT_REVIEW_APP_PRIVATE_KEY }}
          GITHUB_APP_PERMISSIONS: '{"metadata":"read","contents":"read","issues":"read","pull_requests":"read","actions":"read","security_events":"read","vulnerability_alerts":"read","discussions":"read"}'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token=$(node scripts/github-app-token.mjs)
          # Masked BEFORE it is written anywhere, including to GITHUB_OUTPUT.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # Where the MCP server finds it. --env-file rather than -e on the docker
      # command line, so the token is never an argument another process on the
      # runner could list. Mode 600, owner only, in the runner user's home —
      # the same user Copilot's MCP processes run as.
      - name: Hand the token to the GitHub MCP server
        if: steps.app.outputs.armed == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${HOME}/.copilot-review"
          printf 'GITHUB_PERSONAL_ACCESS_TOKEN=%s\n' "${TOKEN}" > "${HOME}/.copilot-review/github-mcp.env"
          echo "Wrote ${HOME}/.copilot-review/github-mcp.env (mode 600)."
