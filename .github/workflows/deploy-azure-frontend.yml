name: Deploy Frontend

# Release workflow for the public website (the Static Web App).
#
# WHEN IT RUNS. Two ways:
#
#   - By itself, whenever a change under `frontend/` reaches `main` (a merged
#     pull request, including the daily content-manifest pull request, which
#     changes frontend/data/content-manifest.json). The owner approved this on
#     2026-11-09 on #1613: since that change, an address with no pre-built
#     page answers 404, so a newly published article has no page until the
#     site is rebuilt and deployed. Before that date this workflow was
#     dispatch-only.
#   - By hand ("Run workflow", from `main`), for a re-deploy, a rollback (below)
#     or the break-glass sign-in input. A change that is not a file under
#     `frontend/` (a repository variable, this workflow file itself) starts no
#     run, so it still needs one by hand to reach the site.
#
# NOBODY APPROVES A RUN. A frontend merge deploys by itself, start to finish
# (owner decision 2026-11-09, #1613). The `deploy` job names the `production`
# environment, and on the same day the owner removed that environment's
# required reviewers, so GitHub no longer pauses the job as "Waiting" for an
# approval click. GitHub explains that pause, which no longer happens here:
# https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments#using-required-reviews-in-workflows
# The controls in this repository are two: the `push` trigger below names
# `main` only, and the T-705 guard (the first step of the `build` job)
# refuses any ref but `main`, for a run started by hand too. The environment's
# own `main`-only branch rule (Required-Inputs §4.4) is a setting outside the
# repository that nothing in a checkout can prove is still set.
#
# Two gaps the owner accepted that day, both closed by #1617:
#   - The backend deploy (deploy-functions.yml) names the same `production`
#     environment. It still starts only by hand, but no approval follows
#     that start any more. #1617 moves it to a reviewed `production-backend`.
#   - This workflow still signs in as `github_deploy` (infra/oidc.tf), the one
#     deploy identity, which also holds rights on the Function App and its
#     storage that uploading a static site does not need. #1617 gives the
#     frontend an identity that can only deploy the Static Web App.
#
# The workflow publishes to the Static Web App hostname configured in Azure;
# DNS and custom-domain changes are separate infrastructure decisions.
#
# ============================================================================
# ROLLBACK (T-729)
# ============================================================================
# There is no "redeploy the previous version" button. Static Web Apps keeps no
# addressable history of uploads for this SKU, and the upload here replaces the
# content root wholesale. So rollback is a FORWARD deploy of known-good code,
# and it has one non-obvious constraint worth knowing before you need it:
#
#   **You cannot roll back by dispatching an older ref.** The T-705 guard below
#   refuses any ref but `main`, deliberately — that guard is what stops an
#   unreviewed branch shipping to production past the required checks. It
#   applies to a rollback dispatch exactly as it applies to a bad one.
#
# The procedure is therefore:
#
#   1. `git revert <bad commit>` on a branch, open a PR, let CI run.
#   2. Merge it. Reverting through the normal gate is the point: a rollback is
#      a production change and gets the same review as any other.
#   3. Deploy `main`. When the reverted commit changed `frontend/`, the merge
#      in step 2 has already started a run, and it deploys by itself: wait
#      for it to turn green. Otherwise dispatch this workflow from `main`.
#
# If the estate is unserviceable and step 1-2 is too slow, the escape hatch is
# an owner one and lives outside this repository: Azure Portal → the Static Web
# App → re-point or disable the custom domain. That is a decision with DNS
# consequences, which is why it is not automated here.
#
# **Not automated, and why.** The obvious automation — a post-deploy HTTP check
# that triggers a re-deploy of the previous commit — cannot be written honestly
# today. A GitHub-hosted runner asking `https://hybridcloudworks.com` is a
# datacenter client, and Cloudflare's Bot Fight Mode answers those with a 403
# interstitial; that is the whole reason the availability test is disarmed and
# ADR 0024 routes around it with a Worker (T-519). A smoke step written
# against the public host would fail on a healthy deploy and trigger a rollback
# of good code, which is worse than having no smoke step. The revisit
# precondition is now met — the Worker was deployed and its alert armed on
# 2026-09-01 — so asking the probe's availabilityResults instead of the public
# host is available; wiring that is a deliberate owner decision, not assumed
# here.
on:
  # Automatic deploys (owner decision 2026-11-09, #1613). `branches: [main]`
  # with no `tags` filter means a push to any other branch, and any tag, starts
  # nothing: GitHub runs a push workflow only for the kind of ref it names.
  # `paths` keeps a docs-only or functions-only merge from rebuilding the site.
  # Only the frontend's own folder: the build reads nothing outside it
  # (`npm run build` is vite plus scripts under frontend/scripts).
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: break-glass input is refused unless it is a GUID before it is printed or built. docs/security/scanner-triage.md#checkov
    inputs:
      entra_client_id_override:
        description: >-
          BREAK-GLASS ONLY. Build with this Entra application (client) id instead
          of the VITE_ENTRA_CLIENT_ID repository variable. Leave blank for a
          normal deploy. See docs/runbooks/admin-signin-rollback.md.
        required: false
        default: ''

permissions:
  contents: read # the SWA action reads app_location from the workspace

# One deploy to the Static Web App at a time (T-729). `deploy-functions.yml`
# has always had this; the frontend did not, so two overlapping dispatches
# raced the upload with nondeterministic last-writer-wins — and because the
# upload is not atomic, the losing run could interleave rather than simply be
# overwritten, leaving a mix of two builds served.
#
# `cancel-in-progress: false`, matching the functions deploy: cancelling a
# deploy part-way through leaves the target in exactly the half-written state
# the group exists to prevent. Queue instead.
#
# With pushes as well as dispatches in this one group, two merges close
# together queue rather than race. GitHub keeps one running run and ONE
# waiting run per group; a third arrival cancels the waiting one, not the
# running one (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
# That loses nothing: every run builds the `main` it was started on, so the
# newest waiting run already contains the commits of the one it replaced.
# There is no approval step to wait at (#1613), so a waiting run only queues
# behind the running one for the few minutes that one takes to finish.
concurrency:
  group: swa-deploy
  cancel-in-progress: false

# ============================================================================
# WHY THIS IS TWO JOBS (T-727)
# ============================================================================
# The deployment token used to be `AZURE_STATIC_WEB_APPS_API_TOKEN`, a stored
# non-expiring GitHub secret, and it lived in the same job that had just run
# `npm ci` and executed the whole frontend dependency tree. A compromised build
# dependency had it in reach, and exfiltrating it granted standing ability to
# publish arbitrary content to the public site until a human noticed and
# rotated it.
#
# Two changes, in that order, and the split still matters after the second.
#
# The split came first: `build` installs, builds and verifies and holds NO
# secret; `deploy` installs nothing and only downloads the verified output and
# uploads it. A compromised build dependency can still poison this deploy's
# content — it produced it — but it cannot take the credential and publish
# again tomorrow, which is the harm the finding names.
#
# THE STORED SECRET IS NOW GONE (T-727, 2026-08-30). `deploy` mints the token
# from ARM under federated identity and it lives for one run. That does not
# make the split redundant: a token in a job that installs nothing is reachable
# only by this workflow's own steps, while the same token in the build job
# would be reachable by every transitive dependency for the length of the
# install. Ephemeral and unreachable are different properties, and this keeps
# both.
#
# What did NOT change: the token still exists in Terraform state as an
# attribute of azurerm_static_web_app.hcw. infra/outputs.tf says so where the
# output used to be.
#
# The `production` environment binding moves to `deploy`, which is the job that
# actually touches production — and it is where an approval gate belongs, since
# an approval that fires before the build is an approval of nothing.
#
# KEPT, AS AN ACCEPTED RISK (owner decision 2026-10-03, #834): the deploy
# stays on the deployment token rather than moving off it. TODO.md, Accepted
# risks, has the reasoning: Microsoft's "GitHub" policy example still passes
# the token beside github_id_token, so switching would not remove it, and the
# compensating control is resetting the token every 90 days or on suspicion.
# (The other half once listed here, storing the token as an ENVIRONMENT
# secret on a protected `production`, went with the stored secret: T-727 left
# no secret to store.)
jobs:
  build:
    name: Build and verify the site
    runs-on: ubuntu-26.04
    timeout-minutes: 10 # slowest 1.8 min, Oct 2026 (#1441)
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Refuse a deploy from a ref that is not main
        # The federated credential's subject is environment-scoped, so it
        # matches from ANY branch, and GitHub auto-creates a missing
        # environment with no protection rules. Without a gate a dispatch from
        # an unreviewed ref ships to production past every required check
        # (T-705). Read live on 2026-10-03, the `production` environment had
        # two required reviewers and a main-only deployment-branch policy
        # (Required-Inputs §4.4). The owner removed the reviewers on
        # 2026-11-09 (#1613), so no person checks a run any more: this step
        # and the push trigger's `branches: [main]` are the repository's
        # whole control. The branch policy is a setting outside the
        # repository that nothing in a checkout can prove is still set, so
        # this step stays as the repository-side backstop.
        #
        # The same test works for both ways the run starts. A push run's
        # github.ref is the branch that was pushed, and the trigger above
        # admits only main, so it is refs/heads/main and this step skips. A
        # dispatch's github.ref is the branch chosen in "Run workflow", so
        # any branch but main, or a tag, still stops here.
        if: github.ref != 'refs/heads/main'
        # Overrides the job's `working-directory: frontend`: this step runs
        # before checkout, so that directory does not exist yet.
        working-directory: .
        run: |
          # Workflow-command data must percent-encode %, CR and LF, and a branch
          # name may legally contain %; unescaped, it could misparse the annotation.
          ref="${GITHUB_REF//%/%25}"
          ref="${ref//$'\r'/%0D}"
          ref="${ref//$'\n'/%0A}"
          echo "::error::Refusing to deploy from ${ref}. Production deploys run from main only."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          # No npm cache here (#563). A production deploy must build from a clean
          # npm install, not restore a cache another workflow run could have
          # written: a poisoned cache would ship straight to production.
          # setup-node v5+ caches automatically unless told not to.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate public data (certifications, speakerevents)
        run: npm run build:data
        env:
          # Data generation reads from the API — no direct Cosmos access from CI.
          # FUNCTIONS_URL is a repository VARIABLE (a public API base URL, not a
          # secret), named per the variable standard: 2 words, no provider prefix.
          AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}

      # An emergency deploy must say what it did, in the log, without anyone
      # having to reconstruct it from the inputs afterwards.
      #
      # Dispatch only, said in so many words. A push run has no inputs, and
      # an empty input already compares equal to '', but the break-glass id
      # must never reach an automatic build, so the event is checked too
      # rather than left to how GitHub compares a missing value.
      - name: Note the break-glass override
        if: github.event_name == 'workflow_dispatch' && inputs.entra_client_id_override != ''
        # Through env, not ${{ }} in the script (#561): a workflow input is
        # caller-supplied text, and expanding it into `run` would execute it.
        env:
          OVERRIDE_CLIENT_ID: ${{ inputs.entra_client_id_override }}
          VARIABLE_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
        run: |
          # An Entra client id is a GUID. Anything else, including text with a
          # newline that could start a workflow command in the log, is refused
          # before it is printed or built into the site.
          if [[ ! "${OVERRIDE_CLIENT_ID}" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "::error::entra_client_id_override must be a GUID such as 00000000-0000-0000-0000-000000000000."
            exit 1
          fi
          echo "::warning title=Break-glass deploy::Building with an Entra client id from the workflow input, not the repository variable."
          echo "  building with : ${OVERRIDE_CLIENT_ID}"
          echo "  variable holds: ${VARIABLE_CLIENT_ID}"
          echo ""
          echo "This does NOT persist. The next deploy reads the variable again,"
          echo "and any merge that changes frontend/ starts that deploy by itself,"
          echo "with no approval step. Set the variable to this same value now so"
          echo "that deploy keeps it (docs/runbooks/admin-signin-rollback.md, step 2)."
          echo ""
          echo "If you are rolling back to the API registration, its redirect"
          echo "URIs must exist or sign-in fails at the redirect. This workflow"
          echo "cannot add them — the deploy identity has no Entra directory"
          echo "rights, by design (infra/oidc.tf). The command is in"
          echo "docs/runbooks/admin-signin-rollback.md."

      - name: Build
        run: npm run build
        env:
          # Fails the build rather than shipping a bundle with no API base.
          REQUIRE_API_BASE: 'true'
          # Must include the Functions route prefix, e.g. https://<host>/api,
          # or "/api" when the SPA and the Function App share an origin.
          VITE_AZURE_FUNCTIONS_URL: ${{ vars.FUNCTIONS_URL }}
          # Entra ID — public client registration values (not secrets)
          # Normally the repository variable. The override exists so a broken
          # admin sign-in can be rolled back in one dispatch, without first
          # needing whatever permission writes repository variables — see
          # docs/runbooks/admin-signin-rollback.md. Blank is falsy in a GitHub
          # expression, so an ordinary run is unaffected.
          #
          # IT DOES NOT PERSIST. The next deploy reads the variable again, so
          # the variable must still be corrected to make a rollback stick. The
          # step above says so in the log, where an operator mid-incident will
          # actually see it. Since 2026-11-09 that next deploy can start by
          # itself, from any merge that changes frontend/, and finishes with
          # nobody approving it.
          #
          # The override is read on a dispatch only. A push run always builds
          # with the variable: `false && x || y` is y in a GitHub expression.
          VITE_ENTRA_CLIENT_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.entra_client_id_override) || vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          # Without this the SPA requests a token the backend rejects on
          # audience: sign-in succeeds and every API call 401s (Required-Inputs §4.2).
          # msalConfig.js defaults it to '' — the build does not fail.
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
          # Social URLs — public, non-sensitive
          VITE_SOCIAL_X_URL: ${{ vars.VITE_SOCIAL_X_URL }}
          VITE_SOCIAL_LINKEDIN_URL: ${{ vars.VITE_SOCIAL_LINKEDIN_URL }}
          VITE_SOCIAL_GITHUB_URL: ${{ vars.VITE_SOCIAL_GITHUB_URL }}
          # The site key of the lab's Cloudflare Turnstile widget, for the
          # Landing Zone Builder's "Validate on the lab" (ADR 0032 decision 6,
          # revised 2026-09-28). Public by construction: Cloudflare puts it in
          # the page. A repository variable, never a secret (variables-and-
          # secrets.md, "not secret but needed at build time"). The secret key
          # is the Function App's, in Key Vault. Unset, the build still
          # succeeds and the button says this build has no site key.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # The site token of the Cloudflare Web Analytics beacon (#1302): the
          # page-view count behind the monthly audience figure the Ambassador
          # hub records. Public by nature — it ships in every page — so a
          # repository variable, never a secret, like the Turnstile site key
          # above. The owner copies it from the `cloudflare_web_analytics_site`
          # output after the TFC apply. Unset, the build serves no beacon tag
          # at all; a value that is not token-shaped fails the build
          # (frontend/scripts/cf-web-analytics.mjs).
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          # NOTE: VITE_COSMOS_* vars are intentionally absent.
          # The frontend never accesses Cosmos directly — all data goes through the API.

      # Hidden source maps are built for every bundle (vite.config.js,
      # `sourcemap: 'hidden'`) so a stack trace from production can be read
      # back against the source. They must not be SERVED: the upload below
      # ships everything under dist, and a map is fetchable by its hashed name
      # whether or not a bundle advertises it (AP-F11, #935). So they are
      # moved out of dist here, kept for thirty days as a workflow artifact
      # in the next step, and the payload check after that refuses a dist
      # with any left in it.
      #
      # A build that produced NO maps fails too. vite.config.js builds them
      # unconditionally outside development, so none at all means the build
      # that ran is not the one this workflow was written for, and the step
      # says so rather than uploading an empty artifact and moving on.
      - name: Set the source maps aside
        run: |
          set -euo pipefail
          rm -rf source-maps
          # Created before anything is moved: with nothing to move, `find`
          # on a directory that does not exist fails, and under `set -e`
          # that kills the step before the error below can say why.
          mkdir -p source-maps
          find dist -name '*.map' -type f -print0 | while IFS= read -r -d '' map; do
            target="source-maps/${map#dist/}"
            mkdir -p "$(dirname "$target")"
            mv "$map" "$target"
          done
          count=$(find source-maps -name '*.map' -type f | wc -l)
          [ "$count" -gt 0 ] || {
            echo "::error::the build produced no source maps under dist. vite.config.js builds hidden maps for every bundle; a dist without them is a different build from the one this step expects."
            exit 1
          }
          echo "set aside $count source maps for the source-maps artifact"

      # Thirty days, not one: the site artifact below is a hand-off between
      # two jobs of one run, while these are the only copy of this build's
      # maps anywhere, and a stack trace is read days after the deploy that
      # produced it.
      - name: Keep the source maps for thirty days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-maps
          path: frontend/source-maps
          retention-days: 30
          if-no-files-found: error

      # The build output must be complete and must be the ONLY thing uploaded.
      # The first run of this workflow failed with "The size of the app content
      # was too large. The limit for this Static Web App is 524288000 bytes":
      # with `skip_app_build: true` the action uploads `app_location` itself, so
      # pointing it at `frontend` sent 1.4 GB — 927 MB of which was
      # node_modules. `dist` is 112 MB.
      - name: Verify the upload payload
        run: |
          set -euo pipefail
          test -f dist/staticwebapp.config.json || {
            echo "::error::dist/staticwebapp.config.json is missing. Without it the site loads, the home page works, and every deep link 404s — see frontend/scripts/stage-swa-config.mjs."
            exit 1
          }
          test -f dist/index.html || { echo "::error::dist/index.html is missing; the build did not produce a site."; exit 1; }

          # No source map ships (AP-F11, #935). The step above moved them to
          # the source-maps artifact; one left here would be served by its
          # hashed name to anyone who asks for it.
          maps=$(find dist -name '*.map' -type f | wc -l)
          [ "$maps" -eq 0 ] || {
            echo "::error::$maps source map(s) are still under dist. They are set aside in the step above; a map that ships is readable by anyone who guesses its hashed name."
            exit 1
          }

          # A shell builds cleanly, passes component tests, and can look correct
          # in a browser while crawlers receive no page content. Assert the
          # rendered document count here rather than leaving that to discovery.
          # `npm run build` runs scripts/prerender.mjs, which writes ~80.
          html=$(find dist -name '*.html' | wc -l)
          echo "dist contains $html HTML documents"
          [ "$html" -ge 60 ] || {
            echo "::error::only $html HTML documents in dist — pre-rendering did not run or mostly failed. See frontend/scripts/prerender.mjs."
            exit 1
          }
          # The pattern is MOUNT_POINT_PATTERN in frontend/scripts/prerender.mjs
          # and prerender.test.js reads it back out of THIS FILE to assert the
          # two still agree. Change one and the frontend test job fails.
          #
          # It was `<div id="root"><[^/]` until 2026-09-01, written when the
          # mount point carried no attributes. #296 added
          # data-prerendered-route and the literal stopped existing, so this
          # check could never pass — and since it BLOCKS rather than admits, it
          # failed every deploy on correctly pre-rendered output instead of
          # being noticed.
          grep -q '<div id="root"[^>]*><[^/]' dist/about/index.html || {
            echo "::error::dist/about/index.html has an empty mount point — it is a shell, not a pre-rendered page."
            exit 1
          }

          # Assert on the BUILT HTML, not the components. The canonical bug got
          # past every unit test precisely because it lived in index.html and
          # was applied by the pre-render step — neither of which a React
          # component test looks at. Every page shipped a canonical pointing at
          # the home page, telling crawlers the whole site was one document.
          # Every page, not a sample: the two-canonical bug appeared only on
          # article detail routes, because those templates render one of their
          # own — a sample of three landing pages would have missed all 24.
          # NUL-separated, so a path is never split on whitespace (SC2044).
          dupes=$(find dist -name index.html -print0 | while IFS= read -r -d '' f; do
            n=$(grep -c 'rel="canonical"' "$f" || true); [ "$n" -eq 1 ] || echo "$f:$n";
          done)
          [ -z "$dupes" ] || { echo "::error::pages without exactly one canonical:"; echo "$dupes"; exit 1; }

          for page in about azure/education contact; do
            f="dist/$page/index.html"
            n=$(grep -c 'rel="canonical"' "$f" || true)
            [ "$n" -eq 1 ] || { echo "::error::$f has $n canonical links, expected exactly 1."; exit 1; }
            grep -q "rel=\"canonical\" href=\"https://hybridcloudworks.com/$page\"" "$f" || {
              echo "::error::$f canonical is not https://hybridcloudworks.com/$page/ — $(grep -o 'rel="canonical"[^>]*' "$f")"
              exit 1
            }
            grep -q 'property="og:url"' "$f" || { echo "::error::$f has no og:url."; exit 1; }
          done

          # The sitemap is generated from the routes that were written, so a
          # stale hand-maintained file reappearing is a real regression.
          locs=$(grep -c '<loc>' dist/sitemap.xml || echo 0)
          [ "$locs" -ge 60 ] || { echo "::error::sitemap.xml has only $locs URLs — it was not generated from the pre-render route list."; exit 1; }
          grep -q '<loc>https://hybridcloudworks.com/about</loc>' dist/sitemap.xml || {
            echo "::error::sitemap.xml does not use the canonical (non-trailing) form."
            exit 1
          }
          test -f dist/robots.txt || { echo "::error::dist/robots.txt is missing, so crawlers asking for it would get a 404."; exit 1; }
          echo "metadata contract: canonical, og:url and sitemap verified on built HTML"
          bytes=$(du -sb dist | cut -f1)
          echo "dist: $(du -sh dist | cut -f1) ($bytes bytes), limit 524288000"
          [ "$bytes" -lt 524288000 ] || {
            echo "::error::dist is over the Static Web Apps 500 MB limit at $bytes bytes."
            exit 1
          }

      # Handed to `deploy` instead of being uploaded from here, so the token
      # never shares a job with the dependency tree that produced this (T-727).
      # One day's retention: this is a build artifact, not a release archive,
      # and the rollback path in the header is a forward deploy from main.
      - name: Upload the verified site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error
          # Already-compressed assets; re-compressing 117 MB buys little and
          # costs minutes on both ends.
          compression-level: 1

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15 # slowest 1.6 min; waiting for approval does not count (#1441)
    # Binding the job to an environment gives production deploys a deployment
    # history, and any gate on them lives in the environment, not here. Read
    # live on 2026-10-03, `production` had two required reviewers
    # (saulpatinojr and hcw-architect) and a main-only deployment-branch
    # policy (Required-Inputs §4.4). The owner removed the reviewers on
    # 2026-11-09 (#1613), so every run, automatic or by hand, goes straight
    # on to the upload with nobody approving it. Without the environment
    # GitHub would auto-create a bare one that records who deployed without
    # gating whether they may (T-705).
    #
    # deploy-functions.yml names this same environment, so the backend deploy
    # has no approval either until #1617 moves it to a reviewed
    # `production-backend`. Do not rename the environment here on its own:
    # the sign-in below matches on this exact name.
    environment: production
    # id-token for the federated login that mints the deployment token (T-727).
    # `environment: production` above is load-bearing for it: the OIDC subject
    # becomes repo:<org>/<repo>:environment:production, and github_deploy holds
    # exactly that credential plus its immutable form (github_production and
    # github_production_immutable in infra/oidc.tf). The subject is the same
    # whether a push or a dispatch started the run, because a job that names an
    # environment presents the environment form, not the branch form
    # (https://docs.github.com/en/actions/reference/security/oidc#filtering-for-a-specific-environment),
    # so the automatic runs need no new credential.
    # Removing the environment key would break authentication with AADSTS700213,
    # not merely lose the deployment record.
    permissions:
      contents: read # the SWA action reads app_location from the workspace
      id-token: write # the federated login that mints the deployment token (T-727)
    steps:
      # The SWA action reads `app_location` from the workspace, so the
      # repository still has to be present — but nothing here installs or runs
      # a dependency.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the verified site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: frontend/dist

      # Cheap re-assertion after the transfer. The build verified this content
      # thoroughly; what is unverified here is that it survived upload and
      # download intact, and deploying an empty directory would succeed and
      # blank the site.
      - name: Confirm the artifact arrived
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html || { echo "::error::artifact is missing index.html"; exit 1; }
          test -f frontend/dist/staticwebapp.config.json || { echo "::error::artifact is missing staticwebapp.config.json — every deep link would 404"; exit 1; }
          html=$(find frontend/dist -name '*.html' | wc -l)
          [ "$html" -ge 60 ] || { echo "::error::only $html HTML documents survived the artifact round trip"; exit 1; }
          echo "artifact intact: $html HTML documents"

      # THE DEPLOYMENT TOKEN IS MINTED HERE, NOT STORED (T-727).
      #
      # Azure/static-web-apps-deploy cannot authenticate with a federated
      # credential — azure/static-web-apps#1304 is an open request for exactly
      # that. So the token is still what the action takes; what changed is that
      # it no longer lives as a long-lived GitHub secret and a Terraform output.
      # It is read from ARM under the same federated identity this repository
      # already uses everywhere else, and it lives for one run. Keeping it is
      # an accepted risk (TODO.md, Accepted risks; #834), compensated by
      # resetting the token every 90 days or on any suspicion.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Mint the deployment token
        id: swa
        env:
          APP: ${{ vars.STATIC_WEB_APP_NAME || 'stapp-site-prod-cus-01' }}
          RG: ${{ vars.STATIC_WEB_APP_RESOURCE_GROUP || 'rg-web-site-prod-cus' }}
        run: |
          set -uo pipefail

          err=$(mktemp)
          # --query with -o tsv, as deploy-functions.yml already does. The
          # working agreement against `az --query` is about BRACKETS at a
          # PowerShell prompt, where [0] and [?...] get re-parsed; this is bash
          # and a plain property path. It matters here for a second reason: the
          # value must arrive alone, not inside a JSON blob that could be echoed
          # whole before the mask is registered.
          if ! token=$(az staticwebapp secrets list --name "${APP}" --resource-group "${RG}" \
                --query 'properties.apiKey' -o tsv --only-show-errors 2>"${err}"); then
            reason=$(tr -d '\r' < "${err}" | tr '\n' ' ' | cut -c1-300)
            case "${reason}" in
              *AuthorizationFailed*|*does\ not\ have\ authorization*|*Forbidden*)
                echo "::error::Not authorized to list the deployment token. github_deploy needs"
                echo "::error::the 'HCW Static Web App Deployer' role on ${APP}; the definition is"
                echo "::error::in infra/roles/static-web-app-deployer.json and must be created by"
                echo "::error::the owner before the Terraform assignment can be applied." ;;
              *)
                echo "::error::Could not read the deployment token from ARM." ;;
            esac
            echo "Reason: ${reason}"
            exit 1
          fi

          # An empty token is an AUTHORIZED call that returned nothing, which
          # the action would accept and then fail on obscurely. Catch it here,
          # where the cause is still legible.
          if [ -z "${token}" ]; then
            echo "::error::ARM returned an empty deployment token for ${APP}. The call succeeded,"
            echo "::error::so this is not a permissions problem — check the app name."
            exit 1
          fi

          # Registered as a mask BEFORE it is written anywhere, so a later
          # accidental echo of it is redacted rather than published.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
          echo "minted a deployment token for ${APP}"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The BUILT OUTPUT, not the app source. `output_location` is an Oryx
          # build-output path and is ignored when the build is skipped, so it
          # cannot narrow what gets uploaded — `app_location` has to be the
          # content root itself.
          app_location: frontend/dist
          skip_app_build: true
          # No skip_api_build here: it is not an input at the pinned action SHA,
          # and with no api_location set there is no API build to skip anyway.

      # Post-deploy probe: three requests to the live site (PLAT-5, #965; #1613).
      #
      # Probes the Static Web App default hostname directly (bypassing Cloudflare
      # Bot Fight Mode, which rejects datacenter runner IPs on the custom domain).
      #   - `/` must answer 200 with the page markup.
      #   - `/about` must answer 200 and be the PRE-BUILT page: its body must
      #     carry `data-prerendered-route="/about"`, the mark the pre-render
      #     step puts on every page it writes (scripts/prerender.mjs). The
      #     build step above already requires dist/about/index.html. This
      #     probed `/news` until #1613, which is not a page the site builds;
      #     it only answered 200 because the old catch-all sent the app to
      #     every address.
      #   - A made-up address must answer 404 with the app (the
      #     `responseOverrides` 404 rule in staticwebapp.config.json). This
      #     proves on every deploy that an unknown address is a real 404 and
      #     not a "Soft 404" (an error page sent with 200), which is the bug
      #     #1613 fixed.
      - name: Post-deploy frontend probe
        env:
          APP: ${{ vars.STATIC_WEB_APP_NAME || 'stapp-site-prod-cus-01' }}
          RG: ${{ vars.STATIC_WEB_APP_RESOURCE_GROUP || 'rg-web-site-prod-cus' }}
          DEFAULT_HOSTNAME_OVERRIDE: ${{ vars.STATIC_WEB_APP_DEFAULT_HOSTNAME || 'calm-ground-0d0e6a010.7.azurestaticapps.net' }}
          POLL_INTERVAL_S: '5'
          POLL_BUDGET_S: '90'
        run: |
          set -euo pipefail

          DEFAULT_HOSTNAME="${DEFAULT_HOSTNAME_OVERRIDE:-}"
          if [ -z "${DEFAULT_HOSTNAME}" ]; then
            DEFAULT_HOSTNAME=$(az staticwebapp show --name "${APP}" --resource-group "${RG}" --query "defaultHostname" -o tsv 2>/dev/null || true)
          fi
          if [ -z "${DEFAULT_HOSTNAME}" ]; then
            echo "::error::Could not read defaultHostname for ${APP}"
            exit 1
          fi

          echo "Probing deployed Static Web App at https://${DEFAULT_HOSTNAME} (PLAT-5)..."
          ROOT_URL="https://${DEFAULT_HOSTNAME}/"
          PRERENDER_URL="https://${DEFAULT_HOSTNAME}/about"
          PRERENDER_MARK='data-prerendered-route="/about"'
          # GITHUB_RUN_ID is a number GitHub sets, so the path is new on each
          # run and cannot be a page anyone has written.
          MISSING_PATH="/__deploy-probe-${GITHUB_RUN_ID}"
          MISSING_URL="https://${DEFAULT_HOSTNAME}${MISSING_PATH}"

          # probe_url URL LABEL EXPECTED_STATUS REQUIRED_TEXT
          # Asks again every POLL_INTERVAL_S seconds until the address answers
          # EXPECTED_STATUS or POLL_BUDGET_S runs out (the upload can take a
          # little while to reach every server). Then the body must contain
          # REQUIRED_TEXT, matched as plain text, not as a pattern.
          probe_url() {
            local target_url="$1"
            local label="$2"
            local expected="$3"
            local required="$4"
            local started=$SECONDS
            local attempt=0
            local status=""
            local body_file
            body_file=$(mktemp)

            echo "Probing ${label} at ${target_url}, expecting HTTP ${expected}..."
            while :; do
              attempt=$((attempt + 1))
              status=$(curl -sS -m 20 -w '%{http_code}' -o "${body_file}" "${target_url}" 2>/dev/null || true)
              local elapsed=$((SECONDS - started))
              echo "  attempt ${attempt} at +${elapsed} s: HTTP ${status}"
              [ "${status}" = "${expected}" ] && break
              if [ $((elapsed + POLL_INTERVAL_S)) -gt "${POLL_BUDGET_S}" ]; then
                echo "  no HTTP ${expected} within ${POLL_BUDGET_S} s"
                break
              fi
              sleep "${POLL_INTERVAL_S}"
            done

            if [ "${status}" != "${expected}" ]; then
              echo "::error::Probe failed for ${label}: HTTP ${status}, expected ${expected}"
              echo "Response excerpt: $(head -c 300 "${body_file}" || true)"
              rm -f "${body_file}"
              return 1
            fi

            if ! grep -qF -- "${required}" "${body_file}"; then
              echo "::error::Probe response for ${label} did not contain ${required}"
              echo "Response excerpt: $(head -c 300 "${body_file}" || true)"
              rm -f "${body_file}"
              return 1
            fi
            rm -f "${body_file}"
            echo "  ${label} verified: HTTP ${expected}, body contains ${required}"
          }

          probe_url "${ROOT_URL}" "root document (/)" 200 '<div id="root"'
          probe_url "${PRERENDER_URL}" "pre-built page (/about)" 200 "${PRERENDER_MARK}"
          probe_url "${MISSING_URL}" "made-up address (${MISSING_PATH})" 404 '<div id="root"'

          {
            echo "## 🌐 Frontend Post-Deploy Verification"
            echo ""
            echo "Direct Azure Static Web Apps probe on \`${DEFAULT_HOSTNAME}\` (PLAT-5):"
            echo "- \`GET /\` → **HTTP 200 OK** (the app's page markup)"
            echo "- \`GET /about\` → **HTTP 200 OK** (the pre-built page, \`${PRERENDER_MARK}\`)"
            echo "- \`GET ${MISSING_PATH}\` → **HTTP 404** (an unknown address is a real 404, #1613)"
          } >> "$GITHUB_STEP_SUMMARY"
