name: Repository Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel superseded pull request runs, but never a push to main: the main run
  # is the record that what landed satisfies the policy.
  group: repository-policy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-structure:
    name: Validate root and documentation policy
    runs-on: ubuntu-26.04
    steps:
      # fetch-depth: 0 for the TODO/CHANGELOG movement gate below, which reads
      # TODO.md at the pull request's base commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate repository structure
        shell: pwsh
        run: ./scripts/validate-repository-structure.ps1

      # TODO.md's handling rule — "completed items are removed from this file
      # after the corresponding regular entry is present in CHANGELOG.md" —
      # was prose until 2026-09-02, which means it held exactly as long as
      # every editor remembered it. This makes it a gate: any T-identifier
      # that leaves TODO.md in a pull request must appear in CHANGELOG.md at
      # the same head. The script fails loudly when it cannot read the base
      # (a gate that cannot evaluate has not evaluated), and pull_request is
      # the only event with a base to compare against.
      # Node.js 26, the newest line, to match scripts/package.json's engines
      # declaration (scripts/version-floors.json, #715) — the gate is
      # stdlib-only (no install, so no npm cache), but a policy gate should
      # not float on whatever the runner image ships.
      - name: Set up Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: TODO removals are recorded in the CHANGELOG
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-todo-changelog-movement.mjs --base "${BASE_SHA}"

      # Parses every .ps1/.psm1 and checks its bytes. Four defects were found in
      # cutover/05-verify-timer.ps1 in one evening on 2026-08-30 — one of them a
      # BOM — and none by a check, because nothing in CI had ever loaded a
      # PowerShell file other than the validator above. A syntax error in a
      # cutover script surfaces when an operator runs it, which is the worst
      # possible time to find one. (That script was retired on 2026-09-08; the
      # remaining cutover scripts are the ones an operator still runs, which is
      # exactly the set this needs to cover.)
      - name: Validate PowerShell syntax and encoding
        shell: pwsh
        run: ./scripts/validate-powershell.ps1

      # The gate above shipped with a defect its own mutation testing missed:
      # under $ErrorActionPreference = 'Stop' it printed one finding and stopped,
      # while still exiting 1 — so CI looked identical with the bug and without
      # it. These run it against fixtures of deliberately broken files and assert
      # on its OUTPUT, which is the only way that class of bug is visible.
      - name: Test the PowerShell validator
        shell: pwsh
        run: ./scripts/validate-powershell.tests.ps1

      # scripts/lab/Connect-Lab.ps1 rewrites a file on the owner's desktop,
      # ~/.ssh/config, so its merge logic is tested against fixtures rather
      # than trusted. scripts/lab/Register-LabAgent.ps1 creates Entra objects
      # and rewrites the lab host's Ansible vault, so its az calls are tested
      # against a mocked seam and its vault merge runs under bash against a
      # stand-in ansible-vault. scripts/lab/Register-LabArc.ps1 does the same
      # for Azure Arc and also handles a client secret, so its tests add runs
      # of the whole script, with and without -WhatIf, against stand-in az and
      # ssh executables that refuse every write. The tests load the functions
      # from each script's syntax tree and touch only Pester's TestDrive (the
      # whole-script runs put their stand-ins there too). Pester 5 ships
      # preinstalled on the Ubuntu runner image (5.9.0 on 26.04, as on 24.04,
      # in September 2026). The result check fails on zero tests as
      # well as on a failure, because a sweep that found nothing is not a pass.
      #
      # scripts/cutover joined on 2026-09-29 (#814). 06-seed-secret.ps1 is the
      # break-glass seeder for when the site is down, and it had stopped at
      # its first line of work since the infra/ split, unnoticed, because
      # nothing runs it on a good day. Its tests hold the names it accepts to
      # the repository as committed.
      #
      # scripts/alerts joined on 2026-10-10 (#964). Invoke-AlertFireTest.ps1
      # makes production changes on purpose (a role, a firewall entry, a
      # lowered threshold, a disabled timer) and must put each one back, so
      # its stop conditions, records and put-backs are tested against a mocked
      # az, and the whole script runs under -WhatIf against a stand-in az that
      # refuses every write. The path list is explicit, so a new scripts/
      # directory with tests is added here.
      - name: Test the lab, cutover and alert scripts
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path scripts/lab, scripts/cutover, scripts/alerts -Output Detailed -PassThru
          if ($result.Result -ne 'Passed' -or $result.PassedCount -eq 0) { exit 1 }

      # A step that ran ./scripts/cutover/workspace-query.tests.ps1 stood here
      # until 2026-09-08. It covered the KQL transport helpers used by
      # 05-verify-timer.ps1 — the multi-line-query-to-`az.cmd` truncation that
      # made Azure answer a different question and still exit 0. Both the
      # script and its helpers were retired with the timer-arming gate they
      # served (#345 closed that gate; #321 had already switched off the
      # `Function.*` traces they read), so the step now had no subject.
      #
      # The lesson it encoded did not go with it: a helper whose internals can
      # only run against a live cloud is a helper nobody can change safely.
      # scripts/check-unresolved-secrets.mjs carries the same row-shape guard
      # in the same shape — it refuses a payload it cannot recognise instead of
      # reporting a clean bill of health — and its tests need no credential, so
      # they run in the `scripts (operations)` job of ci.yml.
