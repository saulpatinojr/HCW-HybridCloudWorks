name: Update Version Floors

# Re-reads the newest release of every runtime, OS and base image the
# repository chooses and opens one pull request when a floor in
# scripts/version-floors.json moves (#715, #714).
#
# WHY A WORKFLOW. version-floors.json records the newest Python, Node.js,
# Ubuntu LTS, Debian, Alpine, Terraform, PostgreSQL and HashiCorp Vault
# release on the day it was read, and
# scripts/version-floors.test.mjs fails any pin below the floor derived from
# it. That keeps the pins honest against the file; this keeps the file honest
# against the world. Ubuntu 24.04 was named in ADR 0032 on 2026-09-25 without
# a check against what was current, and seven files then pinned `noble`: this
# is the check.
#
# THE PULL REQUEST MOVES WHAT CAN BE MOVED EXACTLY. A bump moves the floors
# and, in the same commit, every engines.node range they leave behind within
# its line, with the root entry of the package-lock.json beside it. Until
# #1152 it moved the floors alone, and every Node.js minor turned the pull
# request red on five package.json ranges a person then moved by hand. The
# same pull request's CI runs version-floors.test.mjs against the new floors,
# so it goes red only on the pins a person has to move — an exact pin with
# its digest or checksum, a runtime_version, a runs-on, or a pin on a new
# line — and names each one; the body lists the same pins. Move them on the
# branch, or split them into their own pull requests; do not merge the floors
# ahead of the pins.
#
# ONE PATCH, JUDGED BEFORE IT IS APPLIED. `update` hands its edits on as a
# patch. `commit` holds the App token, so before it applies the patch it
# refuses one that touches anything but scripts/version-floors.json, a
# package.json or a package-lock.json, or that changes any line of a package
# file other than an `"node": "…"` line — a rule written here rather than in
# anything the patch could replace (the lab-supply-chain.yml guard, CodeRabbit
# on #1129). Once applied, and before anything runs a repository file, each
# package file must equal HEAD as JSON but for engines.node, which a line rule
# alone cannot tell from a dependency named node. It then stages the paths
# that guard listed, by name — never `-A`, never `.` — because the branch the
# App pushes is the one thing its write permission can reach.
# scripts/version-floors-workflow.test.mjs asserts all three, and runs both
# checks against real patches.
#
# NOTHING MOVED IS NOT A PULL REQUEST. checkedOn moves only with its entry
# (the AVM_VERIFIED_ON convention), so most weeks end at "No floor moved".
#
# SOURCES. endoflife.date's v1 API for each kind; the "Supported language
# stack versions" table on Microsoft Learn's Flex Consumption page for the
# Node.js line Azure Functions can run; and the "Available Images" table of
# the actions/runner-images README for the Ubuntu release GitHub-hosted
# runners offer as generally available, which every workflow's runs-on names.
# A source that cannot be read, or that lists an older release than the file
# records, ends the run with exit code 1 and nothing written. The two tables
# are the exception: when one cannot be read its ceiling stays put, the run
# carries on, and a warning in the step summary says to check the page by
# hand.
#
# MODELLED ON update-avm-versions.yml, and for the same reasons. Two jobs, so
# that no job holds both network input and a credential that can write to
# this repository. `update` installs nothing (the scripts use node: built-ins
# and global fetch) and holds a checkout only. `commit` installs nothing and
# holds `contents: read`; the push and the pull request use a GitHub App
# installation token minted for a few API calls, the same App the manifest,
# the catalogue and the AVM bump use (MANIFEST_APP_ID /
# MANIFEST_APP_PRIVATE_KEY). Opened ready for review, not as a draft (owner
# decision 2026-09-05, .claude/CLAUDE.md), and without auto-merge.

on:
  workflow_dispatch:
  schedule:
    # Wednesdays 06:30 UTC. Monday carries the catalogue, the page audit and
    # CodeQL, Tuesday the AVM bump; a floors pull request is a work list and
    # should not land in the same hour as either.
    - cron: '30 6 * * 3'

# No workflow-level permissions: each job declares its own.
permissions: {}

concurrency:
  group: version-floors
  cancel-in-progress: false

jobs:
  update:
    name: Check the floors against endoflife.date, Microsoft Learn and runner-images
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only — this job must never be able to push
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No npm cache and no `npm ci`: the updater imports node: built-ins and
      # its own sibling module, and nothing else.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # Exit code 1 and one sentence when a source cannot be read or goes
      # backwards; nothing is written. When a floor moved it also moves the
      # engines.node ranges the new floors leave behind within their line. The
      # summary lists what moved and every pin still behind; the body is the
      # pull request template around it.
      - name: Run the updater
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/version-floors"
          node scripts/update-version-floors.mjs --summary "${RUNNER_TEMP}/version-floors/summary.md" --body "${RUNNER_TEMP}/version-floors/pr-body.md" --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # The edits travel as one text patch of the tracked files: the commit
      # job reads it line by line before it applies it.
      - name: Did a floor move?
        id: changed
        run: |
          set -euo pipefail
          cat "${RUNNER_TEMP}/version-floors/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain -- scripts/version-floors.json)" ]; then
            echo "No floor moved."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff > "${RUNNER_TEMP}/version-floors/floors.patch"

      - name: Upload the patch, the summary and the body
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-floors
          path: ${{ runner.temp }}/version-floors/
          retention-days: 1
          if-no-files-found: error

  commit:
    name: Open a pull request if a floor moved
    needs: update
    # Without this gate an unchanged week fails at "Artifact not found"
    # instead of ending quietly (learn catalogue run 34408439025).
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    # `automation` and not `production`, as in the other scheduled
    # PR-opening jobs: this opens a pull request, runs on a schedule, and an
    # approval gate would leave the run waiting for a human who is not there.
    environment: automation
    permissions:
      contents: read # checkout only — this job cannot push anywhere on its own
    steps:
      # `persist-credentials: false`, or the push below authenticates as
      # github-actions[bot] and is refused (publish-content-manifest.yml,
      # run 34092896715).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-floors
          path: ${{ runner.temp }}/version-floors

      # This job holds the App token and runs a repository script after the
      # patch is applied, so the patch is judged before it is applied, by a
      # rule written here rather than in anything the patch could replace: it
      # moves the floors file, and may otherwise touch only a package.json or
      # a package-lock.json, and in those only an `"node": "<range>"` line. No
      # binary hunk, no other file, no other line (lab-supply-chain.yml's
      # guard, CodeRabbit on #1129). The updater edits files in place and
      # nothing else, so a rename, copy, creation, deletion or mode change is
      # refused too: those carry no hunk for the line rule to read, and a
      # rename's numstat names only its destination (CodeRabbit on #1160).
      # The list it writes is what gets staged.
      - name: The patch moves only the floors file and engines.node ranges
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/version-floors"
          patch="${dir}/floors.patch"
          if grep -qE '^(GIT binary patch|Binary files )' "${patch}"; then
            echo "::error::The patch carries a binary change; refused."
            exit 1
          fi
          if grep -qE '^((rename|copy) (from|to) |(old|new|deleted file|new file) mode |(dis)?similarity index )' "${patch}"; then
            echo "::error::The patch renames, copies, creates, deletes or re-modes a file; refused."
            exit 1
          fi
          git apply --numstat "${patch}" | cut -f3- | sort -u > "${dir}/patched.txt"
          if ! grep -qx 'scripts/version-floors.json' "${dir}/patched.txt"; then
            echo "::error::The patch does not move scripts/version-floors.json; refused."
            exit 1
          fi
          outside="$(grep -vxE 'scripts/version-floors\.json|([^/]+/)*package(-lock)?\.json' "${dir}/patched.txt" || true)"
          if [ -n "${outside}" ]; then
            echo "::error::The patch touches files other than the floors file and package manifests: $(echo "${outside}" | tr '\n' ' ')"
            exit 1
          fi
          stray="$(awk '
            /^diff --git / { file = $NF; sub(/^b\//, "", file); hunk = 0; next }
            /^@@ / { hunk = 1; next }
            hunk && /^[-+]/ && file != "scripts/version-floors.json" && $0 !~ /^[-+][[:space:]]*"node": "[-0-9.<>=^~|*xX ]+",?$/ { print file ": " $0 }
          ' "${patch}")"
          if [ -n "${stray}" ]; then
            echo "::error::The patch changes a package file line that is not an engines.node range: ${stray}"
            exit 1
          fi
          echo "Patched: $(tr '\n' ' ' < "${dir}/patched.txt")"

      # The line rule above cannot see where a `"node"` line sits: one under a
      # dependency named node, or in a lockfile entry other than the root,
      # reads the same as engines.node. So once the patch is applied, and
      # before anything runs a repository file, each package file is compared
      # with HEAD as JSON with engines.node taken out of both sides
      # (packages[""].engines.node in a lockfile); any other difference
      # refuses the run (CodeRabbit on #1160). Inline, for the guard's reason:
      # nothing the patch touches can change it.
      - name: Apply the patch; nothing but engines.node moved in a package file
        run: |
          set -euo pipefail
          git apply "${RUNNER_TEMP}/version-floors/floors.patch"
          node --input-type=commonjs -e '
            const { execFileSync } = require("node:child_process");
            const { readFileSync } = require("node:fs");
            const withoutRange = (file, value) => {
              const engines = file.endsWith("package-lock.json") ? value.packages?.[""]?.engines : value.engines;
              if (engines) delete engines.node;
              return JSON.stringify(value);
            };
            const packages = readFileSync(process.argv[1], "utf8").split("\n").filter((f) => /(^|\/)package(-lock)?\.json$/.test(f));
            const beyond = packages.filter((file) => {
              const before = JSON.parse(execFileSync("git", ["show", `HEAD:${file}`], { encoding: "utf8", maxBuffer: 1 << 28 }));
              const after = JSON.parse(readFileSync(file, "utf8"));
              return withoutRange(file, before) !== withoutRange(file, after);
            });
            if (beyond.length) {
              console.log(`::error::The patch changes more than engines.node in: ${beyond.join(" ")}`);
              process.exit(1);
            }
            console.log(`Only engines.node moved in: ${packages.join(" ") || "(no package file)"}`);
          ' "${RUNNER_TEMP}/version-floors/patched.txt"

      - name: Did a floor move?
        id: changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- scripts/version-floors.json)" ]; then
            echo "No floor moved."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "as_of=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Self-arming, like the other App-token workflows: before the App exists
      # this reports that it opened nothing rather than failing every week.
      - name: Is the App configured?
        id: app
        if: steps.changed.outputs.changed == 'true'
        env:
          MANIFEST_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          MANIFEST_APP_ID: ${{ vars.MANIFEST_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MANIFEST_APP_PRIVATE_KEY}" ] && [ -n "${MANIFEST_APP_ID}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A floor moved but the App is not configured, so no pull request was opened. Set the MANIFEST_APP_ID variable and the MANIFEST_APP_PRIVATE_KEY secret (T-726)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # No `npm ci`: the minter imports only node:crypto and node:url.
      - name: Mint an App installation token
        id: token
        if: steps.app.outputs.armed == 'true'
        env:
          GITHUB_APP_ID: ${{ vars.MANIFEST_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token=$(node scripts/github-app-token.mjs)
          # Masked BEFORE it is written anywhere, including to GITHUB_OUTPUT.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # `git add -- <paths>`, the list the guard above wrote, and never `-A`
      # or `.`: the branch this pushes is the one thing the App's write
      # permission can reach.
      - name: Push the branch
        if: steps.app.outputs.armed == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          AS_OF: ${{ steps.changed.outputs.as_of }}
        run: |
          set -euo pipefail
          # RUN_ATTEMPT as well as RUN_ID: a re-run keeps the id, and a branch
          # that already exists on the remote fails the push.
          branch="chore/version-floors-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=${branch}" >> "$GITHUB_ENV"
          git config user.name  'hcw-manifest[bot]'
          git config user.email 'hcw-manifest[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          mapfile -t patched < "${RUNNER_TEMP}/version-floors/patched.txt"
          git add -- "${patched[@]}"
          git commit -m "chore: move the version floors (checked ${AS_OF})"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${branch}"

      # The body is the updater's: .github/pull_request_template.md's
      # sections around the summary (renderPullRequestBody, tested).
      - name: Open the pull request
        if: steps.app.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          AS_OF: ${{ steps.changed.outputs.as_of }}
        run: |
          set -euo pipefail
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${branch}" \
            --title "chore: move the version floors (checked ${AS_OF})" \
            --body-file "${RUNNER_TEMP}/version-floors/pr-body.md"

      # The token lives an hour; the work above takes seconds. `always()`, so
      # a failed push or `gh pr create` still cleans up.
      - name: Revoke the installation token
        if: always() && steps.token.outputs.token != ''
        env:
          GITHUB_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/github-app-token.mjs --revoke
