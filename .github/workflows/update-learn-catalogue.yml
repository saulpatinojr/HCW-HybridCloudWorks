name: Update Learn Catalogue

# Refreshes frontend/src/data/azure/certifications.js and
# the outlines in frontend/src/data/azure/study-guides/ from Microsoft Learn and
# opens one pull request when either changed (#461 item 3, #499).
#
# ONE DIRECTORY, NOT ONE FILE, SINCE #500. The outlines are one module per
# guide plus index.js, so a detail page downloads only its own. The directory
# is staged by path as a single output: `git add <dir>` stages additions,
# rewrites and deletions inside it and nothing outside it, and the updater
# writes nothing else there.
#
# TWO OUTPUTS, ONE PULL REQUEST (#499). The outlines arrived with #498 and
# refreshed only by hand; this workflow was scoped to a single file, and
# widening it was deliberately left as its own reviewable change rather than
# slipped into #498 — the one-file scope is the argument for what the App
# token is allowed to reach, so growing it by one output is a boundary change.
# It is still a boundary: `git add` names both paths and neither wildcard, and
# scripts/learn-catalogue-workflow.test.mjs asserts that.
#
# THE ORDER MATTERS. update-study-guides.mjs reads eligibleCerts() out of
# certifications.js, so it runs AFTER the catalogue script and refreshes the
# outlines against the exam list that run just wrote, not last week's.
#
# WHY A WORKFLOW. The updater, frontend/scripts/update-applied-skills.mjs, had
# only ever been run by hand: the file said "Last manual sync: 2026-04-16"
# until 2026-09-09, and in that gap the live page printed "Expiring" for ten
# exams Microsoft had already retired and "BETA" for twelve that had gone GA.
# The script now stamps DATA_AS_OF on every run, refuses to write when a
# source fails or parses to nothing, and never moves an entry backwards in
# its lifecycle; this workflow is what makes it run without anyone
# remembering to.
#
# MODELLED ON publish-content-manifest.yml, and for the same reasons. Two
# jobs, so that no job holds both third-party packages and a credential that
# can write to this repository. `update` runs `npm ci --ignore-scripts` on the
# frontend tree and the updater, and holds nothing but a checkout; it makes
# only GET requests to learn.microsoft.com and the poster CDN, so it needs no
# Azure identity and no origin window. `commit` installs nothing and holds
# `contents: read`; the branch push and the pull request are done with a
# GitHub App installation token minted for the length of a few API calls —
# the same App the manifest uses (MANIFEST_APP_ID / MANIFEST_APP_PRIVATE_KEY),
# because a second stored non-expiring key for the same ability would be a
# second credential to rotate and nothing more.
#
# WHY A PULL REQUEST AND NOT A PUSH. The ruleset's `pull_request` rule refuses
# a direct push to main from anyone, this token included, and the checks run
# on the pull request precisely because it is opened with an App token rather
# than GITHUB_TOKEN (GitHub does not trigger workflows for events its own
# token creates). Opened READY FOR REVIEW, not as a draft (owner decision
# 2026-09-05, .claude/CLAUDE.md), and without auto-merge: the diff is what
# the site says about Microsoft's catalogue, and the body lists every entry
# that changed so the reader can check it against Learn before merging.
#
# THE FILE ALWAYS CHANGES. DATA_AS_OF moves on every successful run, so a
# Monday on which the catalogue did not move still opens a one-line pull
# request; the body says "only the sync date moved" in that case. That is
# deliberate: the page renders the date as "checked against Microsoft Learn
# on", and a date that only moved when something else did would be a claim
# the site could not back.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:30 UTC, after the Friday scrape and before the working week.
    - cron: '30 6 * * 1'

# No workflow-level permissions: each job declares its own, and the whole
# point of the split below is that no job holds both.
permissions: {}

concurrency:
  group: learn-catalogue
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the catalogue from Microsoft Learn
    runs-on: ubuntu-26.04
    permissions:
      contents: read # checkout only — this job must never be able to push
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Node.js 24, not the newest line: the study-guide step below imports
      # functions/src/lib/listen-and-learn/studyguide.js and resolves its
      # dependencies from functions/node_modules, so this job runs functions
      # code, and functions code runs on the line Azure Functions Flex
      # Consumption supports. scripts/version-floors.json holds it there with
      # every other functions pin (#715).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          # Both lockfiles, because #499 made this job install both trees. A
          # cache keyed on the frontend lockfile alone would go on being
          # reported as a hit while functions/ was fetched from the registry
          # every Monday.
          cache-dependency-path: |
            frontend/package-lock.json
            functions/package-lock.json

      # `--ignore-scripts`: the updater needs pdf-parse and prettier, neither
      # of which has an install-time script; nothing else in the tree is used.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # The study-guide script imports the Listen & Learn parser from
      # functions/src/lib/listen-and-learn/studyguide.js, so `node` resolves
      # cheerio out of functions/node_modules — without this the import fails
      # at resolution, before a single guide is fetched. `--ignore-scripts`
      # for the same reason as above.
      - name: Install functions dependencies (the study-guide parser)
        working-directory: functions
        run: npm ci --ignore-scripts

      # A source that cannot be fetched or parses to zero items ends this step
      # with exit code 1 and one sentence, and the file is not written.
      - name: Run the updater
        working-directory: frontend
        run: node scripts/update-applied-skills.mjs --summary "${RUNNER_TEMP}/learn-catalogue-summary.md"

      # Second, and after the catalogue rather than beside it: the study-guide
      # script reads eligibleCerts() out of certifications.js, so it must see
      # the file the step above just wrote. Running it first would refresh the
      # outlines against last week's exam list.
      #
      # FAILURE POLICY (#499 item 6). A partial failure is NOT a red run. The
      # script refuses to write only when NOTHING parses; when one exam's fetch
      # fails it keeps that exam's previous outline and names it in the summary.
      # So a single retitled Learn page cannot block the catalogue refresh —
      # but it must not vanish either, which is why the summary is carried into
      # the pull request body below.
      - name: Refresh the study-guide outlines
        working-directory: frontend
        run: node scripts/update-study-guides.mjs --summary "${RUNNER_TEMP}/study-guides-summary.md"

      # The data tests fail the day a stored status contradicts its dates; a
      # refresh that would open a pull request destined to go red stops here
      # instead, with the offending line in the log.
      # `education-catalogues.test.js` as well as the Azure-only file, because
      # the Azure-only file cannot see the defect that matters most here. The
      # first dispatch of this workflow (run 34627119281) re-added all six GH
      # exams that #496 had removed hours earlier — the poster and the browse
      # API both carry them, so the script offered them and nothing in
      # `certifications.test.js` looks at another catalogue. The cross-catalogue
      # guard lives in the shared file, so this step is what makes the workflow
      # refuse to open that pull request rather than leaving it to the reviewer.
      - name: Check the refreshed catalogue
        working-directory: frontend
        run: npx vitest run src/data/azure/certifications.test.js src/data/education-catalogues.test.js

      # Separately, because it asserts a different contract: every outline
      # belongs to a live catalogue exam and none is orphaned. That is the test
      # that catches an outline left behind by a row leaving the catalogue.
      - name: Check the refreshed outlines
        working-directory: frontend
        run: npx vitest run src/data/azure/study-guides.test.js

      # EITHER file changing is a change. Both scripts stamp their own
      # DATA_AS_OF on every successful run, so in practice both move every
      # Monday and this is belt and braces — it is about what counts as a
      # change, nothing more.
      #
      # It is NOT failure tolerance: a study-guide run where nothing parses
      # raises SourceError, which exits the step non-zero and ends the job
      # before this check is reached, so no pull request is opened for the
      # catalogue either. Tolerance operates one level down, inside the script,
      # where a single exam's failed fetch keeps that exam's previous outline
      # and is named in the summary.
      - name: Did the catalogue or the outlines change?
        id: changed
        # `git status --porcelain`, not `git diff --quiet`: a guide that is new
        # this week is an UNTRACKED file, which `git diff` does not report.
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- frontend/src/data/azure/certifications.js frontend/src/data/azure/study-guides)" ]; then
            echo "Neither the catalogue nor the outlines changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cp "${RUNNER_TEMP}/learn-catalogue-summary.md" learn-catalogue-summary.md
          cp "${RUNNER_TEMP}/study-guides-summary.md" study-guides-summary.md
          cat learn-catalogue-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat study-guides-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the refreshed catalogue and outlines
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learn-catalogue
          path: |
            frontend/src/data/azure/certifications.js
            frontend/src/data/azure/study-guides/
            learn-catalogue-summary.md
            study-guides-summary.md
          retention-days: 1
          if-no-files-found: error

  commit:
    name: Open a pull request if the catalogue changed
    needs: update
    # Runs only when the refresh job reported a change. The upload above is
    # conditional, so without this gate an unchanged catalogue fails here at
    # "Artifact not found" instead of ending quietly (run 34408439025).
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    # Scoped to the `automation` environment so this job's secret is reachable
    # only from a run GitHub has admitted into it (zizmor secrets-outside-env,
    # #567). The estate already does this — `production` on the two deploys,
    # `copilot` on the Copilot setup, `github-pages` on the docs — and these
    # three workflows were simply the ones that never adopted it.
    #
    # `automation` and NOT `production`: these open pull requests rather than
    # deploying, they run on a schedule, and inheriting a production approval
    # gate would leave a scheduled run waiting for a human who is not there.
    #
    # Declaring it changes nothing on its own: a repository secret is still
    # readable from a job in any environment. It is what makes an ENVIRONMENT
    # secret possible, which is the control Microsoft's MCSB v2 DS-3 asks for
    # and what `azure/login`'s own guidance means by "use environment secrets
    # instead of repository secrets".
    #
    # ORDER MATTERS, and the wrong order is silent. This job self-arms: an
    # absent secret makes it report "not set — skipping" and pass GREEN. Move
    # the secret to the environment before this file declares it and the
    # automation stops dead with every check still passing.
    #
    # No `azure/login` in this job, so no OIDC subject changes here. That trap
    # is real and infra/oidc.tf records it (AADSTS700213) — it applies to jobs
    # that exchange a token, which this one does not.
    environment: automation
    # `contents: read` for the checkout, and NOTHING ELSE. The writing is done
    # by a GitHub App installation token, and this job cannot push to main
    # with it either — the ruleset's `pull_request` rule has no bypass actor.
    permissions:
      contents: read # checkout only — this job cannot push anywhere on its own
    steps:
      # `persist-credentials: false`, or the push below authenticates as
      # github-actions[bot] and is refused: checkout writes GITHUB_TOKEN into
      # .git/config as an http.extraheader, which outranks the token in the
      # remote URL (publish-content-manifest.yml, run 34092896715).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the refreshed catalogue
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: learn-catalogue
          path: ${{ runner.temp }}/learn-catalogue

      - name: Did the catalogue or the outlines change?
        id: changed
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/learn-catalogue/frontend/src/data/azure/certifications.js" frontend/src/data/azure/certifications.js
          # The directory is REPLACED, not merged into: a guide the updater
          # deleted (its exam left the catalogue) must be absent here too.
          rm -rf frontend/src/data/azure/study-guides
          cp -R "${RUNNER_TEMP}/learn-catalogue/frontend/src/data/azure/study-guides" frontend/src/data/azure/study-guides
          if [ -z "$(git status --porcelain -- frontend/src/data/azure/certifications.js frontend/src/data/azure/study-guides)" ]; then
            echo "Neither the catalogue nor the outlines changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          as_of=$(grep -o "DATA_AS_OF = '[0-9-]*'" frontend/src/data/azure/certifications.js | grep -o '[0-9-]\{10\}')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "as_of=${as_of}" >> "$GITHUB_OUTPUT"

      # Self-arming, like the manifest workflow: before the App exists this
      # reports honestly that it did not open anything rather than failing
      # every Monday. `secrets` is not available to a job-level `if`.
      - name: Is the App configured?
        id: app
        if: steps.changed.outputs.changed == 'true'
        env:
          MANIFEST_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          MANIFEST_APP_ID: ${{ vars.MANIFEST_APP_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MANIFEST_APP_PRIVATE_KEY}" ] && [ -n "${MANIFEST_APP_ID}" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The catalogue changed but the App is not configured, so no pull request was opened. Set the MANIFEST_APP_ID variable and the MANIFEST_APP_PRIVATE_KEY secret (T-726)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # No `npm ci`: the minter imports only node:crypto and node:url and uses
      # global fetch. This job holds the most powerful credential in the
      # pipeline for the length of a few API calls, so it installs nothing.
      - name: Mint an App installation token
        id: token
        if: steps.app.outputs.armed == 'true'
        env:
          GITHUB_APP_ID: ${{ vars.MANIFEST_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token=$(node scripts/github-app-token.mjs)
          # Masked BEFORE it is written anywhere, including to GITHUB_OUTPUT.
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      # `git add <path>` and never `-A` or `.`: the branch this pushes is the
      # one thing the App's write permission can reach, so what goes on it is
      # the boundary. scripts/learn-catalogue-workflow.test.mjs asserts the
      # absence of the wildcard forms.
      - name: Push the branch
        if: steps.app.outputs.armed == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          AS_OF: ${{ steps.changed.outputs.as_of }}
        run: |
          set -euo pipefail
          # RUN_ATTEMPT as well as RUN_ID: a re-run keeps the id, and a branch
          # that already exists on the remote fails the push (found in review
          # of the manifest workflow).
          branch="chore/learn-catalogue-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=${branch}" >> "$GITHUB_ENV"
          git config user.name  'hcw-manifest[bot]'
          git config user.email 'hcw-manifest[bot]@users.noreply.github.com'
          git checkout -b "${branch}"
          git add frontend/src/data/azure/certifications.js
          git add frontend/src/data/azure/study-guides
          git commit -m "chore: refresh the Azure Learn catalogue and study-guide outlines (checked ${AS_OF})"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${branch}"

      # Ready for review, not a draft. The body is the updater's own summary:
      # every entry added, changed or removed, what was kept from the file
      # because the sources no longer list it, and where a source disagreed
      # with the file — so the reviewer can check each line against Learn.
      - name: Open the pull request
        if: steps.app.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          AS_OF: ${{ steps.changed.outputs.as_of }}
          SUMMARY: ${{ runner.temp }}/learn-catalogue/learn-catalogue-summary.md
          GUIDES_SUMMARY: ${{ runner.temp }}/learn-catalogue/study-guides-summary.md
        run: |
          set -euo pipefail
          {
            echo "## Summary"
            echo
            echo "Weekly refresh of \`frontend/src/data/azure/certifications.js\` and the outlines in \`frontend/src/data/azure/study-guides/\` from Microsoft Learn by \`.github/workflows/update-learn-catalogue.yml\` (#461 item 3, #499, #500). Opened by the App rather than pushed to \`main\`, so the required checks run on it. That file and that directory are the only paths it may touch."
            echo
            cat "${SUMMARY}"
            echo
            cat "${GUIDES_SUMMARY}"
            echo
            echo "A non-zero \"Failed\" count above is not a failed run: that exam kept the outline it already had, so the page still renders one. It does mean the outline is now older than the date this file claims, so check the named exams against Learn before merging."
            echo
            echo "## Related issue or decision"
            echo
            echo "Refs #461 (item 3) and #499."
            echo
            echo "## Verification"
            echo
            echo "- Checks run: \`node scripts/update-applied-skills.mjs\` and \`node scripts/update-study-guides.mjs\` against the live sources; then on the result, \`npx vitest run src/data/azure/certifications.test.js src/data/education-catalogues.test.js\` and \`npx vitest run src/data/azure/study-guides.test.js\` (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo "- \`education-catalogues.test.js\` is in that list because the Azure-only test cannot see a contradiction with another catalogue: it reads one file. That is how run 34627119281 re-added the six GitHub exams #507 had removed and still went green (#496)."
            echo "- Evidence level: [x] CI"
          } > "${RUNNER_TEMP}/pr-body.md"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${branch}" \
            --title "chore: refresh the Azure Learn catalogue and study-guide outlines (checked ${AS_OF})" \
            --body-file "${RUNNER_TEMP}/pr-body.md"

      # The token lives an hour; the work above takes seconds. Ending it here
      # keeps a credential that can open pull requests on this repository from
      # outliving the job that needed it (#641) — which is what
      # `actions/create-github-app-token` does in its post step, and the one
      # thing the in-repo minter did not do.
      #
      # `always()`, so a failed push or a failed `gh pr create` still cleans up
      # — that is the case where a live token matters most. The step cannot
      # fail the job: the script returns 0 whatever GitHub answers, because a
      # run that did its work should not turn red over cleanup.
      - name: Revoke the installation token
        if: always() && steps.token.outputs.token != ''
        env:
          GITHUB_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/github-app-token.mjs --revoke
