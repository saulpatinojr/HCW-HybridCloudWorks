# The reachability check that already existed, on a timer.
#
# WHY THIS IS THE RIGHT DETECTOR FOR T-519, AND A 404 ALERT IS NOT.
#
# Three recorded incidents share one shape: host up, functions unregistered,
# every route 404 (2026-08-20 mass 404; two on 2026-08-21). `Http5xx` does not
# count 404s. `AppExceptions` cannot fire because no handler runs to throw. The
# availability web test is the only rule that asks from outside and it cannot be
# armed, because Cloudflare's Bot Fight Mode answers Azure's agents with a 403
# and the WAF skip rule against it was built, applied and confirmed inert.
#
# ADR 0022 recorded an interim `Http404` metric alert as the cheapest partial
# cover. That is not available: #219 read
# `az monitor metrics list-definitions` on this Function App and found nine
# metric names, all execution or memory counters, and no HTTP metric of any
# kind — Http5xx and HttpResponseTime belong to App Service and Elastic Premium,
# not Flex Consumption. The ADR's alternative predates that measurement.
#
# A KQL rule on `requests | where resultCode == '404'` would detect the SYMPTOM
# on a host that is by then already failing, and might not fire at all: if no
# function runs, it is unproven that the host emits request telemetry for the
# unmatched route — the same reason AppExceptions cannot fire.
#
# So this checks the CONDITION instead, which
# `docs/runbooks/alerting-and-support.md` already documents as the detector:
#
#   "A function count of 0, or an AzureWebJobsStorage count of 1, is the
#    condition behind all three recorded incidents."
#
# It beats an alert rule on every axis that matters here. It reads ARM rather
# than telemetry, so it survives the Log Analytics daily cap that silences every
# log rule in observability.tf. It does not traverse Cloudflare, so Bot Fight
# Mode is irrelevant. It needs no metric that does not exist. And it names the
# cause, not a downstream symptom.
#
# BY NAME, NOT BY COUNT (PLAT-2, #962). This asserted a minimum of one
# registered function, and the second incident, 83 deployed and 80 registered
# with three timers silently down, passed it. It now compares the live listing
# with the expected set and names every function missing, with its trigger:
# scripts/check-registered-functions.mjs, the same script deploy-functions.yml
# runs after SyncTriggers, against functions/function-inventory.json.
#
# WHICH inventory matters. Deploys are dispatch-only, so `main` routinely holds
# functions the host has not been given yet, and comparing with `main` would
# page "missing" for every merge not yet shipped. `--deployed` reads the
# inventory at the commit whose package is live: the newest successful
# `Deploy to Azure Functions` step in the last runs of deploy-functions.yml.
# Reading that run history is why this job holds `actions: read`. A deployed
# commit older than the inventory file has no expected set, and the check
# falls back to "at least one registered", saying so, until the next deploy.
#
# The listing method is unchanged: `az functionapp function list` through
# probe(), so an authorization failure still reads as a broken check rather
# than an outage. Only what it is compared against changed.
#
# ORPHANED ACCESS WINDOWS (#1050). deploy-functions.yml and
# publish-content-manifest.yml each open a one-host `ci-*` Allow rule on the
# Function App for their runner and close it in an always() step, which does
# not run on runner loss or a force-cancel. scripts/assert-origin-lock.mjs
# accepts any single-host `ci-*` rule, because a concurrent run may hold one.
# scripts/check-ci-access-windows.mjs matches each `ci-*` rule on the site and
# the SCM site to its run by the id in its name, through the same
# `actions: read`, and names any whose run has ended. It reads twice, a
# minute apart, so a run closing its window as this reads is not named.
# Removing an orphan stays a person's decision. This check only reads; the
# identity it runs as can write site config, because publish-content-manifest
# uses it for its own window (infra/oidc.tf, T-718), and separating the two is
# #1098.
#
# The check was never missing — it was manual, or inside deploy-functions.yml,
# which only runs when someone deploys. Nobody deployed during any of the three
# incidents. The gap was the timer, not the test.
#
# HOW IT PAGES. A failed scheduled run emails the repository owner through
# GitHub's own notifications. No action group, no Azure alert rule, no cost. It
# deliberately does not route through ag-plat-prod-cus-01: that path depends on
# the subscription this job exists to watch.
#
# THE CRON SAYS HOURLY. GITHUB DELIVERS ABOUT A FIFTH OF THAT.
#
# Measured 2026-08-31 over the 132 hours from 08-26 08:23 to 08-31 20:23, the
# whole life of this workflow at an unchanged `41 * * * *`:
#
#   133 :41 slots in the window, 29 produced a run  ->  22% delivered
#   when one lands, it is a median 36 minutes late (min 0, max 59)
#   only 3 of 29 arrived within 5 minutes of :41
#   longest window with no check at all: 12.7 hours (08-28 06:20 -> 19:00)
#   three separate gaps over 10 hours
#
# So this ran every 4.6 hours on average, not hourly. It is not specific to this
# workflow: monitor-unresolved-secrets.yml (`29 */6 * * *`, added 08-30) has
# produced 2 runs where ~8 were due, and publish-content-manifest.yml (`15 6 * * *`)
# has landed anywhere from 07:05 to 18:37. GitHub documents that `schedule` can
# be delayed under load and that delayed runs are DROPPED rather than queued;
# what the numbers add is how much, on this repository, on a free allowance.
#
# WHAT THAT MEANS FOR THE CLAIM ABOVE, which used to end this paragraph: "an
# hour of detection latency on a personal site is not the binding constraint."
# The premise was never true here. The real figure is up to 12.7 hours observed,
# and it was never checked against the run history — the sentence reasoned from
# the cron rather than from what the cron produced.
#
# WHY THAT IS TOLERABLE, AND EXACTLY WHEN IT STOPS BEING. This is the CAUSE
# check. The SYMPTOM is watched by edge/availability-probe, a Cloudflare Worker
# on a 5-minute cron that GETs /api/health and records success only on a 200 —
# so an unregistered host, which 404s every route including that one, shows up
# there twelve times an hour on a scheduler GitHub cannot drop. Two independent
# schedulers is the right shape: this one names WHICH condition (function count,
# AzureWebJobsStorage, RUNTIME_CONFIG_WRITER, firewall posture), and the probe
# notices FAST.
#
# The probe's alert is armed by `availability_probe_alert_enabled`, set `true`
# on 2026-09-01 (T-519 closed): alert-api-reachability-prod-cus now pages on
# the symptom, and this workflow's job is naming WHICH condition. While the
# variable was false, this workflow was in practice the only watcher — at 22%
# delivery and a 12.7-hour worst case. That gap is closed by the probe alert;
# nothing about this file could have closed it.
#
# THE BUDGET NUMBER WAS ALSO WRONG, in the direction that mattered less. It read
# "~720 minutes a month", assuming every firing lands. At 29 runs per 5.5 days,
# each billed as one rounded-up minute, the real cost is about 160 minutes a
# month. Lowering the cron would not buy anything worth having: delivery rate is
# the constraint, not the requested rate, and asking for less can only deliver
# less.
#
# NO `environment:` KEY — declaring one changes the OIDC subject from
# repo:<org>/<repo>:ref:<ref> to :environment:<name>, which the branch
# credential cannot match (AADSTS700213, documented in infra/oidc.tf).

name: Monitor Functions Registered

on:
  schedule:
    # Offset from the top of the hour, so it does not queue behind every other
    # top-of-the-hour schedule on GitHub's runners.
    - cron: '41 * * * *'
  # No inputs (checkov CKV_GHA_7). The app and its resource group are fixed
  # below and the expected set is the deployed commit's inventory: a manual
  # run checks the same thing the schedule does, and nothing about what
  # "registered" means is a dispatch field.
  workflow_dispatch:

# The workflow-level default. `id-token: write` is granted on the job that uses
# it rather than here (zizmor excessive-permissions, #588): this workflow has
# one job today, so the two are identical in effect — what a job-level grant
# prevents is a second job added later silently inheriting the OIDC token.
permissions:
  contents: read # the checkout, nothing more

concurrency:
  # Never cancel a run in flight. This is an hourly monitor, so a cancelled run
  # is a skipped check rather than a check done later.
  group: monitor-functions-registered-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the expected functions are registered
    # Self-arming, as verify-alert-state.yml is: before the first apply there
    # is no identity to log in as, and an hourly red run would read as a
    # permissions bug while actually meaning "not deployed yet".
    if: ${{ vars.READER_CLIENT_ID != '' }}
    permissions:
      contents: read # the checkout, and the inventory at the deployed commit
      actions: read # deploy-functions.yml's run history: which commit is live
      id-token: write # exchanged by azure/login for an Azure access token
    runs-on: ubuntu-26.04
    steps:
      # For scripts/check-registered-functions.mjs. The inventory it compares
      # against is fetched at the deployed commit, not read from this checkout.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `npm ci`: the script imports Node built-ins and uses global fetch,
      # and this job holds an OIDC token. No cache either, for the same reason
      # deploy-functions.yml gives.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false

      # READER_CLIENT_ID, not CLIENT_ID (T-728). This workflow reads and
      # changes nothing, so it runs as the read-only identity rather than the
      # one that can deploy code, write blobs and rewrite storage firewalls.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.READER_CLIENT_ID }}
          tenant-id: ${{ vars.TENANT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Are the functions registered?
        env:
          APP: func-site-prod-cus-01
          RG: rg-web-site-prod-cus
          # Empty when the variable is unset, which skips the firewall probes
          # rather than failing the monitor on a missing name (T-713).
          STOR: ${{ vars.FUNCTIONS_STORAGE_ACCOUNT }}
          # Read-only, by the job's permissions: the deploy run history and
          # the inventory at the commit it deployed.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail

          report=$(mktemp)
          err=$(mktemp)
          warnings=$(mktemp)
          failed=0

          # probe() IS CALLED INSIDE $( ), so its stdout is the return value and
          # NOTHING ELSE may be written there. An earlier draft echoed the
          # ::warning:: from in here; the warning text became part of the
          # captured value, the token comparisons below stopped matching, and a
          # denial rendered as a HEALTHY function count. Caught by
          # scratch-testing against a mocked az, not by review. Warnings are
          # stashed and emitted after the substitutions instead.
          #
          # --only-show-errors keeps az's extension warnings out of stderr, so
          # the classifier reads the error and not a warning in front of it
          # (#229).
          probe() {   # $1 = label, $2... = az args
            local label="$1"; shift
            local out reason
            if out=$("$@" --only-show-errors 2>"$err"); then
              printf '%s' "$out"
              return 0
            fi
            reason=$(tr -d '\r' < "$err" | tr '\n' ' ' | cut -c1-200)
            # An authorization failure is NOT an outage. Saying so is the whole
            # difference between a useful page and a distrusted one.
            case "$(tr -d '\r' < "$err" | tr '\n' ' ')" in
              *AuthorizationFailed*|*does\ not\ have\ authorization*|*Forbidden*)
                printf '%s\t%s\n' "$label" "NOT AUTHORIZED — $reason" >> "$warnings"
                printf 'UNAUTHORIZED' ;;
              *)
                printf '%s\t%s\n' "$label" "$reason" >> "$warnings"
                printf 'ERROR' ;;
            esac
            return 1
          }

          # Registration, by name (PLAT-2, #962). The listing goes through
          # probe() exactly as the count did, so UNAUTHORIZED and ERROR keep
          # their meaning. regstatus: 0 every expected function registered,
          # 1 some missing (named in regout), 2 the comparison could not run
          # (regout says why), 3 the listing itself failed.
          read_registration() {
            names=$(probe "function list" \
              az functionapp function list -n "$APP" -g "$RG" --query "[].name" -o tsv) || true
            case "$names" in
              UNAUTHORIZED|ERROR)
                regstatus=3
                regout="$names" ;;
              *)
                regstatus=0
                regout=$(printf '%s\n' "$names" | node scripts/check-registered-functions.mjs --deployed) || regstatus=$? ;;
            esac
          }

          # A run can land in the minute a deploy swaps the package, while
          # registration is partial and recovering. So "missing" is read twice
          # more, a minute apart, before it is believed. It costs nothing when
          # everything is registered and two minutes when something is not.
          read_registration
          for reread in 1 2; do
            [ "$regstatus" -eq 1 ] || break
            echo "registration read ${reread}: ${regout%%$'\n'*}; reading again in 60 s in case a deploy is mid-swap"
            sleep 60
            read_registration
          done

          # Orphaned per-run access windows (#1050). winstatus: 0 none, 1 some
          # orphaned (named in winout), 2 the script could not judge them, 3
          # the listing itself failed. An orphan is read once more, a minute
          # later, before it is believed: a run may be closing its window.
          read_windows() {
            restrictions=$(probe "access restrictions" \
              az functionapp config access-restriction show -n "$APP" -g "$RG" -o json) || true
            case "$restrictions" in
              UNAUTHORIZED|ERROR)
                winstatus=3
                winout="$restrictions" ;;
              *)
                winstatus=0
                winout=$(printf '%s' "$restrictions" | node scripts/check-ci-access-windows.mjs) || winstatus=$? ;;
            esac
          }

          read_windows
          if [ "$winstatus" -eq 1 ]; then
            echo "access windows: ${winout%%$'\n'*}; reading again in 60 s in case a run is closing its own"
            sleep 60
            read_windows
          fi

          webjobs=$(probe "AzureWebJobsStorage" \
            az functionapp config appsettings list -n "$APP" -g "$RG" \
              --query "[?name=='AzureWebJobsStorage'] | length(@)" -o tsv) || true

          writer=$(probe "RUNTIME_CONFIG_WRITER" \
            az functionapp config appsettings list -n "$APP" -g "$RG" \
              --query "[?name=='RUNTIME_CONFIG_WRITER'].value | [0]" -o tsv) || true

          # T-713. deploy-functions.yml opens this account to the runner for
          # the package upload and closes it in an always() step — which does
          # NOT run on runner loss, infrastructure failure, or a force-cancel.
          # In those cases the host's secret repository stays network-open with
          # only Entra data-plane auth left, and nothing noticed: this workflow
          # checked function count and app settings but never firewall posture.
          # Two probes, because the window has two halves and either can be
          # orphaned on its own.
          if [ -n "${STOR:-}" ]; then
            netaction=$(probe "storage default action" \
              az storage account show -n "$STOR" -g "$RG" \
                --query "networkRuleSet.defaultAction" -o tsv) || true

            # The temporary allow-rules are named ci-deploy-scm-* / ci-smoke-*
            # after the runner IP, so any that survive name a run that died.
            cirules=$(probe "leftover CI firewall rules" \
              az storage account network-rule list -n "$STOR" -g "$RG" \
                --query "length(ipRules)" -o tsv) || true
          fi

          # Outside every substitution, so the annotations reach the run without
          # contaminating a captured value.
          while IFS=$'\t' read -r wlabel wreason; do
            echo "::warning title=${wlabel}::${wreason}"
          done < "$warnings"

          {
            echo "## Function registration"
            echo
            echo "\`$APP\` in \`$RG\`, checked $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "| Check | Value | Healthy |"
            echo "| --- | ---: | :---: |"
          } >> "$report"

          # Registered functions against the deployed commit's expected set.
          # Line 1 of the script's output is the cell; the rest is the detail
          # printed under the table, which names every missing function.
          regcell=${regout%%$'\n'*}
          case "$regstatus" in
            0) echo "| Registered functions | $regcell | ✅ |" ;;
            1) echo "| Registered functions | **$regcell** | ❌ |"; failed=1 ;;
            *) echo "| Registered functions | \`$regcell\` | ⚠️ |"; failed=1 ;;
          esac >> "$report"

          # AzureWebJobsStorage present means the azurerm write came back and
          # the host is preferring a connection string with an empty account
          # key — the mechanism behind the incidents, documented beside the
          # azapi strip pair in infra/main.tf. Expected count is 0.
          if [ "$webjobs" = "0" ]; then
            echo "| \`AzureWebJobsStorage\` present | 0 | ✅ |" >> "$report"
          elif [ "$webjobs" = "UNAUTHORIZED" ] || [ "$webjobs" = "ERROR" ]; then
            echo "| \`AzureWebJobsStorage\` present | \`$webjobs\` | ⚠️ |" >> "$report"
            failed=1
          else
            echo "| \`AzureWebJobsStorage\` present | **$webjobs** | ❌ |" >> "$report"
            failed=1
          fi

          # Should read azapi-strip. `azurerm` means the strip did not complete
          # and the app is running on the first write.
          if [ "$writer" = "azapi-strip" ]; then
            echo "| \`RUNTIME_CONFIG_WRITER\` | azapi-strip | ✅ |" >> "$report"
          elif [ "$writer" = "UNAUTHORIZED" ] || [ "$writer" = "ERROR" ]; then
            echo "| \`RUNTIME_CONFIG_WRITER\` | \`$writer\` | ⚠️ |" >> "$report"
            failed=1
          else
            echo "| \`RUNTIME_CONFIG_WRITER\` | **${writer:-unset}** | ❌ |" >> "$report"
            failed=1
          fi

          # Firewall posture (T-713). Skipped entirely when STOR is unset, so
          # an unconfigured variable does not manufacture a failure.
          if [ -n "${STOR:-}" ]; then
            if [ "$netaction" = "Deny" ]; then
              echo "| Host storage default action | Deny | ✅ |" >> "$report"
            elif [ "$netaction" = "UNAUTHORIZED" ] || [ "$netaction" = "ERROR" ]; then
              echo "| Host storage default action | \`$netaction\` | ⚠️ |" >> "$report"
              failed=1
            else
              # Allow means a deploy opened the window and never closed it.
              echo "| Host storage default action | **${netaction:-unset}** | ❌ |" >> "$report"
              failed=1
            fi

            if [ "$cirules" = "0" ]; then
              echo "| Leftover CI firewall rules | 0 | ✅ |" >> "$report"
            elif [ "$cirules" = "UNAUTHORIZED" ] || [ "$cirules" = "ERROR" ]; then
              echo "| Leftover CI firewall rules | \`$cirules\` | ⚠️ |" >> "$report"
              failed=1
            else
              echo "| Leftover CI firewall rules | **$cirules** | ❌ |" >> "$report"
              failed=1
            fi
          fi

          # Per-run access windows on the Function App (#1050).
          wincell=${winout%%$'\n'*}
          case "$winstatus" in
            0) echo "| Orphaned \`ci-*\` access windows | $wincell | ✅ |" ;;
            1) echo "| Orphaned \`ci-*\` access windows | **$wincell** | ❌ |"; failed=1 ;;
            *) echo "| Orphaned \`ci-*\` access windows | \`$wincell\` | ⚠️ |"; failed=1 ;;
          esac >> "$report"

          # The registration detail under the table: which expected set, and
          # every missing function by name and trigger.
          regdetail=${regout#"$regcell"}
          if [ -n "${regdetail//[[:space:]]/}" ]; then
            printf '\n%s\n' "${regdetail#$'\n'}" >> "$report"
          fi

          # Each orphaned window by name, its site and why, under the table.
          windetail=${winout#"$wincell"}
          if [ -n "${windetail//[[:space:]]/}" ]; then
            printf '\n%s\n' "${windetail#$'\n'}" >> "$report"
          fi

          # A run where nothing could be read is a broken check, not an outage,
          # and must not be reported as one. Counted rather than pattern-matched
          # over the concatenation, which got mixed results wrong.
          unreadable=0
          for v in "$names" "$webjobs" "$writer"; do
            case "$v" in UNAUTHORIZED|ERROR) unreadable=$((unreadable + 1)) ;; esac
          done

          {
            echo
            if [ "$failed" -eq 0 ]; then
              echo "Every expected function is registered, the host is not running on an \`azurerm\`-written config, and no \`ci-*\` access window outlived its run."
            elif [ "$unreadable" -eq 3 ]; then
              echo "**This check could not read anything, so the platform's state is unknown.** That is a broken check, not an outage — do not read it as one. Every row failed the same way, which points at the identity rather than at the Function App: \`Reader\` on \`rg-web-site-prod-cus\` is what \`az functionapp function list\` needs, and \`HCW Function Settings Reader\` is what \`config appsettings list\` needs (\`infra/oidc.tf\`, T-728). Confirm both grants are applied before trusting or distrusting this workflow."
            else
              echo "**Investigate.** An expected function that is not registered, an \`AzureWebJobsStorage\` setting that exists, or a \`RUNTIME_CONFIG_WRITER\` other than \`azapi-strip\` is the condition behind the 2026-08-20 and 2026-08-21 incidents: the host answers, functions are not registered, and routes return 404 or timers silently stop — which no alert rule in \`observability.tf\` detects."
              echo
              echo "When the \`AzureWebJobsStorage\` or \`RUNTIME_CONFIG_WRITER\` row is ❌, the repair is to re-apply \`infra/\` so the azapi strip runs again. **Do not delete the setting by hand** — that hides the regression from the assertion in \`deploy-functions.yml\`. When only the registration row is ❌, the strip is intact and the named functions failed to register on their own: their module's startup error is in the host log. See *The failure with no alert* in \`docs/runbooks/alerting-and-support.md\` (https://docs.hybridcloudworks.com/runbooks/alerting-and-support/)."
              echo
              echo "When the \`ci-*\` access windows row is ❌, a run that opened a one-host window on the Function App ended without closing it, and that address can still reach the origin past the Cloudflare lock. Each orphan is listed above with its run and the exact command that removes it. This monitor only reads, so removing it stays a person's decision: read the rule and its run again first, because a re-run keeps its run id and reopens the same window."
              echo
              echo "A ⚠️ row means the check could not run, not that the platform is down. An authorization failure is not an outage."
            fi
          } >> "$report"

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

          exit "$failed"
