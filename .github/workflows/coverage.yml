# Test coverage for frontend/ and functions/, uploaded to Qlty (#568).
#
# NOT A REQUIRED CHECK, and it must not become one. The required contexts on
# the `main` ruleset are the jobs in ci.yml (`frontend`, `functions (azure)`
# and the rest) and they still run `npm test` with no instrumentation, so this
# workflow adds no time to them: it runs beside them, on the same triggers.
# Because it is not required, the T-523 doctrine in ci.yml (no `paths:` on a
# required workflow's pull_request trigger) does not bind it; it still runs
# on every pull request so Qlty has a coverage report for every head it
# compares.
#
# Coverage configuration lives with each package's tests
# (frontend/vitest.config.js, functions/vitest.config.js). Both write
# coverage/lcov.info with repository-relative paths (`frontend/src/...`,
# `functions/src/...`), so one upload carries both packages and Qlty needs no
# add-prefix or strip-prefix.
#
# NO STORED TOKEN. The upload authenticates to Qlty with GitHub OIDC
# (`oidc: true`, `id-token: write` on this job only), so there is no
# QLTY_COVERAGE_TOKEN to store, rotate or leak — the same federated-first rule
# as every Azure login in this repository (docs/standards/variables-and-secrets.md).
# Pull requests from forks cannot mint an OIDC token, so for those the tests
# still run and the upload is skipped with a notice.

name: Coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # the checkout, nothing more

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage (qlty)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # the checkout, nothing more
      # Only for the Qlty OIDC upload; nothing else in the job requests a token.
      id-token: write # the Qlty OIDC upload; nothing else here requests a token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Two Node.js lines in one job, each package on the line it runs on
      # (scripts/version-floors.json, #715): the frontend on the newest, 26,
      # and functions on 24, the newest Azure Functions Flex Consumption
      # supports. The second setup-node puts 24 first on PATH for the steps
      # after it.
      - name: Set up Node.js 26 for the frontend
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          # No npm cache (#563): a job that runs on pull requests must not
          # restore a cache another run could have written. setup-node v5+
          # caches automatically unless told not to.
          package-manager-cache: false

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Set up Node.js 24 for functions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false # the same reason as above (#563)

      - name: Install functions
        working-directory: functions
        run: npm ci

      - name: Functions tests with coverage
        working-directory: functions
        run: npm run test:coverage

      - name: Note a fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice title=Coverage not uploaded::Pull requests from forks cannot mint the OIDC token Qlty needs. Tests ran and coverage was generated; the upload was skipped."

      - name: Upload coverage to Qlty
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          format: lcov
          files: |
            frontend/coverage/lcov.info
            functions/coverage/lcov.info
