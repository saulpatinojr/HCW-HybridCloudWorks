# Build-and-test gate for pull requests.
#
# This is deliberately NOT a delivery workflow: it uses no secrets, no cloud
# credentials, and no OIDC. It only installs, builds, and runs unit tests, so
# it is safe to run on every pull request.
#
# It exists because dependency pull requests previously had nothing validating
# them — `npm ci` alone catches the most common failure mode, a package.json
# and package-lock.json that disagree.
#
# WHY THE pull_request TRIGGER IS NOT PATH-FILTERED — the T-523 doctrine,
# stated in full in iac-validate.yml: every job here is a required context on
# the `main` ruleset, and a required context whose workflow was filtered out
# is never auto-satisfied — the pull request waits on "Expected" forever. So
# the trigger fires on every pull request and THE FILTERING LIVES INSIDE each
# job: it diffs against the base, and when the component's own tree (and the
# out-of-tree files its tests actually read) did not change, the expensive
# steps skip while the job still completes and posts its context. Each
# matrix row's `filter` regex names that dependency set — the out-of-tree
# entries are real test-time reads (functions tests assert against infra/
# Terraform source and .azure/api-surface.json; scripts tests pin
# .github/workflows contracts and scan infra/ Terraform source, roles
# included), not caution.
#
# Do not re-add `paths:` to `pull_request` without first removing these
# contexts from the ruleset, in that order.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    # All CI runs use GitHub-hosted runners. No alternate runner infrastructure
    # is provisioned or selected. Every job in every workflow names the
    # Ubuntu release, never ubuntu-latest, which GitHub moves on its own
    # schedule: scripts/version-floors.test.mjs holds each runs-on to the
    # runners ceiling in scripts/version-floors.json, and the weekly
    # update-version-floors.yml moves that ceiling when GitHub makes the next
    # LTS generally available.
    runs-on: ubuntu-26.04
    strategy:
      # One package failing should not mask the state of the others.
      fail-fast: false
      matrix:
        include:
          # The lab-image and vps-agent paths are what the Landing Zone
          # Builder's lab tests read (#672): labImage.test.js holds the
          # builder's vendored-module list to lab-image's Dockerfile and
          # versions.env, and labPayload.test.js unpacks the payload with the
          # agent's own tar parser. The two functions paths are the visitor
          # report: LzLabValidate.test.jsx renders what the server's own
          # builder makes of the owner's real job logs. The two lab-host
          # files are what the lab pane's tests read: catalogue.test.js holds
          # the sign-in path and the launcher's path to the coder route and
          # the workspace names to the launcher's map, and
          # LabPanePage.test.jsx holds its states to the launcher's. The rss
          # path is the news feed list the server reads: providerFeeds.test.js
          # holds the frontend's copy to it, and HomePage.hubs.test.jsx holds
          # each home page hub's feed count to it. The decision-center and
          # content-status paths are the Decision Center's links and the review
          # statuses: itemLinks.test.js holds lib/itemLinks.js, every deep link
          # and the Frameworks hub's review set to them, and
          # decisionCenterModel.test.js holds the tabs to the API's categories.
          - name: frontend
            dir: frontend
            filter: '^(frontend/|\.azure/api-surface\.json|lab-image/(versions\.env|Dockerfile)$|vps-agent/lib/docker-runner\.js$|functions/src/lib/(labs/(visitor-report\.js|fixtures/[^/]+\.log)|rss/feeds\.js|decision-center/(links|items)\.js|cms/(content-status|content-update-validation)\.js|addons/registry\.js|ai/(router|model-catalog|usage|mcp-policy)\.js|health/(status-model|probe-catalogue|pulse-checks)\.js)$|lab-host/(coder/launcher/launcher\.js|coder/templates/hcw-lab/main\.tf|ansible/roles/coder/templates/10-coder\.caddy\.j2)$)'
            lint: npm run lint
            format: npm run format:check
            build: npm run build
            test: npm test
          # Node.js 24, not 26: Azure Functions Flex Consumption runs 22 and
          # 24 only, so the tests run on the line production runs. Every other
          # row takes the step's default, the newest line. Both are held there
          # by scripts/version-floors.json (#715). docs/content/blog-*.md is
          # here because tests read those files: content-modules.test.js reads
          # blog-machine.md, and repo-draft.test.js requires the lab articles
          # to stay importable into the review queue. The first three frontend
          # files are the pages that word the public routes' codes themselves:
          # public-visitor-copy.test.js and public-lock.test.js read them, so a
          # code the server answers can never go unmapped on the page. The next
          # two are the admin copies of server allowlists (the default-cover
          # providers and the image-prompt pages): docker-cms.test.js holds
          # them to the server's lists (#775). api.js is the browser's timeout
          # table: sync-budgets.test.js holds the server's AI time budgets
          # under it, so a shorter client timeout cannot land unchecked. The
          # last three are the admin provider list and the provider registry
          # it is built from, which docker-cms.test.js holds to
          # normalizeProviderName, and the submission pages, whose provider
          # lists submissions.test.js holds the API's contract to. The
          # dashboard's decisionCenterModel.js is where each Decision Center
          # source's list lives: decision-center.test.js holds every source to it.
          # sourceUrl.js is what source-episode.test.js imports, and onboard.yml
          # is what estate.test.js reads for the guest configuration toggle.
          - name: functions (azure)
            dir: functions
            node-version: '24'
            filter: '^(functions/|\.azure/api-surface\.json|infra/|docs/content/blog-[a-z0-9-]+\.md$|lab-host/ansible/roles/arc/tasks/onboard\.yml$|frontend/src/(pages/tools/landingZone/labValidateRules\.js$|pages/tools/explain/ExplainControl\.jsx$|lib/(turnstile|api|providers|sourceUrl)\.js$|components/admin/(platform-settings/settingShared\.jsx$|dashboard/decisionCenterModel\.js$)|pages/admin/ImagePromptsPage\.jsx$|config/admin\.js$|pages/submissions/[A-Za-z]+SubmissionPage\.jsx$))'
            lint: npm run lint
            test: npm test
          # The out-of-tree entries after infra/ are what
          # version-floors.test.mjs reads (#715): every package.json and
          # Dockerfile, the lab host's and the lab image's pins, and every
          # Terraform root's required_version. The three landing zone files
          # are what lab-image-avm-vendoring.test.mjs imports: the builder's
          # pins, and its port of the image's rewrite rule. The vps-agent
          # files are what lab-job-types.test.mjs imports (capabilities.js)
          # and lab-job-limits.test.mjs reads (index.js, .env.example) or
          # imports for the stop budget (shutdown.js, which imports
          # docker-runner.js; LAB-13) and for the maintenance hold
          # (maintenance-hold.js; LAB-13), and what lab-host-docker-proxy.test.mjs
          # imports to hold the agent's Docker proxy to the argv a job really
          # sends (docker-runner.js, capabilities.js; LAB-5).
          # LabPanePage.jsx is what lab-host-visitor-copy.test.mjs reads: the
          # lab host's "Coder stopped" answer, and the lab launcher's, is the
          # pane's own sentence. catalogue.js is what
          # lab-host-launcher.test.mjs reads: the launcher's workspace names
          # are the catalogue's. function-inventory.json is what
          # check-registered-functions.test.mjs parses with the script the
          # deploy and the registration monitor run (PLAT-2).
          # BuildingImagesPage.jsx and AddOnPanePage.jsx are read by supply-chain
          # and visitor-copy tests.
          - name: scripts (operations)
            dir: scripts
            filter: '^(scripts/|\.github/workflows/|infra/|infra-lab/|lab-host/|lab-image/|(TODO|CHANGELOG)\.md$|([^/]+/)*package\.json$|([^/]+/)*Dockerfile|frontend/src/lib/landingZone/(avmVersions|labImage|tfConstraints)\.js$|frontend/src/(pages/shared/LabPanePage\.jsx|pages/tools/AddOnPanePage\.jsx|pages/docker/BuildingImagesPage\.jsx|data/labs/catalogue\.js)$|vps-agent/(index\.js|\.env\.example|lib/(capabilities|docker-runner|shutdown|maintenance-hold)\.js)$|functions/(function-inventory\.json$|src/(lib/(labs|rss/feeds)\.js|functions/(schedulers|jobs-sweeper)\.js)$))'
            lint: npm run lint
            test: npm test
          # vps-agent shells out to `docker run` with a payload that reached
          # the host from the platform API, and its sandbox flag list is the
          # entire security boundary. Until T-743 this row ran `npm ci` and
          # nothing else, so an edit dropping `--network none` shipped green.
          # The suite uses node:test — no dependency, which keeps this
          # package's single-dependency lockfile intact.
          # group_vars/all.yml and hcw-labs-agent.service.j2 are read by
          # applied-commit.test.js and log.test.js.
          - name: vps-agent
            dir: vps-agent
            filter: '^(vps-agent/|lab-host/ansible/(group_vars/all\.yml|roles/labs_agent/templates/hcw-labs-agent\.service\.j2)$)'
            test: npm test
          - name: edge (availability probe)
            dir: edge/availability-probe
            filter: '^edge/'
            test: npm test

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      # fetch-depth: 0 so the change detection below can diff against the base
      # commit — same reasoning as iac-validate.yml: a shallow clone fails the
      # diff rather than returning "no changes".
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Non-pull_request events (the push to main) run everything: a merge is
      # exactly when the full matrix should confirm the combined result.
      - name: Detect component changes
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: ${{ matrix.filter }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first: `set -e` is inert inside an `if`
          # condition, so a failed diff (an unfetchable base sha) would read
          # as "no changes" and silently skip required work. A diff that
          # cannot be computed fails toward running everything.
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          if grep -qE "${FILTER}"'|^\.github/workflows/ci\.yml$' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "component files changed — running all checks"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — skipping checks, still reporting this context"
          fi

      # A row's own node-version wins; a row without one gets the newest
      # line, so a new row cannot fall back to whatever the runner ships.
      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true' || matrix.name == 'scripts (operations)'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version || '26' }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      # On every pull request, whatever it touches, so outside the filter. A
      # repository transfer changes no file, so the pull request that has to
      # catch one is as likely to be docs-only as anything (Copilot review on
      # #1001). It needs Node and nothing from npm ci. The why is in
      # scripts/check-oidc-owner.mjs; oidc-subjects.test.mjs keeps this step
      # outside the filter.
      - name: OIDC subjects name this repository
        if: matrix.name == 'scripts (operations)'
        run: node check-oidc-owner.mjs

      # Outside the filter for the same reason: a pull request that brings
      # back the former organisation's GitHub address can touch any path, and
      # that address keeps working through GitHub's redirect, so nothing else
      # fails (#1009). Needs Node and nothing from npm ci; the why is in
      # scripts/check-repo-owner-urls.mjs, and its test keeps this step here.
      - name: No URL names the repository's former owner
        if: matrix.name == 'scripts (operations)'
        run: node check-repo-owner-urls.mjs

      # `npm ci` is the point of this job for packages with no tests: it fails
      # when the lockfile is out of sync with package.json, which is exactly
      # how a bad dependency bump shows up.
      - name: Install (lockfile-strict)
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      # Lint and format run before the build so style feedback arrives fast.
      # `npm run lint` exits non-zero only on errors, not warnings, so the 19
      # pre-existing warnings do not fail the job.
      - name: Lint
        if: steps.changes.outputs.relevant == 'true' && matrix.lint != ''
        env:
          COMMAND: ${{ matrix.lint }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Format check
        if: steps.changes.outputs.relevant == 'true' && matrix.format != ''
        env:
          COMMAND: ${{ matrix.format }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Build
        if: steps.changes.outputs.relevant == 'true' && matrix.build != ''
        env:
          COMMAND: ${{ matrix.build }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Test
        if: steps.changes.outputs.relevant == 'true' && matrix.test != ''
        env:
          COMMAND: ${{ matrix.test }}
        run: bash -eo pipefail -c "$COMMAND"

  # The browser suites (frontend/e2e). Until 2026-10-06 nothing ran them: the
  # hydration, console-error and smoke specs had real assertions and executed
  # only when someone remembered, and the admin spec could not fail (estate
  # review, finding QA-1). This job is NOT a required check: it is a signal
  # for two weeks first, then the hydration spec becomes required in the
  # ruleset. The build is the same `npm run build` the frontend row runs;
  # `vite preview` serves it and the suites run against it on desktop Chrome
  # and a Pixel 5.
  #
  # Only the hydration and admin specs run here. The first run (PR #899)
  # showed why: the console-error and smoke specs assert a clean console on
  # the public pages, and a pull-request build has no API origin
  # (VITE_AZURE_FUNCTIONS_URL is unset, and pointing it at the Function App
  # from 127.0.0.1 fails CORS), so every public page logs "Public data fetch
  # failed" and 32 of 70 cases failed on the environment, not the code. Those
  # two specs need the deployed site, which is the post-deploy probe the
  # review's PLAT-5 item describes for deploy-azure-frontend.yml. The
  # contrast spec (66 axe runs) stays out until its runtime is measured.
  #
  # The admin journey signed in (admin-authenticated.spec.js, 2026-10-07)
  # runs here too, against the placeholder identity the Build step sets:
  # the callback landing on the route asked for, the denial and
  # configuration cards, one re-authentication on an expired token, and the
  # Pixel 5 drawer on four admin routes. All three specs together took 100 s
  # on one worker locally; the acceptance is a job under eight minutes.
  e2e:
    name: e2e (playwright, not required)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile-strict)
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Placeholder identity and API settings, so the signed-in admin journey
      # (e2e/admin-authenticated.spec.js) can run with no tenant and no
      # secret: GUIDs no directory issued, an `api://` resource that does not
      # exist, and the same-origin `/api` base. They are ordinary build
      # variables, not a test switch; the spec's fixture answers
      # login.microsoftonline.com and `/api` with page.route(), so nothing
      # leaves the runner. This step and playwright.config.js's local
      # webServer are the only places they are set (one list, in
      # e2e/fixtures/stub-build-env.js, which this must match); no deploy
      # builds with them. QA-1, AP-F1.
      - name: Build
        working-directory: frontend
        env:
          VITE_ENTRA_CLIENT_ID: e2e00000-0000-4000-8000-00000000c11e
          VITE_ENTRA_TENANT_ID: e2e00000-0000-4000-8000-0000000071d0
          VITE_ENTRA_API_SCOPE: api://e2e-hcw-api/access_as_admin
          VITE_AZURE_FUNCTIONS_URL: /api
        run: npm run build

      # The preview server is started here rather than by Playwright's
      # webServer so the build above is reused and a server that fails to
      # start fails this step, by name, instead of every test.
      - name: Serve the build
        working-directory: frontend
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "${RUNNER_TEMP}/preview.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sSf -o /dev/null http://127.0.0.1:4173/; then
              echo "preview answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview did not answer within 60s"
          cat "${RUNNER_TEMP}/preview.log"
          exit 1

      - name: Run the browser suites
        working-directory: frontend
        env:
          TEST_BASE_URL: http://127.0.0.1:4173
          CI: 'true'
        run: npx playwright test --project=chromium --project=mobile-chrome hydration.spec.js contentforge.spec.js admin-authenticated.spec.js

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # lab-host/ansible/ is the configuration management for the Hostinger lab
  # host (#662). ansible-lint's production profile is the gate, and the
  # playbook syntax check runs beside it because they fail on different
  # things: lint reads files, syntax-check loads the play with its roles and
  # collections. Same in-job change detection as the matrix above; the tool
  # versions are pinned to what lab-host/bootstrap.sh installs on the host.
  ansible-lint:
    name: ansible-lint (lab-host)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: lab-host/ansible
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect lab-host changes
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first — same reasoning as the matrix job's
          # detect step: a failed diff must fail toward running, not skipping.
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # docker-runner.js too: hcw-labjob-sweep.test.sh checks the
          # sweep's label against the JOB_LABEL it exports, and a PR that
          # renamed only the label would otherwise skip that check.
          if grep -qE '^lab-host/|^\.github/workflows/ci\.yml$|^vps-agent/lib/docker-runner\.js$' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "lab-host files changed — running all checks"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — skipping checks, still reporting this context"
          fi

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install ansible-lint and ansible-core
        if: steps.changes.outputs.relevant == 'true'
        run: python -m pip install --disable-pip-version-check 'ansible-lint==26.9.0' 'ansible-core==2.21.4'

      - name: Install the pinned collections
        if: steps.changes.outputs.relevant == 'true'
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint (production profile)
        if: steps.changes.outputs.relevant == 'true'
        run: ansible-lint --profile production

      - name: Playbook syntax check
        if: steps.changes.outputs.relevant == 'true'
        run: ansible-playbook --syntax-check -i inventory/localhost.yml site.yml

      # Ansible never applies a default written only in a role's
      # meta/argument_specs.yml, and two coder options had theirs only
      # there, so the first run with coder_enabled true stopped undefined.
      # This fails on any option like that, or one whose defaults/main.yml
      # value disagrees with the spec.
      - name: Argument spec defaults are set
        if: steps.changes.outputs.relevant == 'true'
        run: python check-argument-spec-defaults.py

      # /usr/local/sbin/hcw-vault-set rewrites the host's Ansible vault, so
      # the file the vault_tools role installs is run here against a scratch
      # vault with this job's ansible-vault: two keys set, an empty value and
      # bad key names refused, the file left encrypted and root 0600. As root,
      # because the helper installs the vault root:root; env keeps this job's
      # Python on PATH past sudo's secure_path.
      - name: hcw-vault-set test
        if: steps.changes.outputs.relevant == 'true'
        run: sudo env "PATH=$PATH" bash roles/vault_tools/tests/hcw-vault-set.test.sh

      # /usr/local/sbin/hcw-coder-template-push is handed a token that can
      # publish templates, so the helper the coder role renders is rendered
      # here with the role's defaults (this job's Jinja2) and run against a
      # stub docker: the token in no argument and no output, only *.tf, the
      # lock file and the README copied, the copy removed, every failure
      # non-zero. Needs neither root nor Docker.
      - name: hcw-coder-template-push test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/coder/tests/hcw-coder-template-push.test.sh

      # /usr/local/libexec/hcw-coder-automation holds a Coder token that can
      # publish templates and mints the site's status token, so the file the
      # coder role installs is run as it ships against a fake Coder API, a
      # fake systemd-run and a fake site CLI: renewal only when due, the
      # read scopes plus user:read and nanosecond lifetimes, the clean-up's 48-hour
      # and newest-two rules, a token never in any output, state or report.
      # Needs neither root nor Docker.
      - name: hcw-coder-automation test
        if: steps.changes.outputs.relevant == 'true'
        run: python roles/coder/tests/hcw-coder-automation.test.py

      # The daily held-package report the hardening role installs (LAB-3,
      # #949), rendered with the role's defaults and run against stub
      # apt-mark, apt and logger: one daemon.warning line per held package
      # with an upgrade, the notice line when none, a failed run when apt
      # fails. Needs neither root nor Docker.
      - name: hcw-held-upgradable test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/hardening/tests/hcw-held-upgradable.test.sh

      # The nightly playbook drift detection timer (LAB-4, #950), rendered with
      # the role's defaults and run against stub ansible-playbook and logger:
      # runs the playbook in check and diff mode from the applied checkout,
      # detects task changes or errors, logs to syslog (warning on drift or error,
      # notice on clean), and exits non-zero on drift or failure.
      - name: hcw-playbook-drift test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/hardening/tests/hcw-playbook-drift.test.sh

      # The lab_images role and workspace image retention on skipped Coder template publication (#1134).
      - name: lab-images-role test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/lab_images/tests/lab-images-role.test.sh


      # The unattended-upgrades override (LAB-13, #959), rendered with the
      # role's defaults: the allowed origins are cleared and named by the
      # role, and the reboot is left to hcw-reboot-when-idle.timer.
      - name: unattended-upgrades test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/hardening/tests/unattended-upgrades.test.sh

      # The nightly idle reboot (LAB-13, #959), rendered with the role's
      # defaults and run against stub apt-config, loginctl, docker, sleep,
      # systemctl and logger: a stand-down while unattended-upgrades' own
      # reboot is on, no reboot without the marker, with a login session
      # (class user) open, with a lab job container up (created and not yet
      # started included) or with a Coder workspace up on the sandbox daemon,
      # none for lingering service managers, a failed run when apt-config,
      # loginctl or either docker daemon cannot answer, and, with new lab jobs
      # held, a wait for the labs agent's acknowledgement of the hold (none
      # when systemd says the agent is inactive or failed; the night deferred
      # when none comes, or one names another hold) and a second look that
      # defers for a job, a workspace or a login that appeared during the hold
      # (CodeRabbit on #1191); exactly one `systemctl reboot` when idle at
      # both looks, the hold kept only on that path, a stop exiting 143 as a
      # success, the age counted from the first sight across a rewritten
      # marker, an overdue deferral at err, the timer at the role's hour, and
      # the hold and acknowledgement paths, the agent's unit, the sandbox
      # socket and both labels their owners'. Needs neither root nor Docker.
      - name: hcw-reboot-when-idle test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/hardening/tests/hcw-reboot-when-idle.test.sh

      # /usr/local/libexec/hcw-docker-volume-carry copies Coder's PostgreSQL
      # cluster into the daemon's user-namespaced data root on the run that
      # turns userns-remap on (LAB-5), so the file the docker role installs
      # is run here as it ships, against a tree shaped like that cluster:
      # owners shifted, modes and hard links kept, the source untouched, a
      # non-empty destination refused. As root, because it chowns.
      - name: hcw-docker-volume-carry test
        if: steps.changes.outputs.relevant == 'true'
        run: sudo bash roles/docker/tests/hcw-docker-volume-carry.test.sh

      # /usr/local/libexec/hcw-docker-stale-bridges deletes the bridges a
      # data-root switch leaves in the kernel, whose routes shadowed the live
      # Coder networks' on 2026-10-08. It deletes interfaces, so it is run as
      # it ships against stand-ins for docker and ip and a scratch data root
      # shaped like that host: the bridges the old root recorded go; live
      # ones, a just-created network, docker0, another program's bridge
      # named like Docker's and one with a port attached stay. No root needed.
      - name: hcw-docker-stale-bridges test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/docker/tests/hcw-docker-stale-bridges.test.sh

      # /usr/local/libexec/hcw-addons-egress-clear removes the addons role's
      # egress rules from DOCKER-USER before the role rebuilds them, behind a
      # reject it holds on the subnet until the rebuild is done. The inline
      # pipeline it replaced failed on an empty chain (the host's first run,
      # 2026-10-10), could not delete a rule whose comment `iptables -S`
      # quotes, and left the subnet unfiltered while it ran. It reads what
      # iptables prints, so it runs here against real iptables, in a scratch
      # chain of its own, never Docker's. As root, because it writes iptables.
      - name: hcw-addons-egress-clear test
        if: steps.changes.outputs.relevant == 'true'
        run: sudo bash roles/addons/tests/hcw-addons-egress-clear.test.sh

      # The Caddyfile's per-name direct-visit redirect (ADR 0035) relies on
      # Caddy ordering every `vars` directive ahead of `redir` and letting a
      # route's later `vars` win for its name. Nothing but Caddy can say so:
      # this renders the Caddyfile and every conf.d route with this job's
      # ansible-core, has the pinned Caddy release (version from group_vars,
      # SHA-512 in the script) adapt it, and checks the order it settled on.
      # Needs neither root nor Docker.
      - name: Rendered Caddy configuration adapts, with the vars before the redir
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/caddy/tests/caddy-adapt.test.sh

      # /usr/local/libexec/hcw-docker-proxy-stale says whether the agent's
      # Docker socket proxy started before the daemon's current start, which
      # is a proxy holding the daemon's old socket (every forwarded call a
      # 503; the 2026-10-14 bootstrap). The labs_agent role restarts it on
      # that answer, so the answer is tested here against stand-ins for
      # systemctl and docker and the real GNU date. No root needed.
      - name: hcw-docker-proxy-stale test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/labs_agent/tests/hcw-docker-proxy-stale.test.sh

      # The agent's unit and env file (LAB-13, #959), rendered with the
      # role's values and this job's Jinja2: SIGTERM reaches the agent alone
      # (KillMode=mixed), the stop timeout is the 30 s that covers its
      # shutdown budget and two heartbeats, the env file carries that budget,
      # and OnFailure and Requires=docker.service stay. Needs neither root
      # nor Docker.
      - name: hcw-labs-agent unit test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/labs_agent/tests/hcw-labs-agent.service.test.sh

      # /usr/local/libexec/hcw-labjob-sweep, which the agent's unit runs as
      # root before the agent starts and after it exits, removes only
      # containers with the agent's job label, through the daemon's own
      # socket, and fails when Docker refuses (CodeRabbit on #1188). Run
      # against a stand-in for docker; needs neither root nor Docker.
      - name: hcw-labjob-sweep test
        if: steps.changes.outputs.relevant == 'true'
        run: bash roles/labs_agent/tests/hcw-labjob-sweep.test.sh

      # The lab agent's Docker socket proxy is HAProxy with a configuration
      # this repository writes (LAB-5). scripts/lab-host-docker-proxy.test.mjs
      # evaluates its rules; this renders it with this job's ansible-core and
      # has HAProxy itself parse it, at the image digest the host runs, so a
      # line HAProxy would refuse fails here rather than leaving the agent
      # without Docker on the host.
      - name: Agent Docker proxy configuration parses
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hcw-labs-agent-docker-proxy.cfg"
          ansible localhost -c local -e ansible_become=false -m ansible.builtin.template \
            -a "src=roles/labs_agent/templates/docker-proxy.haproxy.cfg.j2 dest=$out" \
            -e labs_agent_docker_proxy_socket=/run/hcw-labs-agent-docker/docker.sock \
            -e labs_agent_docker_proxy_gid=999 \
            -e labs_agent_tmp_dir=/var/lib/hcw-labs-agent/tmp
          digest="$(sed -n 's/^labs_agent_docker_proxy_image_digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' group_vars/all.yml)"
          test -n "$digest"
          docker run --rm --network none -v "$out:/usr/local/etc/haproxy/haproxy.cfg:ro" "haproxy@${digest}" \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Set up Node.js for the agent proxy run
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      # The same file, run: the proxy container as the labs_agent role runs
      # it (root with no capabilities, no network, read-only, the socket
      # given to one group) in front of this runner's Docker, and the
      # privilege_checks role's script driving it the way the host's
      # end-of-run check does: one shell-echo job through the agent's own
      # runInDocker, which must print its payload, then `docker ps` and a
      # privileged `docker run`, which must be refused. The parse above
      # cannot see whether the real docker CLI's calls pass; this does.
      - name: Agent Docker proxy passes a job and refuses the rest
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          gid="$(id -g)"
          socket_dir=/run/hcw-labs-agent-docker
          tmp_dir=/var/lib/hcw-labs-agent/tmp
          sudo install -d -o root -g "$gid" -m 0750 "$socket_dir"
          sudo install -d -o "$(id -u)" -g "$gid" -m 0750 "$tmp_dir"
          out="$RUNNER_TEMP/hcw-labs-agent-docker-proxy.run.cfg"
          ansible localhost -c local -e ansible_become=false -m ansible.builtin.template \
            -a "src=roles/labs_agent/templates/docker-proxy.haproxy.cfg.j2 dest=$out" \
            -e "labs_agent_docker_proxy_socket=$socket_dir/docker.sock" \
            -e "labs_agent_docker_proxy_gid=$gid" \
            -e "labs_agent_tmp_dir=$tmp_dir"
          digest="$(sed -n 's/^labs_agent_docker_proxy_image_digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' group_vars/all.yml)"
          docker run -d --name hcw-labs-agent-docker-proxy --user 0:0 --group-add "$gid" --cap-drop ALL \
            --security-opt no-new-privileges:true --read-only --network none \
            -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$out:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v "$socket_dir:$socket_dir" "haproxy@${digest}"
          for _ in $(seq 30); do [ -S "$socket_dir/docker.sock" ] && break; sleep 1; done
          # The proxy refuses pulls, as on the host, where lab_images pulls first.
          alpine="$(node --input-type=module -e "import('$GITHUB_WORKSPACE/vps-agent/lib/capabilities.js').then((m) => console.log(m.IMAGES.alpine))")"
          docker pull --quiet "$alpine"
          if ! DOCKER_HOST="unix://$socket_dir/docker.sock" TMPDIR="$tmp_dir" \
            node roles/privilege_checks/files/hcw-labs-agent-proxy-check.mjs "$GITHUB_WORKSPACE/vps-agent" 64m 0.5 32; then
            docker logs hcw-labs-agent-docker-proxy
            exit 1
          fi

  # lab-host/coder/ is the Coder deployment on the lab host (#679): the
  # Compose file, the hcw-lab workspace template and the test that holds
  # both to the ADR 0032 boundary (no service holding the host's socket,
  # the proxy holding the rootless sandbox daemon's, nothing privileged, no
  # host path, a workspace network of its own, uid 65534).
  # Four checks that fail on different things: node --test reads the two
  # files as text, `docker compose config` parses the Compose file, and
  # terraform fmt and validate parse the template with its pinned providers
  # and module. No npm install: the test uses node:test and nothing else.
  coder-template:
    name: coder (lab-host)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: lab-host/coder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect lab-host/coder changes
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          if grep -qE '^lab-host/coder/|^\.github/workflows/ci\.yml$' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "lab-host/coder files changed — running all checks"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — skipping checks, still reporting this context"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Template hardening test
        if: steps.changes.outputs.relevant == 'true'
        run: node --test

      - name: Compose file parses
        if: steps.changes.outputs.relevant == 'true'
        run: bash compose-config-check.sh

      - name: Setup Terraform
        if: steps.changes.outputs.relevant == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform fmt
        if: steps.changes.outputs.relevant == 'true'
        working-directory: lab-host/coder/templates/hcw-lab
        run: terraform fmt -recursive -check -diff

      - name: Terraform init (no backend)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: lab-host/coder/templates/hcw-lab
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        if: steps.changes.outputs.relevant == 'true'
        working-directory: lab-host/coder/templates/hcw-lab
        run: terraform validate -no-color

  # hooks/claude_event.py runs on every Claude Code session start and stop, and
  # tooling/workflow.py owns the state the Stop guard reads. Both were shipped
  # with nothing checking them. This is a smoke test rather than a linter on
  # purpose: the failure that matters is the round trip breaking, not style.
  harness:
    name: harness (python)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect harness changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first — same reasoning as the matrix job's
          # detect step: a failed diff must fail toward running, not skipping.
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          if grep -qE '^(hooks/|tooling/)|^\.github/workflows/ci\.yml$' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "harness files changed — running all checks"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — skipping checks, still reporting this context"
          fi

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Compile
        if: steps.changes.outputs.relevant == 'true'
        run: python -m compileall -q hooks tooling

      # The Stop guard's BLOCKING path. Everything below this step drives the
      # workflow tool; the only assertion this job ever made about the hook was
      # the fail-open one at the end, so a regression that stopped it blocking
      # would have been silent — and a guard that never fires is the failure
      # mode the guard exists to prevent. Runs against throwaway roots, so it
      # is safe here, before the steps that write and delete .agentic/.
      - name: Stop guard unit tests
        if: steps.changes.outputs.relevant == 'true'
        run: python -m unittest discover -s hooks -p 'test_*.py' -v

      - name: Workflow round trip
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python tooling/workflow.py init --mode selected --agents ci-probe \
            --optional-agents ci-probe --objective 'ci smoke' --workflow-id wf-ci-smoke
          python tooling/workflow.py validate --workflow wf-ci-smoke
          python tooling/workflow.py status --workflow wf-ci-smoke > /dev/null
          python tooling/workflow.py close --workflow wf-ci-smoke --reason 'ci smoke'
          # `empty`, not `completed` (T-741). ci-probe is not in the agent
          # registry, so it is unavailable and marked skipped_optional and
          # NOTHING RAN. This assertion used to demand `completed`, which
          # pinned the exact failure the tool exists to prevent: an audit
          # trail claiming work that never happened.
          test "$(python -c 'import json;print(json.load(open(".agentic/workflows/wf-ci-smoke/WORKFLOW.json"))["status"])')" = empty

      - name: Close refuses to fake a completed workflow
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          python tooling/workflow.py init --mode selected --agents ci-required \
            --objective 'ci dirty' --workflow-id wf-ci-dirty --enforce-stop
          if python tooling/workflow.py close --workflow wf-ci-dirty --reason 'should refuse'; then
            echo 'close accepted a workflow with missing handoffs'
            exit 1
          fi
          python tooling/workflow.py close --workflow wf-ci-dirty --reason 'ci dirty' --abandon
          test "$(python -c 'import json;print(json.load(open(".agentic/workflows/wf-ci-dirty/WORKFLOW.json"))["status"])')" = abandoned

      # The two scenarios above drive every node through the UNAVAILABLE-agent
      # branch, so `handoff_valid` and `scalar` — the parsing that decides
      # whether an agent's claimed work is real — were never called (T-742).
      # A regression in the frontmatter regex, the workflow/agent cross-check
      # or the evidence requirement passed CI green, and the Stop guard would
      # then release on a workflow carrying fabricated handoffs.
      #
      # No agent definition is committed (`.claude/agents/` is untracked), so
      # nothing here can be available by accident. This step manufactures one:
      # the file existing is the whole of what `installed_agents` checks, and
      # the registry entry is what `discover` matches it against. Both are
      # throwaway edits to an ephemeral checkout.
      - name: Handoff validator accepts real work and rejects fabricated work
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          mkdir -p .claude/agents
          cat > .claude/agents/ci-probe.md <<'AGENT'
          ---
          name: ci-probe
          description: Synthetic agent used only by this CI check. Never invoked.
          ---
          Its file existing is what makes the node available. Nothing runs it.
          AGENT
          cat >> tooling/agent-registry.yml <<'ENTRY'
            - id: ci-probe
              agent_name: ci-probe
              capability: "CI harness probe"
              enabled_by_default: true
          ENTRY

          python tooling/workflow.py init --mode selected --agents ci-probe \
            --objective 'ci handoff' --workflow-id wf-ci-handoff
          # The node must be AVAILABLE, or this step silently re-tests the
          # unavailable branch and proves nothing — which is the whole bug.
          python - <<'PY'
          import json, sys
          nodes = json.load(open('.agentic/workflows/wf-ci-handoff/WORKFLOW.json'))['nodes']
          if not (len(nodes) == 1 and nodes[0]['available']):
              sys.exit(f'ci-probe is not available; this step would prove nothing: {nodes}')
          PY

          write_handoff() {
            cat > .agentic/workflows/wf-ci-handoff/handoffs/ci-probe.yml
          }

          # 1. A well-formed handoff validates.
          write_handoff <<'HANDOFF'
          workflow_id: wf-ci-handoff
          agent_id: ci-probe
          status: completed
          summary: Synthetic handoff so the validator is exercised.
          next_action: none
          authorization_used: none
          evidence:
            - path: tooling/workflow.py
              note: the validator under test
          HANDOFF
          python tooling/workflow.py validate --workflow wf-ci-handoff

          # 2. An agent claiming another node's work is refused.
          sed -i 's/^agent_id: ci-probe/agent_id: someone-else/' \
            .agentic/workflows/wf-ci-handoff/handoffs/ci-probe.yml
          if python tooling/workflow.py validate --workflow wf-ci-handoff; then
            echo 'validate accepted a handoff whose agent_id does not match its node'
            exit 1
          fi

          # 3. "completed" with no evidence path is refused — the property that
          #    stops an agent claiming work it never did.
          write_handoff <<'HANDOFF'
          workflow_id: wf-ci-handoff
          agent_id: ci-probe
          status: completed
          summary: Claims completion, offers nothing.
          next_action: none
          authorization_used: none
          evidence:
          HANDOFF
          if python tooling/workflow.py validate --workflow wf-ci-handoff; then
            echo 'validate accepted a completed handoff carrying no evidence'
            exit 1
          fi

      - name: Stop hook stays fail-open without state
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          rm -rf .agentic .claude/agents
          echo '{}' | python hooks/claude_event.py --event Stop
