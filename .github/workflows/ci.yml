# Build-and-test gate for pull requests.
#
# This is deliberately NOT a delivery workflow: it uses no secrets and no
# cloud credentials. The one job that asks GitHub for an OIDC token (a
# short-lived proof of which workflow is running) is `coverage`, which runs
# only after a merge to `main` and uses the token to upload the coverage
# report to Qlty; nothing else here can mint one.
#
# It exists because dependency pull requests previously had nothing validating
# them — `npm ci` alone catches the most common failure mode, a package.json
# and package-lock.json that disagree.
#
# HOW THE JOBS ARE ARRANGED (#1545). One job, `gate`, at the end of this file
# is the check the `main` ruleset (the repository's merge rules) requires from
# this workflow. It waits for every other job and fails when any of them
# failed or was cancelled. A job that was skipped is fine: the change did not
# touch what that job tests. So each job runs only when it is needed, and the
# pull request still ends with one green `gate`.
#
# Which jobs are needed is decided by diffing the pull request against its
# base, in two places:
# - The `changes` job runs first and answers, once per filter, whether the
#   browser suites, the lab-host lint, the lab-host role tests, the Coder
#   template checks and the Python harness checks are needed. The `e2e`,
#   `ansible-lint`, `role-tests`, `coder-template` and `harness` jobs read its
#   answers in their `if:` and are skipped outright when the answer is no (no
#   runner is started).
#   Each of those filters also says whether a change to this file alone
#   (`WORKFLOW_SELF_TRIGGER`) counts: yes for the cheap lint-class jobs, so a
#   workflow edit still proves they run; no for the expensive ones (the
#   browser suites, the role tests, the Coder template checks), which read no
#   line of this file that a workflow edit could break and cost nine minutes
#   of runner each time it was tried (the owner's question on #1545,
#   2026-11-04). scripts/ci-workflow-steps.test.mjs pins which is which.
# - The `verify` matrix (frontend, functions, scripts, vps-agent, edge) keeps
#   its own detect step per row, because a matrix row cannot carry an `if:`
#   of its own: a row whose files did not change skips its install, build and
#   test steps and finishes in a few seconds.
# Each filter names the files the job's tests really read, not only the
# component's own folder: functions tests assert against infra/ Terraform
# source and .azure/api-surface.json, and scripts tests pin
# .github/workflows contracts. scripts/ci-filters.test.mjs checks that the
# matrix filters list every such file.
#
# WHY THE pull_request TRIGGER IS NOT PATH-FILTERED. `gate` is a required
# check, and a required check whose workflow never ran is never satisfied:
# the pull request waits on "Expected" forever (the T-523 doctrine, stated in
# full in iac-validate.yml, and ADR 0026). So the trigger fires on every pull
# request, and the filtering lives inside, as described above. A job skipped
# by its `if:` is different: GitHub still posts it, as "skipped", and counts
# it as passing (Troubleshooting required status checks on GitHub Docs,
# linked from docs/runbooks/required-checks.md).
#
# Do not add `paths:` to `pull_request`; `gate` would then be missing from
# every pull request the paths exclude.
#
# A push to `main` runs everything: every filter answers yes, the Qlty
# coverage upload runs, and `gate` confirms the combined result.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed, for the jobs below that have an `if:` of their own. One
  # checkout with history, then one detect step per filter; each writes
  # `relevant=true` or `relevant=false`, and the job's outputs carry the
  # answers to the jobs that `needs` it. Five more steps answer for the rows
  # of the verify job, and the last step builds that job's matrix from them.
  # The detect shell is the same in every step: scripts/ci-workflow-steps.test.mjs
  # runs each one with bash and checks that a filter grep cannot read fails
  # the step instead of switching the job off (#1428). On a push to `main`,
  # or when the diff cannot be computed, every answer is yes.
  #
  # In each step, grep's answer is kept, not tested in an `if`. grep -E
  # answers 0 when a changed file matches the filter, 1 when none does, and
  # 2 or more when it could not read the filter at all (an unclosed
  # parenthesis, say). `if grep …` takes every answer other than 0 as "no",
  # so a filter grep cannot read would switch the job off as "no relevant
  # change" while the pull request looked green (#1428). The answer is kept
  # instead, and anything other than 0 or 1 fails the step and names the
  # filter. The filter goes in brackets so that a stray backslash at its end
  # cannot join onto the `|` that adds ci.yml and so hide the mistake.
  #
  # WORKFLOW_SELF_TRIGGER, on each step: 'true' means a change to this file
  # alone is a reason to run the job; 'false' means it is not, and the step
  # takes this file out of the changed list before the filter sees it. The
  # grep line itself is the same in every step (the shape tests hold it so);
  # only the list it reads differs.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5 # a checkout, ten git diffs and the matrix
    outputs:
      e2e: ${{ steps.e2e.outputs.relevant }}
      ansible: ${{ steps.ansible.outputs.relevant }}
      roletests: ${{ steps.roletests.outputs.relevant }}
      coder: ${{ steps.coder.outputs.relevant }}
      harness: ${{ steps.harness.outputs.relevant }}
      # The verify job's matrix: its rows whose files changed, as JSON.
      verify: ${{ steps.verify.outputs.matrix }}
    steps:
      # fetch-depth: 0 so the diffs below can reach the base commit — a
      # shallow clone fails the diff rather than returning "no changes".
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # The browser suites (frontend/e2e is inside frontend/, so one prefix
      # covers the pages and the specs).
      - name: Detect frontend changes for the browser suites
        id: e2e
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^frontend/'
          # The browser suites read nothing in this file; 19 minutes of runner for a workflow edit.
          WORKFLOW_SELF_TRIGGER: 'false'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first: `set -e` is inert inside an `if`
          # condition, so a failed diff (an unfetchable base sha) would read
          # as "no changes" and silently skip required work. A diff that
          # cannot be computed fails toward running everything.
          changed="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # Unless this job wants a workflow-only change, this file is taken
          # out of the list before the filter reads it (see the job comment).
          if [ "${WORKFLOW_SELF_TRIGGER:-true}" != "true" ]; then
            changed="$(sed '\#^\.github/workflows/ci\.yml$#d' <<<"$changed")"
          fi
          # grep's answer is kept, not tested in an `if`: see the job comment for why
          # (#1428).
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/ci\.yml$' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "frontend files changed — running the browser suites"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — the browser suites are skipped"
          else
            echo "::error file=.github/workflows/ci.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      # The lint, the playbook syntax check and the argument-spec check read
      # lab-host/ansible/ and nothing else, so the filter is lab-host/ alone
      # (the paths the role tests read moved to the next step with them).
      - name: Detect lab-host changes
        id: ansible
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^lab-host/'
          # About a minute; a workflow edit that broke the lint's install lines should show here.
          WORKFLOW_SELF_TRIGGER: 'true'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first — same reasoning as the step above: a
          # failed diff must fail toward running, not skipping.
          changed="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # Unless this job wants a workflow-only change, this file is taken
          # out of the list before the filter reads it (see the job comment).
          if [ "${WORKFLOW_SELF_TRIGGER:-true}" != "true" ]; then
            changed="$(sed '\#^\.github/workflows/ci\.yml$#d' <<<"$changed")"
          fi
          # grep's answer is kept, not tested in an `if`: see the job comment for why
          # (#1428).
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/ci\.yml$' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "lab-host files changed — running the Ansible lint"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — the Ansible lint is skipped"
          else
            echo "::error file=.github/workflows/ci.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      # The role tests (the `role-tests` job): the roles, with their tasks,
      # templates, defaults and tests, the group_vars the tests render with,
      # and the inventory the syntax check and tests load. The rest are the
      # files the tests assert on outside lab-host/ansible/, each named in
      # ROLE_TEST_READS in scripts/ci-workflow-steps.test.mjs with the test
      # that reads it: lab-host/coder/ (the templates' workspace label and
      # image digest, the Compose file), lab-host/bootstrap.sh and
      # lab-host/README.md (the install paths and the owner's lines),
      # infra/lab-hybrid.tf and infra-lab/variables.tf (the data collection
      # rule's facilities and the lab zone), docs/runbooks/labs-host.md (the
      # Coder lines, #954), docker-runner.js (the sweep's JOB_LABEL),
      # capabilities.js (the image the proxy run pulls) and
      # report-host-check.js (the CLI the portainer helper is configured with).
      - name: Detect lab-host role changes
        id: roletests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^lab-host/(ansible/(roles|group_vars|inventory)/|coder/|bootstrap\.sh$|README\.md$)|^infra/lab-hybrid\.tf$|^infra-lab/variables\.tf$|^docs/runbooks/labs-host\.md$|^vps-agent/lib/(docker-runner|capabilities)\.js$|^vps-agent/bin/report-host-check\.js$'
          # Nine minutes of runner, and no test reads this file (the one that
          # did, hcw-portainer-check.test.py, hands that check to
          # scripts/ci-workflow-steps.test.mjs since 2026-11-04).
          WORKFLOW_SELF_TRIGGER: 'false'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          changed="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # Unless this job wants a workflow-only change, this file is taken
          # out of the list before the filter reads it (see the job comment).
          if [ "${WORKFLOW_SELF_TRIGGER:-true}" != "true" ]; then
            changed="$(sed '\#^\.github/workflows/ci\.yml$#d' <<<"$changed")"
          fi
          # grep's answer is kept, not tested in an `if`: see the job comment for why
          # (#1428).
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/ci\.yml$' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "lab-host role files changed — running the role tests"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — the role tests are skipped"
          else
            echo "::error file=.github/workflows/ci.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      - name: Detect lab-host/coder changes
        id: coder
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^lab-host/coder/'
          # Two minutes of Terraform init and validate that read nothing here.
          WORKFLOW_SELF_TRIGGER: 'false'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          changed="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # Unless this job wants a workflow-only change, this file is taken
          # out of the list before the filter reads it (see the job comment).
          if [ "${WORKFLOW_SELF_TRIGGER:-true}" != "true" ]; then
            changed="$(sed '\#^\.github/workflows/ci\.yml$#d' <<<"$changed")"
          fi
          # grep's answer is kept, not tested in an `if`: see the job comment for why
          # (#1428).
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/ci\.yml$' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "lab-host/coder files changed — running the Coder template checks"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — the Coder template checks are skipped"
          else
            echo "::error file=.github/workflows/ci.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      - name: Detect harness changes
        id: harness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^(hooks/|tooling/)'
          # Under a minute, and its steps are written in this file.
          WORKFLOW_SELF_TRIGGER: 'true'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first — same reasoning as the steps above: a
          # failed diff must fail toward running, not skipping.
          changed="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # Unless this job wants a workflow-only change, this file is taken
          # out of the list before the filter reads it (see the job comment).
          if [ "${WORKFLOW_SELF_TRIGGER:-true}" != "true" ]; then
            changed="$(sed '\#^\.github/workflows/ci\.yml$#d' <<<"$changed")"
          fi
          # grep's answer is kept, not tested in an `if`: see the job comment for why
          # (#1428).
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/ci\.yml$' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "harness files changed — running the harness checks"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — the harness checks are skipped"
          else
            echo "::error file=.github/workflows/ci.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      # The rows of the verify job, one detect step each (#1545, the third
      # pull request). Until then every row started a runner on every pull
      # request and the rows whose files had not changed exited after a few
      # seconds, because a matrix row cannot carry an `if:` of its own. Now
      # the filter of each row is decided here, and the "Build the verify
      # matrix" step at the end puts only the rows whose files changed into
      # the matrix, so no runner starts for the others. The scripts row is
      # the exception: it is always in the matrix, because three of its steps
      # run on every pull request whatever changed (the verify job says
      # which), and its answer here only decides whether its lint and tests
      # run. The comments above each step are the reasons for the paths in
      # its filter; scripts/ci-filters.test.mjs checks that every filter
      # lists every file the row's tests read.

      # The lab-image and vps-agent paths are what the Landing Zone
      # Builder's lab tests read (#672): labImage.test.js holds the
      # builder's vendored-module list to lab-image's Dockerfile and
      # versions.env, and labPayload.test.js unpacks the payload with the
      # agent's own tar parser. The two functions paths are the visitor
      # report: LzLabValidate.test.jsx renders what the server's own
      # builder makes of the owner's real job logs. The two lab-host
      # files are what the lab pane's tests read: catalogue.test.js holds
      # the sign-in path and the launcher's path to the coder route and
      # the workspace names to the launcher's map, and
      # LabPanePage.test.jsx holds its states to the launcher's. The rss
      # path is the news feed list the server reads: providerFeeds.test.js
      # holds the frontend's copy to it, and HomePage.hubs.test.jsx holds
      # each home page hub's feed count to it. The decision-center and
      # content-status paths are the Decision Center's links and the review
      # statuses: itemLinks.test.js holds lib/itemLinks.js, every deep link
      # and the Frameworks hub's review set to them, and
      # decisionCenterModel.test.js holds the tabs to the API's categories.
      # The two integrations paths are the Linkie proxy's allow-list and
      # the matcher it uses: linkie.test.js sends every path the Linkie Hub
      # builds through them, so a rename on Linkie's side that moves one
      # and not the other fails the frontend suite.
      # Added with #1414: functions/src/lib/labs.js is the server's rule
      # that labsPolling.test.js holds the lab hub's down statuses to. The
      # deploy-azure-frontend.yml workflow is read by
      # deploy-source-maps.test.js and prerender.test.js (the mount-point
      # check); publish-lab-image.yml and lab-image/smoke.sh are read by
      # DockerGuides.test.jsx.
      # Added with #1428. A test that imports a functions module depends on
      # every file that module imports in turn, and on every file it reads
      # when it loads, so the guard follows the chain to its end. Six tests
      # start the chains:
      # - aiEngine.test.js imports ai/router.js, ai/model-catalog.js,
      #   ai/usage.js and ai/mcp-policy.js, which load the rest of ai/, the
      #   Cosmos client (cosmos-client.js, cosmos-call-shape.js,
      #   job-context.js), the secrets code (admin-secrets.js,
      #   secret-catalog.js, secret-vault.js, secrets-health.js and the
      #   expected-unresolved.js it loads (#1512), key-verdict.js) and
      #   http/error-response.js.
      # - statusParity.test.js imports health/pulse-checks.js, which loads
      #   labs.js and so the lab checks in labs/, lab-agent.js,
      #   timers/agent-health.js, the publishing code in cms/,
      #   blob-paths.js, triggers/fetch-image.js, cloud-tools/history.js
      #   with its two pricing files, and the http/ helpers (error-response,
      #   fetch-with-timeout, guarded-fetch, read-setting).
      # - linkie.test.js imports integrations/rest-proxy.js, which loads
      #   connection-probe.js and upstream-error.js.
      # - useLivePageArchive.test.jsx and itemLinks.test.js import
      #   cms/content-update-validation.js and content-status.js, which load
      #   cms/publish-targets.js and public-reads.js.
      # - ambassadorModel.test.js imports ambassador/readiness.js, which
      #   loads ambassador/model.js.
      # ai/, cms/ and labs/ are whole folders because the tests load eight
      # or more of their code files: 20 of the 25 non-test code files
      # directly in ai/, 10 of the 23 in cms/ (31 with its image-prompts/
      # folder) and 8 of the 19 in labs/. So a new import inside them needs
      # no edit here.
      # A folder also matches the test files in it, which nothing here
      # loads: the new entries match 66 test files (26 in ai/, 21 in cms/,
      # 19 in labs/), and a pull request that changes only one of them runs
      # this row for nothing. The other entries are listed file by file.
      - name: Detect changes for the frontend row
        id: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^(frontend/|\.azure/api-surface\.json|lab-image/(versions\.env|Dockerfile|smoke\.sh)$|vps-agent/lib/docker-runner\.js$|\.github/workflows/(deploy-azure-frontend|publish-lab-image)\.yml$|functions/src/lib/((ai|cms|labs)/|(labs|rss/feeds|addons/registry|admin-secrets|blob-paths|cosmos-call-shape|cosmos-client|job-context|key-verdict|lab-agent|public-reads|secret-catalog|secret-vault|secrets-health|expected-unresolved|decision-center/(links|items)|health/(status-model|probe-catalogue|pulse-checks)|integrations/(linkie-allowlist|rest-proxy|connection-probe|upstream-error)|cloud-tools/(history|pricing/(baseline|regions))|http/(error-response|fetch-with-timeout|guarded-fetch|read-setting)|timers/agent-health|triggers/fetch-image|ambassador/(readiness|model))\.js$)|lab-host/(coder/launcher/launcher\.js|coder/templates/hcw-lab/main\.tf|ansible/roles/coder/templates/10-coder\.caddy\.j2)$)'
          # The row's install and run lines are in this file, so an edit to it runs the row.
          WORKFLOW_SELF_TRIGGER: 'true'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first: `set -e` is inert inside an `if`
          # condition, so a failed diff (an unfetchable base sha) would read
          # as "no changes" and silently skip required work. A diff that
          # cannot be computed fails toward running everything.
          changed="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # Unless this job wants a workflow-only change, this file is taken
          # out of the list before the filter reads it (see the job comment).
          if [ "${WORKFLOW_SELF_TRIGGER:-true}" != "true" ]; then
            changed="$(sed '\#^\.github/workflows/ci\.yml$#d' <<<"$changed")"
          fi
          # grep's answer is kept, not tested in an `if`: see the job comment for why
          # (#1428).
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/ci\.yml$' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "frontend files changed — the row runs"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — the frontend row is left out of the matrix"
          else
            echo "::error file=.github/workflows/ci.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      # docs/content/ is here because tests read it: content-modules.test.js
      # reads blog-machine.md, and test/docs-content-guard.test.js fails
      # when a draft article (blog-*.md) is added there, which is why a pull
      # request that only adds such a file must still run this row
      # (pre-publish drafts do not live in this public repository). The
      # first three frontend files are the pages that word the public
      # routes' codes themselves: public-visitor-copy.test.js and
      # public-lock.test.js read them, so a code the server answers can
      # never go unmapped on the page. The next two are the admin copies of
      # server allowlists (the default-cover providers and the image-prompt
      # pages): docker-cms.test.js holds them to the server's lists (#775).
      # api.js is the browser's timeout table: sync-budgets.test.js holds
      # the server's AI time budgets under it, so a shorter client timeout
      # cannot land unchecked. The last three are the admin provider list
      # and the provider registry it is built from, which docker-cms.test.js
      # holds to normalizeProviderName, and the submission pages, whose
      # provider lists submissions.test.js holds the API's contract to. The
      # dashboard's decisionCenterModel.js is where each Decision Center
      # source's list lives: decision-center.test.js holds every source to
      # it. sourceUrl.js is what source-episode.test.js imports, and
      # onboard.yml is what estate.test.js reads for the guest configuration
      # toggle. scripts/ideas/idea-notes.mjs is what idea-promotion.test.js
      # imports, to hold the drafts it writes to the markdown upload's
      # parser. frontend/src/, frontend/scripts/, frontend/public/ and
      # scripts/ are listed whole (#1414) because doc-vault/no-leak.test.js
      # reads every source file in them to prove nothing outside the Doc
      # Vault names its container, so a pull request that only changes one
      # of those files runs this row. That makes the single frontend files
      # and scripts/ideas/idea-notes.mjs named above redundant; they stay so
      # each one keeps its reason beside it. The other entries (onboard.yml,
      # the .azure files and the docs/content/ folder) are not redundant.
      - name: Detect changes for the functions (azure) row
        id: functions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^(functions/|\.azure/(api-surface|agent-protocol)\.json|infra/|docs/content/|scripts/ideas/idea-notes\.mjs$|scripts/|frontend/(src|scripts|public)/|lab-host/ansible/roles/arc/tasks/onboard\.yml$|frontend/src/(pages/tools/landingZone/labValidateRules\.js$|pages/tools/explain/ExplainControl\.jsx$|lib/(turnstile|api|providers|sourceUrl)\.js$|components/admin/(platform-settings/settingShared\.jsx$|dashboard/decisionCenterModel\.js$)|pages/admin/ImagePromptsPage\.jsx$|config/admin\.js$|pages/submissions/[A-Za-z]+SubmissionPage\.jsx$))'
