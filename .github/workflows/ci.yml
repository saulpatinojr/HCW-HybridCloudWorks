      - name: Detect changes for the scripts (operations) row
        id: scripts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^(scripts/|\.github/workflows/|\.github/(actionlint\.yaml|pull_request_template\.md)$|infra/|infra-lab/|lab-host/|lab-image/|(TODO|CHANGELOG)\.md$|docs/runbooks/(labs-host|alerting-and-support|admin-signin-rollback|cosmos-restore|data-subject-requests|deployment-runbook)\.md$|([^/]+/)*package(-lock)?\.json$|([^/]+/)*\.(nvmrc|node-version|python-version)$|([^/]+/)*Dockerfile|frontend/src/lib/landingZone/(avmVersions|labImage|tfConstraints)\.js$|frontend/src/(pages/shared/LabPanePage\.jsx|pages/tools/AddOnPanePage\.jsx|pages/docker/BuildingImagesPage\.jsx|data/labs/catalogue\.js|context/ProviderContext\.jsx|components/admin/labs/labsView\.js)$|vps-agent/(index\.js|\.env\.example|bin/report-host-check\.js|lib/(capabilities|docker-runner|shutdown|maintenance-hold)\.js)$|functions/(function-inventory\.json$|src/lib/(cms|labs|http|cloud-tools)/|src/(lib/(labs|public-section-counts|rss/feeds|addons/registry|credentials/(cloudflare-roll|google-roll|aws-roll)|admin-secrets|blob-paths|cosmos-call-shape|cosmos-client|job-context|lab-agent|public-reads|secret-catalog|secret-vault|secrets-health|expected-unresolved|timers/agent-health|triggers/fetch-image)\.js|functions/(schedulers|jobs-sweeper)\.js)$))'
          # The scripts tests read the workflow files anyway.
          WORKFLOW_SELF_TRIGGER: 'true'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "non-pull_request event — running all checks"
            exit 0
          fi
          # Capture the diff first: `set -e` is inert inside an `if`
          # condition, so a failed diff (an unfetchable base sha) would read
          # as "no changes" and silently skip required work. A diff that
          # cannot be computed fails toward running everything.
          changed="$(git diff --name-only --no-renames "${BASE_SHA}" HEAD)" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "could not compute the diff — running all checks rather than guessing"
            exit 0
          }
          # Unless this job wants a workflow-only change, this file is taken
          # out of the list before the filter reads it (see the job comment).
          if [ "${WORKFLOW_SELF_TRIGGER:-true}" != "true" ]; then
            changed="$(sed '\#^\.github/workflows/ci\.yml$#d' <<<"$changed")"
          fi
          # grep's answer is kept, not tested in an `if`: see the job comment for why
          # (#1428).
          status=0
          grep -qE "(${FILTER})"'|^\.github/workflows/ci\.yml$' <<<"$changed" || status=$?
          if [ "${status}" -eq 0 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "scripts (operations) files changed — the row runs"
          elif [ "${status}" -eq 1 ]; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no relevant change — the scripts row runs only the guards it runs on every pull request"
          else
            echo "::error file=.github/workflows/ci.yml,title=Path filter could not be read::grep -E could not read the path filter of job ${GITHUB_JOB} (exit status ${status}), so the job cannot tell whether it is needed. The filter: ${FILTER}"
            exit 1
          fi

      # vps-agent shells out to `docker run` with a payload that reached
      # the host from the platform API, and its sandbox flag list is the
      # entire security boundary. Until T-743 this row ran `npm ci` and
      # nothing else, so an edit dropping `--network none` shipped green.
      # The suite uses node:test — no dependency, which keeps this
      # package's single-dependency lockfile intact.
      # group_vars/all.yml and hcw-labs-agent.service.j2 are read by
      # applied-commit.test.js and log.test.js; .azure/agent-protocol.json
      # is the shared agent protocol contract fixture (QA-3 #978).
      - name: Detect changes for the vps-agent row
        id: vps-agent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILTER: '^(vps-agent/|\.azure/agent-protocol\.json$|lab-host/ansible/(group_vars/all\.yml|roles/labs_agent/templates/hcw-labs-agent\.service\.j2)$)'
          # As for the frontend row.
