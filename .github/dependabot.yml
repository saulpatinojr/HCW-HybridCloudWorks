version: 2

# Grouping policy. Every ecosystem batches minor and patch into one PR and
# majors into a second. Majors are deliberately kept out of the safe batch: a
# breaking bump that fails review would otherwise hold back the routine updates
# alongside it. Leaving majors ungrouped entirely was the noisier failure --
# 2026-08-24 produced three grouped PRs for fourteen updates and six separate
# single-package PRs, all of them majors.
#
# cooldown keeps a release from landing the day it is published. That is a
# supply-chain control as much as a noise control: a compromised or yanked
# release is usually caught within days, and nothing here is urgent enough to
# need same-day adoption. Security updates ignore cooldown.

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
      frontend-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    # undici's major follows the runtime, not the calendar. guarded-fetch.js
    # passes an Agent from this package to the built-in fetch, which is the
    # undici Node bundles, and the two must share a major: on Node 24 (the
    # Function App's line, bundled undici 7) an undici 8 Agent makes fetch
    # throw UND_ERR_INVALID_ARG. #902 proposed exactly that with every check
    # green. Lift this when functions/package.json's engines move to a Node
    # line that bundles undici 8 (Node 26 does); the end-to-end case in
    # src/lib/http/guarded-fetch.test.js fails until the two agree.
    ignore:
      - dependency-name: undici
        update-types:
          - version-update:semver-major
    groups:
      azure-functions-minor-patch:
        update-types:
          - minor
          - patch
      azure-functions-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      operations-scripts-minor-patch:
        update-types:
          - minor
          - patch
      operations-scripts-major:
        update-types:
          - major

  # The Cloudflare Worker (T-747). It has no dependencies today, so this adds
  # nothing immediately — which is exactly why it is cheap to add now, rather
  # than discovering later that a package entered an unwatched directory.
  - package-ecosystem: npm
    directory: /edge/availability-probe
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7

  - package-ecosystem: npm
    directory: /vps-agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      vps-agent-minor-patch:
        update-types:
          - minor
          - patch
      vps-agent-major:
        update-types:
          - major

  # Actions are SHA-pinned with a version comment, so every bump is the same
  # two-line shape and they review well as one PR regardless of semver level.
  # Splitting majors out here would only recreate the three-same-day-PRs case.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      github-actions:
        update-types:
          - major
          - minor
          - patch

  # infra/.terraform.lock.hcl is deliberately committed (see .gitignore) because
  # the azurerm pin is `~> 4.0` and an uncommitted lock lets CI resolve a
  # different provider version than a developer does. Nothing kept that lock
  # current until now, so the pin quietly drifted from what CI actually ran.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # No semver-major-days here: Dependabot does not support that property
      # for the terraform ecosystem, and its presence made the WHOLE file
      # invalid — so no ecosystem got updates, not just this one. The failure
      # was latent because Dependabot only re-validates when the file changes,
      # and nothing had changed it since the property was copied over from the
      # npm entries above. The github-actions entry already gets this right.
      default-days: 3
    groups:
      infra-terraform-minor-patch:
        update-types:
          - minor
          - patch
      infra-terraform-major:
        update-types:
          - major

  # infra-lab/ is the hcw-lab root module (#661) with its own committed lock.
  # Deliberately ungrouped: hostinger/hostinger is pinned exactly and manages a
  # paid server, so each bump arrives as its own pull request whose hcw-lab
  # plan is read alone (infra-lab/README.md, "Changing the provider version").
  - package-ecosystem: terraform
    directory: /infra-lab
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      # Same constraint as the /infra entry: default-days only.
      default-days: 3

  # The lab image's base (lab-image/Dockerfile, FROM by digest). Dependabot
  # cannot read versions.env or the digests pinned where the images are
  # consumed; .github/workflows/lab-supply-chain.yml watches those. This adds
  # the one thing it can watch: the base image digest on the FROM lines
  # (LAB-3, estate review 2026-10-06).
  - package-ecosystem: docker
    directory: /lab-image
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3

  # The Python tools three CI jobs install with pip, each from a lock file
  # that carries a SHA256 checksum for every package (pip's --require-hashes):
  # ansible-lint and ansible-core for the lab-host lint and role tests,
  # lizard for the complexity check, MkDocs for the documentation site. Each
  # folder has a short .in file a person edits and the .txt lock file made
  # from it with pip-compile; Dependabot rebuilds the lock, checksums
  # included, when it raises a version.
  #
  # ansible-core is left out on purpose: CI lints and tests with the release
  # lab-host/bootstrap.sh installs on the host (ANSIBLE_CORE_VERSION in
  # lab-image/versions.env), and lab-supply-chain.yml proposes that move.
  # The two .in files in lab-host/ansible follow it by hand.
  - package-ecosystem: pip
    directories:
      - /lab-host/ansible
      - /scripts/complexity
      - /scripts/docs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: ansible-core
    groups:
      ci-python-tools-minor-patch:
        update-types:
          - minor
          - patch
      ci-python-tools-major:
        update-types:
          - major
