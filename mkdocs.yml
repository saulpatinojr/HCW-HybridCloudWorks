# Documentation site: https://docs.hybridcloudworks.com (issue #360).
#
# docs/ is the reviewed source. It replaced wiki/ on 2026-09-06. The GitHub Wiki
# was retired the same day by retire-wiki.yml — every page overwritten with a
# pointer here — and the Wiki feature is now off in repository settings
# (`has_wiki: false`), so that one-shot workflow was deleted on 2026-09-08.
# Build and deploy: .github/workflows/docs-pages.yml. `mkdocs build --strict`
# turns every warning below — a broken link, a page missing from nav that is
# not meant to be, an unknown anchor — into a failed check.
site_name: HybridCloudWorks Engineering
site_url: https://docs.hybridcloudworks.com/
site_description: Architecture decisions, runbooks, standards and the engineering record for the HybridCloudWorks website.
repo_url: https://github.com/saulpatinojr/HCW-HybridCloudWorks
repo_name: saulpatinojr/HCW-HybridCloudWorks
edit_uri: edit/main/docs/
copyright: HybridCloudWorks

docs_dir: docs
site_dir: site
strict: true

# README.md, CHANGELOG.md and TODO.md stay at the repository root (the
# repository-structure policy requires them there) and are pulled into the
# site at build time as repo/*.md, so they are never copied by hand.
hooks:
  - scripts/docs/hooks.py

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

