# Ansible configuration for the lab host bootstrap. Read only when
# ansible-playbook runs from this directory, which is what bootstrap.sh does.
[defaults]
inventory = inventory/localhost.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
nocows = True
forks = 5
stdout_callback = ansible.builtin.default
# The twenty slowest tasks, printed after the recap, so a long run says where
# its minutes went (ansible.posix is pinned in requirements.yml).
callbacks_enabled = ansible.posix.profile_tasks

[callback_default]
result_format = yaml
pretty_results = True

[callback_profile_tasks]
task_output_limit = 20
sort_order = descending

[privilege_escalation]
become = True
become_method = ansible.builtin.sudo
