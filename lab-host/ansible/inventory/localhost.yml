---
all:
  hosts:
    localhost:
      ansible_connection: local
      # The one recorded exception to the lab host's Python rule (bootstrap.sh):
      # ansible-playbook itself runs on uv's CPython 3.15.2, but modules run on
      # the distribution's python3. python3-apt, python3-debian and
      # python3-docker, which the apt, deb822_repository and community.docker
      # modules import, are Ubuntu packages built for that interpreter only.
      ansible_python_interpreter: /usr/bin/python3
