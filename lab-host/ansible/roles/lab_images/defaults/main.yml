---
# The checkouts of this repository whose pins this host holds: the playbook's
# own (the commit this run applies) and the agent's (the commit the agent
# runs). They are the same commit unless `-e labs_agent_repo_ref` holds the
# agent back, and then both sets are pulled and kept, so the held agent keeps
# its images and the next plain run removes whichever the released hold left
# behind. Check mode reads the playbook's checkout at the new commit, so it
# shows the pulls that commit needs even though it cannot move the agent's.
lab_images_checkouts:
  - "{{ lab_images_playbook_checkout }}"
  - "{{ labs_agent_home }}"

# Plan the Coder workspace image on the sandbox daemon the workspaces run on
# (the coder_sandbox role; LAB-5): pull it there, and remove the ones no pin
# names. Coder pulls it itself on the first workspace start; pulled here, that
# start does not wait for it. Off while Coder is, because that daemon is then
# stopped.
lab_images_pull_workspace: "{{ coder_enabled }}"

# The sandbox daemon's socket, the coder_sandbox role's fixed path.
lab_images_sandbox_docker_host: unix:///run/hcw-coder-docker/docker.sock

# NodeSource's node, which the labs_agent role installs, runs the plan.
lab_images_node: /usr/bin/node

# Defer workspace image removal when Coder template publication was skipped or failed.
# When true, newly pinned workspace images are still pulled, but existing workspace images
# on the sandbox daemon are kept so active Coder template versions continue running.
lab_images_defer_workspace_cleanup: false
