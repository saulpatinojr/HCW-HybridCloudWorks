---
argument_specs:
  main:
    short_description: Hold every digest-pinned lab image on the host and remove the ones no pin names
    description:
      - Reads the pins from checkouts of this repository with files/lab-images.mjs, which imports
        IMAGES from vps-agent/lib/capabilities.js and reads the workspace image of every template
        under lab-host/coder/templates from its main.tf, so a pin bump needs no edit here.
      - Pulls each capability image into the host daemon, and each template's workspace image into
        the coder_sandbox daemon while lab_images_pull_workspace is true (LAB-5), by
        repository@digest with community.docker.docker_image_pull, pull not_present, so a digest
        already there is ok. Each daemon's plan pins only its own images.
      - Removes, with docker image rm, every reference in the lab's own repositories (those the
        pins name, and hybridcloudworks/hcw-lab* on Docker Hub or the former
        ghcr.io/hybridcloudworks/hcw-lab*) on an image none of whose references is a pin,
        unless a container still uses the image. No other repository is touched.
      - Runs only over a local connection, because the helper and the playbook's checkout are read
        from the machine the play runs from.
    author: HybridCloudWorks
    options:
      lab_images_checkouts:
        type: list
        elements: path
        required: false
        description:
          - Checkouts of this repository whose pins the host holds; the union is pulled and kept.
            Defaults to the playbook's own checkout and labs_agent_home, the agent's, which are
            the same commit unless -e labs_agent_repo_ref holds the agent back.
      lab_images_pull_workspace:
        type: bool
        required: false
        description:
          - Plan every template's Coder workspace image on the sandbox daemon (pull each, remove
            superseded ones). Defaults to coder_enabled, because that daemon stops while Coder is
            off.
      lab_images_sandbox_docker_host:
        type: str
        required: false
        default: unix:///run/hcw-coder-docker/docker.sock
        description: The coder_sandbox daemon's socket, where workspace images are held.
      lab_images_node:
        type: path
        required: false
        default: /usr/bin/node
        description: The node binary that runs the plan; the labs_agent role installs it.
      lab_images_defer_workspace_cleanup:
        type: bool
        required: false
        default: false
        description:
          - Defer removing superseded workspace images from the sandbox daemon. When true (or
            when Coder template publication was skipped), existing workspace images are
            retained so active Coder template versions continue running without interruption.
