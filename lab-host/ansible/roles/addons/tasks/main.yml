---
# Fail closed before touching the host: whatever the variables say, every
# add-on is published on the loopback only, on its own port, and never
# without the vault key its environment names.
- name: Refuse to publish an add-on anywhere but the host's loopback
  ansible.builtin.assert:
    that:
      - addons_publish_address == '127.0.0.1'
    fail_msg: >-
      Add-ons would be published on {{ addons_publish_address }}. They are reached through Caddy
      alone, so they are published on 127.0.0.1 only (ADR 0035; roles/addons/README.md).
    quiet: true

- name: Refuse an add-on row without an integer port of its own, or two rows with one id
  ansible.builtin.assert:
    that:
      - addons_active | map(attribute='port') | reject('integer') | list | length == 0
      - addons_active | map(attribute='port') | select('lt', 1024) | list | length == 0
      - addons_active | map(attribute='port') | select('gt', 65535) | list | length == 0
      - addons_active | map(attribute='port') | unique | length == addons_active | length
      - addons_active | map(attribute='id') | unique | length == addons_active | length
      - addons_active | map(attribute='id') | reject('match', '^[a-z0-9]+(-[a-z0-9]+)*$') | list | length == 0
    fail_msg: >-
      Every row of addons in group_vars/all.yml needs an id of lowercase letters, digits and
      hyphens and an integer port between 1024 and 65535 that no other row uses; found
      {{ addons_active | map(attribute='id') | zip(addons_active | map(attribute='port')) | list }}.
    quiet: true

# A deployed row must carry its own widget's site key, never a test key: the
# real secret the vault holds rejects the token a test key produces, and the
# add-on would then refuse every upload while reporting itself configured.
- name: Refuse to deploy an add-on whose environment still carries a verification test key
  ansible.builtin.assert:
    that:
      - item.env | default({}) | dict2items | map(attribute='value') | map('string')
        | intersect(addons_test_site_keys) | length == 0
    fail_msg: >-
      hcw-addon-{{ item.id }} has a digest, so it would be deployed, but its env still carries a
      verification test site key. Create the add-on's widget and put its site key in
      addons[].env in group_vars/all.yml (lab-host/README.md, "Tool add-ons"), then re-run
      bootstrap.sh.
    quiet: true
  loop: "{{ addons_deployed }}"
  loop_control:
    label: "{{ item.id }}"

- name: Refuse an add-on digest that is not a sha256 image digest
  ansible.builtin.assert:
    that:
      - item.image_digest | default('') == '' or item.image_digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      {{ item.id }}: image_digest must be empty (not deployed yet) or sha256: followed by 64 hex
      characters, the image index digest the add-on's publish-images summary prints; found
      {{ item.image_digest | default('') }}.
    quiet: true
  loop: "{{ addons_active }}"
  loop_control:
    label: "{{ item.id }}"

# Every secret_env value names a vault key; the container is not started
# while any of them is unset, because the add-on would then start without
# human verification or refuse to start, and either is better said here.
# The loop prints key NAMES only; the values are never looked at outside
# the assertion.
#
# Only rows that will be deployed are asked for their keys, the same set
# the test-key check above and the container tasks below use. A row whose
# digest is still empty starts nothing, so it needs no secret yet; it gets
# the "not deployed" note below instead. Asking every enabled row stopped
# the whole play at this task on 2026-10-10 for an add-on with no digest,
# and portainer, vault, the privilege checks and the applied-commit record
# never ran.
- name: Collect the vault keys the add-ons being deployed need
  ansible.builtin.set_fact:
    addons_secret_refs: >-
      {{ addons_secret_refs | default([])
         + (item.secret_env | default({}) | dict2items | map('combine', {'id': item.id}) | list) }}
  loop: "{{ addons_deployed }}"
  loop_control:
    label: "{{ item.id }}"

- name: Refuse to start an add-on whose vault key is not set
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item.value, default='') | length > 0
    fail_msg: >-
      hcw-addon-{{ item.id }} needs {{ item.key }} from the vault key {{ item.value }}, which is not
      set. Set it from the workstation with the add-on's secret on the clipboard:
      (Get-Clipboard -Raw) | ssh hcw-lab "sudo -n /usr/local/sbin/hcw-vault-set {{ item.value }}"
      (lab-host/README.md, "Tool add-ons"), then re-run bootstrap.sh.
    quiet: true
  loop: "{{ addons_secret_refs | default([]) }}"
  loop_control:
    label: "{{ item.id }}: {{ item.key }} from {{ item.value }}"

# A row whose digest is still empty is not deployed: its release has not
# been published yet (lab-host/README.md, "Tool add-ons"). The route is
# rendered all the same, so its name answers the site's sentence with 503
# and the site's status proxy reads the add-on as unreachable, which is the
# truth. The run says so rather than failing, because the other roles must
# still converge.
- name: Say which enabled add-ons have no digest yet and are not deployed
  ansible.builtin.debug:
    msg: >-
      hcw-addon-{{ item.id }} is enabled but addons[].image_digest for {{ item.id }} is empty in
      group_vars/all.yml, so nothing is pulled or run for it and its name answers 503. Put the
      digest the add-on's publish-images summary prints there and re-run bootstrap.sh.
  loop: "{{ addons_running | rejectattr('image_digest') | list }}"
  loop_control:
    label: "{{ item.id }}"

# The add-ons' own network (defaults/main.yml): no inter-container
# communication, a fixed subnet and bridge name, so the egress rules below
# have one source to match and nothing on it can talk to anything else on
# the host's Docker networks.
- name: Create the add-ons' own bridge network
  community.docker.docker_network:
    name: "{{ addons_network_name }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ addons_network_subnet }}"
    driver_options:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.name: "{{ addons_network_bridge }}"
  when: addons_active | length > 0

# Egress from that subnet, in the DOCKER-USER chain, now (so the rules hold
# from this run) and in ufw's after.rules (so they hold from the next boot).
# Inserted at the top in reverse order, so the chain reads: established
# returns, then one accept per range and port, then reject everything else
# from the subnet. Each insert is idempotent: the module checks for the rule
# before adding it. Traffic to the containers (the published loopback ports,
# the answers to their flows) does not match -s and is untouched.
# Reconcile first: every live rule this role wrote (its comment names it) is
# removed, so a range or port dropped from the defaults is dropped from the
# chain too, and the inserts below rebuild the set in one known order. Docker's
# own trailing RETURN carries no such comment and is untouched.
#
# The subnet is never less restricted than the policy while this happens.
# The removal is one iptables-restore transaction that also puts a reject for
# the whole subnet at the top of the chain ("... rebuilding"); the inserts go
# above it, and only after the last one is it lifted. A run that stops in
# between leaves the reject: the add-ons lose egress until the next run, never
# keep it unfiltered. Rules are deleted by their full specification, never by
# position, so another writer's rule cannot be hit
# (files/hcw-addons-egress-clear, tested against real iptables in
# tests/hcw-addons-egress-clear.test.sh).
#
# It replaces an inline pipeline that failed the host's first run
# (2026-10-10): the chain held none of the role's rules, grep exited 1 and
# pipefail made that the task's failure. On any later run it would have
# deleted nothing while printing "removed", because `iptables -S` quotes the
# comment and the unquoted re-read split it. The comment passed here is the
# one every insert below carries.
- name: Install hcw-addons-egress-clear, which clears the role's egress rules behind a held reject
  ansible.builtin.copy:
    src: hcw-addons-egress-clear
    dest: /usr/local/libexec/hcw-addons-egress-clear
    owner: root
    group: root
    mode: "0750"
  when: addons_active | length > 0

- name: Hold a reject on the add-ons' subnet and remove the egress rules this role wrote on an earlier run
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/hcw-addons-egress-clear
      - guard
      - DOCKER-USER
      - hcw-addons egress (roles/addons)
      - "{{ addons_network_subnet }}"
  register: addons_egress_reconcile
  changed_when: addons_egress_reconcile.stdout_lines | length > 0
  when: addons_active | length > 0 and not ansible_check_mode

- name: Reject every other new flow from the add-ons' subnet
  ansible.builtin.iptables:
    chain: DOCKER-USER
    action: insert
    source: "{{ addons_network_subnet }}"
    jump: REJECT
    reject_with: icmp-port-unreachable
    comment: hcw-addons egress (roles/addons)
  when: addons_active | length > 0

- name: Allow a new flow from the add-ons' subnet to the verification endpoint's ranges only
  ansible.builtin.iptables:
    chain: DOCKER-USER
    action: insert
    source: "{{ addons_network_subnet }}"
    destination: "{{ item.0 }}"
    protocol: tcp
    destination_port: "{{ item.1 }}"
    ctstate: NEW
    jump: RETURN
    comment: hcw-addons egress (roles/addons)
  loop: "{{ addons_egress_cidrs | product(addons_egress_tcp_ports) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"
  when: addons_active | length > 0

- name: Let established flows from the add-ons' subnet return
  ansible.builtin.iptables:
    chain: DOCKER-USER
    action: insert
    source: "{{ addons_network_subnet }}"
    ctstate: ESTABLISHED,RELATED
    jump: RETURN
    comment: hcw-addons egress (roles/addons)
  when: addons_active | length > 0

# The whole policy is above the held reject now, so lifting it changes
# nothing the policy allows; it only ends the rebuild.
- name: Lift the reject held on the add-ons' subnet while the egress rules were rebuilt
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/hcw-addons-egress-clear
      - unguard
      - DOCKER-USER
      - hcw-addons egress (roles/addons)
  register: addons_egress_unguard
  changed_when: addons_egress_unguard.stdout_lines | length > 0
  when: addons_active | length > 0 and not ansible_check_mode

- name: Write the same egress rules where ufw restores them at boot
  ansible.builtin.blockinfile:
    path: "{{ addons_ufw_after_rules }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: hcw-addons egress (roles/addons)"
    block: "{{ lookup('ansible.builtin.template', 'ufw-after-rules.j2') }}"
    create: false
    mode: "0640"
  when: addons_active | length > 0

- name: Pull each deployed add-on image by digest
  community.docker.docker_image_pull:
    name: "{{ item.image }}@{{ item.image_digest }}"
    platform: linux/amd64
  loop: "{{ addons_deployed }}"
  loop_control:
    label: "{{ item.id }}: {{ item.image }}@{{ item.image_digest }}"

# One hardened container per row (ADR 0035 decision 6; the standard's
# section 16): read-only root with /tmp on tmpfs, every capability dropped,
# no new privileges, memory, pids and one CPU bounded, no volume and no
# mount of any kind (compared strictly, so a container reused from an
# earlier run with a volume is recreated without it), no socket, on the
# add-ons' own network only, under the daemon's user-namespace remap (no
# userns_mode: host), the image's own HEALTHCHECK, json-file logs capped.
# The environment is the row's env plus each secret_env key read from its
# vault variable, so no_log: the secret would otherwise be in the diff.
# comparisons env strict: a key removed from the row is removed from the
# container on the next run rather than kept.
- name: Run each deployed add-on, published on the host's loopback only
  community.docker.docker_container:
    name: "hcw-addon-{{ item.id }}"
    image: "{{ item.image }}@{{ item.image_digest }}"
    pull: false
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ addons_publish_address }}:{{ item.port }}:{{ addons_container_port }}"
    network_mode: "{{ addons_network_name }}"
    volumes: []
    mounts: []
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opts:
      - no-new-privileges:true
    memory: "{{ item.memory }}"
    pids_limit: "{{ item.pids_limit }}"
    cpus: 1
    log_driver: json-file
    log_options:
      max-size: "{{ addons_log_max_size }}"
      max-file: "3"
    env: "{{ item.env | combine(addon_secret_values) }}"
    comparisons:
      env: strict
      published_ports: strict
      volumes: strict
      mounts: strict
      network_mode: strict
  vars:
    addon_secret_values: >-
      {{ dict(item.secret_env | default({}) | dict2items | map(attribute='key')
              | zip(item.secret_env | default({}) | dict2items | map(attribute='value')
                    | map('extract', vars))) }}
  no_log: true
  loop: "{{ addons_deployed }}"
  loop_control:
    label: "hcw-addon-{{ item.id }} on {{ addons_publish_address }}:{{ item.port }}"

# Every row that is not deployed this run: disabled, or enabled with its
# digest cleared. The second case matters: a container left from an earlier
# digest would otherwise keep serving while the run says nothing is deployed
# and the privilege checks no longer look at it.
- name: Stop and remove each add-on container that is disabled or has no digest
  community.docker.docker_container:
    name: "hcw-addon-{{ item.id }}"
    state: absent
  loop: "{{ addons | rejectattr('id', 'in', addons_deployed | map(attribute='id') | list) | list }}"
  loop_control:
    label: "hcw-addon-{{ item.id }}"

- name: Render the Caddy route for the enabled add-ons' names
  ansible.builtin.template:
    src: 20-addons.caddy.j2
    dest: "{{ addons_caddy_route_file }}"
    owner: root
    group: "{{ addons_caddy_group }}"
    mode: "0640"
  when: addons_running | length > 0
  notify: Reload caddy for the addons route

- name: Remove the Caddy route while no add-on is enabled
  ansible.builtin.file:
    path: "{{ addons_caddy_route_file }}"
    state: absent
  when: addons_running | length == 0
  notify: Reload caddy for the addons route

# Only now the health wait: withdrawn containers are already gone and the
# route already says who is deployed, so one tool that fails to come up
# cannot leave another tool's retirement or route change undone.
- name: Wait for each deployed add-on to answer its health read on the loopback
  ansible.builtin.uri:
    url: "http://{{ addons_publish_address }}:{{ item.port }}/api/health"
    follow_redirects: none
    status_code: 200
  register: addons_health
  until: addons_health.status == 200
  retries: "{{ addons_wait_retries }}"
  delay: "{{ addons_wait_delay }}"
  loop: "{{ addons_deployed }}"
  loop_control:
    label: "hcw-addon-{{ item.id }}"
  when: not ansible_check_mode

- name: Say what runs
  ansible.builtin.debug:
    msg: >-
      {% if addons_deployed | length > 0 %}
      Tool add-ons running: {{ addons_deployed | map(attribute='id')
      | map('regex_replace', '^', 'hcw-addon-') | join(', ') }}, each on the loopback behind Caddy
      at <id>.{{ lab_host_domain }}. Health over SSH: curl -s http://127.0.0.1:<port>/api/health
      (lab-host/README.md, "Tool add-ons").
      {% else %}
      No tool add-on is running: addons_enabled is {{ addons_enabled }} and no enabled row has a
      digest. To run one, set addons_enabled true and the row's enabled true and image_digest in
      group_vars/all.yml and re-run bootstrap.sh (lab-host/README.md, "Tool add-ons").
      {% endif %}
