---
# labs_agent_user, labs_agent_home, labs_agent_repo_url, labs_agent_repo_ref,
# labs_agent_node_version and labs_agent_id are pins, host identity or (for
# labs_agent_repo_ref) the playbook's own commit, and live in
# group_vars/all.yml; meta/argument_specs.yml marks them required.
labs_agent_group: "{{ labs_agent_user }}"
labs_agent_app_dir: "{{ labs_agent_home }}/vps-agent"
labs_agent_state_dir: /var/lib/hcw-labs-agent
# Where the agent stages each job's payload before bind-mounting it into the
# job container (lib/docker-runner.js uses os.tmpdir()). It must be a path the
# Docker daemon can see, so it is not the unit's private /tmp.
labs_agent_tmp_dir: /var/lib/hcw-labs-agent/tmp
labs_agent_config_dir: /etc/hcw
labs_agent_env_file: /etc/hcw/labs-agent.env
labs_agent_certificate_path: /etc/hcw/labs-agent.pem
labs_agent_public_certificate_path: /etc/hcw/labs-agent.crt
labs_agent_certificate_days: 730
# Every run checks the certificate's remaining validity and prints a warning
# inside this window, pointing at the rotation procedure in lab-host/README.md.
labs_agent_certificate_warn_days: 60
labs_agent_service_name: hcw-labs-agent

# The agent's Docker socket proxy (LAB-5, 2026-10-07; tasks/docker_proxy.yml).
# The image pin is in group_vars/all.yml; the socket path is fixed in
# vars/main.yml, because the unit, the runbook and the end-of-run checks name it.
labs_agent_docker_proxy_container: hcw-labs-agent-docker-proxy
labs_agent_docker_proxy_config_dir: /etc/hcw/labs-agent-docker-proxy
# HAProxy on a handful of connections uses a few MB.
labs_agent_docker_proxy_memory: 64m

labs_agent_node_apt_key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
labs_agent_node_apt_key_path: /etc/apt/keyrings/nodesource.asc
labs_agent_node_apt_repository_url: https://deb.nodesource.com/node_26.x

# Identity, from the vault file bootstrap.sh passes with -e. Until all four are
# set the unit is installed and left stopped: the app registration is an owner
# step (docs/standards/required-inputs.md section 4.7) and can land after the
# first bootstrap.
labs_agent_api_base: "{{ vault_labs_agent_api_base | default('') }}"
labs_agent_tenant_id: "{{ vault_labs_agent_tenant_id | default('') }}"
labs_agent_client_id: "{{ vault_labs_agent_client_id | default('') }}"
labs_agent_api_scope: "{{ vault_labs_agent_api_scope | default('') }}"

# Job limits, the defaults from vps-agent/.env.example.
labs_agent_max_concurrent: 1
labs_agent_poll_ms: 15000
# 512m since 2026-09-27 (owner decision). At 256m `terraform validate` of the
# Landing Zone Builder's full default build is OOM-killed (exit 247) after an
# offline init that succeeded; 320m passes in 20 to 86 s, 512m in 15 to 19 s.
# One job at a time on a 16 GB host makes the margin cheap. The measurement
# and the reason are beside the agent's own default in vps-agent/index.js.
labs_agent_job_memory: 512m
labs_agent_job_cpus: "0.5"
labs_agent_job_pids: 128
labs_agent_job_nofile: 1024
