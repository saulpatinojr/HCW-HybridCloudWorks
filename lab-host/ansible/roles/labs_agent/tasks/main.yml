---
- name: Create the agent group
  ansible.builtin.group:
    name: "{{ labs_agent_group }}"
    system: true
    state: present

# No supplementary groups, and the docker group above all (LAB-5,
# 2026-10-07): the docker group is root on this host. append false takes the
# user out of it on a host where an earlier run put it there. The agent
# reaches Docker through hcw-labs-agent-docker-proxy instead
# (tasks/docker_proxy.yml), and the process picks the change up when the
# unit's change below restarts it.
- name: Create the agent user, in no group but its own
  ansible.builtin.user:
    name: "{{ labs_agent_user }}"
    group: "{{ labs_agent_group }}"
    groups: []
    append: false
    system: true
    shell: /usr/sbin/nologin
    home: "{{ labs_agent_home }}"
    create_home: false
    state: present

- name: Install the packages the checkout and the Node.js repository need
  ansible.builtin.apt:
    name:
      - git
      - ca-certificates
      - curl
      - openssl
      - python3-debian
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: "{{ labs_agent_node_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the NodeSource apt signing key and refuse one that does not match its pinned checksum
  ansible.builtin.get_url:
    url: "{{ labs_agent_node_apt_key_url }}"
    dest: "{{ labs_agent_node_apt_key_path }}"
    checksum: "{{ labs_agent_node_apt_key_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the NodeSource Node.js 26 repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types:
      - deb
    uris: "{{ labs_agent_node_apt_repository_url }}"
    suites:
      - nodistro
    components:
      - main
    architectures:
      - amd64
    signed_by: "{{ labs_agent_node_apt_key_path }}"
    state: present

- name: Install Node.js at the pinned version
  ansible.builtin.apt:
    name: "nodejs={{ labs_agent_node_version }}"
    state: present
    update_cache: true
    install_recommends: false
    allow_downgrade: true
    allow_change_held_packages: true

# Retried: dpkg --set-selections does not wait for the dpkg lock (see the
# docker role's hold task).
- name: Hold the pinned Node.js package so apt never moves it
  ansible.builtin.dpkg_selections:
    name: nodejs
    selection: hold
  register: labs_agent_node_hold
  until: labs_agent_node_hold is succeeded
  retries: 30
  delay: 20

- name: Create the agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ labs_agent_home }}"
    - "{{ labs_agent_state_dir }}"
    - "{{ labs_agent_config_dir }}"

- name: Create the job staging directory the Docker daemon can see
  ansible.builtin.file:
    path: "{{ labs_agent_tmp_dir }}"
    state: directory
    owner: "{{ labs_agent_user }}"
    group: "{{ labs_agent_group }}"
    mode: "0750"

- name: Run the Docker socket proxy the agent reaches Docker through
  ansible.builtin.import_tasks: docker_proxy.yml

# `repo:` also repoints an existing checkout: when the origin differs, the
# module runs `git remote set-url origin` before it fetches, and check mode
# reports it as a change (set_remote_url in ansible-core 2.21's git module,
# read 2026-10-08). So the agent's checkout, cloned from the HybridCloudWorks
# organisation before the repository moved on 2026-10-07, follows
# labs_agent_repo_url on the next run with nothing else to do (#1009).
- name: Check out the repository at labs_agent_repo_ref
  ansible.builtin.git:
    repo: "{{ labs_agent_repo_url }}"
    dest: "{{ labs_agent_home }}"
    version: "{{ labs_agent_repo_ref }}"
  register: labs_agent_checkout
  notify: Restart hcw-labs-agent

# node_modules holds one commit's dependencies at a time, so only that
# commit's stamp may exist. A stamp left by another commit would let the
# install below be skipped on a return to that commit (a hold released, a
# rollback undone) with the other commit's dependencies still installed.
- name: Find dependency stamps written for another commit or Node.js pin
  ansible.builtin.find:
    paths: "{{ labs_agent_state_dir }}"
    patterns: deps-installed-*
    excludes: "{{ labs_agent_deps_stamp | basename }}"
  register: labs_agent_stale_stamps

- name: Remove them, so the install below runs for any commit it has not just run for
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ labs_agent_stale_stamps.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# --ignore-scripts: none of the agent's dependencies needs an install hook
# (checked 2026-10-06, LAB-5), and a postinstall in a compromised package
# would otherwise run as root on the host.
- name: Install the agent's production dependencies for this commit
  ansible.builtin.shell:
    cmd: npm ci --omit=dev --ignore-scripts && touch "{{ labs_agent_deps_stamp }}"
    chdir: "{{ labs_agent_app_dir }}"
    creates: "{{ labs_agent_deps_stamp }}"
  notify: Restart hcw-labs-agent

- name: Generate the agent's private key and self-signed certificate on this host
  ansible.builtin.shell:
    cmd: >-
      umask 077
      && openssl req -x509 -newkey rsa:4096 -sha256 -nodes
      -days {{ labs_agent_certificate_days }}
      -subj "/CN={{ labs_agent_id }}"
      -keyout "{{ labs_agent_certificate_path }}"
      -out "{{ labs_agent_public_certificate_path }}"
      && cat "{{ labs_agent_public_certificate_path }}" >> "{{ labs_agent_certificate_path }}"
    creates: "{{ labs_agent_certificate_path }}"

- name: Keep the certificate and key root-owned, readable only by the agent's group
  ansible.builtin.file:
    path: "{{ labs_agent_certificate_path }}"
    owner: root
    group: "{{ labs_agent_group }}"
    mode: "0640"

- name: Make the public certificate readable so it can be uploaded to the app registration
  ansible.builtin.file:
    path: "{{ labs_agent_public_certificate_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Check how long the agent certificate remains valid
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "{{ labs_agent_certificate_warn_seconds }}"
      - -noout
      - -in
      - "{{ labs_agent_public_certificate_path }}"
  register: labs_agent_certificate_check
  changed_when: false
  failed_when: labs_agent_certificate_check.rc not in [0, 1]

- name: Warn when the agent certificate is close to expiry
  ansible.builtin.debug:
    msg: >-
      {{ labs_agent_public_certificate_path }} expires within
      {{ labs_agent_certificate_warn_days }} days. Rotate it now: generate the next key
      pair, register the new public certificate on the app registration first, then swap
      the PEM — the steps are in lab-host/README.md under "Rotating the agent certificate".
  when: labs_agent_certificate_check.rc | default(0) == 1

# scripts/lab-job-limits.test.mjs holds the DEFAULTS to this budget; a host
# override set in the inventory never reaches that test, so the role refuses it
# here, before the env file and the unit are written (CodeRabbit on #1188).
# The agent's shutdown sends two heartbeats of at most 5 s each beside the
# drain, so systemd's stop timeout must cover the drain plus both, or it kills
# the agent before the interrupted jobs are reported and the host goes offline.
- name: Refuse a shutdown budget the unit's stop timeout cannot cover
  ansible.builtin.assert:
    that:
      - labs_agent_shutdown_timeout_ms | int > 0
      - labs_agent_timeout_stop_sec | int > 0
      - (labs_agent_timeout_stop_sec | int) * 1000 >= (labs_agent_shutdown_timeout_ms | int) + 2 * 5000
    fail_msg: >-
      labs_agent_timeout_stop_sec ({{ labs_agent_timeout_stop_sec }} s) must be at least
      labs_agent_shutdown_timeout_ms ({{ labs_agent_shutdown_timeout_ms }} ms) plus the two
      5 s shutdown heartbeats, and both must be positive; otherwise systemd kills the agent
      before it reports the jobs it interrupted.
    quiet: true

# The unit's RuntimeDirectory= is rendered from the acknowledgement's
# directory, which systemd can only create directly under /run (LAB-13,
# #959). A path anywhere else would be one the agent cannot write, and the
# idle reboot would defer every night.
- name: Refuse a maintenance acknowledgement path the unit could not create
  ansible.builtin.assert:
    that:
      - labs_agent_maintenance_ack_path is match('^/run/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$')
    fail_msg: >-
      labs_agent_maintenance_ack_path ({{ labs_agent_maintenance_ack_path }}) must be
      /run/<directory>/<file>: the unit creates that directory as its RuntimeDirectory=.
    quiet: true

- name: Write the agent environment from the vault
  ansible.builtin.template:
    src: labs-agent.env.j2
    dest: "{{ labs_agent_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: labs_agent_configured | bool
  notify: Restart hcw-labs-agent

# The unit runs this as root before the agent starts and after it exits, so
# a job container the agent did not finish removing never outlives it
# (CodeRabbit on #1188). Installed before the unit that names it.
- name: Install the orphaned lab job container sweep
  ansible.builtin.copy:
    src: hcw-labjob-sweep
    dest: /usr/local/libexec/hcw-labjob-sweep
    owner: root
    group: root
    mode: "0755"

- name: Install the agent systemd unit
  ansible.builtin.template:
    src: hcw-labs-agent.service.j2
    dest: "/etc/systemd/system/{{ labs_agent_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart hcw-labs-agent

- name: Check whether the agent unit is installed
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ labs_agent_service_name }}.service"
  register: labs_agent_unit_stat

- name: Enable and start the agent
  ansible.builtin.systemd_service:
    name: "{{ labs_agent_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: labs_agent_configured | bool

- name: Stop and disable the agent while its identity is missing
  ansible.builtin.systemd_service:
    name: "{{ labs_agent_service_name }}"
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - not labs_agent_configured | bool
    - labs_agent_unit_stat.stat.exists

- name: Remove the stale environment so removed credentials cannot be reused by a manual start
  ansible.builtin.file:
    path: "{{ labs_agent_env_file }}"
    state: absent
  when: not labs_agent_configured | bool

- name: Say why the agent is not running yet
  ansible.builtin.debug:
    msg: >-
      {{ labs_agent_service_name }} is installed but not started: one or more of
      vault_labs_agent_api_base, vault_labs_agent_tenant_id, vault_labs_agent_client_id
      and vault_labs_agent_api_scope is unset. Provision the identity
      (docs/standards/required-inputs.md section 4.7) using the public certificate at
      {{ labs_agent_public_certificate_path }}, add the four values to the vault, and re-run
      bootstrap.sh.
  when: not labs_agent_configured | bool
