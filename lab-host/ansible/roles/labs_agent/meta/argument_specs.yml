---
argument_specs:
  main:
    short_description: Run vps-agent as a systemd service from a checkout of the repository at a given commit
    description:
      - Creates the agent user in no group but its own (never the docker group, which is root
        on the host; LAB-5), runs hcw-labs-agent-docker-proxy, HAProxy with the allowlist in
        templates/docker-proxy.haproxy.cfg.j2, on a Unix socket only the agent's group may
        open, and points the unit's DOCKER_HOST at it.
      - Installs Node.js 26 from NodeSource at a pinned version, checks the repository out at
        labs_agent_repo_ref (by default the commit the playbook runs from) and runs
        npm ci --omit=dev once per commit and Node.js pin.
      - Generates the agent's private key and self-signed certificate on the host if absent and
        keeps the PEM root-owned, group hcw-labs-agent, mode 0640, so the service can read it
        and nothing else can. Only the public certificate leaves the host.
      - Writes /etc/hcw/labs-agent.env with the names from vps-agent/.env.example from vault
        variables and starts the unit only once all four identity values are present.
    author: HybridCloudWorks
    options:
      labs_agent_user:
        type: str
        required: true
        description: Service user, hcw-labs-agent on the lab host.
      labs_agent_group:
        type: str
        required: false
        description: Primary group; defaults to the user name.
      labs_agent_home:
        type: path
        required: true
        description: Where the repository is checked out, /opt/hcw-labs-agent on the lab host.
      labs_agent_repo_url:
        type: str
        required: true
        description: Repository to clone.
      labs_agent_repo_ref:
        type: str
        required: true
        description:
          - Commit sha (or tag) to check out. group_vars/all.yml sets it to the full sha of the
            playbook's own checkout, which bootstrap.sh leaves at the commit it resolved from
            HCW_REPO_REF (origin/main by default), so the agent runs the same commit as the
            playbook. -e labs_agent_repo_ref=<sha> holds the agent at another commit.
          - The dependency stamp is keyed on the commit the checkout lands on, so a change of
            commit reinstalls dependencies and restarts the service.
      labs_agent_node_version:
        type: str
        required: true
        description: NodeSource apt version string for nodejs, for example 26.10.0-1nodesource1.
      labs_agent_id:
        type: str
        required: true
        description: LABS_AGENT_ID, the id of this agent's lab_agents registry document. Also the certificate CN.
      labs_agent_api_base:
        type: str
        required: false
        default: ""
        description: LABS_AGENT_API_BASE; defaults to vault_labs_agent_api_base.
      labs_agent_tenant_id:
        type: str
        required: false
        default: ""
        description: LABS_AGENT_TENANT_ID; defaults to vault_labs_agent_tenant_id.
      labs_agent_client_id:
        type: str
        required: false
        default: ""
        description: LABS_AGENT_CLIENT_ID; defaults to vault_labs_agent_client_id.
      labs_agent_api_scope:
        type: str
        required: false
        default: ""
        description: LABS_AGENT_API_SCOPE; defaults to vault_labs_agent_api_scope.
      labs_agent_max_concurrent:
        type: int
        required: false
        default: 1
        description: LABS_AGENT_MAX_CONCURRENT.
      labs_agent_poll_ms:
        type: int
        required: false
        default: 15000
        description: LABS_AGENT_POLL_MS.
      labs_agent_job_memory:
        type: str
        required: false
        default: 512m
        description: LABS_AGENT_JOB_MEMORY.
      labs_agent_job_cpus:
        type: str
        required: false
        default: "0.5"
        description: LABS_AGENT_JOB_CPUS.
      labs_agent_job_pids:
        type: int
        required: false
        default: 128
        description: LABS_AGENT_JOB_PIDS.
      labs_agent_job_nofile:
        type: int
        required: false
        default: 1024
        description: "LABS_AGENT_JOB_NOFILE, the open-files ceiling per job container (LAB-13, issue 959)."
      labs_agent_state_dir:
        type: path
        required: false
        default: /var/lib/hcw-labs-agent
        description: Holds the stamp that records npm ci has run for the checked-out commit and Node.js pin; stamps for any other are removed.
      labs_agent_tmp_dir:
        type: path
        required: false
        default: /var/lib/hcw-labs-agent/tmp
        description:
          - TMPDIR for the service. The runner stages each job payload here and bind-mounts it
            into the job container, so it must be visible to the Docker daemon; the unit's
            PrivateTmp /tmp is not.
      labs_agent_config_dir:
        type: path
        required: false
        default: /etc/hcw
        description: Holds the env file and the certificate.
      labs_agent_env_file:
        type: path
        required: false
        default: /etc/hcw/labs-agent.env
        description: EnvironmentFile for the unit, root-only.
      labs_agent_certificate_path:
        type: path
        required: false
        default: /etc/hcw/labs-agent.pem
        description: PEM with the private key and certificate, root:hcw-labs-agent 0640.
      labs_agent_public_certificate_path:
        type: path
        required: false
        default: /etc/hcw/labs-agent.crt
        description: The certificate alone, world-readable, for upload to the app registration.
      labs_agent_certificate_days:
        type: int
        required: false
        default: 730
        description: Validity of a newly generated certificate.
      labs_agent_certificate_warn_days:
        type: int
        required: false
        default: 60
        description: Every run warns when the certificate expires within this many days.
      labs_agent_service_name:
        type: str
        required: false
        default: hcw-labs-agent
        description: systemd unit name.
      labs_agent_docker_proxy_image:
        type: str
        required: true
        description: The proxy's image, haproxy (Docker's official image).
      labs_agent_docker_proxy_image_tag:
        type: str
        required: true
        description: The release the digest was read from; for people, never pulled.
      labs_agent_docker_proxy_image_digest:
        type: str
        required: true
        description: The image index digest the proxy runs, sha256:<64 hex>.
      labs_agent_docker_proxy_container:
        type: str
        required: false
        default: hcw-labs-agent-docker-proxy
        description: The proxy container's name.
      labs_agent_docker_proxy_config_dir:
        type: path
        required: false
        default: /etc/hcw/labs-agent-docker-proxy
        description: Holds the rendered haproxy.cfg the proxy mounts read-only.
      labs_agent_docker_proxy_memory:
        type: str
        required: false
        default: 64m
        description: The proxy container's memory limit.
      labs_agent_node_apt_key_url:
        type: str
        required: false
        default: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        description: NodeSource signing key.
      labs_agent_node_apt_key_checksum:
        type: str
        required: true
        description: sha256:<hex> of the NodeSource signing key; get_url refuses one that does not match.
      labs_agent_node_apt_key_path:
        type: path
        required: false
        default: /etc/apt/keyrings/nodesource.asc
        description: Where the signing key is stored.
      labs_agent_node_apt_repository_url:
        type: str
        required: false
        default: https://deb.nodesource.com/node_26.x
        description: NodeSource repository for the Node.js 26 line.
      labs_agent_shutdown_timeout_ms:
        type: int
        required: false
        default: 5000
        description:
          - "LABS_AGENT_SHUTDOWN_TIMEOUT_MS (LAB-13, issue 959): how long the agent waits, after SIGTERM, for the
            reports of the jobs it interrupted before it goes offline and exits."
          - Must stay within labs_agent_timeout_stop_sec less the two 5 s shutdown heartbeats;
            scripts/lab-job-limits.test.mjs checks the defaults.
      labs_agent_timeout_stop_sec:
        type: int
        required: false
        default: 30
        description:
          - "systemd TimeoutStopSec for hcw-labs-agent (LAB-13, issue 959), after which systemd kills what is left
            of the unit."
          - Covers labs_agent_shutdown_timeout_ms plus the two 5 s shutdown heartbeats, with margin. The unit
            sets KillMode=mixed, so SIGTERM reaches the agent alone and never the docker CLI it runs.
      labs_agent_maintenance_hold_path:
        type: path
        required: false
        default: /run/hcw-maintenance/reboot-hold
        description:
          - "LABS_AGENT_MAINTENANCE_HOLD_PATH (LAB-13, issue 959): the file the hardening role's
            hcw-reboot-when-idle writes before its second look at an idle host. The agent claims no new job
            while it holds an expiry in the future, and never for longer than ten minutes from its write."
          - Must equal hardening_reboot_hold_path; scripts/lab-job-limits.test.mjs checks the defaults.
      labs_agent_maintenance_ack_path:
        type: path
        required: false
        default: /run/hcw-labs-agent/maintenance-ack
        description:
          - "LABS_AGENT_MAINTENANCE_ACK_PATH (LAB-13, issue 959): where the agent writes the hold's expiry once
            no claim is in flight and no job is running. hcw-reboot-when-idle waits for it before its second
            look, and defers the night without it."
          - Must be /run/<directory>/<file>; the unit's RuntimeDirectory= is the directory, owned by the
            agent's user and removed when the agent stops. Must equal hardening_reboot_ack_path;
            scripts/lab-job-limits.test.mjs checks the defaults.
