---
- name: Refuse tag names or values containing a comma, an equals sign or a space
  ansible.builtin.assert:
    that:
      - (arc_tags.keys() | list + arc_tags.values() | list) | select('search', '[ ,=]') | list | length == 0
    fail_msg: >-
      arc_tags is passed to azcmagent as Name=Value pairs joined by commas, so
      no tag name or value may contain a comma, an equals sign or a space.
    quiet: true

- name: Install the packages the Microsoft repository and the agent need
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssl
      - python3-debian
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: "{{ arc_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Microsoft's apt signing key and refuse one that does not match its pinned checksum
  ansible.builtin.get_url:
    url: "{{ arc_apt_key_url }}"
    dest: "{{ arc_apt_key_path }}"
    checksum: "{{ arc_apt_key_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Microsoft's Ubuntu package repository
  ansible.builtin.deb822_repository:
    name: microsoft-prod
    types:
      - deb
    uris: "{{ arc_apt_repository_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - main
    architectures:
      - amd64
    signed_by: "{{ arc_apt_key_path }}"
    state: present

- name: Install the Azure Connected Machine agent at the pinned version
  ansible.builtin.apt:
    name: "azcmagent={{ arc_agent_version }}"
    state: present
    update_cache: true
    install_recommends: false
    allow_downgrade: true
    allow_change_held_packages: true

# Retried: dpkg --set-selections does not wait for the dpkg lock (see the
# docker role's hold task).
- name: Hold the pinned agent package so apt never moves it
  ansible.builtin.dpkg_selections:
    name: azcmagent
    selection: hold
  register: arc_hold
  until: arc_hold is succeeded
  retries: 30
  delay: 20

# Read-only, so it runs in check mode too. A fresh install reports
# Disconnected; anything that is not Connected goes on to connect, and an
# unparseable status fails the play rather than being read as either.
- name: Read the agent's connection state
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - show
      - --json
  register: arc_show
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record the agent's connection state
  ansible.builtin.set_fact:
    arc_status: "{{ (arc_show.stdout | from_json).status if arc_show.rc == 0 else 'NotInstalled' }}"

# Fail closed, as the coder role does, but only where the credential is
# needed. Once the machine is Connected, scripts/lab/Register-LabArc.ps1
# -Connect deletes the secret from the vault and from Entra (ADR 0032: never
# on the host after onboarding), so a Connected host must keep converging
# without it. Two tasks with the same condition rather than a block: a block
# here would only group them, and checkov's CKV2_ANSIBLE_3 reads a block
# without a rescue as unhandled errors, where a rescue would swallow exactly
# the failures these exist to raise.
- name: Refuse to onboard without the four Arc vault values
  ansible.builtin.assert:
    that:
      - arc_identity_present | bool
    fail_msg: >-
      arc_enabled is true, the agent reports {{ arc_status }}, and one of
      vault_arc_service_principal_id, vault_arc_service_principal_secret,
      vault_arc_tenant_id and vault_arc_subscription_id is unset. Run
      scripts/lab/Register-LabArc.ps1, which writes all four, then its
      -Connect run (docs/runbooks/labs-host.md, "Arc onboarding"); or
      remove /etc/ansible/facts.d/hcw_arc.fact to turn Arc off here.
    quiet: true
  when: arc_status != 'Connected'

- name: Refuse Arc identifiers that are not GUIDs
  ansible.builtin.assert:
    that:
      - arc_service_principal_id is match(arc_guid_pattern)
      - arc_tenant_id is match(arc_guid_pattern)
      - arc_subscription_id is match(arc_guid_pattern)
    fail_msg: >-
      vault_arc_service_principal_id (the application id, not the object
      id), vault_arc_tenant_id and vault_arc_subscription_id must each be a
      GUID. One of them is not, which usually means two values were pasted
      into each other's keys.
    quiet: true
  when: arc_status != 'Connected'

- name: Connect to Azure Arc with the onboarding service principal
  when:
    - arc_status != 'Connected'
    - not ansible_check_mode
  block:
    - name: Create a private file for the connect configuration
      ansible.builtin.tempfile:
        state: file
        suffix: .arc-connect.json
      register: arc_connect_config_file

    # The secret goes into a root-only temporary file passed with --config,
    # never onto the command line, and the always: below deletes the file
    # whether connect succeeds or not.
    - name: Write the connect configuration
      ansible.builtin.copy:
        dest: "{{ arc_connect_config_file.path }}"
        content: "{{ arc_connect_config | to_nice_json(indent=2) }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Run azcmagent connect
      ansible.builtin.command:
        argv:
          - "{{ arc_azcmagent_path }}"
          - connect
          - --config
          - "{{ arc_connect_config_file.path }}"
      register: arc_connect
      changed_when: arc_connect.rc == 0

  always:
    - name: Delete the connect configuration
      ansible.builtin.file:
        path: "{{ arc_connect_config_file.path }}"
        state: absent
      when: arc_connect_config_file.path is defined

- name: Read the agent's connection state after connecting
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - show
      - --json
  register: arc_show_after
  changed_when: false
  when: not ansible_check_mode

- name: Assert the agent reports Connected
  ansible.builtin.assert:
    that:
      - (arc_show_after.stdout | from_json).status == 'Connected'
    fail_msg: >-
      azcmagent show reports {{ (arc_show_after.stdout | from_json).status }}
      after connect. `sudo /opt/azcmagent/bin/azcmagent show` and
      `sudo /opt/azcmagent/bin/azcmagent check --location {{ arc_location }}`
      on the host say why.
    success_msg: >-
      Connected to Azure Arc as {{ arc_resource_name }} in {{ arc_resource_group }}.
  when: not ansible_check_mode

# Agent lockdown (estate review 2026-10-06, LAB-6, shipped with LAB-5). An
# Arc machine accepts any extension and Run Command from any identity with
# Contributor on its resource group, which is root on the host over the
# control plane, bypassing sshd. The allowlist admits the one extension this
# estate installs (the Azure Monitor Agent, docs/runbooks/labs-host.md).
# Incoming connections (SSH over Arc, Windows Admin Center) were off until
# 2026-10-16; since #953 (LAB-7; ADR 0032, amendment of that date) they are
# on for port 22 alone, sshd's, so the owner can reach sshd through Arc SSH
# once port 22 is closed to the internet. The relay delivers a stream to
# sshd, which still asks for the pinned key, and nothing else listens for it:
# Windows Admin Center and every other port stay refused, and no extension is
# added. arc_incoming_ssh_enabled false puts LAB-6's state back. Guest
# configuration is off too (owner decision 2026-10-07, ADR 0032 amendment of
# that date):
# Microsoft's locked-down-machine guidance disables it so a custom machine
# configuration policy cannot rewrite the agent settings above, and it
# avoids the per-server machine-configuration charge on an Arc server. Each
# setting is read first and written only when it differs, so the play
# reports changed truthfully.
#
# The reads run in check mode too (check_mode: false; `config get` changes
# nothing), and so do the reductions below them, so that the nightly
# `--check --diff` run (hcw-playbook-drift, LAB-4) sees these settings. The
# writes cannot run there; the check-mode report after the reductions turns
# a difference into a changed task instead, which is how that run counts
# drift. Until 2026-10-16 the reads were skipped in check mode, and drift in
# the agent's lockdown was invisible to it.
- name: Read the Arc agent's extension allowlist
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - get
      - extensions.allowlist
  register: arc_allowlist_get
  changed_when: false
  check_mode: false

- name: Read whether incoming connections through Arc are enabled
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - get
      - incomingconnections.enabled
  register: arc_incoming_get
  changed_when: false
  check_mode: false

- name: Read the ports incoming connections through Arc may reach
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - get
      - incomingconnections.ports
  register: arc_ports_get
  changed_when: false
  check_mode: false

- name: Read whether guest configuration is enabled on the Arc agent
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - get
      - guestconfiguration.enabled
  register: arc_guestconfig_get
  changed_when: false
  check_mode: false

# `config get` prints `<key> : <value>` (the same layout as `config list`)
# or the bare value, depending on the agent version. The first output line
# is reduced to the value, and a list value to its sorted entries with brackets, quotes and
# spaces removed, so the comparison below is whole-list equality: an
# allowlist that CONTAINS the Azure Monitor Agent beside a second extension
# is not the allowlist this role asserts, and is rewritten. (A substring
# test here would have accepted it; review of #909.) The first version read
# `config list --json` and assumed a list of name/value objects, which it is
# not, and the play stopped here on the owner's first re-run (2026-10-06).
# Agent 1.68 prints the bare value: `false`, `[]`, and
# `[Microsoft.Azure.Monitor/AzureMonitorLinuxAgent]` (read on the host
# 2026-10-16); the ports list reads the same way, so `[22]` and `[]` reduce
# to ['22'] and [].
- name: Reduce the four readings to comparable values
  ansible.builtin.set_fact:
    arc_allowlist_current: >-
      {{ ((arc_allowlist_get.stdout_lines | first | default('')) | regex_replace('^[^:]*:', '')
          | regex_replace('[\[\]"\s]', '')).split(',')
         | reject('eq', '') | sort }}
    arc_allowlist_wanted: >-
      {{ (arc_extensions_allowlist | regex_replace('\s', '')).split(',')
         | reject('eq', '') | sort }}
    arc_incoming_current: >-
      {{ (arc_incoming_get.stdout_lines | first | default('')) | regex_replace('^[^:]*:', '') | trim | lower }}
    arc_ports_current: >-
      {{ ((arc_ports_get.stdout_lines | first | default('')) | regex_replace('^[^:]*:', '')
          | regex_replace('[\[\]"\s]', '')).split(',')
         | reject('eq', '') | sort }}
    arc_guestconfig_current: >-
      {{ (arc_guestconfig_get.stdout_lines | first | default('')) | regex_replace('^[^:]*:', '') | trim | lower }}

# Check mode only: the writes below are skipped there, so a setting that
# differs would otherwise pass unseen. This reports it as one changed task,
# which hcw-playbook-drift counts as drift and names, and the check carries on
# through the roles after this one. A failed task here would stop the whole
# check at the third role and hide drift in every role after it.
- name: Report Arc agent settings that differ from this role's (check mode)
  ansible.builtin.debug:
    msg: >-
      The Arc agent would be changed: extensions.allowlist {{ arc_allowlist_current }}
      (wanted {{ arc_allowlist_wanted }}), incomingconnections.enabled
      {{ arc_incoming_current }} (wanted {{ arc_incoming_enabled_wanted }}),
      incomingconnections.ports {{ arc_ports_current }} (wanted
      {{ arc_incoming_ports_wanted }}), guestconfiguration.enabled
      {{ arc_guestconfig_current }} (wanted false).
  changed_when: true
  when:
    - ansible_check_mode
    - >-
      arc_allowlist_current != arc_allowlist_wanted
      or arc_incoming_current != arc_incoming_enabled_wanted
      or arc_ports_current != arc_incoming_ports_wanted
      or arc_guestconfig_current != 'false'

- name: Allow only the Azure Monitor Agent extension
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - set
      - extensions.allowlist
      - "{{ arc_extensions_allowlist }}"
  # Runs only when the whole list differs, so a run is a change.
  changed_when: true
  when:
    - not ansible_check_mode
    - arc_allowlist_current != arc_allowlist_wanted

# Ports before the switch, so that the moment incoming connections turn on
# the agent admits 22 alone; and, turning Arc SSH off, the switch before the
# ports are cleared.
- name: Admit port 22 alone for incoming connections through Arc
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - set
      - incomingconnections.ports
      - "22"
  changed_when: true
  when:
    - not ansible_check_mode
    - arc_incoming_ssh_enabled | bool
    - arc_ports_current != arc_incoming_ports_wanted

# Turning Arc SSH off must not leave the host with no SSH path (#953 stage 3;
# CodeRabbit on #1258). Before anything changes on the agent.
- name: Refuse to turn Arc SSH off while ufw keeps port 22 closed
  ansible.builtin.import_tasks: ssh_off_guard.yml

- name: Turn incoming connections through Arc on for Arc SSH, or off without it
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - set
      - incomingconnections.enabled
      - "{{ arc_incoming_enabled_wanted }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - arc_incoming_current != arc_incoming_enabled_wanted

- name: Clear the incoming ports when Arc SSH is off
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - clear
      - incomingconnections.ports
  changed_when: true
  when:
    - not ansible_check_mode
    - not (arc_incoming_ssh_enabled | bool)
    - arc_ports_current | length > 0

# Read back after the writes above, and fail closed if they did anything but
# what they say: Arc SSH opens port 22 and nothing else, and adding it must
# not widen what the agent may install. A run that leaves the allowlist
# admitting a second extension, or the agent open on another port, stops
# here naming what it found. Real runs only: in check mode nothing was
# written, so the read-back would repeat the reads above, whose differences
# the check-mode report has already counted as drift without stopping the
# check.
- name: Read the extension allowlist and the incoming-connection settings back
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - get
      - "{{ item }}"
  loop:
    - extensions.allowlist
    - incomingconnections.enabled
    - incomingconnections.ports
  register: arc_lockdown_after
  changed_when: false
  when: not ansible_check_mode

- name: Reduce the read-back to comparable values
  ansible.builtin.set_fact:
    arc_allowlist_after: >-
      {{ ((arc_lockdown_after.results[0].stdout_lines | first | default('')) | regex_replace('^[^:]*:', '')
          | regex_replace('[\[\]"\s]', '')).split(',')
         | reject('eq', '') | sort }}
    arc_incoming_after: >-
      {{ (arc_lockdown_after.results[1].stdout_lines | first | default('')) | regex_replace('^[^:]*:', '') | trim | lower }}
    arc_ports_after: >-
      {{ ((arc_lockdown_after.results[2].stdout_lines | first | default('')) | regex_replace('^[^:]*:', '')
          | regex_replace('[\[\]"\s]', '')).split(',')
         | reject('eq', '') | sort }}
  when: not ansible_check_mode

- name: Assert the extension allowlist is unchanged and incoming connections reach port 22 alone
  ansible.builtin.assert:
    that:
      - arc_allowlist_after == arc_allowlist_wanted
      - arc_incoming_after == arc_incoming_enabled_wanted
      - arc_ports_after == arc_incoming_ports_wanted
    fail_msg: >-
      The Arc agent reads extensions.allowlist {{ arc_allowlist_after }},
      incomingconnections.enabled {{ arc_incoming_after }} and
      incomingconnections.ports {{ arc_ports_after }}; this role sets
      {{ arc_allowlist_wanted }}, {{ arc_incoming_enabled_wanted }} and
      {{ arc_incoming_ports_wanted }} (arc_incoming_ssh_enabled is
      {{ arc_incoming_ssh_enabled | bool }}). Read them with
      `sudo /opt/azcmagent/bin/azcmagent config list` on the host. Nothing
      after this task has run.
    success_msg: >-
      Arc agent: extension allowlist {{ arc_allowlist_wanted | join(',') }};
      incoming connections {{ 'on, port 22 only (Arc SSH)' if arc_incoming_ssh_enabled | bool else 'off' }}.
  when: not ansible_check_mode

- name: Turn off guest configuration on the Arc agent
  ansible.builtin.command:
    argv:
      - "{{ arc_azcmagent_path }}"
      - config
      - set
      - guestconfiguration.enabled
      - "false"
  changed_when: true
  when:
    - not ansible_check_mode
    - arc_guestconfig_current != 'false'
