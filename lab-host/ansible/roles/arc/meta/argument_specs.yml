---
argument_specs:
  main:
    short_description: Install the Azure Connected Machine agent at a pinned version and connect the host to Azure Arc
    description:
      - Adds Microsoft's signed Ubuntu apt repository, refusing a signing key whose SHA256 does
        not match the pin, installs azcmagent at the exact version given and holds it.
      - Runs azcmagent connect with a service principal that holds only Azure Connected Machine
        Onboarding on the target resource group (infra/lab-hybrid.tf). The credential is passed
        in a root-only temporary --config file that is deleted in the same run, never on the
        command line.
      - Idempotent. When azcmagent show already reports Connected, connect is skipped and the
        vault values are not required, so the credential can be deleted after onboarding. When
        it does not, the role fails closed unless all four vault values are present and the
        three identifiers are GUIDs.
      - Does nothing while arc_enabled is false, including never disconnecting a connected
        machine. The Azure Monitor Agent is not installed here; it is an Azure extension that
        scripts/lab/Register-LabArc.ps1 -Connect adds after onboarding (docs/runbooks/labs-host.md).
    author: HybridCloudWorks
    options:
      arc_extensions_allowlist:
        type: str
        required: false
        default: "Microsoft.Azure.Monitor/AzureMonitorLinuxAgent"
        description: The extensions the Arc agent may install, as azcmagent's extensions.allowlist value (LAB-6).
      arc_incoming_ssh_enabled:
        type: bool
        required: false
        default: true
        description:
          - Azure Arc SSH (#953, LAB-7; ADR 0032 amendment of 2026-10-16). True sets
            incomingconnections.enabled true and incomingconnections.ports 22, so the
            connectivity endpoint in infra/lab-hybrid.tf can carry SSH to sshd and to nothing
            else. False puts LAB-6's state back, incoming connections off and no port listed.
          - The extension allowlist is not touched either way, and the role fails closed if it
            reads back anything but arc_extensions_allowlist.
      arc_enabled:
        type: bool
        required: true
        description:
          - Onboard the host. group_vars/all.yml reads it from the local fact
            /etc/ansible/facts.d/hcw_arc.fact, which scripts/lab/Register-LabArc.ps1 -Connect
            writes; without that file it is false and every task is skipped.
      arc_agent_version:
        type: str
        required: true
        description:
          - Exact apt version string for azcmagent, four-part, for example "1.68.03532.1399".
      arc_apt_key_checksum:
        type: str
        required: true
        description:
          - sha256:<hex> of the key at arc_apt_key_url for the running release. The key is the
            root of trust for the version pin, so get_url refuses one that does not match.
            group_vars/all.yml picks it from a per-release map, arc_apt_key_checksums.
      arc_apt_key_urls:
        type: dict
        required: false
        default:
          resolute: https://packages.microsoft.com/keys/microsoft-2025.asc
          noble: https://packages.microsoft.com/keys/microsoft.asc
        description:
          - Ubuntu codename to the key that signs that release's Microsoft repository. The 26.04
            repository is signed by microsoft-2025.asc and the 24.04 one by microsoft.asc.
      arc_apt_key_url:
        type: str
        required: false
        default: "{{ arc_apt_key_urls[ansible_facts['distribution_release']] }}"
        description: Where the repository signing key is fetched from; the running release's entry of arc_apt_key_urls.
      arc_apt_key_path:
        type: path
        required: false
        default: /etc/apt/keyrings/microsoft.asc
        description: Where the signing key is stored; referenced by Signed-By in the source.
      arc_apt_repository_url:
        type: str
        required: false
        default: "https://packages.microsoft.com/ubuntu/{{ ansible_facts['distribution_version'] }}/prod"
        description:
          - The apt repository base URL, for the running release's version (26.04 or 24.04). The
            suite is the running release's codename.
      arc_azcmagent_path:
        type: path
        required: false
        default: /opt/azcmagent/bin/azcmagent
        description: The CLI the package installs.
      arc_ufw_path:
        type: path
        required: false
        default: /usr/sbin/ufw
        description:
          - ufw's CLI, read before Arc SSH is turned off (tasks/ssh_off_guard.yml). Absent, nothing
            filters port 22 and the guard passes; present, `ufw status` must answer, or the run
            stops before the agent is changed.
      arc_resource_group:
        type: str
        required: true
        description: Resource group the machine resource is created in, rg-lab-hybrid-prod-cus.
      arc_location:
        type: str
        required: true
        description: Azure region of the machine resource, centralus.
      arc_resource_name:
        type: str
        required: true
        description:
          - Name of the Arc machine resource. Fixed rather than the hostname default, because it
            cannot be changed without disconnecting and the runbook's az commands name it.
      arc_tags:
        type: dict
        required: true
        description:
          - Tags applied to the machine resource. No name or value may contain a comma, an equals
            sign or a space; the role asserts it.
      arc_cloud:
        type: str
        required: false
        default: AzureCloud
        choices:
          - AzureCloud
          - AzureUSGovernment
          - AzureChinaCloud
        description: Azure cloud the machine connects to.
      arc_service_principal_id:
        type: str
        required: false
        default: ""
        description: Application (client) id of the onboarding service principal; defaults to vault_arc_service_principal_id.
      arc_service_principal_secret:
        type: str
        required: false
        default: ""
        no_log: true
        description: Its client secret; defaults to vault_arc_service_principal_secret.
      arc_tenant_id:
        type: str
        required: false
        default: ""
        description: Entra tenant id; defaults to vault_arc_tenant_id.
      arc_subscription_id:
        type: str
        required: false
        default: ""
        description: Application subscription id; defaults to vault_arc_subscription_id.
