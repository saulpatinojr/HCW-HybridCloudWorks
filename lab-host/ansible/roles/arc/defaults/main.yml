---
# arc_enabled, arc_agent_version, arc_apt_key_checksum, arc_resource_group,
# arc_location, arc_resource_name and arc_tags are the switch, the pins and the
# machine's Azure identity; they live in group_vars/all.yml and
# meta/argument_specs.yml marks them required.

# Microsoft's package repository for the running Ubuntu release, and the key
# that signs its InRelease. Microsoft signs repositories created since spring
# 2025 with microsoft-2025.asc and older ones with microsoft.asc
# (https://packages.microsoft.com/keys/README); 26.04's is the first kind and
# 24.04's the second, so the key is chosen by codename. Its checksum is pinned
# per release in group_vars. The key is stored under one path whichever it is:
# get_url replaces a file whose checksum does not match, so a host that moves
# release gets the other key on its next run.
arc_apt_key_urls:
  resolute: https://packages.microsoft.com/keys/microsoft-2025.asc
  noble: https://packages.microsoft.com/keys/microsoft.asc
arc_apt_key_url: "{{ arc_apt_key_urls[ansible_facts['distribution_release']] }}"
arc_apt_key_path: /etc/apt/keyrings/microsoft.asc
arc_apt_repository_url: "https://packages.microsoft.com/ubuntu/{{ ansible_facts['distribution_version'] }}/prod"

# Where the package installs the CLI on Linux.
arc_azcmagent_path: /opt/azcmagent/bin/azcmagent

arc_cloud: AzureCloud

# Onboarding identity and target, from the vault file bootstrap.sh passes with
# -e. All four must be set when arc_enabled is true and the agent is not yet
# Connected; the role fails closed otherwise. Once it is Connected they are
# not needed, and scripts/lab/Register-LabArc.ps1 -Connect, which writes them,
# deletes all four and the secret in Entra. The service principal holds
# only Azure Connected Machine Onboarding on arc_resource_group
# (infra/lab-hybrid.tf). The tenant and subscription are identifiers rather
# than secrets, but they are kept in the vault beside the credential because
# nothing else in this repository commits them.
arc_service_principal_id: "{{ vault_arc_service_principal_id | default('') }}"
arc_service_principal_secret: "{{ vault_arc_service_principal_secret | default('') }}"
arc_tenant_id: "{{ vault_arc_tenant_id | default('') }}"
arc_subscription_id: "{{ vault_arc_subscription_id | default('') }}"

# The extensions the Arc agent may install, as azcmagent's allowlist value
# (publisher/type, comma-separated). The Azure Monitor Agent is the one this
# estate uses (LAB-6, 2026-10-06).
arc_extensions_allowlist: "Microsoft.Azure.Monitor/AzureMonitorLinuxAgent"

# Azure Arc SSH (#953, LAB-7; ADR 0032, amendment of 2026-10-16). True lets
# the agent accept incoming connections through Arc on port 22 alone, sshd's
# port, which is how the owner reaches the host once port 22 is closed to the
# internet. It reverses LAB-6's "incoming connections off" for that one port
# and nothing else: Windows Admin Center and every other port stay closed,
# and the extension allowlist above is unchanged. False puts the LAB-6 state
# back (incoming connections off, no port listed).
arc_incoming_ssh_enabled: true
