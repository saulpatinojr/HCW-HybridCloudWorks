---
# What the checks look at. Every path is the one the role that makes it fixes
# (labs_agent, coder_sandbox, coder); scripts/lab-host-docker-proxy.test.mjs
# holds these to those roles, so the checks cannot drift onto a path nothing
# creates.
privilege_checks_agent_user: "{{ labs_agent_user }}"
privilege_checks_agent_app_dir: "{{ labs_agent_home }}/vps-agent"
privilege_checks_agent_tmp_dir: /var/lib/hcw-labs-agent/tmp
privilege_checks_agent_socket: /run/hcw-labs-agent-docker/docker.sock
privilege_checks_agent_proxy_container: hcw-labs-agent-docker-proxy

# Whether the host daemon must report user-namespace remapping. Follows the
# docker role's switch, so the deliberate way back (-e
# docker_userns_remap=false) is reported as a warning, not a failure.
privilege_checks_userns_required: "{{ docker_userns_remap | default(true) }}"

# The only ports that may listen beyond the loopback (tasks/listeners.yml,
# #958): Caddy. TCP alone: Caddy serves no HTTP/3 (#958), so no UDP
# port is public. Port 22 is closed to the internet at ufw (#953 stage 3)
# and sshd listens on the loopback alone (#1257), so only 80 and 443 remain.
# The lab host's group_vars adds 22 for a run in which the hardening role's
# Arc gate has sshd listen on every address (Arc SSH not ready yet).
privilege_checks_public_tcp_ports: [80, 443]
# How the listeners are read; a test points it at a fixture.
privilege_checks_listeners_argv: [ss, -H, -l, -n, -t, -u]
# How the host daemon's published-port rules are read, IPv4 then IPv6; a test
# points them at fixtures.
privilege_checks_dnat_argv:
  - [iptables, -w, -t, nat, -S, DOCKER]
  - [ip6tables, -w, -t, nat, -S, DOCKER]

privilege_checks_coder_enabled: "{{ coder_enabled }}"
privilege_checks_coder_compose_file: /etc/hcw/coder/docker-compose.yml
privilege_checks_sandbox_socket_dir: /run/hcw-coder-docker
privilege_checks_sandbox_docker_host: unix:///run/hcw-coder-docker/docker.sock

# The tool add-on containers (ADR 0035): every enabled row with a digest,
# the ones the addons role deployed; none while addons_enabled is false.
privilege_checks_addons: >-
  {{ (addons | default([])) | selectattr('enabled') | selectattr('image_digest') | list
     if (addons_enabled | default(false)) | bool else [] }}
# What the addons role runs each container on and publishes it from: the
# role's own values (roles/addons/defaults and vars), read here so the check
# fails when a container was reused from a run with other settings.
privilege_checks_addons_network: "{{ addons_network_name | default('hcw-addons') }}"
privilege_checks_addons_container_port: "{{ addons_container_port | default(8080) }}"
