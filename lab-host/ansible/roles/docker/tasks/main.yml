---
- name: Install the packages the Docker apt repository and the Ansible Docker modules need
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
      - python3-docker
      - python3-requests
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: "{{ docker_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's apt signing key and refuse one that does not match its pinned checksum
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    checksum: "{{ docker_apt_key_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris: "{{ docker_apt_repository_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - amd64
    signed_by: "{{ docker_apt_key_path }}"
    state: present

# docker-ce-rootless-extras is the same build as docker-ce, so it takes the
# same version string. It carries rootlesskit and dockerd-rootless.sh, which
# the coder_sandbox role runs Coder's workspaces under (LAB-5). Its AppArmor
# profile for /usr/bin/rootlesskit comes from Ubuntu's apparmor package, not
# from this one (the deb ships three binaries and no profile, read
# 2026-10-07); coder_sandbox refuses to start without it.
- name: Install Docker Engine, buildx, compose and the rootless extras at the pinned versions
  ansible.builtin.apt:
    name:
      - "docker-ce={{ docker_version }}"
      - "docker-ce-cli={{ docker_version }}"
      - "docker-ce-rootless-extras={{ docker_version }}"
      - "containerd.io={{ docker_containerd_version }}"
      - "docker-buildx-plugin={{ docker_buildx_version }}"
      - "docker-compose-plugin={{ docker_compose_version }}"
    state: present
    update_cache: true
    install_recommends: false
    allow_downgrade: true
    allow_change_held_packages: true

# dpkg --set-selections takes the dpkg frontend lock and, unlike the apt
# module, does not wait for it; a timer-started unattended-upgrade can hold
# it at any point in the play (it did on 2026-09-26). Retried for up to ten
# minutes, the same budget as the apt module's lock_timeout in site.yml.
- name: Hold the pinned Docker packages so apt never moves them
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  register: docker_hold
  until: docker_hold is succeeded
  retries: 30
  delay: 20
  loop:
    - docker-ce
    - docker-ce-cli
    - docker-ce-rootless-extras
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

# User namespaces (LAB-5, 2026-10-07). Turning userns-remap on or off moves
# the daemon to another data root (/var/lib/docker/<uid>.<gid> while it is
# on), and with live-restore the old root's containers would keep running
# with no daemon that knows them. So on the run that switches, and only
# then, every running container is stopped first. The roles after this one
# create the host's own containers again in the new root, and
# userns_carry.yml below brings the named volumes that hold state across.
- name: Read the daemon configuration this run replaces
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_json_current
  failed_when: false

- name: Work out whether this run switches user-namespace remapping on or off
  ansible.builtin.set_fact:
    docker_userns_switching: >-
      {{ (docker_daemon_json_current.content | default('e30=') | b64decode | from_json).get('userns-remap', '')
         != docker_daemon_config.get('userns-remap', '') }}

- name: List the running containers the switch would leave behind
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --quiet
  register: docker_running_before_switch
  changed_when: false
  # Fails closed (#987 review): a daemon that cannot list its containers here
  # could leave them running on the old root after the restart. Only a host
  # with no daemon.json yet is skipped: that is a first run, on a daemon the
  # install above has just started, with nothing on it to stop.
  when:
    - docker_userns_switching | bool
    - docker_daemon_json_current.content is defined

- name: Stop them before the daemon changes data root
  ansible.builtin.command:
    argv: "{{ ['docker', 'stop', '--time', '30'] + docker_running_before_switch.stdout_lines }}"
  changed_when: true
  when:
    - docker_userns_switching | bool
    - docker_running_before_switch.stdout_lines | default([]) | length > 0

- name: Write the daemon configuration
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json(indent=2) }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Now rather than at the end of the play: left to the end, the restart would
# run after the coder, labs_agent and portainer roles had created their
# containers in the old data root, and would then hide every one of them.
# This flushes every handler notified so far, the hardening role's included,
# which would otherwise run at the end; force_handlers in site.yml already
# runs them whatever fails later.
- name: Restart Docker now if its configuration changed, so the roles after this one meet the new daemon
  ansible.builtin.meta: flush_handlers

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# A switch of data root leaves the old root's bridges in the kernel, down but
# with their addresses and routes, and the Coder networks' fixed subnets then
# had two routes each. The stale one came first, so the host's own traffic to
# Coder (Docker's port proxy included) went into an empty bridge, and Caddy
# answered 503 (2026-10-08). Run on every bootstrap, before any later role
# creates a network: it deletes only a bridge whose network another Docker
# data root on this host recorded, that the running daemon does not list, and
# that nothing is attached to (files/hcw-docker-stale-bridges.py).
- name: Install hcw-docker-stale-bridges, which deletes the bridges another data root left behind
  ansible.builtin.copy:
    src: hcw-docker-stale-bridges.py
    dest: /usr/local/libexec/hcw-docker-stale-bridges
    owner: root
    group: root
    mode: "0750"

- name: Delete the bridges the running daemon no longer owns, so their routes cannot shadow its own
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/hcw-docker-stale-bridges
  register: docker_stale_bridges
  changed_when: >-
    ((docker_stale_bridges.stdout | from_json).deleted | length > 0) or
    ((docker_stale_bridges.stdout | from_json).deleted_rules | default([]) | length > 0)
  when: not ansible_check_mode

- name: Say which stale bridges were left because something is still attached
  ansible.builtin.debug:
    msg: >-
      These bridges were left behind by another Docker data root but still
      have an interface attached, so they were kept: {{ (docker_stale_bridges.stdout | from_json).kept_attached | join(', ') }}.
      See which with ip link show master <bridge>.
  when:
    - not ansible_check_mode
    - (docker_stale_bridges.stdout | from_json).kept_attached | length > 0

- name: Check user-namespace remapping and carry the host's named volumes into the remapped root
  ansible.builtin.include_tasks: userns_carry.yml
  when: docker_daemon_config.get('userns-remap', '') | length > 0
