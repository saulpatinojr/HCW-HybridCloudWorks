---
# Fixed names and patterns. Not meant to be overridden, which is why they are
# vars and not defaults; tests/admin-keys.test.sh and tests/sshd-apply.test.sh
# point the paths, the journal command and the sshd binary at scratch files
# and stubs with -e, which is the one override they get.

# Root's authorized_keys. Root login is off, so the role keeps this file
# empty (#953); break-glass is meant to be hPanel's Web Console with root's
# password, and whether that goes through sshd is unverified (README,
# "Break-glass").
hardening_root_authorized_keys_path: /root/.ssh/authorized_keys

# One public key line as hardening_admin_authorized_keys must hold it: a key
# type sshd accepts, the base64 key blob, and an optional comment. No
# authorized_keys options: the list is keys, and only keys.
hardening_public_key_types: '(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-(ssh-ed25519|ecdsa-sha2-nistp256)@openssh\.com)'
hardening_public_key_pattern: '^{{ hardening_public_key_types }} AAAA[A-Za-z0-9+/]+={0,3}( \S.*)?$'

# The key blob in an authorized_keys line, wherever it stands (after
# options, before a comment). Every OpenSSH public key blob begins AAAA,
# because it begins with the four-byte length of its type name, and it
# carries that type name, so two lines name the same key exactly when their
# blobs are equal.
hardening_public_key_blob_pattern: '(?:^|\s)(AAAA[A-Za-z0-9+/]+={0,3})(?=\s|$)'

# sshd, its drop-in, and the marker that says a written drop-in has not been
# loaded yet (tasks/sshd.yml; only the Reload ssh handler removes it).
# tests/sshd-apply.test.sh points all three at a stub and scratch paths.
hardening_sshd_binary: /usr/sbin/sshd
hardening_sshd_dropin_path: /etc/ssh/sshd_config.d/00-hcw-hardening.conf
hardening_sshd_reload_marker: /var/lib/hcw-hardening/sshd-reload-pending

# Where the lockout guard reads the SSH logins of the last 14 days
# (tasks/admin_keys.yml). sshd logs each accepted login at INFO as
# `Accepted publickey for <user> from <address> port <n> ssh2: <type>
# SHA256:<fingerprint>`, under ssh.service, which runs both the listener and
# each connection's sshd-session. --quiet prints nothing for no entries.
# tests/admin-keys.test.sh points it at fixtures with -e.
hardening_ssh_login_journal_argv:
  - journalctl
  - --quiet
  - --no-pager
  - --unit
  - ssh.service
  - --since
  - 14 days ago
  - --output
  - cat

# The connection sshd -T -C is asked about after the drop-in is written: a
# label for the host and a TEST-NET-1 address (RFC 5737), which names no
# real client. sshd's configuration on this host has no Match block, so the
# address does not change the answer; a Match block added later would need
# a test connection it covers.
hardening_sshd_test_host: hcw-lab
hardening_sshd_test_addr: 192.0.2.10
# The sshd -T keywords the role holds to the drop-in, which its refusal
# prints when they differ.
hardening_sshd_checked_keywords:
  - allowusers
  - authenticationmethods
  - pubkeyauthentication
  - passwordauthentication
  - permitrootlogin
  - allowagentforwarding
  - allowtcpforwarding
  - allowstreamlocalforwarding
  - logingracetime
  - persourcepenaltyexemptlist
  - permittunnel
  - x11forwarding
  - authorizedkeysfile
