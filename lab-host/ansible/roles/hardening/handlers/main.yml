---
# A reload, never a restart (#953). ssh.service's ExecReload runs sshd -t and
# then sends HUP to the listening sshd, which re-reads its settings; each open
# session is its own sshd-session process and stays up. With ssh.service not
# running yet (ssh.socket starts it on the first connection after boot), the
# module starts it instead, which reads the new settings too.
# Ubuntu's sshd-socket-generator derives ssh.socket's ListenStream= lines
# from sshd's ListenAddress directives at daemon-reload. Restarting ssh.socket
# rebinds the listener to the loopback alone (#1257).
- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
    daemon_reload: true

- name: Restart ssh.socket
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
  listen: Reload ssh

# Notified with Reload ssh and defined after it, so it runs after the reload
# and only once the reload has succeeded (a failed handler stops the host's
# handlers). The marker says sshd has not loaded the drop-in yet
# (tasks/sshd.yml); once it has, the marker goes.
- name: Forget the pending reload of sshd
  ansible.builtin.file:
    path: "{{ hardening_sshd_reload_marker }}"
    state: absent
  listen: Reload ssh

- name: Restart unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Reload systemd for the failure notifier
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload systemd for the held-package report
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload systemd for the idle reboot
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload systemd for playbook drift detection
  ansible.builtin.systemd_service:
    daemon_reload: true
