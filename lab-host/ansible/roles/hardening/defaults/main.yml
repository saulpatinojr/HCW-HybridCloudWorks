---
# Behaviour knobs. The host's values live in group_vars/all.yml; these are the
# role's own defaults so it also works on its own.
hardening_packages:
  - openssh-server
  - sudo
  - ufw
  - fail2ban
  - unattended-upgrades

hardening_admin_user: hcwadmin
# Public keys for the administrative user. Empty means: copy whatever the
# provisioner installed in /root/.ssh/authorized_keys, so disabling root and
# password login never removes the only way in.
hardening_admin_authorized_keys: []

hardening_ufw_allowed_tcp_ports:
  - 22
  - 80
  - 443
hardening_ufw_logging: "low"

# The hour, host local time (HH:MM), at which hcw-reboot-when-idle.timer asks
# whether the host may reboot for a pending upgrade (LAB-13, #959). The other
# nightly timers are placed around it: the Coder dump at 03:30 and the Vault
# snapshot at 03:45 end before it, the held report at 07:15 starts after it.
hardening_unattended_reboot_time: "04:30"
# The origins unattended-upgrades may move packages from, rendered into
# 52hcw-unattended-upgrades rather than inherited from 50unattended-upgrades'
# defaults (LAB-13, #959): what may move is written where the role's test
# reads it, and `unattended-upgrade --dry-run -d` on the host lists exactly
# these. They are Ubuntu's own four; `-updates` is left out as Ubuntu leaves
# it. The third-party repositories the docker and labs_agent roles add are
# pinned and held, so nothing here can move them.
hardening_unattended_allowed_origins:
  - "${distro_id}:${distro_codename}"
  - "${distro_id}:${distro_codename}-security"
  - "${distro_id}ESMApps:${distro_codename}-apps-security"
  - "${distro_id}ESM:${distro_codename}-infra-security"

hardening_fail2ban_maxretry: 5
hardening_fail2ban_findtime: 10m
hardening_fail2ban_bantime: 1h

# The daily held-package report (LAB-3, #949): hcw-held-upgradable logs one
# syslog line per held package apt could upgrade, under this tag, to the
# daemon facility at warning (one line at notice when there is none). The
# tag is what a Log Analytics query or alert matches on (ProcessName).
hardening_held_report_tag: hcw-held-upgradable
# The same daily run says, at warning, while this file exists, that a reboot
# is pending and for how long (LAB-13, #959): hcw-reboot-when-idle reboots
# only with nobody logged in and no job container running, and this line is
# what says it has waited. The path is a variable for the roles' tests; both
# scripts read it.
hardening_reboot_required_path: /var/run/reboot-required
hardening_held_report_script_path: /usr/local/sbin/hcw-held-upgradable
# Daily, after the 04:30 idle-reboot window and early in the working day,
# with up to 15 minutes of jitter from the timer.
hardening_held_report_on_calendar: "*-*-* 07:15:00"

# The nightly idle reboot (LAB-13, #959). unattended-upgrades no longer
# reboots (Automatic-Reboot is off in 52hcw-unattended-upgrades): it asked
# `users` when the upgrade ran, about twenty-two hours before the reboot it
# then scheduled with no further question, and it never asked whether a
# visitor's job container was running. hcw-reboot-when-idle.timer runs the
# script at hardening_unattended_reboot_time instead, and the script reboots
# only while the marker above exists, logind has no login session (class
# user, or user- and a suffix) and no container with the job label runs;
# one syslog line per outcome under this tag, the deferrals and the reboot
# itself at warning, which the Arc data collection rule ships. A loginctl or
# a docker that does not answer fails the run, so the failure notifier pages
# rather than the host guessing. `users` is not asked: on this host it reads
# utmp, which systemd no longer writes, and prints nobody (2026-10-15).
hardening_reboot_when_idle_script_path: /usr/local/sbin/hcw-reboot-when-idle
hardening_reboot_when_idle_tag: hcw-reboot-when-idle
# The label the labs agent puts on every job container, JOB_LABEL in
# vps-agent/lib/docker-runner.js. scripts/lab-job-limits.test.mjs holds the
# two together and tests/hcw-reboot-when-idle.test.sh reads the agent's, so
# a label that drifted would fail a test rather than see no job and reboot
# through one.
hardening_reboot_job_label: hcw.lab-job
# Coder's workspaces (review of #1191). They run on the rootless sandbox
# daemon, which the host daemon's `docker ps` does not see, and a person
# working in one has no logind session on the host; so the script also
# defers while that daemon has a container with this label up. The socket
# is coder_sandbox's fixed one (roles/coder_sandbox/vars/main.yml), and
# every workspace container in lab-host/coder/templates carries the label;
# tests/hcw-reboot-when-idle.test.sh and
# scripts/lab-host-docker-proxy.test.mjs hold both. With no socket (Coder
# off) nothing is asked.
hardening_reboot_workspace_docker_host: unix:///run/hcw-coder-docker/docker.sock
hardening_reboot_workspace_label: coder.workspace_id
# The maintenance hold (CodeRabbit on #1191). One look is not enough: a job
# claimed after `docker ps` came back empty and before the reboot request
# would start a container the reboot kills. So when the first look finds the
# host idle, the script writes this file, root's, holding the epoch second
# it lapses (hardening_reboot_hold_seconds from now); the labs agent claims
# no new job while it holds (vps-agent/lib/maintenance-hold.js, through
# labs_agent_maintenance_hold_path, the same path). The script then waits
# for the agent to acknowledge the hold (hardening_reboot_ack_path, below)
# for at most hardening_reboot_hold_settle_seconds, looks again, and reboots
# only if the host is still idle. Every other way out removes the file; on
# the reboot path it stays until the reboot clears /run. Under
# /run/<directory>/, which the service creates as its RuntimeDirectory=, the
# one place it may write. scripts/lab-job-limits.test.mjs holds the path to
# the agent's and the labs_agent role's, the wait to the agent's
# ACK_WITHIN_MS and the hold to the agent's ten-minute cap; the role refuses
# values outside those bounds.
hardening_reboot_hold_path: /run/hcw-maintenance/reboot-hold
# The longest the script waits for the agent's acknowledgement before it
# defers the night (CodeRabbit's second round on #1191). At least the
# agent's ACK_WITHIN_MS (35 s: a claim already sent, 20 s, then one 15 s
# poll tick); at most 90, so the second look still fits in the service's
# 120 s TimeoutStartSec.
hardening_reboot_hold_settle_seconds: 45
# The agent's acknowledgement (CodeRabbit's second round on #1191): once no
# claim is in flight and no job is running, the agent writes the hold's
# expiry here, in its own runtime directory. A matching acknowledgement is
# the agent's word that no job is running or can start, so the script needs
# no fixed wait after it; without one, within the wait above, the night is
# deferred. The same path as labs_agent_maintenance_ack_path and the agent's
# DEFAULT_ACK_PATH; scripts/lab-job-limits.test.mjs fails if they part.
hardening_reboot_ack_path: /run/hcw-labs-agent/maintenance-ack
# The agent's unit, labs_agent_service_name. When systemd says it is
# inactive or failed, no claim can be in flight and no job can start, so the
# script looks again at once; in any other state it waits for the
# acknowledgement.
hardening_reboot_agent_service: hcw-labs-agent
# Longer than the service's TimeoutStartSec (120 s), so the hold never lapses
# while the script still runs, and within the agent's ten-minute cap.
hardening_reboot_hold_seconds: 300
# A reboot pending this many days or more turns each deferral line from
# warning to err, so a fix that needs the reboot and has waited a week is
# not one more warning among the nightly ones. Only the line changes: the
# script still never reboots over a logged-in user or a running job. Seven
# is the week the runbook already calls the sign that neither the owner's
# logout nor a reboot by hand has happened (Runtime advisories).
hardening_reboot_overdue_days: 7

# The nightly playbook drift detection timer (LAB-4, #950): hcw-playbook-drift
# runs the playbook in check and diff mode from the applied checkout, logging
# to syslog at daemon.warning and exiting non-zero on any change or failure.
# A clean run logs to syslog at daemon.notice and exits 0.
hardening_drift_tag: hcw-playbook-drift
hardening_drift_script_path: /usr/local/sbin/hcw-playbook-drift
hardening_drift_src_dir: /opt/hcw-src
# Nightly at 03:00 host local time, before the Coder dump (03:30) and the
# idle reboot (04:30), with up to 15 minutes of jitter from the timer.
hardening_drift_on_calendar: "*-*-* 03:00:00"
hardening_drift_ansible_playbook: /usr/local/bin/ansible-playbook
hardening_drift_vault_file: /etc/hcw/vault.yml
hardening_drift_vault_password_file: /etc/hcw/vault.pass
