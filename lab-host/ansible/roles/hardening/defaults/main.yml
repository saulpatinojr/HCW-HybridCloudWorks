---
# Behaviour knobs. The host's values live in group_vars/all.yml; these are the
# role's own defaults so it also works on its own.
hardening_packages:
  - openssh-server
  - sudo
  - ufw
  - fail2ban
  - unattended-upgrades

hardening_admin_user: hcwadmin
# Public keys for the administrative user. Empty means: copy whatever the
# provisioner installed in /root/.ssh/authorized_keys, so disabling root and
# password login never removes the only way in.
hardening_admin_authorized_keys: []

hardening_ufw_allowed_tcp_ports:
  - 22
  - 80
  - 443
hardening_ufw_logging: "low"

# The hour, host local time (HH:MM), at which hcw-reboot-when-idle.timer asks
# whether the host may reboot for a pending upgrade (LAB-13, #959). The other
# nightly timers are placed around it: the Coder dump at 03:30 and the Vault
# snapshot at 03:45 end before it, the held report at 07:15 starts after it.
hardening_unattended_reboot_time: "04:30"
# The origins unattended-upgrades may move packages from, rendered into
# 52hcw-unattended-upgrades rather than inherited from 50unattended-upgrades'
# defaults (LAB-13, #959): what may move is written where the role's test
# reads it, and `unattended-upgrade --dry-run -d` on the host lists exactly
# these. They are Ubuntu's own four; `-updates` is left out as Ubuntu leaves
# it. The third-party repositories the docker and labs_agent roles add are
# pinned and held, so nothing here can move them.
hardening_unattended_allowed_origins:
  - "${distro_id}:${distro_codename}"
  - "${distro_id}:${distro_codename}-security"
  - "${distro_id}ESMApps:${distro_codename}-apps-security"
  - "${distro_id}ESM:${distro_codename}-infra-security"

hardening_fail2ban_maxretry: 5
hardening_fail2ban_findtime: 10m
hardening_fail2ban_bantime: 1h

# The daily held-package report (LAB-3, #949): hcw-held-upgradable logs one
# syslog line per held package apt could upgrade, under this tag, to the
# daemon facility at warning (one line at notice when there is none). The
# tag is what a Log Analytics query or alert matches on (ProcessName).
hardening_held_report_tag: hcw-held-upgradable
# The same daily run says, at warning, while this file exists, that a reboot
# is pending and for how long (LAB-13, #959): hcw-reboot-when-idle reboots
# only with nobody logged in and no job container running, and this line is
# what says it has waited. The path is a variable for the roles' tests; both
# scripts read it.
hardening_reboot_required_path: /var/run/reboot-required
hardening_held_report_script_path: /usr/local/sbin/hcw-held-upgradable
# Daily, after the 04:30 idle-reboot window and early in the working day,
# with up to 15 minutes of jitter from the timer.
hardening_held_report_on_calendar: "*-*-* 07:15:00"

# The nightly idle reboot (LAB-13, #959). unattended-upgrades no longer
# reboots (Automatic-Reboot is off in 52hcw-unattended-upgrades): it asked
# `users` when the upgrade ran, about twenty-two hours before the reboot it
# then scheduled with no further question, and it never asked whether a
# visitor's job container was running. hcw-reboot-when-idle.timer runs the
# script at hardening_unattended_reboot_time instead, and the script reboots
# only while the marker above exists, nobody is logged in and no container
# with the job label runs; one syslog line per outcome under this tag, the
# deferrals and the reboot itself at warning, which the Arc data collection
# rule ships. A `users` or a docker that does not answer fails the run, so
# the failure notifier pages rather than the host guessing.
hardening_reboot_when_idle_script_path: /usr/local/sbin/hcw-reboot-when-idle
hardening_reboot_when_idle_tag: hcw-reboot-when-idle
# The label the labs agent puts on every job container, JOB_LABEL in
# vps-agent/lib/docker-runner.js. scripts/lab-job-limits.test.mjs holds the
# two together and tests/hcw-reboot-when-idle.test.sh reads the agent's, so
# a label that drifted would fail a test rather than see no job and reboot
# through one.
hardening_reboot_job_label: hcw.lab-job
