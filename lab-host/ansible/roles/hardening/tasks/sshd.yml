---
# sshd's settings and root's keys (#953), once admin_keys.yml has written
# hcwadmin's. The drop-in is written, proven and then loaded; root's keys
# are emptied only after sshd has loaded it. The paths and the sshd binary
# are vars (vars/main.yml), so tests/sshd-apply.test.sh runs this file
# against a stub sshd and scratch paths.

- name: Refuse an sshd allowlist that leaves out the administrative user or lets root in
  ansible.builtin.assert:
    that:
      - hardening_sshd_allow_users | length > 0
      - hardening_admin_user in hardening_sshd_allow_users
      - "'root' not in hardening_sshd_allow_users"
      - hardening_sshd_allow_users | reject('match', '^[a-z_][a-z0-9_-]*$') | list | length == 0
    fail_msg: >-
      hardening_sshd_allow_users is {{ hardening_sshd_allow_users }}. It becomes sshd's AllowUsers, the
      only accounts that may log in over SSH, so it must name {{ hardening_admin_user }}, must not name
      root (root login is off), and holds plain user names only. Nothing in sshd has been changed.
    quiet: true

# The pending-reload marker (review of #953). A run interrupted after the
# drop-in is written and before the reload below leaves a drop-in sshd has
# not loaded. The next run finds the file unchanged and notifies nothing,
# and would empty root's keys while the running sshd may still let root in.
# So the marker is written before the drop-in changes, only the reload
# handler removes it (handlers/main.yml), and a run that finds it reloads
# sshd before it touches root's keys. The preview is the template in check
# mode, which says whether the real write will change the file.
- name: See whether the sshd drop-in is about to change
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: "{{ hardening_sshd_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  check_mode: true
  register: hardening_sshd_dropin_preview

- name: Make the directory the pending-reload marker lives in
  ansible.builtin.file:
    path: "{{ hardening_sshd_reload_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mark sshd's reload pending before the drop-in changes
  ansible.builtin.copy:
    dest: "{{ hardening_sshd_reload_marker }}"
    content: >
      {{ hardening_sshd_dropin_path }} is being changed and ssh.service has not reloaded it yet;
      the hardening role's Reload ssh handler removes this file.
    owner: root
    group: root
    mode: "0644"
  # no-handler: this has to run before the drop-in is written, and a
  # handler runs after; that order is the marker's whole point.
  when: hardening_sshd_dropin_preview is changed # noqa: no-handler

# Written, then proven, then applied (#953). The template's validate parses
# the drop-in on its own; sshd -t then parses the whole configuration it is
# now part of, and sshd -T says what a login as hcwadmin and as root would
# get, which is held to what this role means. If any of that fails, the
# rescue puts the previous drop-in back before stopping: force_handlers in
# site.yml still runs the reload a changed drop-in notified, and it must
# reload the settings sshd had, not the ones that failed. In check mode a
# changed drop-in is not on disk, so the reads would describe the old one;
# they run when the drop-in is unchanged, which is every nightly drift run on
# a converged host.
- name: Harden sshd, and prove what it would apply before it reads the change
  block:
    - name: Harden sshd through a drop-in that sorts before cloud-init's
      ansible.builtin.template:
        src: sshd_hardening.conf.j2
        dest: "{{ hardening_sshd_dropin_path }}"
        owner: root
        group: root
        mode: "0644"
        validate: "{{ hardening_sshd_binary }} -t -f %s"
        backup: true
      register: hardening_sshd_dropin
      notify: Reload ssh

    - name: Test the whole sshd configuration the drop-in is part of
      ansible.builtin.command:
        argv:
          - "{{ hardening_sshd_binary }}"
          - -t
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and hardening_sshd_dropin is changed)

    - name: Read what sshd would apply to a login as the administrative user and as root
      ansible.builtin.command:
        argv:
          - "{{ hardening_sshd_binary }}"
          - -T
          - -C
          - "user={{ item }},host={{ hardening_sshd_test_host }},addr={{ hardening_sshd_test_addr }}"
      loop:
        - "{{ hardening_admin_user }}"
        - root
      register: hardening_sshd_effective
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and hardening_sshd_dropin is changed)

    # sshd -T prints every keyword in lower case, and one `allowusers <name>`
    # line per allowed user.
    - name: Refuse an sshd configuration that is not the one this role writes
      ansible.builtin.assert:
        that:
          - >-
            hardening_sshd_effective.results[0].stdout_lines | select('match', '^allowusers ')
            | map('regex_replace', '^allowusers ', '') | sort
            == hardening_sshd_allow_users | sort
          - "'authenticationmethods publickey' in hardening_sshd_effective.results[0].stdout_lines"
          - "'pubkeyauthentication yes' in hardening_sshd_effective.results[0].stdout_lines"
          - "'passwordauthentication no' in hardening_sshd_effective.results[0].stdout_lines"
          - "'permitrootlogin no' in hardening_sshd_effective.results[0].stdout_lines"
          - "'allowagentforwarding no' in hardening_sshd_effective.results[0].stdout_lines"
          - "'allowtcpforwarding local' in hardening_sshd_effective.results[0].stdout_lines"
          - "'permittunnel no' in hardening_sshd_effective.results[0].stdout_lines"
          - "'x11forwarding no' in hardening_sshd_effective.results[0].stdout_lines"
          - "'authorizedkeysfile .ssh/authorized_keys' in hardening_sshd_effective.results[0].stdout_lines"
          - "'permitrootlogin no' in hardening_sshd_effective.results[1].stdout_lines"
          - "'allowusers root' not in hardening_sshd_effective.results[1].stdout_lines"
        fail_msg: >-
          sshd would not apply the settings {{ hardening_sshd_dropin_path }} writes.
          For {{ hardening_admin_user }} it says:
          {{ hardening_sshd_effective.results[0].stdout_lines
             | select('match', '^(' ~ hardening_sshd_checked_keywords | join('|') ~ ') ')
             | join('; ') }};
          for root:
          {{ hardening_sshd_effective.results[1].stdout_lines
             | select('match', '^(allowusers|permitrootlogin) ') | join('; ') }}.
          sshd keeps the first value it reads, so a file in {{ hardening_sshd_dropin_path | dirname }} that
          sorts before {{ hardening_sshd_dropin_path | basename }}, or a Match block, is the usual cause;
          bash, on the host, ls {{ hardening_sshd_dropin_path | dirname }}/ lists them.
        quiet: true
      when: not (ansible_check_mode and hardening_sshd_dropin is changed)

    # The template's backup exists only for the rescue below, which copies it
    # back and then removes it; when the checks pass it is removed here.
    # Either way no copy of sshd settings is left in sshd_config.d (sshd
    # would not read it, its name not ending in .conf, but the next person
    # to look in the directory would).
    - name: Remove the previous drop-in's backup once the new one has passed
      ansible.builtin.file:
        path: "{{ hardening_sshd_dropin.backup_file }}"
        state: absent
      when: hardening_sshd_dropin.backup_file is defined

  rescue:
    - name: Put the previous drop-in back, so the reload still to come keeps today's settings
      ansible.builtin.copy:
        src: "{{ hardening_sshd_dropin.backup_file }}"
        dest: "{{ hardening_sshd_dropin_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: hardening_sshd_dropin.backup_file is defined

    - name: Remove the drop-in this run added where there was none
      ansible.builtin.file:
        path: "{{ hardening_sshd_dropin_path }}"
        state: absent
      when:
        - hardening_sshd_dropin is changed
        - hardening_sshd_dropin.backup_file is not defined

    - name: Remove the backup, now that it is back in place
      ansible.builtin.file:
        path: "{{ hardening_sshd_dropin.backup_file }}"
        state: absent
      when: hardening_sshd_dropin.backup_file is defined

    - name: Stop, with sshd still on the settings it had
      ansible.builtin.fail:
        msg: >-
          The sshd drop-in did not pass its checks.
          {{ 'This run had changed it and has put the previous one back, so the reload still to come keeps
          the settings sshd had.' if hardening_sshd_dropin is changed
          else 'This run did not change it, so sshd keeps the settings it had.' }}
          Task "{{ ansible_failed_task.name | default('unknown') }}" said:
          {{ ansible_failed_result.msg | default('') }} {{ ansible_failed_result.stderr | default('') }}

# Reload sshd now, not at the end of the play. On 2026-09-26 the first run
# wrote this drop-in and then failed in the docker role, so the end-of-play
# handler never ran; the next run found the file unchanged, notified
# nothing, and root login stayed on until sshd was restarted by hand.
# force_handlers in site.yml covers every other role the same way. A reload,
# not a restart (#953): ssh.socket hands connections to ssh.service's sshd,
# which hands each one to its own sshd-session process with the settings it
# holds, so only that listener has to re-read them. ssh.service's own
# ExecReload runs sshd -t before it sends HUP, and HUP leaves every open
# session, the operator's included, where it is.
#
# A marker an earlier run left (above) means a drop-in sshd has not loaded:
# that run was interrupted between the write and this flush. Finding it
# notifies the reload here, so the flush below loads the drop-in before
# root's keys are touched; the handler removes the marker once the reload
# succeeds. Read-only, so check mode reports the same drift.
- name: Look for a reload of sshd an earlier run left pending
  ansible.builtin.stat:
    path: "{{ hardening_sshd_reload_marker }}"
    get_checksum: false
  register: hardening_sshd_reload_pending
  changed_when:
    - hardening_sshd_reload_pending.stat.exists
    - hardening_sshd_dropin is not changed
  notify: Reload ssh

- name: Apply the sshd drop-in before any later role can fail
  ansible.builtin.meta: flush_handlers

# Root login is off, so root needs no key (#953). After the flush above,
# which has loaded every drop-in this run or an interrupted one wrote (the
# pending-reload marker), so root's keys are never taken while the running
# sshd may still let root in; and a run that stopped in the sshd block never
# gets here. Break-glass is hPanel's Web Console with root's password;
# whether that console goes through sshd is unverified (README, "Break-glass").
- name: Make sure root's .ssh directory is root's alone
  ansible.builtin.file:
    path: "{{ hardening_root_authorized_keys_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Keep root's authorized_keys empty
  ansible.builtin.copy:
    dest: "{{ hardening_root_authorized_keys_path }}"
    content: ""
    owner: root
    group: root
    mode: "0600"

# sshd reads .ssh/authorized_keys only (AuthorizedKeysFile in the drop-in),
# so a second file would hold keys nothing manages.
- name: Remove authorized_keys2, which sshd no longer reads
  ansible.builtin.file:
    path: "{{ item | dirname }}/authorized_keys2"
    state: absent
  loop:
    - "{{ hardening_admin_authorized_keys_path }}"
    - "{{ hardening_root_authorized_keys_path }}"
