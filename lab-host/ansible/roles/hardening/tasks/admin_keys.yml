---
# The administrative user's keys (#953, owner decision 2026-10-16). The list
# in group_vars is the whole truth: hcwadmin's authorized_keys is written
# from it and nothing else, and tasks/main.yml keeps root's empty once sshd's
# settings are applied. The refusals come before anything is written: an
# empty list, an entry that is not one public key, and a list without the
# key the operator logs in with (the lockout guard: the key of the most
# recent SSH login in the journal, or, with no login there, the keys on
# file). This file reads the journal and those two files and writes the
# administrative user's only, so tests/admin-keys.test.sh runs it against a
# journal fixture and scratch copies of the files.

- name: Refuse to run without a public key for the administrative user
  ansible.builtin.assert:
    that:
      - hardening_admin_authorized_keys | length > 0
    fail_msg: >-
      hardening_admin_authorized_keys is empty. It is the whole list of keys that may log in as
      {{ hardening_admin_user }}: this role writes {{ hardening_admin_user }}'s authorized_keys from it
      alone, keeps root's empty, and sshd takes no password, so an empty list would leave no way in
      over SSH. Nothing in SSH has been changed. Add your public key (the line in your .pub file, without
      the comment at its end) to hardening_admin_authorized_keys in
      lab-host/ansible/group_vars/all.yml, merge, and run bootstrap.sh again
      (docs/runbooks/labs-host.md, "Connect from a desktop").
    quiet: true

- name: Refuse an entry in the key list that is not one public key
  ansible.builtin.assert:
    that:
      - item is string
      - item is match(hardening_public_key_pattern)
    fail_msg: >-
      Entry {{ hardening_key_index + 1 }} of hardening_admin_authorized_keys is not one public key
      line: a key type, the key, and at most a comment, with no options and no line break. Nothing in SSH
      has been changed. Copy the line from the .pub file into lab-host/ansible/group_vars/all.yml
      again.
    quiet: true
  loop: "{{ hardening_admin_authorized_keys }}"
  loop_control:
    index_var: hardening_key_index
    label: "entry {{ hardening_key_index + 1 }}"

# The user task in tasks/main.yml registers hardening_admin_account; check
# mode on a host without the user yet has no home to report.
- name: Name the administrative user's authorized_keys
  ansible.builtin.set_fact:
    hardening_admin_authorized_keys_path: >-
      {{ hardening_admin_account.home | default('/home/' ~ hardening_admin_user, true) }}/.ssh/authorized_keys

- name: Look for the keys on file
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ hardening_admin_authorized_keys_path }}"
    - "{{ hardening_root_authorized_keys_path }}"
  register: hardening_keys_files

- name: Read the keys on file
  ansible.builtin.slurp:
    src: "{{ item.item }}"
  loop: "{{ hardening_keys_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: hardening_keys_read
  when: item.stat.exists

# Keys are compared by their blob alone, so a comment or an options field
# on either side does not hide a match (vars/main.yml).
- name: List the keys on each side, by key blob
  ansible.builtin.set_fact:
    hardening_keys_wanted: >-
      {{ hardening_admin_authorized_keys
         | map('regex_findall', hardening_public_key_blob_pattern) | flatten | unique | list }}
    hardening_keys_admin_text: "{{ hardening_keys_read.results[0].content | default('') | b64decode }}"
    hardening_keys_root_text: "{{ hardening_keys_read.results[1].content | default('') | b64decode }}"

# The fallback, for a journal with no login in it. The keys on file are
# hcwadmin's; on the first run after a reinstall hcwadmin has none yet and
# the operator is in as root with the key hPanel installed, so root's are
# the ones a wrong list would lock out. With neither (a password login
# through the Web Console), no key is on file and none can be locked out.
- name: Decide which keys on file the list falls back to
  ansible.builtin.set_fact:
    hardening_keys_now_path: >-
      {{ hardening_admin_authorized_keys_path
         if hardening_keys_admin_text is search(hardening_public_key_blob_pattern, multiline=true)
         else hardening_root_authorized_keys_path }}
    hardening_keys_now_text: >-
      {{ hardening_keys_admin_text
         if hardening_keys_admin_text is search(hardening_public_key_blob_pattern, multiline=true)
         else hardening_keys_root_text }}

- name: List the keys on file, by key blob
  ansible.builtin.set_fact:
    hardening_keys_now: >-
      {{ hardening_keys_now_text | split('\n') | map('trim') | reject('match', '^(#|$)')
         | map('regex_findall', hardening_public_key_blob_pattern) | flatten | unique | list }}

# The key that matters is the one the operator logs in with, not any key on
# file (review of #953): a list that keeps an unused key on file and drops
# the one in use would pass a file comparison and still lock the operator
# out. sshd logs every accepted login at INFO, with the key's fingerprint
# (`Accepted publickey for <user> from <address> port <n> ssh2: <type>
# SHA256:<fingerprint>`), so the most recent such login as the
# administrative user or root is the key in use. The file comparison above
# is the fallback for a journal with no login in it, a fresh host. A
# journal that cannot be read stops the run rather than fall back.
- name: Read the SSH logins of the last 14 days from the journal
  ansible.builtin.command:
    argv: "{{ hardening_ssh_login_journal_argv }}"
  register: hardening_ssh_journal
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse to guess which key logs in when the journal cannot be read
  ansible.builtin.assert:
    that:
      - hardening_ssh_journal.rc == 0
    fail_msg: >-
      {{ hardening_ssh_login_journal_argv | join(' ') }} exited {{ hardening_ssh_journal.rc }}
      ({{ hardening_ssh_journal.stderr | default('') | trim }}), so this run cannot tell which key you
      log in with, and it has changed nothing in SSH. Bash, on the host, the same command shows why.
    quiet: true

- name: Find the most recent SSH login as the administrative user or root
  ansible.builtin.set_fact:
    hardening_ssh_last_login: >-
      {{ hardening_ssh_journal.stdout_lines
         | select('match', '^Accepted publickey for (' ~ (hardening_admin_user | regex_escape) ~ '|root) ')
         | list | last | default('') }}

- name: Fingerprint the key list
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -l
      - -E
      - sha256
      - -f
      - "-"
    stdin: "{{ hardening_admin_authorized_keys | join('\n') }}"
  register: hardening_keys_wanted_fingerprints
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse a key list ssh-keygen cannot read
  ansible.builtin.assert:
    that:
      - hardening_keys_wanted_fingerprints.rc == 0
      - >-
        hardening_keys_wanted_fingerprints.stdout_lines | select('search', ' SHA256:') | list | length
        == hardening_admin_authorized_keys | length
    fail_msg: >-
      ssh-keygen read {{ hardening_keys_wanted_fingerprints.stdout_lines | select('search', ' SHA256:') | list | length }}
      key(s) from the {{ hardening_admin_authorized_keys | length }} entries of hardening_admin_authorized_keys
      ({{ hardening_keys_wanted_fingerprints.stderr | default('') | trim }}), so an entry is not a valid key.
      Nothing in SSH has been changed. Copy the line from the .pub file into
      lab-host/ansible/group_vars/all.yml again.
    quiet: true

- name: Decide what the key list is compared with
  ansible.builtin.set_fact:
    hardening_keys_wanted_fps: >-
      {{ hardening_keys_wanted_fingerprints.stdout_lines | map('regex_search', 'SHA256:[A-Za-z0-9+/]+') | list }}
    hardening_ssh_last_login_fp: >-
      {{ hardening_ssh_last_login | regex_search('SHA256:[A-Za-z0-9+/]+') | default('', true) }}
    hardening_ssh_last_login_user: "{{ hardening_ssh_last_login.split(' ')[3] | default('') }}"
    hardening_keys_lockout_basis: "{{ 'journal' if hardening_ssh_last_login | length > 0 else 'file' }}"

# From the journal: the key of the most recent login must be in the list. A
# login line without a fingerprint counts as a key not in it. From the file,
# on a host with no login in the journal: the list must share a key with
# the keys on file, unless there are none.
- name: Decide whether the key list would lock out the key that logs in today
  ansible.builtin.set_fact:
    hardening_keys_lockout: >-
      {{ (hardening_ssh_last_login_fp | length == 0 or hardening_ssh_last_login_fp not in hardening_keys_wanted_fps)
         if hardening_keys_lockout_basis == 'journal'
         else (hardening_keys_now | length > 0 and hardening_keys_now | intersect(hardening_keys_wanted) | length == 0) }}

# Only when the guard below has something to say about the file, so the
# operator sees fingerprints, as ssh -v and the .pub files show them, not
# key blobs.
- name: Fingerprint the keys on file, for the refusal below
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -l
      - -E
      - sha256
      - -f
      - "-"
    stdin: "{{ hardening_keys_now_text }}"
  register: hardening_keys_now_fingerprints
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - hardening_keys_lockout | bool
    - hardening_keys_lockout_basis == 'file'

- name: Say what the key list would lock out, from the journal
  ansible.builtin.set_fact:
    hardening_keys_lockout_reason: >-
      The most recent SSH login here, as {{ hardening_ssh_last_login_user }}, used the key
      {{ hardening_ssh_last_login_fp | default('(no fingerprint logged)', true) }} (the journal of the
      last 14 days), and that key is not in hardening_admin_authorized_keys
      ({{ hardening_keys_wanted_fps | join('; ') }}). Writing the list would lock it out,
  when:
    - hardening_keys_lockout | bool
    - hardening_keys_lockout_basis == 'journal'

- name: Say what the key list would lock out, from the files
  ansible.builtin.set_fact:
    hardening_keys_lockout_reason: >-
      No key in hardening_admin_authorized_keys ({{ hardening_keys_wanted_fps | join('; ') }}) is one on
      file ({{ hardening_keys_now_path }}:
      {{ hardening_keys_now_fingerprints.stdout_lines | default([]) | join('; ') }}), and the journal
      has no SSH login to go by. Writing the list would replace every key that works now,
  when:
    - hardening_keys_lockout | bool
    - hardening_keys_lockout_basis == 'file'

- name: Refuse a key list that would lock out the key that logs in today
  ansible.builtin.assert:
    that:
      - not (hardening_keys_lockout | bool) or (hardening_admin_keys_replace_all | bool)
    fail_msg: >-
      {{ hardening_keys_lockout_reason | default('') }}
      so this run has changed nothing in SSH. If the key you log in with is missing from the list,
      add it to hardening_admin_authorized_keys in lab-host/ansible/group_vars/all.yml, merge, and
      run bootstrap.sh again. If replacing it is what you mean, and you hold one of the listed keys
      or can reach hPanel's Web Console (https://hpanel.hostinger.com/vps, Manage on the server,
      then Web Console), run it again with the override, bash, on the host:
      sudo /opt/hcw-src/lab-host/bootstrap.sh -e hardening_admin_keys_replace_all=true
    quiet: true

- name: Say that the override let a key list through that locks out the key in use
  ansible.builtin.debug:
    msg: >-
      hardening_admin_keys_replace_all is true:
      {{ ('the key of the most recent SSH login, ' ~ hardening_ssh_last_login_fp ~ ', is not in the list')
         if hardening_keys_lockout_basis == 'journal'
         else (hardening_keys_now_path ~ ' held no key in the list') }},
      and this run writes the list anyway.
  when:
    - hardening_keys_lockout | bool
    - hardening_admin_keys_replace_all | bool

# The whole file, one line per list entry and nothing else, so what sshd
# reads is the list byte for byte. hardening_admin_account.group is the
# user's primary group id; check mode on a host without the user yet has
# none, and the file is not written then anyway.
- name: Make sure the administrative user's .ssh directory is the user's alone
  ansible.builtin.file:
    path: "{{ hardening_admin_authorized_keys_path | dirname }}"
    state: directory
    owner: "{{ hardening_admin_user }}"
    group: "{{ hardening_admin_account.group | default(omit) }}"
    mode: "0700"

- name: Write the administrative user's authorized_keys from the list, and nothing else
  ansible.builtin.copy:
    dest: "{{ hardening_admin_authorized_keys_path }}"
    content: "{{ hardening_admin_authorized_keys | join('\n') }}\n"
    owner: "{{ hardening_admin_user }}"
    group: "{{ hardening_admin_account.group | default(omit) }}"
    mode: "0600"
