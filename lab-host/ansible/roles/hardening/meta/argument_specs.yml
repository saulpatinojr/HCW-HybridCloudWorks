---
argument_specs:
  main:
    short_description: Harden SSH, the firewall, patching and brute-force protection on an Ubuntu 26.04 or 24.04 host
    description:
      - Creates a key-only administrative user with passwordless sudo (an accepted risk), writes
        its authorized_keys from hardening_admin_authorized_keys alone behind a lockout guard,
        then limits SSH to that user and to public keys through a drop-in that sorts before
        cloud-init's, proven with sshd -t and sshd -T before sshd is reloaded. Root's
        authorized_keys is kept empty.
      - Sets ufw to deny inbound and allow outbound with an explicit inbound TCP allowlist.
      - Turns on unattended-upgrades, with its own reboot off, once the timer that replaces it
        is verified active; cancels a reboot unattended-upgrades had already scheduled, and stops
        at one it cannot attribute.
      - Reboots at a fixed hour for a pending upgrade only while nobody is logged in and
        no lab job container runs (hcw-reboot-when-idle), asked twice with new lab jobs held
        between, one syslog line per outcome.
      - Enables a fail2ban sshd jail on the systemd backend.
      - Reports, daily to syslog, every held package apt could upgrade (hcw-held-upgradable).
    author: HybridCloudWorks
    options:
      hardening_packages:
        type: list
        elements: str
        required: false
        default: [openssh-server, sudo, ufw, fail2ban, unattended-upgrades]
        description:
          - Packages installed before anything is configured. sudo is listed because the
            administrative user's access and the play's own become depend on it, and a minimal
            image may not ship it.
      hardening_admin_user:
        type: str
        required: false
        default: hcwadmin
        description: The administrative login. Root login is disabled, so this is the way in.
      hardening_admin_authorized_keys:
        type: list
        elements: str
        required: false
        default: []
        description:
          - The public keys that may log in as the administrative user, one key line each (type,
            key, optional comment; no authorized_keys options). The role writes the user's
            authorized_keys from this list alone (exclusive) and keeps root's authorized_keys
            empty (issue 953).
          - The role stops before changing anything when the list is empty or an entry is not one
            public key. There is no fallback to root's keys.
          - The lockout guard. The role also stops when the list does not hold the key of the most
            recent SSH login as the administrative user or root in the journal of the last 14 days.
            With no login in the journal (a fresh host) it falls back to the files, and stops when
            the list shares no key with the administrative user's authorized_keys or, while that
            has none (the first run after a reinstall), root's. See
            hardening_admin_keys_replace_all.
      hardening_admin_keys_replace_all:
        type: bool
        required: false
        default: false
        description:
          - Lets one run through the lockout guard, writing a key list without the key in use.
            Pass it with -e for that run only, once you hold one of the new keys or can reach
            hPanel's Web Console.
      hardening_sshd_allow_users:
        type: list
        elements: str
        required: false
        description:
          - sshd's AllowUsers, the only accounts that may log in over SSH. Defaults to a list of
            hardening_admin_user alone. The role refuses a list that leaves the administrative user
            out, names root, or holds anything but plain user names, and reads the result back
            with sshd -T before it reloads sshd.
      hardening_ufw_allowed_tcp_ports:
        type: list
        elements: int
        required: false
        default: [22, 80, 443]
        description: Inbound TCP ports allowed through ufw. Everything else inbound is denied.
      hardening_ufw_logging:
        type: str
        required: false
        default: low
        choices: ["on", "off", low, medium, high, full]
        description: ufw logging level.
      hardening_unattended_reboot_time:
        type: str
        required: false
        default: "04:30"
        description:
          - Host local time (HH:MM) at which hcw-reboot-when-idle.timer asks whether the host
            may reboot for a pending upgrade (LAB-13, issue 959). The role refuses any other
            shape, because the timer's OnCalendar is rendered from it.
      hardening_unattended_allowed_origins:
        type: list
        elements: str
        required: false
        default:
          - "${distro_id}:${distro_codename}"
          - "${distro_id}:${distro_codename}-security"
          - "${distro_id}ESMApps:${distro_codename}-apps-security"
          - "${distro_id}ESM:${distro_codename}-infra-security"
        description:
          - The apt origins unattended-upgrades may move packages from, rendered into the
            override as the whole list (LAB-13, issue 959). Ubuntu's own four by default.
      hardening_fail2ban_maxretry:
        type: int
        required: false
        default: 5
        description: Failed SSH attempts within findtime before a ban.
      hardening_fail2ban_findtime:
        type: str
        required: false
        default: 10m
        description: Window over which failures are counted.
      hardening_fail2ban_bantime:
        type: str
        required: false
        default: 1h
        description: How long a banned address stays banned.
      hardening_reboot_required_path:
        type: path
        required: false
        default: /var/run/reboot-required
        description:
          - The file unattended-upgrades leaves while a reboot is pending. The daily report logs
            a warning line with its age while it exists, and hcw-reboot-when-idle reboots only
            while it exists (LAB-13, issue 959).
      hardening_held_report_tag:
        type: str
        required: false
        default: hcw-held-upgradable
        description:
          - The syslog tag (ProcessName in Log Analytics) of the daily held-package report.
          - One line per held package apt could upgrade goes to daemon.warning, which the Arc
            data collection rule ships; the all-clear line goes to daemon.notice and stays on
            the host.
      hardening_held_report_script_path:
        type: str
        required: false
        default: /usr/local/sbin/hcw-held-upgradable
        description: Where the held-package report script is installed; the service runs it.
      hardening_held_report_on_calendar:
        type: str
        required: false
        default: "*-*-* 07:15:00"
        description: systemd OnCalendar expression for the daily held-package report.
      hardening_reboot_when_idle_script_path:
        type: str
        required: false
        default: /usr/local/sbin/hcw-reboot-when-idle
        description:
          - Where the idle-reboot script is installed; hcw-reboot-when-idle.service runs it at
            hardening_unattended_reboot_time (LAB-13, issue 959).
      hardening_reboot_when_idle_tag:
        type: str
        required: false
        default: hcw-reboot-when-idle
        description:
          - The syslog tag (ProcessName in Log Analytics) of the idle reboot's one line per
            outcome. Deferrals, the stand-down and the reboot itself go to daemon.warning, which
            the Arc data collection rule ships, and a deferral once the reboot is overdue
            (hardening_reboot_overdue_days) to daemon.err; the nothing-pending line goes to
            daemon.notice and stays on the host; an apt-config, a loginctl or a docker daemon
            (the host's or the Coder sandbox's) that does not answer, or a hold or first-seen
            record that cannot be written, is daemon.err and a failed run.
      hardening_reboot_job_label:
        type: str
        required: false
        default: hcw.lab-job
        description:
          - The Docker label every lab job container carries, JOB_LABEL in
            vps-agent/lib/docker-runner.js. The reboot is deferred while docker ps lists any
            container with it. scripts/lab-job-limits.test.mjs holds this default to the agent's
            constant.
      hardening_reboot_workspace_docker_host:
        type: str
        required: false
        default: unix:///run/hcw-coder-docker/docker.sock
        description:
          - The Coder sandbox daemon's socket (coder_sandbox_docker_host). The reboot is deferred
            while that daemon has a container with hardening_reboot_workspace_label up; with no
            socket there, nothing is asked. Must be a unix socket outside /run/user, which the
            service's ProtectHome= hides.
      hardening_reboot_workspace_label:
        type: str
        required: false
        default: coder.workspace_id
        description:
          - The Docker label every Coder workspace container carries (lab-host/coder/templates).
      hardening_reboot_hold_path:
        type: str
        required: false
        default: /run/hcw-maintenance/reboot-hold
        description:
          - The maintenance hold (LAB-13, issue 959). When the first look
            finds the host idle, hcw-reboot-when-idle writes the epoch second the hold lapses here,
            and the labs agent claims no new job while it holds; the script waits for the agent's
            acknowledgement, looks again, and reboots only if the host is still idle. Removed on
            every way out but the reboot.
          - Must be /run/<directory>/<file>; the service creates the directory as its
            RuntimeDirectory=. Must equal labs_agent_maintenance_hold_path and the agent's
            DEFAULT_HOLD_PATH; scripts/lab-job-limits.test.mjs checks the defaults.
      hardening_reboot_hold_settle_seconds:
        type: int
        required: false
        default: 45
        description:
          - The longest the script waits for the agent's acknowledgement of the hold before it
            defers the night. At least the agent's ACK_WITHIN_MS (35 s, a claim already sent plus
            one poll tick), and at most 90, which leaves the second look 30 s inside the service's
            120 s TimeoutStartSec. The role refuses anything else.
      hardening_reboot_ack_path:
        type: str
        required: false
        default: /run/hcw-labs-agent/maintenance-ack
        description:
          - Where the labs agent writes the hold's expiry once no claim is in flight and no job is
            running. A matching acknowledgement lets the script look again at once; none within
            hardening_reboot_hold_settle_seconds defers the night.
          - Must be /run/<directory>/<file>, the agent unit's RuntimeDirectory=. Must equal
            labs_agent_maintenance_ack_path and the agent's DEFAULT_ACK_PATH;
            scripts/lab-job-limits.test.mjs checks the defaults.
      hardening_reboot_agent_service:
        type: str
        required: false
        default: hcw-labs-agent
        description:
          - The labs agent's unit (labs_agent_service_name). Inactive or failed, it cannot have a
            claim in flight, and the script looks again without waiting for an acknowledgement.
      hardening_reboot_hold_seconds:
        type: int
        required: false
        default: 300
        description:
          - How long a hold lasts if nothing removes it, counted from its write. More than the
            service's 120 s TimeoutStartSec, so it never lapses while the script runs, and at
            most 600, the agent's own cap on any hold. The role refuses anything else.
      hardening_reboot_overdue_days:
        type: int
        required: false
        default: 7
        description:
          - A reboot pending this many days or more is logged at daemon.err rather than
            daemon.warning when a night defers it. Logging only; the script never reboots over a
            logged-in user or a running job.
      hardening_drift_tag:
        type: str
        required: false
        default: hcw-playbook-drift
        description:
          - Syslog tag of the nightly playbook drift detection timer (LAB-4, issue 950).
      hardening_drift_script_path:
        type: str
        required: false
        default: /usr/local/sbin/hcw-playbook-drift
        description:
          - Where the playbook drift detection script is installed.
      hardening_drift_src_dir:
        type: str
        required: false
        default: /opt/hcw-src
        description:
          - Root of the HCW checkout on the host from which the playbook is checked in check mode.
      hardening_drift_on_calendar:
        type: str
        required: false
        default: "*-*-* 03:00:00"
        description:
          - Calendar specification for hcw-playbook-drift.timer.
      hardening_drift_ansible_playbook:
        type: str
        required: false
        default: /usr/local/bin/ansible-playbook
        description:
          - Path to ansible-playbook executable to use for the check run.
      hardening_drift_vault_file:
        type: str
        required: false
        default: /etc/hcw/vault.yml
        description:
          - Path to Ansible vault file passed to check run when present.
      hardening_drift_vault_password_file:
        type: str
        required: false
        default: /etc/hcw/vault.pass
        description:
          - Path to Ansible vault password file passed to check run when present.
