---
argument_specs:
  main:
    short_description: Harden SSH, the firewall, patching and brute-force protection on an Ubuntu 26.04 or 24.04 host
    description:
      - Creates a key-only administrative user with passwordless sudo, then disables
        password and root SSH login through a drop-in that sorts before cloud-init's.
      - Sets ufw to deny inbound and allow outbound with an explicit inbound TCP allowlist.
      - Turns on unattended-upgrades, with its own reboot off.
      - Reboots at a fixed hour for a pending upgrade only while nobody is logged in and
        no lab job container runs (hcw-reboot-when-idle), one syslog line per outcome.
      - Enables a fail2ban sshd jail on the systemd backend.
      - Reports, daily to syslog, every held package apt could upgrade (hcw-held-upgradable).
    author: HybridCloudWorks
    options:
      hardening_packages:
        type: list
        elements: str
        required: false
        default: [openssh-server, sudo, ufw, fail2ban, unattended-upgrades]
        description:
          - Packages installed before anything is configured. sudo is listed because the
            administrative user's access and the play's own become depend on it, and a minimal
            image may not ship it.
      hardening_admin_user:
        type: str
        required: false
        default: hcwadmin
        description: The administrative login. Root login is disabled, so this is the way in.
      hardening_admin_authorized_keys:
        type: list
        elements: str
        required: false
        default: []
        description:
          - Public keys for the administrative user.
          - When empty the role copies /root/.ssh/authorized_keys, so the key the provisioner
            installed for root keeps working under the new user. The role refuses to continue
            if neither source yields a key.
      hardening_ufw_allowed_tcp_ports:
        type: list
        elements: int
        required: false
        default: [22, 80, 443]
        description: Inbound TCP ports allowed through ufw. Everything else inbound is denied.
      hardening_ufw_logging:
        type: str
        required: false
        default: low
        choices: ["on", "off", low, medium, high, full]
        description: ufw logging level.
      hardening_unattended_reboot_time:
        type: str
        required: false
        default: "04:30"
        description:
          - Host local time (HH:MM) at which hcw-reboot-when-idle.timer asks whether the host
            may reboot for a pending upgrade (LAB-13, issue 959). The role refuses any other
            shape, because the timer's OnCalendar is rendered from it.
      hardening_unattended_allowed_origins:
        type: list
        elements: str
        required: false
        default:
          - "${distro_id}:${distro_codename}"
          - "${distro_id}:${distro_codename}-security"
          - "${distro_id}ESMApps:${distro_codename}-apps-security"
          - "${distro_id}ESM:${distro_codename}-infra-security"
        description:
          - The apt origins unattended-upgrades may move packages from, rendered into the
            override as the whole list (LAB-13, issue 959). Ubuntu's own four by default.
      hardening_fail2ban_maxretry:
        type: int
        required: false
        default: 5
        description: Failed SSH attempts within findtime before a ban.
      hardening_fail2ban_findtime:
        type: str
        required: false
        default: 10m
        description: Window over which failures are counted.
      hardening_fail2ban_bantime:
        type: str
        required: false
        default: 1h
        description: How long a banned address stays banned.
      hardening_reboot_required_path:
        type: path
        required: false
        default: /var/run/reboot-required
        description:
          - The file unattended-upgrades leaves while a reboot is pending. The daily report logs
            a warning line with its age while it exists, and hcw-reboot-when-idle reboots only
            while it exists (LAB-13, issue 959).
      hardening_held_report_tag:
        type: str
        required: false
        default: hcw-held-upgradable
        description:
          - The syslog tag (ProcessName in Log Analytics) of the daily held-package report.
          - One line per held package apt could upgrade goes to daemon.warning, which the Arc
            data collection rule ships; the all-clear line goes to daemon.notice and stays on
            the host.
      hardening_held_report_script_path:
        type: str
        required: false
        default: /usr/local/sbin/hcw-held-upgradable
        description: Where the held-package report script is installed; the service runs it.
      hardening_held_report_on_calendar:
        type: str
        required: false
        default: "*-*-* 07:15:00"
        description: systemd OnCalendar expression for the daily held-package report.
      hardening_reboot_when_idle_script_path:
        type: str
        required: false
        default: /usr/local/sbin/hcw-reboot-when-idle
        description:
          - Where the idle-reboot script is installed; hcw-reboot-when-idle.service runs it at
            hardening_unattended_reboot_time (LAB-13, issue 959).
      hardening_reboot_when_idle_tag:
        type: str
        required: false
        default: hcw-reboot-when-idle
        description:
          - The syslog tag (ProcessName in Log Analytics) of the idle reboot's one line per
            outcome. Deferrals and the reboot itself go to daemon.warning, which the Arc data
            collection rule ships; the nothing-pending line goes to daemon.notice and stays on
            the host; a users or a docker that does not answer is daemon.err and a failed run.
      hardening_reboot_job_label:
        type: str
        required: false
        default: hcw.lab-job
        description:
          - The Docker label every lab job container carries, JOB_LABEL in
            vps-agent/lib/docker-runner.js. The reboot is deferred while docker ps lists any
            container with it. scripts/lab-job-limits.test.mjs holds this default to the agent's
            constant.
