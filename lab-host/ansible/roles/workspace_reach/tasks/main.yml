---
# A lab workspace's first minute, checked (#1267). On 2026-10-17 every
# workspace started its container and then waited forever for an agent that
# could not resolve Coder's name, and every run of this playbook still passed,
# because nothing in it started a workspace. This role does: one throwaway
# container shaped like a workspace, created the way the Terraform docker
# provider creates one, at every run and every workspace_reach_interval after.
# README.md beside this file says what it checks and why.

- name: Read the workspace template this host publishes
  ansible.builtin.set_fact:
    workspace_reach_template_text: "{{ lookup('ansible.builtin.file', workspace_reach_template) }}"
  when: workspace_reach_enabled | bool

# The image lab_images pulls into the sandbox daemon and the repository a lab's
# startup script checks out, read the way lab_images reads the image
# (files/lab-images.mjs, workspaceImageFromTemplate), so a pin bump needs no
# edit here.
- name: Read the workspace image and the lab repository from the template
  ansible.builtin.set_fact:
    workspace_reach_digests: >-
      {{ workspace_reach_template_text
         | regex_findall('(?m)^\s*image_digest\s*=\s*"(sha256:[0-9a-f]{64})"\s*$') }}
    workspace_reach_repositories: >-
      {{ workspace_reach_template_text
         | regex_findall('(?m)^\s*image\s*=\s*"([^"@$]+)@[$][{]local[.]image_digest[}]"\s*$') }}
    workspace_reach_repo_urls: >-
      {{ workspace_reach_template_text
         | regex_findall('(?m)^\s*repo_url\s*=\s*"(https://[^"]+)"\s*$') }}
  when: workspace_reach_enabled | bool

- name: Refuse a template the check cannot read its image or repository from
  ansible.builtin.assert:
    that:
      - workspace_reach_digests | length == 1
      - workspace_reach_repositories | length == 1
      - workspace_reach_repo_urls | length == 1
    fail_msg: >-
      {{ workspace_reach_template }} should hold exactly one `image_digest = "sha256:<64 hex>"`, one
      `image = "<repository>@${local.image_digest}"` and one `repo_url = "https://..."` local; it holds
      {{ workspace_reach_digests | length }}, {{ workspace_reach_repositories | length }} and
      {{ workspace_reach_repo_urls | length }}. The lab_images role reads the image the same way, so
      a template that moved them needs both roles changed in the same pull request.
    quiet: true
  when: workspace_reach_enabled | bool

- name: Record what the check runs and reaches
  ansible.builtin.set_fact:
    workspace_reach_image: "{{ workspace_reach_repositories[0] }}@{{ workspace_reach_digests[0] }}"
    workspace_reach_repo_url: "{{ workspace_reach_repo_urls[0] }}"
  when: workspace_reach_enabled | bool

- name: Install the check
  ansible.builtin.copy:
    src: hcw-workspace-reach
    dest: "{{ workspace_reach_script }}"
    owner: root
    group: root
    mode: "0755"
  when: workspace_reach_enabled | bool

- name: Install the check's unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ workspace_reach_unit }}.service"
    - "{{ workspace_reach_unit }}.timer"
  when: workspace_reach_enabled | bool

# Before the check runs, so a check that fails below is run again every
# interval, and alerts again, until it passes.
- name: Enable the timer
  ansible.builtin.systemd_service:
    name: "{{ workspace_reach_unit }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when: workspace_reach_enabled | bool

# Through the unit, so the run checks what the timer will run: its user,
# its sandboxing and its arguments. A failure here also reaches
# hcw-unit-failed@, which is right: no workspace can start.
- name: Run the check once now, as the timer runs it
  ansible.builtin.command:
    argv:
      - systemctl
      - start
      - "{{ workspace_reach_unit }}.service"
  register: workspace_reach_run
  changed_when: false
  failed_when: false
  when:
    - workspace_reach_enabled | bool
    - not ansible_check_mode

- name: Read which run of the unit that was
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=InvocationID
      - --value
      - "{{ workspace_reach_unit }}.service"
  register: workspace_reach_invocation
  changed_when: false
  when:
    - workspace_reach_enabled | bool
    - not ansible_check_mode

- name: Read what the check said
  ansible.builtin.command:
    argv:
      - journalctl
      - "_SYSTEMD_INVOCATION_ID={{ workspace_reach_invocation.stdout | trim }}"
      - --output=cat
      - --no-pager
  register: workspace_reach_said
  changed_when: false
  failed_when: false
  when:
    - workspace_reach_enabled | bool
    - not ansible_check_mode
    - workspace_reach_invocation.stdout | trim | length > 0

- name: Refuse a host where a workspace cannot reach Coder or the lab repository
  ansible.builtin.assert:
    that:
      - workspace_reach_run.rc == 0
    fail_msg: >-
      {{ workspace_reach_unit }}.service failed, so no lab workspace on this host can start its agent
      or check out its folder. What it said:
      {{ (workspace_reach_said.stdout_lines | default([]) | select | list)[-3:] | join(' | ')
         or (workspace_reach_run.stderr | default('nothing; read sudo journalctl -u ' ~ workspace_reach_unit ~ '.service -n 30')) }}
    quiet: true
  when:
    - workspace_reach_enabled | bool
    - not ansible_check_mode

- name: Say what the check saw
  ansible.builtin.debug:
    msg: "{{ (workspace_reach_said.stdout_lines | default([]) | select | list)[-1:] | join('') or 'The check passed.' }}"
  when:
    - workspace_reach_enabled | bool
    - not ansible_check_mode

- name: Look for the timer while the check is off
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ workspace_reach_unit }}.timer"
  register: workspace_reach_timer_file
  when: not workspace_reach_enabled | bool

# Coder off stops the sandbox daemon, so the check would only fail.
- name: Stop and disable the timer while the check is off
  ansible.builtin.systemd_service:
    name: "{{ workspace_reach_unit }}.timer"
    enabled: false
    state: stopped
  when:
    - not workspace_reach_enabled | bool
    - workspace_reach_timer_file.stat.exists
