---
# Fail closed before touching the host: whatever the variables say, the UI is
# published on the loopback only.
- name: Refuse to publish Portainer anywhere but the host's loopback
  ansible.builtin.assert:
    that:
      - portainer_published_port is match('^127\.0\.0\.1:[0-9]+:9443$')
    fail_msg: >-
      Portainer would be published as {{ portainer_published_port }}. It holds the Docker
      socket, which is root on this host, so it is published on 127.0.0.1 only and reached
      through an SSH tunnel (lab-host/README.md, "Portainer").
    quiet: true

- name: Create Portainer's data volume
  community.docker.docker_volume:
    name: "{{ portainer_volume_name }}"
    state: present
  when: portainer_enabled | bool

# Portainer holds the daemon's socket as a bind-mounted FILE (the volume
# below), so a daemon restart, which a docker-ce upgrade causes earlier in this
# play, unlinks and recreates that file and leaves a Portainer that was already
# running on the old inode: it still answers, but its `local` environment (this
# host's Docker) reads down and the check below raises the lab alert. The
# 2026-10-21 bootstrap (Docker 29.9.1 -> 29.9.2, #1324) left it so for three
# runs of the 15-minute check, until `sudo docker restart portainer` (#1328).
# The agent's socket proxy had the same fault (#1135), so the same helper is
# asked: a Portainer that started before the daemon's current start is
# restarted below, and one that did not is left alone.
- name: Install the container staleness check
  ansible.builtin.copy:
    src: "{{ portainer_stale_helper_source }}"
    dest: "{{ portainer_stale_helper_dest }}"
    owner: root
    group: root
    mode: "0755"
  when: portainer_enabled | bool

- name: Ask whether a running Portainer predates the daemon's current start
  ansible.builtin.command:
    argv:
      - "{{ portainer_stale_helper_dest }}"
      - "{{ portainer_container_name }}"
  register: portainer_age
  changed_when: false
  when:
    - portainer_enabled | bool
    - not ansible_check_mode

- name: Record whether Portainer must be restarted onto the daemon's new socket
  ansible.builtin.set_fact:
    portainer_stale: >-
      {{ portainer_enabled | bool and not ansible_check_mode
         and (portainer_age.stdout | default('') | trim) == 'stale' }}

# --http-disabled: Portainer serves its UI on 9443 (HTTPS, a certificate it
# generates itself) and, unless told not to, on 9000 over plain HTTP too.
# Nothing publishes 9000 or the Edge tunnel's 8000, and the flag means 9000
# does not even listen inside the container.
#
# userns_mode host (LAB-5, 2026-10-07): the daemon remaps every container's
# root to an unprivileged range (roles/docker), and Portainer's whole job is
# the socket, which a remapped root cannot open. It is one of three of this
# host's own containers that opt out; its volume was carried into the
# remapped data root as it was, for that reason (group_vars,
# docker_userns_carry_volumes).
- name: Run Portainer, published on the host's loopback only
  community.docker.docker_container:
    name: "{{ portainer_container_name }}"
    image: "{{ portainer_image_ref }}"
    pull: missing
    state: started
    restart: "{{ portainer_stale | bool }}"
    restart_policy: unless-stopped
    userns_mode: host
    command:
      - --http-disabled
    published_ports:
      - "{{ portainer_published_port }}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ portainer_volume_name }}:/data"
    memory: "{{ portainer_memory }}"
    security_opts:
      - no-new-privileges:true
  register: portainer_container
  when: portainer_enabled | bool

- name: Say that Portainer was restarted onto the daemon's new socket
  ansible.builtin.debug:
    msg: >-
      Portainer was restarted onto the daemon's new socket (#1328). It had started before
      Docker's current start, so it still held the old Docker socket and its local
      environment would have read down. If no administrator exists yet, the five minutes
      to create one start again now.
  when: portainer_stale | bool

# Until an administrator exists, Portainer stops serving five minutes after it
# starts (measured 2026-09-26 on 2.45.1: the container stays running, so no
# restart policy brings it back, and every request answers 303 with
# "Administrator initialization timeout"). Both answers mean Portainer is up;
# 303 is reported below rather than failing a run that happens to come later.
# Redirects are not followed, because the 303 leads to a page that answers 200.
- name: Wait for Portainer to answer on the loopback
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ portainer_https_port }}/api/system/status"
    validate_certs: false
    follow_redirects: none
    status_code:
      - 200
      - 303
  register: portainer_status
  until: portainer_status.status in [200, 303]
  retries: 30
  delay: 2
  when:
    - portainer_enabled | bool
    - not ansible_check_mode

# --- The check (#1282) ------------------------------------------------------
# Portainer read every portainer_check_interval and reported to the site's
# Health Hub through the lab agent (README.md beside this role, "The check").
# The token is the owner's own Portainer access token (owner decision
# 2026-10-19), set with hcw-vault-set as vault_portainer_api_token. This role
# never declares that key (hcw-vault-set refuses a key the playbook defines)
# and reads it through a lookup with an empty default, so a host without it
# installs the check and leaves it skipped.
- name: Read whether the Portainer check has its token
  ansible.builtin.set_fact:
    portainer_check_configured: >-
      {{ portainer_enabled | bool and portainer_check_enabled | bool
         and lookup('ansible.builtin.vars', 'vault_portainer_api_token', default='') | length > 0 }}

- name: Create the check's directory, root-only
  ansible.builtin.file:
    path: "{{ portainer_check_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - portainer_enabled | bool
    - portainer_check_enabled | bool

# Root 0600 beside a root 0700 directory: an access token carries the whole
# authority of its user, and the unit hands it to the check as a credential
# (LoadCredential=), so nothing but root and that unit ever reads it.
- name: Write the Portainer token for the check, root-only
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.vars', 'vault_portainer_api_token', default='') }}\n"
    dest: "{{ portainer_check_token_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: portainer_check_configured | bool

# Without the file the unit's condition does not hold and the timer's runs
# are skipped, not failed, so turning the check off pages nobody.
- name: Remove the token while the check is off or its key is unset
  ansible.builtin.file:
    path: "{{ portainer_check_token_file }}"
    state: absent
  when: not portainer_check_configured | bool

- name: Write the check's configuration (the URL, names and the agent's paths, no secret)
  ansible.builtin.template:
    src: hcw-portainer-check.json.j2
    dest: "{{ portainer_check_config_file }}"
    owner: root
    group: root
    mode: "0640"
  when:
    - portainer_enabled | bool
    - portainer_check_enabled | bool

- name: Install the check
  ansible.builtin.copy:
    src: hcw-portainer-check
    dest: "{{ portainer_check_script }}"
    owner: root
    group: root
    mode: "0750"
  when:
    - portainer_enabled | bool
    - portainer_check_enabled | bool

- name: Install the check's unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ portainer_check_unit }}.service"
    - "{{ portainer_check_unit }}.timer"
  when:
    - portainer_enabled | bool
    - portainer_check_enabled | bool

# Read after the install, so in check mode it says whether a real run has
# installed the timer yet: systemd cannot enable a unit it has no file for,
# and a preview before the first real run must not stop here.
- name: Look for the check's timer
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ portainer_check_unit }}.timer"
  register: portainer_check_timer_file

# Before the check runs, so a check that fails below is run again every
# interval, and alerts again, until it passes.
- name: Enable the check's timer
  ansible.builtin.systemd_service:
    name: "{{ portainer_check_unit }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - portainer_check_configured | bool
    - not ansible_check_mode or portainer_check_timer_file.stat.exists

# Through the unit, so the run checks what the timer will run: its credential,
# its sandboxing and its arguments. A failure here also reaches
# hcw-unit-failed@, and is said below rather than failing the play: this role
# runs among the others, and a token the owner has yet to put right should
# not leave Vault, the add-ons and the backups unapplied behind it.
- name: Run the check once now, as the timer runs it
  ansible.builtin.command:
    argv:
      - systemctl
      - start
      - "{{ portainer_check_unit }}.service"
  register: portainer_check_run
  changed_when: false
  failed_when: false
  when:
    - portainer_check_configured | bool
    - not ansible_check_mode

- name: Read which run of the check that was
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=InvocationID
      - --value
      - "{{ portainer_check_unit }}.service"
  register: portainer_check_invocation
  changed_when: false
  when:
    - portainer_check_configured | bool
    - not ansible_check_mode

- name: Read what the check said
  ansible.builtin.command:
    argv:
      - journalctl
      - "_SYSTEMD_INVOCATION_ID={{ portainer_check_invocation.stdout | trim }}"
      - --output=cat
      - --no-pager
  register: portainer_check_said
  changed_when: false
  failed_when: false
  when:
    - portainer_check_configured | bool
    - not ansible_check_mode
    - portainer_check_invocation.stdout | trim | length > 0

- name: Say what the check saw
  ansible.builtin.debug:
    msg: >-
      {{ 'The Portainer check failed, which also raised the lab alert (hcw-unit-failed@): '
         if portainer_check_run.rc != 0 else '' }}{{
      (portainer_check_said.stdout_lines | default([]) | select('match', '^hcw-portainer-check: ') | list)[-1:] | join('')
         or ('nothing was read from its journal; read sudo journalctl -t ' ~ portainer_check_unit ~ ' -n 5') }}
  when:
    - portainer_check_configured | bool
    - not ansible_check_mode

- name: Say that the Portainer check is not configured
  ansible.builtin.debug:
    msg: 'The Portainer check is not configured: set vault_portainer_api_token (lab-host/README.md, "Portainer") and re-run bootstrap.sh.'
  when:
    - portainer_enabled | bool
    - portainer_check_enabled | bool
    - not portainer_check_configured | bool

- name: Stop and disable the check's timer while the check is off or its key is unset
  ansible.builtin.systemd_service:
    name: "{{ portainer_check_unit }}.timer"
    enabled: false
    state: stopped
  when:
    - not portainer_check_configured | bool
    - portainer_check_timer_file.stat.exists

- name: Stop and remove the Portainer container while Portainer is disabled
  community.docker.docker_container:
    name: "{{ portainer_container_name }}"
    state: absent
  when: not portainer_enabled | bool

- name: Say how to reach Portainer, and whether its first-administrator window is open
  ansible.builtin.debug:
    msg: >-
      Portainer {{ portainer_image_tag }} answers on https://127.0.0.1:{{ portainer_https_port }} on
      this host and nowhere else; from a workstation, ssh -L
      {{ portainer_https_port }}:127.0.0.1:{{ portainer_https_port }} hcw-lab and then
      https://localhost:{{ portainer_https_port }} (lab-host/README.md, "Portainer").
      {{ portainer_advice_timed_out if portainer_status.status | default(200) == 303 else portainer_advice_window }}
      {{ portainer_advice_setup_token }}
  when: portainer_enabled | bool

- name: Say why Portainer is not running
  ansible.builtin.debug:
    msg: >-
      Portainer is not running: portainer_enabled is false. Its volume {{ portainer_volume_name }},
      if it exists, is kept. To run it, set portainer_enabled to true in group_vars/all.yml and
      re-run bootstrap.sh (lab-host/README.md, "Portainer").
  when: not portainer_enabled | bool
