---
# A Coder with no account is never published (#954 review).
#
# Coder v2.38.0 lets whoever reaches a deployment that has no account make
# the first one, and that account is the deployment's Owner. Its /setup page
# makes a password account. A GitHub sign-in is let through as well, even
# with sign-ups off (coderd/userauth.go: `userCount == 0 ||
# params.AllowSignups`), limited only by the organisation and team
# allowlists. Two layers keep such a Coder unpublished. First, tasks/main.yml
# counts the accounts in Coder's database before Coder starts, and takes the
# route down, reloading Caddy then and there (tasks/unpublish.yml). Second,
# this asks Coder itself once it is up, before the route is written. On a
# 404 it takes down any route left, and fails with the owner's steps
# (docs/runbooks/labs-host.md, "A Coder with no account yet").
#
# Coder keeps running on the host's loopback only (127.0.0.1:7080), where
# those steps reach it. The sandbox user's firewall refuses host-local
# destinations, so no workspace reaches it there.
#
# GET /api/v2/users/first answers 404 until an account exists and 200 after,
# whatever that account's status. Measured on v2.38.0 on 2026-10-17: it
# stayed 200 with the first account suspended.
#
# Asked until Coder answers. `up --wait` returns once the container runs,
# not once Coder serves: on 2026-10-17 a recreated container was asked two
# seconds after it started, its published port reset the connection, and the
# run failed here. Coder answered 200 well within a minute. A Coder that never
# answers 200 or 404 within that minute still fails the run, before the
# route below is written.
- name: Ask Coder whether its first account exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ coder_http_port }}/api/v2/users/first"
    method: GET
    status_code: [200, 404]
  register: coder_first_user
  until: coder_first_user.status in [200, 404]
  # Attempts, not waits: 31 attempts make 30 two-second waits, a full minute.
  retries: 31
  delay: 2
  check_mode: false

# The second line of defence: tasks/main.yml has already taken the route
# down before Coder started, from the database's own count. Caddy is reloaded
# by the role's handler, never by a task (scripts/lab-host-caddy-admin.test.mjs),
# and site.yml sets force_handlers, so it still runs although the fail below
# ends the play. Not idempotent, on purpose, as in tasks/unpublish.yml: the
# removal always reports a change on this path, so the reload always runs,
# even for a route an interrupted run removed without reloading.
- name: Take down the coder route while Coder has no account
  ansible.builtin.file:
    path: "{{ coder_caddy_route_file }}"
    state: absent
  changed_when: true
  notify: Reload caddy for the coder route
  when: coder_first_user.status == 404

- name: Refuse to publish a Coder with no account
  ansible.builtin.fail:
    msg: >-
      Coder has no account yet (GET /api/v2/users/first answered 404). In that state whoever reaches it
      could make the first account, which is the deployment's Owner, so it stays unpublished, on this
      host's loopback only. Make that account as docs/runbooks/labs-host.md, "A Coder with no account
      yet", says, then run sudo /opt/hcw-src/lab-host/bootstrap.sh again.
  when: coder_first_user.status == 404
