---
# Fail closed before touching the host. site.yml asserts the allowlist too;
# repeated here so the role's contract does not depend on the play.
- name: Refuse to enable Coder with an empty GitHub organisation allowlist
  ansible.builtin.assert:
    that:
      - coder_oauth2_github_allowed_orgs | length > 0
    fail_msg: >-
      coder_enabled is true but coder_oauth2_github_allowed_orgs is empty. An empty
      CODER_OAUTH2_GITHUB_ALLOWED_ORGS lets any GitHub account sign in (ADR 0032).
    quiet: true
  when: coder_enabled | bool

- name: Refuse to enable Coder without its three vault secrets
  ansible.builtin.assert:
    that:
      - coder_secrets_present | bool
    fail_msg: >-
      coder_enabled is true but one of vault_coder_oauth2_github_client_id,
      vault_coder_oauth2_github_client_secret and vault_coder_postgres_password is
      unset. Add all three to the vault (lab-host/README.md, "Coder") and re-run
      bootstrap.sh.
    quiet: true
  when: coder_enabled | bool

- name: Refuse a PostgreSQL password that cannot be spliced into the connection URL
  ansible.builtin.assert:
    that:
      - coder_postgres_password is match(coder_postgres_password_pattern)
    fail_msg: >-
      vault_coder_postgres_password may only contain letters, digits and . _ ~ -
      because it is placed unescaped in CODER_PG_CONNECTION_URL. Generate one with
      `openssl rand -hex 32`.
    quiet: true
  when: coder_enabled | bool

# Enabled or not: the launcher's directory is removed, with everything in it,
# while Coder is disabled.
- name: Refuse a lab launcher directory that is not one of its own
  ansible.builtin.assert:
    that:
      - coder_launcher_dir is match(coder_launcher_dir_pattern)
    fail_msg: >-
      coder_launcher_dir is {{ coder_launcher_dir }}. It must be a directory of the lab
      launcher's own, /etc/caddy/hcw-<name>, because the role serves everything in it and
      removes it, with everything in it, while Coder is disabled.
    quiet: true

# Enabled or not, because the helper is installed either way.
- name: Refuse a template default autostop that is not whole hours
  ansible.builtin.assert:
    that:
      - coder_template_default_ttl is match(coder_template_default_ttl_pattern)
    fail_msg: >-
      coder_template_default_ttl is {{ coder_template_default_ttl }}. It must be whole hours,
      <n>h such as 1h, because hcw-coder-template-push checks that Coder reports it back as
      <n>h0m0s.
    quiet: true

- name: Refuse a workspace capacity the host's memory cannot hold
  ansible.builtin.assert:
    that:
      - (coder_max_workspaces | int * coder_workspace_memory_mib | int + coder_server_memory_reserve_mib | int) <= ansible_facts['memtotal_mb'] | int
    fail_msg: >-
      coder_max_workspaces is {{ coder_max_workspaces }} at {{ coder_workspace_memory_mib }} MiB each
      plus {{ coder_server_memory_reserve_mib }} MiB for Coder, PostgreSQL and the OS, which is more
      than this host's {{ ansible_facts['memtotal_mb'] }} MiB. Lower coder_max_workspaces or
      resize the host.
    quiet: true
  when: coder_enabled | bool

- name: Create the Compose project directory
  ansible.builtin.file:
    path: "{{ coder_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the Compose file from the repository checkout
  ansible.builtin.copy:
    src: "{{ coder_compose_source }}"
    dest: "{{ coder_compose_file }}"
    owner: root
    group: root
    mode: "0640"

- name: Write the Compose interpolation values (the three image pins)
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ coder_compose_env_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Write Coder's environment from the vault
  ansible.builtin.template:
    src: coder.env.j2
    dest: "{{ coder_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: coder_enabled | bool

- name: Write the PostgreSQL password from the vault
  ansible.builtin.template:
    src: coder-postgres.env.j2
    dest: "{{ coder_postgres_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: coder_enabled | bool

# While disabled the two secret files are emptied rather than removed: the
# Compose file marks them required, so `docker compose down` below could not
# even parse the project without them, and an empty file leaves no
# credential behind for a manual `up` to reuse.
- name: Empty the secret environment files while Coder is disabled
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "# Coder is disabled (coder_enabled: false); no values are rendered.\n"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ coder_env_file }}"
    - "{{ coder_postgres_env_file }}"
  when: not coder_enabled | bool

# The Compose file declares it external (lab-host/coder/docker-compose.yml),
# so it is created here, before `up`. On a host whose docker role carried it
# into the remapped root it already exists, and this changes nothing.
- name: Create PostgreSQL's volume, which Compose uses but does not own
  community.docker.docker_volume:
    name: coder-postgres-data
    state: present
  when: coder_enabled | bool

- name: Start Coder and PostgreSQL
  community.docker.docker_compose_v2:
    project_src: "{{ coder_project_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 300
  when: coder_enabled | bool

- name: Stop and remove the Coder containers while Coder is disabled
  community.docker.docker_compose_v2:
    project_src: "{{ coder_project_dir }}"
    state: absent
    remove_orphans: true
  when: not coder_enabled | bool

# The lab launcher, before the route that serves it. Caddy's file_server reads
# the files on every request, so a changed file needs no reload.
- name: Create the lab launcher's directory, readable by Caddy
  ansible.builtin.file:
    path: "{{ coder_launcher_dir }}"
    state: directory
    owner: root
    group: "{{ coder_caddy_group }}"
    mode: "0750"
  when: coder_enabled | bool

- name: Install the lab launcher's files from the repository checkout
  ansible.builtin.copy:
    src: "{{ coder_launcher_source }}/{{ item }}"
    dest: "{{ coder_launcher_dir }}/{{ item }}"
    owner: root
    group: "{{ coder_caddy_group }}"
    mode: "0640"
  loop: "{{ coder_launcher_files }}"
  when: coder_enabled | bool

# Caddy serves whatever is in the directory, so a file the repository no
# longer has must not stay behind.
- name: Find anything in the lab launcher's directory that is not one of its files
  ansible.builtin.find:
    paths: "{{ coder_launcher_dir }}"
    file_type: any
    hidden: true
    excludes: "{{ coder_launcher_files }}"
  register: coder_launcher_extra
  when: coder_enabled | bool

- name: Remove it
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ coder_launcher_extra.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: coder_enabled | bool

- name: Remove the lab launcher while Coder is disabled
  ansible.builtin.file:
    path: "{{ coder_launcher_dir }}"
    state: absent
  when: not coder_enabled | bool

- name: Render the Caddy route for the coder names
  ansible.builtin.template:
    src: 10-coder.caddy.j2
    dest: "{{ coder_caddy_route_file }}"
    owner: root
    group: "{{ coder_caddy_group }}"
    mode: "0640"
  when: coder_enabled | bool
  notify: Reload caddy for the coder route

- name: Remove the Caddy route while Coder is disabled
  ansible.builtin.file:
    path: "{{ coder_caddy_route_file }}"
    state: absent
  when: not coder_enabled | bool
  notify: Reload caddy for the coder route

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ coder_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the PostgreSQL backup script
  ansible.builtin.template:
    src: coder-postgres-backup.sh.j2
    dest: "{{ coder_backup_script_path }}"
    owner: root
    group: root
    mode: "0750"

# The owner's way to publish the hcw-lab template: a token on stdin, the
# checkout's template copied into the coder container, Coder's own CLI run
# there (README.md beside this role, "hcw-coder-template-push"). The path is
# written here, not a variable, because the owner's line in lab-host/README.md
# names it. Installed while disabled too, like the backup script; it then
# stops at the missing container and says so.
- name: Install hcw-coder-template-push, which publishes the hcw-lab template
  ansible.builtin.template:
    src: hcw-coder-template-push.j2
    dest: /usr/local/sbin/hcw-coder-template-push
    owner: root
    group: root
    mode: "0750"

- name: Install the backup service and timer units
  ansible.builtin.template:
    src: "coder-postgres-backup.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ coder_backup_unit_name }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  notify: Reload systemd for the coder backup units

- name: Enable the nightly backup timer
  ansible.builtin.systemd_service:
    name: "{{ coder_backup_unit_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when: coder_enabled | bool

- name: Stop the backup timer while Coder is disabled
  ansible.builtin.systemd_service:
    name: "{{ coder_backup_unit_name }}.timer"
    enabled: false
    state: stopped
    daemon_reload: true
  when: not coder_enabled | bool

# Coder automation (README.md beside this role, "Coder automation"): the
# site's status token renewed daily, and the template published by this role,
# both with the rotation credential the owner seeds once. Installed enabled or
# not, like the push helper; the timer runs only while Coder does. The paths
# of the two helpers are written here, not variables, because the unit, the
# seed wrapper and the owner's lines in docs/runbooks/labs-host.md name them.
- name: Create the rotation credential's directory, root-only
  ansible.builtin.file:
    path: "{{ coder_automation_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the automation's state directory, root-only
  ansible.builtin.file:
    path: "{{ coder_automation_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the automation's configuration (paths and names, no secret)
  ansible.builtin.template:
    src: hcw-coder-automation.json.j2
    dest: "{{ coder_automation_config_file }}"
    owner: root
    group: root
    mode: "0640"

- name: Install hcw-coder-automation, which renews the status token, publishes the template and reports
  ansible.builtin.copy:
    src: hcw-coder-automation.py
    dest: /usr/local/libexec/hcw-coder-automation
    owner: root
    group: root
    mode: "0750"

- name: Install hcw-coder-automation-seed, the owner's one-time step
  ansible.builtin.template:
    src: hcw-coder-automation-seed.j2
    dest: /usr/local/sbin/hcw-coder-automation-seed
    owner: root
    group: root
    mode: "0750"

- name: Install the automation's service and timer units
  ansible.builtin.template:
    src: "hcw-coder-automation.{{ item }}.j2"
    dest: "/etc/systemd/system/hcw-coder-automation.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  notify: Reload systemd for the coder automation units

- name: Enable the daily automation timer
  ansible.builtin.systemd_service:
    name: hcw-coder-automation.timer
    enabled: true
    state: started
    daemon_reload: true
  when: coder_enabled | bool

- name: Stop the automation timer while Coder is disabled
  ansible.builtin.systemd_service:
    name: hcw-coder-automation.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when: not coder_enabled | bool

# The templates, every directory under lab-host/coder/templates with a *.tf
# (hcw-lab first), each published by this run when its files (or the default
# autostop) differ from what the helper last published for it: it keeps a
# SHA-256 per template of exactly what hcw-coder-template-push copies, and
# publishes again only when that changes or the last publish failed. It hands the push helper the
# rotation credential on stdin, as the owner's line does with the owner's
# token. Here, before lab_images removes the images the previous template
# version names, so no workspace starts in between (docs/runbooks/labs-host.md,
# "After a merge"). Exit 3 is "no working rotation credential yet": the run
# goes on and the next task says how to seed one.
- name: Publish the Coder templates with the rotation credential when they changed
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/hcw-coder-automation
      - --config
      - "{{ coder_automation_config_file }}"
      - push-template
  register: coder_automation_push
  changed_when: "'hcw-coder-automation: published' in coder_automation_push.stdout"
  failed_when: coder_automation_push.rc not in [0, 3]
  when:
    - coder_enabled | bool
    - not ansible_check_mode

- name: Say how to let bootstrap.sh publish the template
  ansible.builtin.debug:
    msg: "{{ coder_automation_push.stdout }}"
  when:
    - coder_enabled | bool
    - not ansible_check_mode
    - coder_automation_push.rc | default(0) == 3

- name: Say why Coder is not running
  ansible.builtin.debug:
    msg: >-
      Coder is installed under {{ coder_project_dir }} but not running: coder_enabled is
      false. To enable it, set coder_oauth2_github_allowed_orgs, add
      vault_coder_oauth2_github_client_id, vault_coder_oauth2_github_client_secret and
      vault_coder_postgres_password to the vault, set coder_enabled to true in
      group_vars/all.yml and re-run bootstrap.sh (lab-host/README.md, "Coder").
  when: not coder_enabled | bool
