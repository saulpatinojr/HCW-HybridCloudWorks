---
# Derived values. Not meant to be overridden, which is why they are vars and
# not defaults.
# Pulled by digest, never by tag (the tags in group_vars are for humans).
coder_image_ref: "{{ coder_image }}@{{ coder_image_digest }}"
coder_postgres_image_ref: "{{ coder_postgres_image }}@{{ coder_postgres_image_digest }}"
coder_docker_proxy_image_ref: "{{ coder_docker_proxy_image }}@{{ coder_docker_proxy_image_digest }}"
# The Compose file in this repository is the one source; the role copies it
# rather than carrying a second copy under files/.
coder_compose_source: "{{ role_path }}/../../../coder/docker-compose.yml"
# The launcher's files, the same way: the repository's lab-host/coder/launcher/
# is the one source. They are named, so the role can remove anything else from
# the directory Caddy serves; scripts/lab-host-launcher.test.mjs fails when
# this list and the directory differ.
coder_launcher_source: "{{ role_path }}/../../../coder/launcher"
coder_launcher_files:
  - index.html
  - launcher.css
  - launcher.js
  - main.js
# The role removes coder_launcher_dir, and everything in it, while Coder is
# disabled, so it must be a directory of the launcher's own.
coder_launcher_dir_pattern: '^/etc/caddy/hcw-[a-z0-9-]+$'
coder_secrets_present: >-
  {{ coder_oauth2_github_client_id | length > 0
     and coder_oauth2_github_client_secret | length > 0
     and coder_postgres_password | length > 0 }}
# The password is spliced into a URL, so the role only accepts characters that
# need no escaping there (RFC 3986 unreserved). `openssl rand -hex 32` is the
# documented way to make one.
coder_postgres_password_pattern: '^[A-Za-z0-9._~-]+$'
# A GitHub team as CODER_OAUTH2_GITHUB_ALLOWED_TEAMS takes it:
# <organisation>/<team-slug>, one slash, nothing else. Coder v2.38.0 splits
# each entry at its first slash (cli/server.go, configureGithubOAuth2) and
# compares the organisation with GitHub's login exactly, case included.
coder_oauth2_github_team_pattern: '^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$'
# Whole hours: hcw-coder-template-push compares Coder's read-back (a Go
# duration, 1h0m0s) with this value, and refuses any other shape itself.
coder_template_default_ttl_pattern: '^[1-9][0-9]*h$'
coder_pg_connection_url: "postgresql://coder:{{ coder_postgres_password }}@coder-postgres:5432/coder?sslmode=disable"
coder_backup_keep_minutes: "{{ coder_backup_keep_days | int * 1440 }}"
