---
# coder_enabled, coder_oauth2_github_allowed_orgs, coder_oauth2_github_allowed_teams,
# coder_oauth2_github_allow_signups, coder_domain, coder_max_workspaces and the
# image pins (coder_image, coder_image_tag, coder_image_digest,
# coder_postgres_image, coder_postgres_image_tag, coder_postgres_image_digest)
# live in group_vars/all.yml; meta/argument_specs.yml marks them required.

# Where the Compose project lives on the host. docker compose reads
# docker-compose.yml, .env (interpolation), coder.env and coder-postgres.env
# from this one directory.
coder_project_dir: /etc/hcw/coder
coder_compose_file: "{{ coder_project_dir }}/docker-compose.yml"
coder_compose_env_file: "{{ coder_project_dir }}/.env"
coder_env_file: "{{ coder_project_dir }}/coder.env"
coder_postgres_env_file: "{{ coder_project_dir }}/coder-postgres.env"

# The port docker-compose.yml publishes on the host's loopback and the Caddy
# route proxies to.
coder_http_port: 7080

# The Caddy route. caddy_sites_dir and caddy_group in the caddy role default
# to the same values; repeated here so this role's contract stands alone.
coder_caddy_sites_dir: /etc/caddy/conf.d
coder_caddy_group: caddy
coder_caddy_route_file: "{{ coder_caddy_sites_dir }}/10-coder.caddy"
# Answered with 503 while the coder service is stopped. It renders inside the
# site's pane, where a visitor reads it, so it names no tool and no host, and
# it is the site's own sentence for the same state (UNAVAILABLE_SENTENCE in
# frontend/src/pages/shared/LabPanePage.jsx). scripts/lab-host-visitor-copy.test.mjs
# holds both.
coder_unavailable_response: "Lab workspaces aren't available right now."
# The lab launcher (lab-host/coder/launcher/): the static page the site's
# panes load at https://<coder_domain>/_hcw/lab/, which opens code-server
# inside the pane. Caddy serves it from this directory, so the files are
# root-owned and readable by the caddy group only.
coder_launcher_dir: /etc/caddy/hcw-lab-launcher

# Secrets, from the vault file bootstrap.sh passes with -e. All three must be
# set when coder_enabled is true; the role fails closed otherwise.
coder_oauth2_github_client_id: "{{ vault_coder_oauth2_github_client_id | default('') }}"
coder_oauth2_github_client_secret: "{{ vault_coder_oauth2_github_client_secret | default('') }}"
coder_postgres_password: "{{ vault_coder_postgres_password | default('') }}"

# The capacity assertion's two inputs (tasks/main.yml): the memory limit the
# hcw-lab template gives each workspace (memory_mib in
# lab-host/coder/templates/hcw-lab/main.tf), and the headroom kept for the
# Coder server (1 GiB), PostgreSQL (512 MiB) and the OS (1 GiB). They were in
# meta/argument_specs.yml only until 2026-09-28, and Ansible does not turn an
# argument spec's default into a variable, so the first run with
# coder_enabled true stopped at that assertion with
# "'coder_workspace_memory_mib' is undefined".
coder_workspace_memory_mib: 2048
coder_server_memory_reserve_mib: 2560

# The hcw-lab template's default autostop, set by /usr/local/sbin/hcw-coder-template-push
# (`coder templates edit hcw-lab --default-ttl`) after every publish; this is the
# one place it is written, and the helper is rendered with it. Whole hours
# (<n>h), which the role asserts: Coder's template settings take the default
# autostop in hours, and the helper checks that Coder reports it back as
# <n>h0m0s. lab-host/README.md, "Publishing the template".
coder_template_default_ttl: 1h

# Coder automation (README.md beside this role, "Coder automation";
# docs/runbooks/labs-host.md, "Automatic renewal"). The rotation credential,
# an unscoped token of coder_automation_status_user, lives in a directory of
# its own under the Compose project's, root-only like coder.env: the owner's
# hcw-coder-automation-seed writes it there once, the daily timer renames a
# renewed one into place, and this role never reads or writes the file.
coder_automation_dir: /etc/hcw/coder/automation
coder_automation_credential_file: "{{ coder_automation_dir }}/rotation-token"
# Paths and names for /usr/local/libexec/hcw-coder-automation, no secret.
coder_automation_config_file: /etc/hcw/coder/automation.json
# What the helper last did (the live status token's id and name, the template
# it last published and when), which the timer reports to the site. Token ids
# are the part of a token before the dash, never its secret.
coder_automation_state_dir: /var/lib/hcw-coder-automation
# The Coder user that owns the rotation credential and the site's status
# token: Template Admin, never Owner (lab-host/README.md, "The status token
# for the site", step 2, creates it).
coder_automation_status_user: hcw-status
# Daily, after the 03:30 backup and the 04:30 idle reboot, with up to 30
# minutes of jitter.
coder_automation_on_calendar: "*-*-* 05:45:00"
# The checkout hcw-coder-template-push publishes from: bootstrap.sh's
# HCW_SRC_DIR default, which the helper names too.
coder_automation_src_dir: /opt/hcw-src
# The lab agent, whose CLI hands the site its token and the report. These
# repeat labs_agent_user (group_vars/all.yml), labs_agent_group and
# labs_agent_env_file (the labs_agent role's defaults) and labs_agent_app_dir
# (labs_agent_home/vps-agent), so this role's contract stands alone; the
# test beside this role fails when they differ. The CLI runs from the agent's
# own checkout, which has its node_modules, not /opt/hcw-src, which does not.
coder_automation_agent_user: hcw-labs-agent
coder_automation_agent_group: hcw-labs-agent
coder_automation_agent_env_file: /etc/hcw/labs-agent.env
coder_automation_agent_app_dir: /opt/hcw-labs-agent/vps-agent
coder_automation_report_cli: bin/report-coder-automation.js
# How long the CLI may take before systemd stops it and the run fails.
coder_automation_report_timeout_seconds: 120

# Nightly pg_dump, the convenience docs/architecture/labs-host.md describes:
# seven days on the host, never copied anywhere.
coder_backup_dir: /var/backups/coder
coder_backup_keep_days: 7
coder_backup_on_calendar: "*-*-* 03:30:00"
coder_backup_script_path: /usr/local/sbin/coder-postgres-backup
coder_backup_unit_name: coder-postgres-backup
