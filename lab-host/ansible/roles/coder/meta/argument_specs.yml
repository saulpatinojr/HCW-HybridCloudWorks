---
argument_specs:
  main:
    short_description: Run Coder Community edition and its PostgreSQL under Docker Compose behind Caddy, with a nightly pg_dump
    description:
      - Installs lab-host/coder/docker-compose.yml to /etc/hcw/coder with a Compose .env carrying
        the digest-pinned images and the host's docker group id, and writes Coder's secrets
        (GitHub OAuth client id and secret, the PostgreSQL password) from vault variables into
        two root-only env files, one per service, with no_log.
      - With coder_enabled true it runs docker compose up, installs the lab launcher's static
        files, renders the Caddy route for coder.<domain> and *.coder.<domain> into conf.d and
        starts a nightly pg_dump timer keeping seven days under /var/backups/coder. With it false
        it runs docker compose down (volumes kept), empties the secret files, removes the
        launcher and the route and stops the timer.
      - Fails closed when enabled without a non-empty GitHub organisation allowlist, without a
        non-empty GitHub team allowlist whose every team is in an allowed organisation, without
        all three secrets, with a password that needs URL escaping, or on a host whose memory
        cannot hold coder_max_workspaces workspaces (ADR 0032).
      - Installs /usr/local/sbin/hcw-coder-template-push, root:root 0750, enabled or not. It
        takes a Coder token on stdin and publishes the hcw-lab template from the checkout in
        /opt/hcw-src with the CLI inside the coder container, then sets its default autostop to
        coder_template_default_ttl.
      - Installs Coder automation, enabled or not. /usr/local/sbin/hcw-coder-automation-seed takes
        the owner's token on stdin once and stores a rotation credential, an unscoped token of
        coder_automation_status_user (Template Admin, never Owner), root-only in
        coder_automation_credential_file. The daily hcw-coder-automation timer, running only while
        Coder is enabled, then renews the site's read-only status token through the lab agent's
        CLI, deletes the old ones, renews the rotation credential and reports, and every run of
        this role publishes the hcw-lab template with that credential when its files changed.
        Without a credential the publish is skipped with a message, never failed.
    author: HybridCloudWorks
    options:
      coder_enabled:
        type: bool
        required: true
        description: Whether Coder runs. False stops and removes the containers and the Caddy route; the PostgreSQL volume stays.
      coder_oauth2_github_allowed_orgs:
        type: list
        elements: str
        required: true
        description:
          - GitHub organisations whose members may sign in, rendered comma-separated into
            CODER_OAUTH2_GITHUB_ALLOWED_ORGS. Must be non-empty while coder_enabled is true; an
            empty list would let any GitHub account in.
      coder_oauth2_github_allowed_teams:
        type: list
        elements: str
        required: true
        description:
          - GitHub teams whose members may sign in, each <organisation>/<team-slug>, rendered
            comma-separated into CODER_OAUTH2_GITHUB_ALLOWED_TEAMS (Coder v2.38.0). Coder checks
            a team only inside an organisation the learner already passed, so each team's
            organisation must be in coder_oauth2_github_allowed_orgs, spelled the same way; the
            role refuses any other. Must be non-empty while coder_enabled is true; an empty list
            would let every member of the allowed organisations in.
      coder_oauth2_github_allow_signups:
        type: bool
        required: true
        description:
          - CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS. True lets a member of an allowed team who has no
            Coder account create one at their first GitHub sign-in. False (the setting since
            2026-10-16) refuses that sign-in with "Signups are disabled", so the owner creates a
            learner's account first (coder users create --login-type github with the learner's
            primary verified GitHub email), and leaves existing accounts working.
      coder_domain:
        type: str
        required: true
        description: The dashboard's host name, coder.lab.hybridcloudworks.com. Workspace apps are *.<coder_domain>.
      coder_max_workspaces:
        type: int
        required: true
        description:
          - The number of concurrent workspaces the host is sized for. Coder Community does not
            enforce a count; the role asserts that this many workspaces at
            coder_workspace_memory_mib plus coder_server_memory_reserve_mib fit in the host's
            memory, and the site's status card (#680) publishes it as capacity.
      coder_workspace_memory_mib:
        type: int
        required: false
        default: 2048
        description: The memory limit the hcw-lab template sets per workspace (memory_mib in templates/hcw-lab/main.tf), for the capacity assertion.
      coder_server_memory_reserve_mib:
        type: int
        required: false
        default: 2560
        description: Memory kept for the Coder server (1 GiB), PostgreSQL (512 MiB) and the OS (1 GiB) in the capacity assertion.
      coder_image:
        type: str
        required: true
        description: Coder image repository, ghcr.io/coder/coder.
      coder_image_tag:
        type: str
        required: true
        description: The release the digest was read from, for example v2.37.3. Recorded, not pulled.
      coder_image_digest:
        type: str
        required: true
        description: Image index digest of the Coder release; the container runs image@digest.
      coder_postgres_image:
        type: str
        required: true
        description: PostgreSQL image repository, postgres.
      coder_postgres_image_tag:
        type: str
        required: true
        description: The release the digest was read from, for example 18.6. Recorded, not pulled.
      coder_postgres_image_digest:
        type: str
        required: true
        description: Image index digest of the PostgreSQL release; the container runs image@digest.
      coder_docker_proxy_image:
        type: str
        required: true
        description: The Docker socket proxy image the coder server reaches the daemon through (LAB-5), for example tecnativa/docker-socket-proxy.
      coder_docker_proxy_image_tag:
        type: str
        required: true
        description: The release the proxy digest was read from, for example 0.3.0. Recorded, not pulled.
      coder_docker_proxy_image_digest:
        type: str
        required: true
        description: Image index digest of the proxy release; the container runs image@digest.
      coder_oauth2_github_client_id:
        type: str
        required: false
        default: ""
        description: CODER_OAUTH2_GITHUB_CLIENT_ID; defaults to vault_coder_oauth2_github_client_id. Required when enabled.
      coder_oauth2_github_client_secret:
        type: str
        required: false
        default: ""
        description: CODER_OAUTH2_GITHUB_CLIENT_SECRET; defaults to vault_coder_oauth2_github_client_secret. Required when enabled.
      coder_postgres_password:
        type: str
        required: false
        default: ""
        description:
          - The coder database user's password, used in POSTGRES_PASSWORD and
            CODER_PG_CONNECTION_URL; defaults to vault_coder_postgres_password. Required when
            enabled, and limited to RFC 3986 unreserved characters because it is placed in the
            URL unescaped.
      coder_project_dir:
        type: path
        required: false
        default: /etc/hcw/coder
        description: The Compose project directory holding docker-compose.yml, .env, coder.env and coder-postgres.env.
      coder_compose_file:
        type: path
        required: false
        default: /etc/hcw/coder/docker-compose.yml
        description: Where the Compose file is installed.
      coder_compose_env_file:
        type: path
        required: false
        default: /etc/hcw/coder/.env
        description: Compose interpolation file with CODER_IMAGE, CODER_POSTGRES_IMAGE and DOCKER_GID. Not secret; root-only anyway.
      coder_env_file:
        type: path
        required: false
        default: /etc/hcw/coder/coder.env
        description: env_file of the coder service, root:root 0600, written with no_log.
      coder_postgres_env_file:
        type: path
        required: false
        default: /etc/hcw/coder/coder-postgres.env
        description: env_file of the coder-postgres service, root:root 0600, written with no_log.
      coder_http_port:
        type: int
        required: false
        default: 7080
        description: The loopback port the Compose file publishes and the Caddy route proxies to.
      coder_caddy_sites_dir:
        type: path
        required: false
        default: /etc/caddy/conf.d
        description: The caddy role's conf.d, imported inside the wildcard site block.
      coder_caddy_group:
        type: str
        required: false
        default: caddy
        description: Group that owns the route file, so the caddy user can read it.
      coder_caddy_route_file:
        type: path
        required: false
        default: /etc/caddy/conf.d/10-coder.caddy
        description: The route file; removed while Coder is disabled.
      coder_unavailable_response:
        type: str
        required: false
        description: Body Caddy returns with 503 for the coder names when the coder service is stopped.
      coder_launcher_dir:
        type: path
        required: false
        default: /etc/caddy/hcw-lab-launcher
        description:
          - Where the lab launcher's static files (lab-host/coder/launcher/) are installed, root-owned
            and readable by coder_caddy_group. The Caddy route serves them at /_hcw/lab/ on
            coder_domain, the page the site's panes load. Anything else in it is removed, and so is
            the directory while Coder is disabled, so the role refuses any path but a directory of
            its own, /etc/caddy/hcw-<name>.
      coder_template_default_ttl:
        type: str
        required: false
        default: 1h
        description:
          - The hcw-lab template's default autostop, which hcw-coder-template-push sets with
            `coder templates edit --default-ttl` after every publish and is rendered with. Whole
            hours, <n>h; the role refuses any other shape, because the helper checks that Coder
            reports the value back as <n>h0m0s.
      coder_automation_dir:
        type: path
        required: false
        default: /etc/hcw/coder/automation
        description: Directory of the rotation credential, root:root 0700. The timer's unit may write here and nowhere else under /etc.
      coder_automation_credential_file:
        type: path
        required: false
        default: /etc/hcw/coder/automation/rotation-token
        description:
          - The rotation credential, root:root 0600, written by hcw-coder-automation-seed and renamed
            into place by the timer when it renews it. The role never reads or writes it; the helper
            refuses it unless it is a regular file owned by root with no group or other bits.
      coder_automation_config_file:
        type: path
        required: false
        default: /etc/hcw/coder/automation.json
        description: The helper's configuration (paths, names, the agent's user), rendered from these variables. No secret.
      coder_automation_state_dir:
        type: path
        required: false
        default: /var/lib/hcw-coder-automation
        description: The helper's state.json and lock, root:root 0700. No token is ever written there.
      coder_automation_status_user:
        type: str
        required: false
        default: hcw-status
        description:
          - The Coder user that owns the rotation credential and the site's status token. It must hold
            Template Admin and must not hold Owner; the seed and every run refuse otherwise.
      coder_automation_on_calendar:
        type: str
        required: false
        default: "*-*-* 05:45:00"
        description: systemd OnCalendar for the daily timer, with up to 30 minutes of jitter.
      coder_automation_src_dir:
        type: path
        required: false
        default: /opt/hcw-src
        description: The checkout hcw-coder-template-push publishes from, bootstrap.sh's HCW_SRC_DIR.
      coder_automation_agent_user:
        type: str
        required: false
        default: hcw-labs-agent
        description: The lab agent's user, which runs the site's CLI; labs_agent_user.
      coder_automation_agent_group:
        type: str
        required: false
        default: hcw-labs-agent
        description: The lab agent's group; labs_agent_group.
      coder_automation_agent_env_file:
        type: path
        required: false
        default: /etc/hcw/labs-agent.env
        description: The agent's EnvironmentFile, which systemd reads for the CLI as it does for the agent; labs_agent_env_file.
      coder_automation_agent_app_dir:
        type: path
        required: false
        default: /opt/hcw-labs-agent/vps-agent
        description: The agent's own checkout of vps-agent, with its node_modules, where the CLI runs; labs_agent_app_dir.
      coder_automation_report_cli:
        type: str
        required: false
        default: bin/report-coder-automation.js
        description: The CLI, relative to coder_automation_agent_app_dir, that stores the status token and the report on the site.
      coder_automation_report_timeout_seconds:
        type: int
        required: false
        default: 120
        description: How long the CLI may run before systemd stops it and the run fails.
      coder_backup_dir:
        type: path
        required: false
        default: /var/backups/coder
        description: Where the nightly pg_dump writes coder-<UTC timestamp>.sql.gz, root-only.
      coder_backup_keep_days:
        type: int
        required: false
        default: 7
        description: Dumps older than this are deleted by the next run.
      coder_backup_on_calendar:
        type: str
        required: false
        default: "*-*-* 03:30:00"
        description: systemd OnCalendar for the timer, with up to ten minutes of jitter.
      coder_backup_script_path:
        type: path
        required: false
        default: /usr/local/sbin/coder-postgres-backup
        description: The dump script the service runs.
      coder_backup_unit_name:
        type: str
        required: false
        default: coder-postgres-backup
        description: Name of the .service and .timer units.
