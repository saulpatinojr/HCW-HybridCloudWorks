---
# caddy_version, caddy_cloudflare_module_version, caddy_builder_image,
# caddy_builder_image_tag, caddy_builder_image_digest, caddy_site_domain,
# caddy_site_names, caddy_frame_ancestors and caddy_direct_visit_redirect
# live in group_vars/all.yml; meta/argument_specs.yml marks them required.
caddy_user: caddy
caddy_group: caddy
caddy_home: /var/lib/caddy
caddy_config_dir: /etc/caddy
caddy_sites_dir: /etc/caddy/conf.d
caddy_build_dir: /opt/caddy/bin
caddy_binary_path: /usr/local/bin/caddy
caddy_env_file: /etc/caddy/env

# Secrets come from the vault file bootstrap.sh passes with -e. With no token
# the role still installs and runs Caddy, but fails closed: an HTTP-only apex
# that answers 503 and imports nothing from conf.d.
caddy_cloudflare_api_token: "{{ vault_cloudflare_api_token | default('') }}"
caddy_acme_email: "{{ vault_caddy_acme_email | default('') }}"
# Where Caddy writes its DNS-01 TXT records: the one name in the dedicated lab
# zone that the production zone's _acme-challenge CNAMEs point at
# (infra-lab/dns.tf, #948). group_vars sets it; empty renders no override.
caddy_dns_challenge_override_domain: ""

# Every name here can be framed by the site (lab_panes_only), so these two
# bodies can render inside a pane, where a visitor reads them. They name no
# tool, no host and no setting, like the site's own pages;
# scripts/lab-host-visitor-copy.test.mjs holds them to that.
caddy_apex_response: "There's no lab at this address."
caddy_unknown_host_response: "There's no lab at this address."
