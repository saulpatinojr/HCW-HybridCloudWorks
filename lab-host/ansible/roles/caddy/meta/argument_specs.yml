---
argument_specs:
  main:
    short_description: Build and run Caddy with the Cloudflare DNS module for the lab names, host-native under systemd
    description:
      - Builds Caddy with xcaddy inside the official builder image, pulled and run by digest
        (Docker must already be installed), verifies the version and the Cloudflare DNS module,
        records the build's provenance next to the binary and installs it.
      - Renders a Caddyfile with one site block for the three certificate names, terminating TLS
        with DNS-01, and a conf.d directory later roles add routes to. Without a token the
        Caddyfile fails closed to an HTTP-only 503 apex that imports nothing.
      - Writes the Cloudflare API token to /etc/caddy/env (root:caddy, 0640), which the caddy
        unit reads through EnvironmentFile as the non-root caddy user.
      - Panes only (owner decision 2026-09-28). Every response for every name carries
        Content-Security-Policy frame-ancestors with caddy_frame_ancestors. A top-level browser
        visit (Sec-Fetch-Dest document, or navigate with no destination) is redirected with 302
        to caddy_direct_visit_redirect, unless a conf.d route set lab_top_level_allowed for it.
    author: HybridCloudWorks
    options:
      caddy_version:
        type: str
        required: true
        description: Caddy release tag passed to xcaddy build, for example v2.11.4.
      caddy_cloudflare_module_version:
        type: str
        required: true
        description: github.com/caddy-dns/cloudflare tag, for example v0.2.4.
      caddy_builder_image:
        type: str
        required: true
        description: Builder image repository, normally caddy.
      caddy_builder_image_tag:
        type: str
        required: true
        description: Builder image tag the digest was read from, for example 2.11.4-builder. Recorded, not pulled.
      caddy_builder_image_digest:
        type: str
        required: true
        description:
          - Image index digest of the builder. The image is pulled and run as image@digest, so
            Docker verifies the content and a bumped pin is pulled as a new reference; the
            first twelve hex characters are part of the built binary's name, so a bump here
            rebuilds.
      caddy_site_domain:
        type: str
        required: true
        description: Apex domain, used for the apex matcher and the fail-closed placeholder.
      caddy_site_names:
        type: list
        elements: str
        required: true
        description: Every name the site block serves and obtains a certificate for.
      caddy_frame_ancestors:
        type: list
        elements: str
        required: true
        description:
          - Sources allowed to frame every name the site block serves, joined with spaces into
            Content-Security-Policy frame-ancestors on every response. The site's origins, and
            'self' for code-server's same-origin webviews.
      caddy_direct_visit_redirect:
        type: str
        required: true
        description:
          - Where a top-level browser visit to any lab name is sent with 302, the site's labs page.
      caddy_cloudflare_api_token:
        type: str
        required: false
        default: ""
        description:
          - Cloudflare API token with DNS edit on the zone holding the _acme-challenge TXT records,
            the dedicated lab zone since 2026-10-18 (#948); defaults to vault_cloudflare_api_token.
            Empty fails closed.
      caddy_dns_challenge_override_domain:
        type: str
        required: false
        default: ""
        description:
          - The full name Caddy writes every DNS-01 TXT record at, the target of the
            _acme-challenge CNAMEs in the production zone (Caddyfile dns_challenge_override_domain;
            certmagic does not follow a CNAME by itself). Empty renders no override, so Caddy
            writes at the challenge name itself, which needs a token on the production zone.
      caddy_acme_email:
        type: str
        required: false
        default: ""
        description: ACME account contact, defaults to vault_caddy_acme_email. Omitted when empty.
      caddy_apex_response:
        type: str
        required: false
        description: Body the apex returns until a later role claims it.
      caddy_unknown_host_response:
        type: str
        required: false
        description: Body returned with 404 for a name no route claims.
      caddy_user:
        type: str
        required: false
        default: caddy
        description: Service user.
      caddy_group:
        type: str
        required: false
        default: caddy
        description: Service group.
      caddy_home:
        type: path
        required: false
        default: /var/lib/caddy
        description: Home for the service user; Caddy keeps certificates under it.
      caddy_config_dir:
        type: path
        required: false
        default: /etc/caddy
        description: Where the Caddyfile lives.
      caddy_sites_dir:
        type: path
        required: false
        default: /etc/caddy/conf.d
        description: Snippets imported inside the site block; one file per route owner.
      caddy_build_dir:
        type: path
        required: false
        default: /opt/caddy/bin
        description: Where xcaddy writes the versioned binary and its provenance file.
      caddy_binary_path:
        type: path
        required: false
        default: /usr/local/bin/caddy
        description: Where the active binary is installed.
      caddy_env_file:
        type: path
        required: false
        default: /etc/caddy/env
        description: File holding CLOUDFLARE_API_TOKEN, owner root, group caddy, mode 0640, read by the caddy unit through EnvironmentFile.
