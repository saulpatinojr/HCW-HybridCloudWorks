---
- name: Create the caddy group
  ansible.builtin.group:
    name: "{{ caddy_group }}"
    system: true
    state: present

- name: Create the caddy system user
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ caddy_home }}"
    create_home: true
    state: present

- name: Create the Caddy directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ caddy_config_dir }}", owner: root, group: "{{ caddy_group }}", mode: "0750" }
    - { path: "{{ caddy_sites_dir }}", owner: root, group: "{{ caddy_group }}", mode: "0750" }
    - { path: "{{ caddy_build_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ caddy_home }}", owner: "{{ caddy_user }}", group: "{{ caddy_group }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"

- name: Pull the Caddy builder image by its pinned digest
  community.docker.docker_image_pull:
    name: "{{ caddy_builder_image_ref }}"
    pull: not_present

# --userns=host (LAB-5, 2026-10-07): the daemon remaps container root to an
# unprivileged range (roles/docker), which cannot write the binary into this
# root-owned host directory. The builder is the pinned caddy image, run once
# by root, with no network beyond the module download it exists for.
- name: Build Caddy with the Cloudflare DNS module
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --userns=host
      - --volume
      - "{{ caddy_build_dir }}:/out"
      - "{{ caddy_builder_image_ref }}"
      - xcaddy
      - build
      - "{{ caddy_version }}"
      - --with
      - "github.com/caddy-dns/cloudflare@{{ caddy_cloudflare_module_version }}"
      - --output
      - "/out/{{ caddy_built_binary_name }}"
    creates: "{{ caddy_built_binary }}"

- name: Record what the binary was built from
  ansible.builtin.copy:
    dest: "{{ caddy_built_binary }}.provenance"
    content: |
      caddy_version={{ caddy_version }}
      caddy_cloudflare_module_version={{ caddy_cloudflare_module_version }}
      builder_image={{ caddy_builder_image_ref }}
    owner: root
    group: root
    mode: "0644"

- name: Confirm the built binary is the pinned Caddy version
  ansible.builtin.command:
    argv:
      - "{{ caddy_built_binary }}"
      - version
  register: caddy_binary_version
  changed_when: false
  failed_when: caddy_version not in caddy_binary_version.stdout

- name: Confirm the built binary carries the Cloudflare DNS module
  ansible.builtin.command:
    argv:
      - "{{ caddy_built_binary }}"
      - list-modules
  register: caddy_modules
  changed_when: false
  failed_when: "'dns.providers.cloudflare' not in caddy_modules.stdout"

- name: Install the built binary
  ansible.builtin.copy:
    src: "{{ caddy_built_binary }}"
    dest: "{{ caddy_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart caddy

- name: Check whether a Caddy binary is installed
  ansible.builtin.stat:
    path: "{{ caddy_binary_path }}"
  register: caddy_binary_stat

- name: Write the Cloudflare API token for the DNS challenge
  ansible.builtin.copy:
    dest: "{{ caddy_env_file }}"
    content: "CLOUDFLARE_API_TOKEN={{ caddy_cloudflare_api_token }}\n"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart caddy

- name: Render the apex placeholder route
  ansible.builtin.template:
    src: 00-apex.caddy.j2
    dest: "{{ caddy_sites_dir }}/00-apex.caddy"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
  notify: Reload caddy

- name: Render the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_dir }}/Caddyfile"
    owner: root
    group: "{{ caddy_group }}"
    mode: "0640"
    # --envfile loads the same file the unit reads through EnvironmentFile=,
    # so {env.CLOUDFLARE_API_TOKEN} resolves during validation as it does at
    # run time. Without it the check saw an empty token and refused the TLS
    # Caddyfile ("API token '' appears invalid"), which first happened on
    # 2026-09-27, the first run with a vault; every earlier run was TLS-off.
    # The file is written by the task above on every run, so it always exists.
    validate: >-
      {{ caddy_binary_stat.stat.exists
         | ternary(caddy_binary_path ~ ' validate --adapter caddyfile --envfile ' ~ caddy_env_file ~ ' --config %s', omit) }}
  notify: Reload caddy

- name: Install the Caddy systemd unit
  ansible.builtin.template:
    src: caddy.service.j2
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart caddy

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true

# Every reload goes through the admin socket (#958), and the socket exists
# only while a Caddy started from this unit and this Caddyfile runs: systemd
# creates its directory at start and removes it at stop. A Caddy that is
# running without it is still on an older configuration (the first run after
# the move from TCP 2019, or a run interrupted between the unit change and
# its handlers), and a reload, this role's or the coder and addons roles',
# would find nothing listening. So that case notifies the restart, which
# handlers/main.yml defines ahead of every reload of Caddy and therefore runs
# first. Read-only, so check mode reports the same drift. Tagged `always`
# because the reloads that need the socket also come from the coder and
# addons roles: a `bootstrap.sh --tags coder` (or addons) run on a host whose
# last run stopped mid-change must still restart Caddy before reloading it.
- name: Check that the running Caddy answers on the admin socket
  ansible.builtin.stat:
    path: "{{ caddy_admin_socket }}"
    get_checksum: false
  register: caddy_admin_socket_stat
  changed_when: not (caddy_admin_socket_stat.stat.issock | default(false))
  notify: Restart caddy
  tags: [always]

# Prove the change took, not only that the files were written. Run the
# pending restart or reload now, then read what is live: the socket exists,
# is owned by the Caddy user and is write-only for it (Caddy's default mode
# for an admin socket, 0200), Caddy answers on it, and nothing listens on TCP
# 2019 any more. Flushing here keeps the restart ahead of every reload: the
# coder and addons roles notify theirs later in the play. Caddy skips its
# Host check on a Unix-socket admin listener, where the socket's permissions
# are the access control, so a plain GET as root is answered.
#
# In check mode nothing restarted, so a missing socket is the drift the task
# above already reported; the reads are skipped then rather than failing the
# nightly drift run, and run when the socket is there.
- name: Run any pending Caddy restart or reload before checking the result
  ansible.builtin.meta: flush_handlers

- name: Read the admin socket Caddy is running with
  ansible.builtin.stat:
    path: "{{ caddy_admin_socket }}"
    get_checksum: false
  register: caddy_admin_socket_live
  check_mode: false

- name: Refuse an admin socket that is missing, not Caddy's or not write-only
  ansible.builtin.assert:
    that:
      - caddy_admin_socket_live.stat.issock | default(false)
      - caddy_admin_socket_live.stat.pw_name == caddy_user
      - caddy_admin_socket_live.stat.mode == '0200'
    fail_msg: >-
      Caddy's admin socket {{ caddy_admin_socket }} should be a socket owned by
      {{ caddy_user }} with mode 0200 after the restart; it is
      {{ 'missing' if not (caddy_admin_socket_live.stat.exists | default(false))
         else (caddy_admin_socket_live.stat.pw_name | default('?')) ~ ' '
              ~ (caddy_admin_socket_live.stat.mode | default('?')) }}.
      Reloads would fail. Read `systemctl status caddy` and
      `journalctl -u caddy -n 50`, then see "Caddy: reloading by hand" in
      docs/runbooks/labs-host.md.
    quiet: true
  when: not ansible_check_mode or (caddy_admin_socket_live.stat.issock | default(false))

- name: Check that Caddy answers on the admin socket
  ansible.builtin.uri:
    url: http://localhost/config/
    unix_socket: "{{ caddy_admin_socket }}"
    method: GET
    status_code: 200
    return_content: false
  check_mode: false
  changed_when: false
  when: not ansible_check_mode or (caddy_admin_socket_live.stat.issock | default(false))

- name: Refuse a Caddy still listening on TCP 2019
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 2019
    state: stopped
    timeout: 10
    msg: >-
      Something still listens on 127.0.0.1:2019 after the move of Caddy's admin
      API to {{ caddy_admin_socket }}. Read `sudo ss -ltnp sport = :2019` for
      the process; if it is Caddy, its configuration did not take the global
      block from Caddyfile.j2.
  check_mode: false
  when: not ansible_check_mode or (caddy_admin_socket_live.stat.issock | default(false))
