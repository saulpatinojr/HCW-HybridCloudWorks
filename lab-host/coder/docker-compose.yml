# Coder (Community edition) and its PostgreSQL: the only two Docker Compose
# services on the lab host (ADR 0032, decision 2). Installed to
# /etc/hcw/coder/ by the Ansible `coder` role in lab-host/ansible, which also
# writes the three files this one reads and never commits:
#
#   .env                 Compose interpolation: CODER_IMAGE and
#                        CODER_POSTGRES_IMAGE (image@digest, from the pins in
#                        ansible/group_vars/all.yml) and DOCKER_GID (read from
#                        the host with getent). Not secret.
#   coder.env            Coder's secrets and the values that come from Vault or
#                        group_vars: CODER_OAUTH2_GITHUB_CLIENT_ID,
#                        CODER_OAUTH2_GITHUB_CLIENT_SECRET,
#                        CODER_OAUTH2_GITHUB_ALLOWED_ORGS,
#                        CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS and
#                        CODER_PG_CONNECTION_URL. root:root 0600.
#   coder-postgres.env   POSTGRES_PASSWORD. root:root 0600, separate from
#                        coder.env so the database container never sees the
#                        OAuth secret.
#
# Every CODER_* name below was checked against
# https://coder.com/docs/reference/cli/server on 2026-09-25: --access-url,
# --wildcard-access-url, --http-address, --postgres-url,
# --oauth2-github-client-id, --oauth2-github-client-secret,
# --oauth2-github-allow-signups, --oauth2-github-allowed-orgs,
# --oauth2-github-default-provider-enable, --disable-password-auth,
# --secure-auth-cookie, --redirect-to-access-url, --proxy-trusted-headers and
# --proxy-trusted-origins each list the CODER_ variable used here, and
# --disable-path-apps lists CODER_DISABLE_PATH_APPS and --telemetry lists
# CODER_TELEMETRY_ENABLE in the v2.37.3 binary's
# `coder server --help` (2026-09-28). The
# group_add pattern is Coder's documented Docker install
# (https://coder.com/docs/install/docker: "Coder runs as a non-root user" and
# gets the socket through --group-add with the docker group's id).
#
# The privilege boundary (ADR 0032, decision 4 and its consequences): no
# service here holds the host's Docker socket. `coder-docker-proxy` holds the
# socket of a separate, rootless Docker daemon (the coder_sandbox role, run
# by the unprivileged user hcw-coder-docker; LAB-5, 2026-10-07), and the
# Coder server reaches that daemon through it and nothing else. A workspace
# is a container the Coder server creates from templates/hcw-lab/main.tf on
# that daemon; the test beside that file asserts a workspace never gets a
# socket, `privileged`, or a host path.
#
# To parse this file without the host: bash lab-host/coder/compose-config-check.sh
# (creates empty stand-ins for the three files in a temporary directory and
# runs `docker compose config`).

name: coder

services:
  coder:
    # Pinned by digest in ansible/group_vars/all.yml (coder_image_digest, the
    # image index of ghcr.io/coder/coder:v2.37.3 on 2026-09-25). Docker
    # verifies the content against the digest on pull, so the tag is recorded
    # there for humans and never pulled.
    image: ${CODER_IMAGE:?set by the coder role in .env from coder_image and coder_image_digest}
    # Named so the ADR 0032 validation list (`docker ps` shows `coder` and
    # `coder-postgres`) holds by name rather than by Compose's <project>-<service>-1.
    container_name: coder
    restart: unless-stopped
    depends_on:
      coder-postgres:
        condition: service_healthy
      coder-docker-proxy:
        condition: service_started
    # The image runs as the non-root `coder` user, and since 2026-10-06 it
    # holds no socket and no docker group (estate review, LAB-5): the
    # provisioner's Docker provider reaches the daemon through
    # coder-docker-proxy below, over DOCKER_HOST on the control network, and
    # gets only the API sections that service allows. What that bounds, and
    # what it does not, is written above the proxy service.
    # Coder listens on every interface INSIDE the container (a 127.0.0.1 bind
    # inside the container is unreachable from the host's port publish), and
    # Docker publishes it on the host's loopback only. Caddy on the host
    # reverse-proxies coder.lab and *.coder.lab to 127.0.0.1:7080; nothing
    # else on the network can reach this port.
    ports:
      - "127.0.0.1:7080:7080"
    environment:
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      CODER_ACCESS_URL: "https://coder.lab.hybridcloudworks.com"
      # Workspace apps (code-server) are served one label below coder.lab,
      # which is why the Caddy certificate carries *.coder.lab (ADR 0032).
      CODER_WILDCARD_ACCESS_URL: "*.coder.lab.hybridcloudworks.com"
      # Off, because Caddy terminates TLS and forwards plain HTTP. Coder
      # v2.37.3 with this on redirects every request that did not reach it
      # over TLS itself (all but /healthz) to the access URL, so behind Caddy
      # each request loops: measured 2026-09-26 as a 307 even with the
      # X-Forwarded-* headers set, and a 200 with it off (PR #722). Caddy
      # already sends http:// to https:// and only routes the coder.lab and
      # *.coder.lab hosts here, which is everything this setting would add.
      CODER_REDIRECT_TO_ACCESS_URL: "false"
      # Path-based workspace apps off. Without this, Coder v2.37.3 serves
      # every workspace app on the dashboard's own origin as well, at
      # /@<owner>/<workspace>/apps/<app>/ (--disable-path-apps has no
      # default, codersdk/deployment.go), and that includes apps declared
      # with subdomain = true. On the dashboard's origin a workspace's
      # JavaScript can call the Coder API as the learner. Coder's reference
      # for the flag, checked against the v2.37.3 binary's help on
      # 2026-09-28: "Path-based apps can make requests to the Coder API and
      # pose a security risk when the workspace serves malicious JavaScript.
      # This is recommended for security purposes if a --wildcard-access-url
      # is configured." One is configured above, and the hcw-lab template's
      # code-server sets subdomain = true, so nothing here needs path apps.
      # The web terminal is a separate route and keeps working.
      CODER_DISABLE_PATH_APPS: "true"
      # Owner decision 2026-09-28: no usage data to Coder. v2.37.3's
      # `coder server --help` reads "--telemetry bool, $CODER_TELEMETRY_ENABLE
      # (default: true) ... Coder collects anonymized usage data". The site's
      # privacy policy names no such processor, and the data would come from
      # learners' sessions, so it is off. /api/v2/buildinfo reports the
      # result as "telemetry": false.
      CODER_TELEMETRY_ENABLE: "false"
      # TLS terminates in Caddy, so the session cookie is only ever sent over
      # HTTPS from the browser's point of view.
      CODER_SECURE_AUTH_COOKIE: "true"
      # GitHub OAuth is the only way in (ADR 0032, decision 4). The first
      # GitHub sign-in on an empty deployment becomes the owner
      # (coderd/userauth.go, oauthLogin: "Allow the first user to sign up with
      # OIDC, regardless of AllowSignups" and "If this is the first user, add
      # the owner role"), so no password account is ever created.
      CODER_DISABLE_PASSWORD_AUTH: "true"
      # Coder ships a default GitHub app run by Coder the company; the docs
      # warn that installing it grants them access to the organisation's
      # data. Off, because coder.env carries our own app.
      CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE: "false"
      # Caddy sets X-Forwarded-For. Connections from the host's loopback
      # publish reach this container from the compose network's gateway, so
      # trusting that subnet is what lets Coder's audit log and rate limits
      # see the learner's address rather than the gateway's. The subnet is
      # fixed below so this value cannot drift from it.
      CODER_PROXY_TRUSTED_HEADERS: "X-Forwarded-For"
      CODER_PROXY_TRUSTED_ORIGINS: "172.28.240.0/24"
      # The daemon, through the allowlisting proxy on the control network
      # (LAB-5). The template's Docker provider names the same address.
      DOCKER_HOST: "tcp://coder-docker-proxy:2375"
    env_file:
      - path: ./coder.env
        required: true
    # `coder` first and `coder-control` second, by name: Docker binds the
    # published port and routes Caddy's requests through the container's
    # first network, so CODER_PROXY_TRUSTED_ORIGINS above (the `coder`
    # subnet's gateway) stays true with the second network attached.
    networks:
      - coder
      - coder-control
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # A Docker socket, behind a path allowlist (estate review 2026-10-06,
  # LAB-5). Until then the coder server held the host's socket itself. This
  # is HAProxy with one rule per Docker API section: the provisioner's Docker
  # provider gets containers, images, networks, volumes, the lifecycle verbs
  # it uses and the read-only daemon endpoints, and nothing else answers —
  # no exec on a container it did not create, no build, no commit, no
  # swarm, no system prune, no daemon auth.
  #
  # Which daemon (2026-10-07, LAB-5). The proxy inspects paths, not bodies,
  # so code running as the coder server could still create a privileged
  # container or bind `/`. That is why the socket behind it is no longer the
  # host's: it is the rootless daemon the coder_sandbox role runs as the
  # unprivileged user hcw-coder-docker, listening in /run/hcw-coder-docker
  # (a directory systemd-tmpfiles creates at boot). Every workspace runs
  # there, and whatever a compromised server asks that daemon for — a
  # privileged container, a bind of `/` — is privileged inside that user's
  # namespace and is that user on the host, never root. The directory is
  # mounted rather than the socket file, so the proxy still sees the socket
  # after that daemon restarts and recreates it; read-only, which does not
  # stop the proxy connecting.
  #
  # userns_mode host: the host daemon remaps every container's root to an
  # unprivileged range (roles/docker), and a remapped root cannot open
  # another user's socket. The proxy is one of the three containers of this
  # host's own that opt out; nothing a workspace or a job creates can.
  #
  # The proxy sits on the `coder-control` network with `coder` alone —
  # PostgreSQL shares the `coder` network with the server and never sees
  # this one — and publishes no port. Pinned by digest in
  # ansible/group_vars/all.yml (coder_docker_proxy_image_digest). The host's
  # own socket is held by Portainer, for the owner only, on the loopback
  # (ADR 0032, amendment of 2026-09-26), and by the lab agent's own proxy
  # (roles/labs_agent); workspaces never receive a socket (templates/hcw-lab).
  coder-docker-proxy:
    image: ${CODER_DOCKER_PROXY_IMAGE:?set by the coder role in .env from coder_docker_proxy_image and coder_docker_proxy_image_digest}
    container_name: coder-docker-proxy
    restart: unless-stopped
    environment:
      LOG_LEVEL: warning
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      EVENTS: "1"
      EXEC: "0"
      BUILD: "0"
      COMMIT: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SERVICES: "0"
      NODES: "0"
      TASKS: "0"
      SYSTEM: "0"
      PLUGINS: "0"
      SESSION: "0"
      DISTRIBUTION: "0"
      CONFIGS: "0"
      SOCKET_PATH: /run/hcw-coder-docker/docker.sock
    userns_mode: host
    volumes:
      - /run/hcw-coder-docker:/run/hcw-coder-docker:ro
    networks:
      - coder-control
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  coder-postgres:
    # Pinned by digest in ansible/group_vars/all.yml (coder_postgres_image_digest,
    # the image index that postgres:18 and postgres:18.6 both resolved to on
    # 2026-09-26).
    image: ${CODER_POSTGRES_IMAGE:?set by the coder role in .env from coder_postgres_image and coder_postgres_image_digest}
    container_name: coder-postgres
    restart: unless-stopped
    env_file:
      - path: ./coder-postgres.env
        required: true
    environment:
      POSTGRES_USER: coder
      POSTGRES_DB: coder
    # Listens on the compose network only: no `ports`, so nothing on the host
    # or the internet reaches 5432 (docs/architecture/labs-host.md).
    # The PostgreSQL 18 image declares its VOLUME at /var/lib/postgresql and
    # keeps the cluster in a per-major directory beneath it (PGDATA is
    # /var/lib/postgresql/18/docker), so a later major's pg_upgrade --link can
    # see both clusters on one mount. It refuses to start with a mount at the
    # 16-and-earlier path /var/lib/postgresql/data (docker-library/postgres#1259).
    volumes:
      - coder-postgres-data:/var/lib/postgresql
    networks:
      - coder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # The Compose network. Workspaces are NOT on it: each one gets its own
  # bridge network from the template, with no route here or to 5432. The
  # subnet is fixed so CODER_PROXY_TRUSTED_ORIGINS above stays true; Docker
  # will not hand this range to any other network while it exists.
  coder:
    name: coder
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.240.0/24
  # The control network: the coder server and the socket proxy, nothing
  # else (#900 review). PostgreSQL stays on `coder` only, so a database
  # compromise has no path to the daemon. `internal`: no route out, since
  # nothing on it needs one.
  coder-control:
    name: coder-control
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.241.0/24

volumes:
  # Rebuildable metadata, not data of record (docs/architecture/labs-host.md):
  # the coder role's nightly pg_dump under /var/backups/coder, uploaded off
  # the host by the backups role (LAB-9), is the copy.
  #
  # External: the coder role creates it (roles/coder/tasks/main.yml), and the
  # docker role's userns carry may already have (LAB-5). Compose owned it until
  # 2026-10-08 and warned on every run after the carry that the volume "already
  # exists but was not created by Docker Compose"; it used the volume, but
  # nothing said who should create it. Now one thing does, and `docker compose
  # down -v` can never remove the database.
  coder-postgres-data:
    name: coder-postgres-data
    external: true
