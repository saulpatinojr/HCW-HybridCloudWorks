# coder-docker-proxy (LAB-5): the allowlist between the coder server and the
# rootless sandbox daemon (roles/coder_sandbox). The coder role copies this
# file to /etc/hcw/coder/docker-proxy.haproxy.cfg and docker-compose.yml
# mounts it read-only into the official haproxy image, pinned in
# ansible/group_vars/all.yml (coder_docker_proxy_image_digest).
#
# Until 2026-11-07 this service ran tecnativa/docker-socket-proxy 0.3.0,
# which is HAProxy 2.2 (an end-of-life line) with one configuration whose
# rules are switched on and off by environment variables. This file is that
# configuration, written out for the switches docker-compose.yml set, so the
# coder server is allowed exactly what it was allowed before:
# https://github.com/Tecnativa/docker-socket-proxy/blob/v0.3.0/haproxy.cfg
#
#   on:  CONTAINERS IMAGES NETWORKS VOLUMES INFO VERSION PING EVENTS
#        ALLOW_START ALLOW_STOP ALLOW_RESTARTS POST
#   off: EXEC BUILD COMMIT AUTH SECRETS SWARM SERVICES NODES TASKS SYSTEM
#        PLUGINS SESSION DISTRIBUTION CONFIGS GRPC
#
# Each `allow` line below is the original line of a section that was on,
# with its regular expression unchanged (matched on the URL-decoded path,
# any case, any API version prefix); a section that was off has no line and
# falls to the final deny. POST was on, so the original's first rule
# (`deny unless METH_GET || POST`) refused nothing: every method passed on an
# allowed section. Since 2026-11-08 (owner decision on #1587) the first rule
# here is narrower than the original's: only GET and HEAD (HAProxy's METH_GET
# covers both), POST and DELETE pass, the methods Coder's Docker provider
# uses to read, create, start, stop and remove. PUT is refused, which closes
# `PUT /containers/{id}/archive` (copying files into a container; the
# template has no `upload` block, the only thing that would use it), and so
# is every other method. The proxy reads paths and methods, not bodies; why
# that is safe here is written above the service in docker-compose.yml (the
# daemon behind it is rootless).
#
# Left out because the root filesystem is read-only and nothing reloads the
# proxy: the pidfile, the server-state file and the custom error pages
# (HAProxy's built-in pages answer with the same status codes).
#
# `haproxy -c` prints one warning, "missing timeouts for backend
# 'docker-events'": the event stream is meant to stay open, as it did in the
# original (its `timeout server 0`), so the warning is expected.
#
# lab-host/coder/templates/hcw-lab/template.test.mjs holds this list to the
# sections above; CI parses the file with `haproxy -c` at the pinned image
# (the `lab-host role tests` job).

global
    log stdout format raw daemon warning
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

backend dockerbackend
    server dockersocket unix@/run/hcw-coder-docker/docker.sock

# The event stream stays open as long as the client listens.
backend docker-events
    server dockersocket unix@/run/hcw-coder-docker/docker.sock
    timeout server 0

frontend dockerfrontend
    # The address DOCKER_HOST names (tcp://coder-docker-proxy:2375), on the
    # coder-control network only; the service publishes no port. IPv4 only,
    # a deliberate narrowing: the old image listened on [::]:2375 v4v6 (the
    # Compose file never set its DISABLE_IPV6, which defaults to 0), but
    # coder-control has no IPv6, and HAProxy refuses to start on a kernel
    # without IPv6 when told to listen on [::] (seen when this file was
    # tested, 2026-11-07).
    bind :2375
    # Only the methods the provisioner uses (see the header): GET and HEAD,
    # POST, DELETE. Anything else, PUT included, is refused before the paths.
    http-request deny unless METH_GET || METH_POST || METH_DELETE
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/((stop)|(restart)|(kill))' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/start' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/stop' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/containers' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/events' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/images' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/info' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/networks' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/_ping' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/version' }
    http-request allow if { path,url_dec -m reg -i '^(/v[\d\.]+)?/volumes' }
    http-request deny

    use_backend docker-events if { path,url_dec -m reg -i '^(/v[\d\.]+)?/events' }
    default_backend dockerbackend
