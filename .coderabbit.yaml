# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit for this repository (owner request, 2026-10-08), on the free plan
# CodeRabbit gives public open-source repositories. Nothing here turns on a
# paid add-on, and every key and value is in schema.v2.json (checked against
# it when this file was written; the header line above lets an editor check it
# on every change). The repository's own review rules live in
# .github/skills/code-review/, and CodeRabbit reads them as code guidelines
# (knowledge_base below), so its comments hold the house checklist's bar.
#
# Its comments are review threads, and the Default ruleset requires every
# thread resolved before a merge (.claude/CLAUDE.md), so each is answered on
# its thread and resolved like any other reviewer's.
#
# Reviews arrived on their own on every push while the Advanced trial ran
# (since #1034, 2026-10-08). The trial ended on 2026-10-20: #1293 still showed
# "10 included reviews per hour", #1301 and #1304 "1", and #1301's commit
# status reads "Review skipped: manual review required for this OSS
# repository". A review is now asked for by hand with "@coderabbitai review",
# one included review an hour, and auto_review below says what that review
# is spent on.
# .claude/CLAUDE.md says how a session handles them, in two separate tasks:
# each review finding is fixed or answered on its thread and the thread
# resolved; and the summary comment's checklist is worked by hand and recorded
# on the pull request, its trigger checkboxes and Autopilot never ticked.
# Three rounds at most.
#
# The profile stays "chill" on purpose (owner decision 2026-10-09): each
# finding is a thread that must be fixed or answered before a merge, and the
# tone below asks for the findings that matter rather than more of them.
language: "en-US"
tone_instructions: >-
  Put security, correctness and data integrity first. Skip style points that
  Prettier or ESLint already enforce. Be concise and concrete: name the
  failure, the input that causes it, and the fix.

reviews:
  profile: "chill"
  # CodeRabbit's review is a request for changes while a finding is open and
  # an approval once every thread is resolved and the pre-merge checks pass.
  # That approval is the signal sessions merge on (.claude/CLAUDE.md). It was
  # the Default ruleset's required review from 2026-10-18 (#972, option F);
  # read on 2026-10-31, the ruleset requires no approving review (count 0,
  # unchanged since 2026-10-20), so the approval is practice, not a gate
  # (#1455). Its request for changes does block the merge until a newer
  # review replaces it (#1460, 2026-10-31).
  # Author approval is off: sessions author as the owner's account, and
  # "@coderabbitai approve" from the author would approve its own work.
  request_changes_workflow: true
  allow_author_approval: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    # The included allowance is one review an hour, and every push to an
    # open pull request, every "Update branch" and every "@coderabbitai
    # review" spends one (docs.coderabbit.ai/management/rate-limits). #1304
    # asked eleven times on 2026-10-20 and was refused ten. The three
    # settings below keep the review for a head someone will read.
    #
    # Drafts are not reviewed: pull requests open ready for review here
    # (.claude/CLAUDE.md, owner decision 2026-09-05), so a draft is work in
    # progress by definition, and a review of it is spent on a head that
    # will change.
    drafts: false
    # One incremental review after the first, then pause; ask with
    # "@coderabbitai review" when the branch is ready for the next one.
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 2
    # Dependabot pull requests are approved by the owner (#1299), so a
    # CodeRabbit review of them is the review spent twice. hcw-site-app[bot]
    # is not listed on purpose: CodeRabbit's approval is the merge signal
    # on its pull requests (#1293).
    ignore_usernames:
      - "dependabot[bot]"
  # Generated, vendored or dated files, which a review cannot improve.
  path_filters:
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!CHANGELOG.md"
    - "!docs/history/**"
  # Docstring coverage is scoped to the functions a diff touches, and this
  # repository's diffs keep reporting "Analyzed 0 functions" (#1293, #1301,
  # #1304): a row that can only pass is noise in the checklist. The title,
  # description and linked-issue checks keep their defaults.
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_instructions:
    - path: "functions/**"
      instructions: >-
        Telemetry is content-free: no document ids, tokens, file paths, route
        values or payloads in log lines (.github/pull_request_template.md). A
        write decided from an earlier read is ETag-guarded (ifMatch) with a
        412 handled. patchDoc treats an undefined value as a field deletion,
        and a dotted key is a nested Cosmos patch, so flag either in an update
        built from request input.
    - path: "infra/**"
      instructions: >-
        This is live production, applied by HCP Terraform with a human
        confirmation. Flag any change that would replace or destroy a stateful
        resource (Cosmos, Storage, Key Vault, the Function App) or put a secret
        value into state.
    - path: "lab-host/ansible/**"
      instructions: >-
        ansible-core 2.21: ansible_managed exists only for the template module,
        so it must not appear in a copy task's content. Tasks must be
        idempotent and say why in a comment when they are not.
    - path: "frontend/src/pages/**"
      instructions: >-
        Public pages never name the site's back-end vendors, tools, models or
        admin-side states; they speak to visitors. Admin pages under
        pages/admin/ are exempt.
    - path: "docs/**"
      instructions: >-
        A command meant for the owner is PowerShell unless the line above it
        says bash, is one line, and carries no placeholder; a browser step
        gives the exact URL.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".github/skills/code-review/SKILL.md"
      - ".github/skills/code-review/references/*.md"
